        emit(`  CALL_SYM __t5_dcmp`);
        emit(`  ADDI R8, R8, 8`);
        emit(`  POP R2`);
        const lblT = newLabel('bt'), lblE = newLabel('be');
        emit(`  CMPI R0, 0`);
        emit(`  JNZX ${lblT}`);
        emit(`  LI R0, 0`);
        emit(`  JMPX ${lblE}`);
        emit(`${lblT}:`);
        emit(`  LI R0, 1`);
        emit(`${lblE}:`);
        return;
      }
      if (fromTy.kind === T.TK.LLONG) {
        emit(`  BOR R0, R0, R1`);
      }
      const lblZ = newLabel('bz'), lblD = newLabel('bd');
      emit(`  CMPI R0, 0`);
      emit(`  JZX ${lblZ}`);
      emit(`  LI R0, 1`);
      emit(`  JMPX ${lblD}`);
      emit(`${lblZ}:`);
      emit(`  LI R0, 0`);
      emit(`${lblD}:`);
      return;
    }

    // Float <-> Double
    if (fromTy.kind === T.TK.FLOAT && toTy.kind === T.TK.DOUBLE) {
      emit(`  CALL_SYM __t5_ftod`);
      return;
    }
    if (fromTy.kind === T.TK.DOUBLE && toTy.kind === T.TK.FLOAT) {
      emit(`  CALL_SYM __t5_dtof`);
      return;
    }

    // Int -> Float / Double
    if (T.isInteger(fromTy) && toTy.kind === T.TK.FLOAT) {
      if (fromTy.kind === T.TK.LLONG) {
        emit(`  CALL_SYM ${fromTy.unsigned ? '__t5_u64tof' : '__t5_i64tof'}`);
      } else {
        emit(`  CALL_SYM ${fromTy.unsigned ? '__t5_u32tof' : '__t5_i32tof'}`);
      }
      return;
    }
    if (T.isInteger(fromTy) && toTy.kind === T.TK.DOUBLE) {
      if (fromTy.kind === T.TK.LLONG) {
        emit(`  CALL_SYM ${fromTy.unsigned ? '__t5_u64tod' : '__t5_i64tod'}`);
      } else {
        emit(`  CALL_SYM ${fromTy.unsigned ? '__t5_u32tod' : '__t5_i32tod'}`);
      }
      return;
    }

    // Float / Double -> Int
    if (fromTy.kind === T.TK.FLOAT && T.isInteger(toTy)) {
      if (toTy.kind === T.TK.LLONG) {
        emit(`  CALL_SYM ${toTy.unsigned ? '__t5_ftou64' : '__t5_ftoi64'}`);
      } else {
        emit(`  CALL_SYM ${toTy.unsigned ? '__t5_ftou32' : '__t5_ftoi32'}`);
        if (toTy.size < 4) emit(`  ${toTy.unsigned ? 'WRAPU' : 'WRAPS'} R0, R0, ${toTy.size * 8}`);
      }
      return;
    }
    if (fromTy.kind === T.TK.DOUBLE && T.isInteger(toTy)) {
      if (toTy.kind === T.TK.LLONG) {
        emit(`  CALL_SYM ${toTy.unsigned ? '__t5_dtou64' : '__t5_dtoi64'}`);
      } else {
        emit(`  CALL_SYM ${toTy.unsigned ? '__t5_dtou32' : '__t5_dtoi32'}`);
        if (toTy.size < 4) emit(`  ${toTy.unsigned ? 'WRAPU' : 'WRAPS'} R0, R0, ${toTy.size * 8}`);
      }
      return;
    }

    // 32-bit / Pointer -> 64-bit integer
    if (fromTy.kind !== T.TK.LLONG && toTy.kind === T.TK.LLONG) {
      if (fromTy.unsigned) {
        emit(`  WRAPU R0, R0, 32`);
        emit(`  LI R1, 0`);
      } else {
        emit(`  LI R3, 31`);
        emit(`  BSAR R1, R0, R3`);
        emit(`  WRAPU R1, R1, 32`);
        emit(`  WRAPU R0, R0, 32`);
      }
      return;
    }

    // 64-bit integer -> 32-bit / Pointer
    if (fromTy.kind === T.TK.LLONG && toTy.kind !== T.TK.LLONG) {
      if (toTy.kind === T.TK.PTR) {
        emit(`  WRAPS R0, R0, 32`);
      } else {
        emit(`  ${toTy.unsigned ? 'WRAPU' : 'WRAPS'} R0, R0, ${toTy.size * 8}`);
      }
      return;
    }

    // 32-bit <-> 32-bit / Pointer
    if (toTy.kind === T.TK.PTR) {
      emit(`  WRAPS R0, R0, 32`);
    } else if (T.isInteger(toTy) && toTy.size <= 4) {
      emit(`  ${toTy.unsigned ? 'WRAPU' : 'WRAPS'} R0, R0, ${toTy.size * 8}`);
    }
  }

  // Generate address of an lvalue into R0 (C-space address)
  function genAddr(node) {
    switch (node.kind) {
      case 'Var': {
        const sym = node.symbol;
        if (sym.isGlobal) {
          emit(`  LA R0, ${sym.asmName || sym.name}`);
        } else if (sym.isVla) {
          // VLA local stores its pointer at [FP + sym.offset]
          emitLoad(T.ptrTo(T.TY_VOID), 'R7', sym.offset);
        } else {
          if (sym.offset >= -ISA.TRYTE_HALF && sym.offset <= ISA.TRYTE_HALF) {
            emit(`  ADDI R0, R7, ${sym.offset}`);
          } else {
            emitLoadConst('R3', sym.offset);
            emit(`  ADD R0, R7, R3`);
          }
        }
        return;
      }
      case 'Deref':
        genExpr(node.expr);
        return;
      case 'Member':
        if (node.isArrow) genExpr(node.object);
        else genAddr(node.object);
        if (node.offset !== 0) {
          if (node.offset >= -ISA.TRYTE_HALF && node.offset <= ISA.TRYTE_HALF) {
            emit(`  ADDI R0, R0, ${node.offset}`);
          } else {
            emitLoadConst('R3', node.offset);
            emit(`  ADD R0, R0, R3`);
          }
        }
        return;
      case 'StrLit': {
        const lbl = addStringLit(node.bytes);
        emit(`  LA R0, ${lbl}`);
        return;
      }
      case 'CompoundLit': {
        // Allocate temporary space on C stack (aligned to 4)
        const sz = align4(Math.max(node.type.size, 4));
        if (sz <= ISA.TRYTE_HALF) emit(`  SUBI R8, R8, ${sz}`);
        else { emitLoadConst('R3', sz); emit(`  SUB R8, R8, R3`); }
        emit(`  MOV R0, R8`);
        emit(`  PUSH R0`);
        genLocalInit(node.type, 'R8', 0, node.init);
        emit(`  POP R0`);
        return;
      }
      case 'Binary':
        if (node.op === ',') {
          genExpr(node.left);
          genAddr(node.right);
          return;
        }
        throw new Error(`Cannot take address of binary '${node.op}'`);
      case 'Call':
      case 'Ternary':
      case 'StmtExpr':
      case 'Assign':
        if (T.isAggregate(node.type)) { genExpr(node); return; }
        throw new Error(`Cannot take address of AST node '${node.kind}'`);
      default:
        throw new Error(`Cannot take address of AST node '${node.kind}'`);
    }
  }

  // Bit-field load helper (address of member's byte offset is in R0)
  function emitBitfieldLoad(field) {
    const bw = field.bitWidth;
    const bo = field.bitOffset;
    const byteCount = Math.ceil((bo + bw) / 8);
    const loadTy = byteCount <= 1 ? T.TY_UCHAR : (byteCount <= 2 ? T.TY_USHORT : T.TY_UINT);
    emit(`  MOV R2, R0`);
    emitLoad(loadTy, 'R2', 0, field.type.isVolatile);
    if (bo > 0) {
      emit(`  LI R3, ${bo}`);
      emit(`  BSHR R0, R0, R3`);
    }
    emit(`  ${field.type.unsigned ? 'WRAPU' : 'WRAPS'} R0, R0, ${bw}`);
  }

  // Bit-field store helper (value in R0, address of member's byte offset on top of HW stack)
  function emitBitfieldStore(field) {
    const bw = field.bitWidth;
    const bo = field.bitOffset;
    const byteCount = Math.ceil((bo + bw) / 8);
    const loadTy = byteCount <= 1 ? T.TY_UCHAR : (byteCount <= 2 ? T.TY_USHORT : T.TY_UINT);
    const mask = ((1n << BigInt(bw)) - 1n) << BigInt(bo);
    const invMask = Number((~mask) & 0xFFFFFFFFn);
    emit(`  POP R2`); // R2 = address
    emit(`  PUSH R0`); // save raw value to return
    emit(`  WRAPU R0, R0, ${bw}`);
    if (bo > 0) {
      emit(`  LI R3, ${bo}`);
      emit(`  BSHL R0, R0, R3`);
    }
    emit(`  PUSH R0`); // shifted new bits
    emitLoad(loadTy, 'R2', 0, field.type.isVolatile);
    emitLoadConst('R3', invMask);
    emit(`  BAND R0, R0, R3`);
    emit(`  POP R3`);
    emit(`  BOR R0, R0, R3`);
    emitStore(loadTy, 'R2', 0, field.type.isVolatile);
    emit(`  POP R0`);
    emit(`  ${field.type.unsigned ? 'WRAPU' : 'WRAPS'} R0, R0, ${bw}`);
  }

  // Emit boolean test of R0 (or R0,R1) -> sets flags (SF != 0 iff true)
  function emitTestTruth(ty) {
    ty = T.decayType(T.unqualType(ty));
    if (ty.kind === T.TK.FLOAT || ty.kind === T.TK.DOUBLE) {
      emitCast(ty, T.TY_BOOL);
      emit(`  CMPI R0, 0`);
      return;
    }
    if (ty.kind === T.TK.LLONG) {
      emit(`  BOR R0, R0, R1`);
    }
    emit(`  CMPI R0, 0`);
  }

  // Helper to pass 2 doubles to a runtime helper: (R0,R1) = a, (R2,R3) = b -> stack [CSP+0..7] = b
  function emitDoubleBinCall(fnName) {
    emit(`  SUBI R8, R8, 8`);
    emit(`  PUSH R0`);
    emit(`  PUSH R3`);
    emit(`  MOV R0, R2`);
    emitStore(T.TY_UINT, 'R8', 0);
    emit(`  POP R0`);
    emitStore(T.TY_UINT, 'R8', 4);
    emit(`  POP R0`);
    emit(`  CALL_SYM ${fnName}`);
    emit(`  ADDI R8, R8, 8`);
  }

  // Helper to pass 2 uint64/int64 to a runtime helper: (R0,R1) = a, (R2,R3) = b -> stack [CSP+0..7] = b
  function emitI64BinCall(fnName) {
    emitDoubleBinCall(fnName);
  }

  // Generate expression value into R0 (or R0,R1 for 64-bit)
  function genExpr(node) {
    switch (node.kind) {
      case 'IntLit': {
        const ty = node.type;
        if (ty.kind === T.TK.LLONG) {
          const u = BigInt.asUintN(64, node.value);
          const lo = Number(u & 0xFFFFFFFFn);
          const hi = Number((u >> 32n) & 0xFFFFFFFFn);
          emitLoadConst('R0', lo);
          emitLoadConst('R1', hi);
        } else {
          const bits = ty.size * 8;
          const v = ty.unsigned ? Number(BigInt.asUintN(bits, node.value)) : Number(BigInt.asIntN(bits, node.value));
          emitLoadConst('R0', v);
        }
        return;
      }
      case 'FloatLit': {
        if (node.type.kind === T.TK.FLOAT) {
          emitLoadConst('R0', floatToU32(node.value));
        } else {
          const [lo, hi] = doubleToU32Pair(node.value);
          emitLoadConst('R0', lo);
          emitLoadConst('R1', hi);
        }
        return;
      }
      case 'StrLit': {
        const lbl = addStringLit(node.bytes);
        emit(`  LA R0, ${lbl}`);
        return;
      }
      case 'SizeofType':
        emitLoadConst('R0', node.targetType.size);
        return;
      case 'SizeofExpr':
        if (node.exprType.isVla && node.expr.kind === 'Var' && node.expr.symbol.vlaSizeOffset !== undefined) {
          emitLoad(T.TY_ULONG, 'R7', node.expr.symbol.vlaSizeOffset);
        } else {
          emitLoadConst('R0', node.exprType.size);
        }
        return;
      case 'AlignofType':
        emitLoadConst('R0', node.targetType.align);
        return;
      case 'Offsetof':
        emitLoadConst('R0', node.offset);
        return;
      case 'BuiltinConstP':
        emitLoadConst('R0', ast.evalConstExpr ? (() => { try { ast.evalConstExpr(node.arg); return 1; } catch (_) { return 0; } })() : 0);
        return;
      case 'BuiltinUnreachable':
        emit(`  HALT`);
        return;
      case 'LabelAddr': {
        const asmLbl = getUserLabel(node.label);
        emit(`  LA R0, ${asmLbl}`);
        return;
      }
      case 'Var': {
        const ty = node.type;
        if (ty.kind === T.TK.ARRAY || ty.kind === T.TK.FUNC || T.isAggregate(ty)) {
          genAddr(node);
          return;
        }
        const sym = node.symbol;
        if (sym.isLocal && !sym.isVla) {
          emitLoad(ty, 'R7', sym.offset, ty.isVolatile);
        } else {
          genAddr(node);
          emit(`  MOV R2, R0`);
          emitLoad(ty, 'R2', 0, ty.isVolatile);
        }
        return;
      }
      case 'AddrOf':
        genAddr(node.expr);
        return;
      case 'Deref': {
        genExpr(node.expr);
        const ty = node.type;
        if (ty.kind === T.TK.ARRAY || ty.kind === T.TK.FUNC || T.isAggregate(ty)) {
          return;
        }
        emit(`  MOV R2, R0`);
        emitLoad(ty, 'R2', 0, ty.isVolatile);
        return;
      }
      case 'Member': {
        genAddr(node);
        if (node.field.bitWidth !== null && node.field.bitWidth !== undefined) {
          emitBitfieldLoad(node.field);
          return;
        }
        const ty = node.type;
        if (ty.kind === T.TK.ARRAY || T.isAggregate(ty)) return;
        emit(`  MOV R2, R0`);
        emitLoad(ty, 'R2', 0, ty.isVolatile);
        return;
      }
      case 'CompoundLit': {
        genAddr(node);
        const ty = node.type;
        if (ty.kind !== T.TK.ARRAY && !T.isAggregate(ty)) {
          emit(`  MOV R2, R0`);
          emitLoad(ty, 'R2', 0);
        }
        return;
      }
      case 'StmtExpr': {
        const stmts = node.block.stmts;
        for (let i = 0; i < stmts.length; i++) {
          if (i === stmts.length - 1 && stmts[i].kind === 'ExprStmt') {
            genExpr(stmts[i].expr);
          } else {
            genStmt(stmts[i]);
          }
        }
        return;
      }
      case 'Cast':
        genExpr(node.expr);
        emitCast(node.expr.type, node.type);
        return;
      case 'Unary': {
        genExpr(node.expr);
        const ty = node.type;
        if (node.op === '+') {
          emitCast(node.expr.type, ty);
          return;
        }
        if (node.op === '-') {
          emitCast(node.expr.type, ty);
          if (ty.kind === T.TK.FLOAT) {
            emitLoadConst('R3', 0x80000000);
            emit(`  BXOR R0, R0, R3`);
          } else if (ty.kind === T.TK.DOUBLE) {
            emitLoadConst('R3', 0x80000000);
            emit(`  BXOR R1, R1, R3`);
          } else if (ty.kind === T.TK.LLONG) {
            emit(`  MOV R2, R0`);
            emit(`  MOV R3, R1`);
            emit(`  LI R0, 0`);
            emit(`  LI R1, 0`);
            emit(`  BSUB R0, R0, R2`);
            emit(`  BSBC R1, R1, R3`);
          } else {
            emit(`  NEG R0, R0`);
            emit(`  ${ty.unsigned ? 'WRAPU' : 'WRAPS'} R0, R0, 32`);
          }
          return;
        }
        if (node.op === '~') {
          emitCast(node.expr.type, ty);
          if (ty.kind === T.TK.LLONG) {
            emit(`  BNOT R0, R0`);
            emit(`  BNOT R1, R1`);
          } else {
            emit(`  BNOT R0, R0`);
            emit(`  ${ty.unsigned ? 'WRAPU' : 'WRAPS'} R0, R0, 32`);
          }
          return;
        }
        if (node.op === '!') {
          emitTestTruth(node.expr.type);
          const lblT = newLabel('nt'), lblE = newLabel('ne');
          emit(`  JZX ${lblT}`);
          emit(`  LI R0, 0`);
          emit(`  JMPX ${lblE}`);
          emit(`${lblT}:`);
          emit(`  LI R0, 1`);
          emit(`${lblE}:`);
          return;
        }
        throw new Error(`Unhandled unary op '${node.op}'`);
      }
      case 'PreIncDec':
      case 'PostIncDec':
        break;
      case 'Assign': {
        const lhs = node.left;
        const lhsTy = T.unqualType(lhs.type);
        const isBf = lhs.kind === 'Member' && lhs.field.bitWidth !== null && lhs.field.bitWidth !== undefined;

        if (node.op === '=') {
          if (T.isAggregate(lhsTy)) {
            genAddr(lhs);
            emit(`  PUSH R0`);
            genAddr(node.right);
            emit(`  MOV R1, R0`);
            emit(`  POP R0`);
            emitMemCopy('R0', 'R1', lhsTy.size);
            return;
          }
          genAddr(lhs);
          emit(`  PUSH R0`);
          genExpr(node.right);
          emitCast(node.right.type, lhsTy);
          if (isBf) {
            emitBitfieldStore(lhs.field);
          } else {
            emit(`  POP R2`);
            emitStore(lhsTy, 'R2', 0, lhs.type.isVolatile);
          }
          return;
        }

        // Compound assignment: lhs op= rhs
        const baseOp = node.op.slice(0, -1);
        genAddr(lhs);
        emit(`  PUSH R0`); // save addr
        if (isBf) {
          emitBitfieldLoad(lhs.field);
        } else {
          emit(`  MOV R2, R0`);
          emitLoad(lhsTy, 'R2', 0, lhs.type.isVolatile);
        }
        // Evaluate binary op between lhs (currently in R0/R1) and rhs
        let opTy;
        if ((baseOp === '+' || baseOp === '-') && lhsTy.kind === T.TK.PTR) {
          opTy = lhsTy;
        } else if (baseOp === '<<' || baseOp === '>>') {
          opTy = T.integerPromote(lhsTy);
        } else {
          opTy = T.usualArithConv(lhsTy, node.right.type);
        }
        emitCast(lhsTy, opTy);
        if (T.is64Bit(opTy)) { emit(`  PUSH R0`); emit(`  PUSH R1`); }
        else emit(`  PUSH R0`);
        genExpr(node.right);
        if ((baseOp === '+' || baseOp === '-') && opTy.kind === T.TK.PTR) {
          emitCast(node.right.type, T.TY_LONG);
          const elemSz = Math.max(opTy.base.size, 1);
          if (elemSz > 1) {
            emitLoadConst('R3', elemSz);
            emit(`  BMULLO R0, R0, R3`);
          }
          emit(`  MOV R2, R0`);
          emit(`  POP R0`);
          emit(baseOp === '+' ? `  ADD R0, R0, R2` : `  SUB R0, R0, R2`);
          emit(`  WRAPS R0, R0, 32`);
        } else {
          emitBinaryOp(baseOp, opTy, node.right.type);
        }
        emitCast(opTy, lhsTy);
        if (isBf) {
          emitBitfieldStore(lhs.field);
        } else {
          emit(`  POP R2`);
          emitStore(lhsTy, 'R2', 0, lhs.type.isVolatile);
        }
        return;
      }
      case 'Ternary': {
        const lblElse = newLabel('te'), lblEnd = newLabel('td');
        genExpr(node.cond);
        if (!node.thenExpr) {
          // GNU a ?: b
          if (T.is64Bit(node.type)) { emit(`  PUSH R0`); emit(`  PUSH R1`); }
          else emit(`  PUSH R0`);
          emitTestTruth(node.cond.type);
          emit(`  JZX ${lblElse}`);
          if (T.is64Bit(node.type)) { emit(`  POP R1`); emit(`  POP R0`); }
          else emit(`  POP R0`);
          emitCast(node.cond.type, node.type);
          emit(`  JMPX ${lblEnd}`);
          emit(`${lblElse}:`);
          if (T.is64Bit(node.type)) { emit(`  POP R1`); emit(`  POP R0`); }
          else emit(`  POP R0`);
          genExpr(node.elseExpr);
          emitCast(node.elseExpr.type, node.type);
          emit(`${lblEnd}:`);
          return;
        }
        emitTestTruth(node.cond.type);
        emit(`  JZX ${lblElse}`);
        genExpr(node.thenExpr);
        emitCast(node.thenExpr.type, node.type);
        emit(`  JMPX ${lblEnd}`);
        emit(`${lblElse}:`);
        genExpr(node.elseExpr);
        emitCast(node.elseExpr.type, node.type);
        emit(`${lblEnd}:`);
        return;
      }
      case 'Binary': {
        const op = node.op;
        if (op === ',') {
          genExpr(node.left);
          genExpr(node.right);
          return;
        }
        if (op === '&&') {
          const lblFalse = newLabel('af'), lblEnd = newLabel('ae');
          genExpr(node.left);
          emitTestTruth(node.left.type);
          emit(`  JZX ${lblFalse}`);
          genExpr(node.right);
          emitTestTruth(node.right.type);
          emit(`  JZX ${lblFalse}`);
          emit(`  LI R0, 1`);
          emit(`  JMPX ${lblEnd}`);
          emit(`${lblFalse}:`);
          emit(`  LI R0, 0`);
          emit(`${lblEnd}:`);
          return;
        }
        if (op === '||') {
          const lblTrue = newLabel('ot'), lblEnd = newLabel('oe');
          genExpr(node.left);
          emitTestTruth(node.left.type);
          emit(`  JNZX ${lblTrue}`);
          genExpr(node.right);
          emitTestTruth(node.right.type);
          emit(`  JNZX ${lblTrue}`);
          emit(`  LI R0, 0`);
          emit(`  JMPX ${lblEnd}`);
          emit(`${lblTrue}:`);
          emit(`  LI R0, 1`);
          emit(`${lblEnd}:`);
          return;
        }

        const lt = T.decayType(node.left.type);
        const rt = T.decayType(node.right.type);

        // Pointer arithmetic
        if (op === '+' && (lt.kind === T.TK.PTR || rt.kind === T.TK.PTR)) {
          const ptrNode = lt.kind === T.TK.PTR ? node.left : node.right;
          const idxNode = lt.kind === T.TK.PTR ? node.right : node.left;
          const pTy = lt.kind === T.TK.PTR ? lt : rt;
          const elemSz = Math.max(pTy.base.size, 1);
          genExpr(ptrNode);
          emit(`  PUSH R0`);
          genExpr(idxNode);
          emitCast(idxNode.type, T.TY_LONG);
          if (elemSz > 1) {
            emitLoadConst('R3', elemSz);
            emit(`  BMULLO R0, R0, R3`);
          }
          emit(`  MOV R2, R0`);
          emit(`  POP R0`);
          emit(`  ADD R0, R0, R2`);
          emit(`  WRAPS R0, R0, 32`);
          return;
        }
        if (op === '-' && lt.kind === T.TK.PTR && rt.kind === T.TK.PTR) {
          const elemSz = Math.max(lt.base.size, 1);
          genExpr(node.left);
          emit(`  PUSH R0`);
          genExpr(node.right);
          emit(`  MOV R2, R0`);
          emit(`  POP R0`);
          emit(`  SUB R0, R0, R2`);
          if (elemSz > 1) {
            emitLoadConst('R3', elemSz);
            emit(`  DIV R0, R0, R3`);
          }
          emit(`  WRAPS R0, R0, 32`);
          return;
        }
        if (op === '-' && lt.kind === T.TK.PTR) {
          const elemSz = Math.max(lt.base.size, 1);
          genExpr(node.left);
          emit(`  PUSH R0`);
          genExpr(node.right);
          emitCast(node.right.type, T.TY_LONG);
          if (elemSz > 1) {
            emitLoadConst('R3', elemSz);
            emit(`  BMULLO R0, R0, R3`);
          }
          emit(`  MOV R2, R0`);
          emit(`  POP R0`);
          emit(`  SUB R0, R0, R2`);
          emit(`  WRAPS R0, R0, 32`);
          return;
        }

        // Comparison ops
        if (['==', '!=', '<', '<=', '>', '>='].includes(op)) {
          let cmpTy;
          if (lt.kind === T.TK.PTR || rt.kind === T.TK.PTR) {
            cmpTy = T.TY_LONG; // Signed C-space pointer comparison (ABI-5.md §5)
          } else {
            cmpTy = T.usualArithConv(lt, rt);
          }
          genExpr(node.left);
          emitCast(lt, cmpTy);
          if (T.is64Bit(cmpTy)) { emit(`  PUSH R0`); emit(`  PUSH R1`); }
          else emit(`  PUSH R0`);
          genExpr(node.right);
          emitCast(rt, cmpTy);
          emitCompare(op, cmpTy);
          return;
        }

        // Shifts
        if (op === '<<' || op === '>>') {
          const opTy = T.integerPromote(lt);
          genExpr(node.left);
          emitCast(lt, opTy);
          if (T.is64Bit(opTy)) { emit(`  PUSH R0`); emit(`  PUSH R1`); }
          else emit(`  PUSH R0`);
          genExpr(node.right);
          emitBinaryOp(op, opTy, rt);
          return;
        }

        // Arithmetic & bitwise binary ops
        const opTy = T.usualArithConv(lt, rt);
        genExpr(node.left);
        emitCast(lt, opTy);
        if (T.is64Bit(opTy)) { emit(`  PUSH R0`); emit(`  PUSH R1`); }
        else emit(`  PUSH R0`);
        genExpr(node.right);
        emitBinaryOp(op, opTy, rt);
        return;
      }
      case 'Call': {
        genCall(node);
        return;
      }

      case 'BuiltinTrap':
        emit(`  HALT ; __builtin_trap/abort`);
        return;
      case 'BuiltinAlloca': {
        genExpr(node.size);
        emitCast(node.size.type, T.TY_ULONG);
        emit(`  ADDI R0, R0, 3`);
        emitLoadConst('R3', ~3 >>> 0);
        emit(`  BAND R0, R0, R3`);
        emit(`  SUB R8, R8, R0`);
        emit(`  MOV R0, R8`);
        return;
      }
      case 'BuiltinVaStart': {
        const lastSz = align4(Math.max(node.last.type.size, 4));
        genAddr(node.ap);
        emit(`  PUSH R0`);
        genAddr(node.last);
        emitLoadConst('R3', lastSz);
        emit(`  ADD R0, R0, R3`);
        emit(`  POP R2`);
        emitStore(T.ptrTo(T.TY_SCHAR), 'R2', 0);
        return;
      }
      case 'BuiltinVaEnd': {
        genAddr(node.ap);
        emit(`  MOV R2, R0`);
        emit(`  LI R0, 0`);
        emitStore(T.ptrTo(T.TY_SCHAR), 'R2', 0);
        return;
      }
      case 'BuiltinVaCopy': {
        genAddr(node.dst);
        emit(`  PUSH R0`);
        genExpr(node.src);
        emit(`  POP R2`);
        emitStore(T.ptrTo(T.TY_SCHAR), 'R2', 0);
        return;
      }
      case 'BuiltinVaArg': {
        const argSz = align4(Math.max(node.type.size, 4));
        genAddr(node.ap);
        emit(`  PUSH R4`);
        emit(`  MOV R4, R0`); // R4 = &ap
        emitLoad(T.ptrTo(T.TY_SCHAR), 'R4', 0); // R0 = old ap
        emit(`  PUSH R0`); // save ptr to current arg
        emitLoadConst('R3', argSz);
        emit(`  ADD R0, R0, R3`);
        emitStore(T.ptrTo(T.TY_SCHAR), 'R4', 0); // ap += argSz
        emit(`  POP R2`); // R2 = ptr to current arg
        if (T.isAggregate(node.type)) {
          emit(`  MOV R0, R2`);
        } else {
          emitLoad(node.type, 'R2', 0);
        }
        emit(`  POP R4`);
        return;
      }
      case 'BuiltinOverflow': {
        genBuiltinOverflow(node);
        return;
      }

      case 'BuiltinBit': {
        genBuiltinBit(node);
        return;
      }
      case 'BuiltinAtomic': {
        genBuiltinAtomic(node);
        return;
      }
      default:
        throw new Error(`Codegen: unhandled expression kind '${node.kind}'`);
    }

    // Re-enter cleanly for PreIncDec / PostIncDec (avoiding stack ordering ambiguity)
    if (node.kind === 'PreIncDec' || node.kind === 'PostIncDec') {
      const isPost = node.kind === 'PostIncDec';
      const isInc = node.op === '++';
      const ty = node.type;
      const isBf = node.expr.kind === 'Member' && node.expr.field.bitWidth !== null && node.expr.field.bitWidth !== undefined;
      genAddr(node.expr);
      emit(`  PUSH R4`);
      emit(`  MOV R4, R0`); // R4 = address (callee-saved, preserved across calls!)
      if (isBf) {
        emitBitfieldLoad(node.expr.field);
      } else {
        emitLoad(ty, 'R4', 0, node.expr.type.isVolatile);
      }
      if (isPost) {
        if (T.is64Bit(ty)) { emit(`  PUSH R0`); emit(`  PUSH R1`); }
        else emit(`  PUSH R0`);
      }
      if (ty.kind === T.TK.PTR) {
        const step = Math.max(ty.base.size, 1);
        emitLoadConst('R3', isInc ? step : -step);
        emit(`  ADD R0, R0, R3`);
        emit(`  WRAPS R0, R0, 32`);
      } else if (ty.kind === T.TK.FLOAT) {
        emitLoadConst('R1', floatToU32(1.0));
        emit(`  CALL_SYM ${isInc ? '__t5_fadd' : '__t5_fsub'}`);
      } else if (ty.kind === T.TK.DOUBLE) {
        const [lo, hi] = doubleToU32Pair(1.0);
        emitLoadConst('R2', lo);
        emitLoadConst('R3', hi);
        emitDoubleBinCall(isInc ? '__t5_dadd' : '__t5_dsub');
      } else if (ty.kind === T.TK.LLONG) {
        emit(`  LI R2, 1`);
        emit(`  LI R3, 0`);
        if (isInc) { emit(`  BADD R0, R0, R2`); emit(`  BADC R1, R1, R3`); }
        else { emit(`  BSUB R0, R0, R2`); emit(`  BSBC R1, R1, R3`); }
      } else if (ty.kind === T.TK.BOOL) {
        if (isInc) emit(`  LI R0, 1`);
        else { emit(`  SUBI R0, R0, 1`); emitCast(T.TY_INT, T.TY_BOOL); }
      } else {
        emit(isInc ? `  ADDI R0, R0, 1` : `  SUBI R0, R0, 1`);
        emit(`  ${ty.unsigned ? 'WRAPU' : 'WRAPS'} R0, R0, ${ty.size * 8}`);
      }
      if (isBf) {
        emit(`  PUSH R4`);
        emitBitfieldStore(node.expr.field);
      } else {
        emitStore(ty, 'R4', 0, node.expr.type.isVolatile);
      }
      if (isPost) {
        if (T.is64Bit(ty)) { emit(`  POP R1`); emit(`  POP R0`); }
        else emit(`  POP R0`);
      }
      emit(`  POP R4`);
    }
  }

  // Binary op helper: left is on HW stack (pushed as R0 or R0,R1), right is in R0 (or R0,R1)
  function emitBinaryOp(op, opTy, rightRawTy) {
    if (op === '<<' || op === '>>') {
      emitCast(rightRawTy, T.TY_INT);
      if (opTy.kind === T.TK.LLONG) {
        emit(`  MOV R2, R0`);
        emit(`  POP R1`);
        emit(`  POP R0`);
        const fn = op === '<<' ? '__ashldi3' : (opTy.unsigned ? '__lshrdi3' : '__ashrdi3');
        emit(`  CALL_SYM ${fn}`);
        return;
      }
      emit(`  MOV R2, R0`);
      emit(`  POP R0`);
      if (op === '<<') {
        emit(`  BSHL R0, R0, R2`);
        emit(`  ${opTy.unsigned ? 'WRAPU' : 'WRAPS'} R0, R0, 32`);
      } else if (opTy.unsigned) {
        emit(`  BSHR R0, R0, R2`);
      } else {
        emit(`  BSAR R0, R0, R2`);
      }
      return;
    }

    emitCast(rightRawTy, opTy);

    if (opTy.kind === T.TK.FLOAT) {
      emit(`  MOV R1, R0`);
      emit(`  POP R0`);
      const fnMap = { '+': '__t5_fadd', '-': '__t5_fsub', '*': '__t5_fmul', '/': '__t5_fdiv' };
      emit(`  CALL_SYM ${fnMap[op]}`);
      return;
    }
    if (opTy.kind === T.TK.DOUBLE) {
      emit(`  MOV R2, R0`);
      emit(`  MOV R3, R1`);
      emit(`  POP R1`);
      emit(`  POP R0`);
      const fnMap = { '+': '__t5_dadd', '-': '__t5_dsub', '*': '__t5_dmul', '/': '__t5_ddiv' };
      emitDoubleBinCall(fnMap[op]);
      return;
    }
    if (opTy.kind === T.TK.LLONG) {
      emit(`  MOV R2, R0`);
      emit(`  MOV R3, R1`);
      emit(`  POP R1`);
      emit(`  POP R0`);
      if (op === '+') { emit(`  BADD R0, R0, R2`); emit(`  BADC R1, R1, R3`); return; }
      if (op === '-') { emit(`  BSUB R0, R0, R2`); emit(`  BSBC R1, R1, R3`); return; }
      if (op === '&') { emit(`  BAND R0, R0, R2`); emit(`  BAND R1, R1, R3`); return; }
      if (op === '|') { emit(`  BOR R0, R0, R2`);  emit(`  BOR R1, R1, R3`);  return; }
      if (op === '^') { emit(`  BXOR R0, R0, R2`); emit(`  BXOR R1, R1, R3`); return; }
      if (op === '*') {
        // 64x64->64 multiply using BMULLO/BMULHI (ISA-5.md §1.3)
        emit(`  PUSH R4`);
        emit(`  PUSH R5`);
        emit(`  BMULLO R4, R0, R2`); // r_lo
        emit(`  BMULHI R5, R0, R2`); // hi0
        emit(`  BMULLO R3, R0, R3`); // a_lo * b_hi
        emit(`  BADD R5, R5, R3`);
        emit(`  BMULLO R3, R1, R2`); // a_hi * b_lo
        emit(`  BADD R1, R5, R3`);   // r_hi
        emit(`  MOV R0, R4`);
        emit(`  POP R5`);
        emit(`  POP R4`);
        return;
      }
      if (op === '/') { emitI64BinCall(opTy.unsigned ? '__udivdi3' : '__divdi3'); return; }
      if (op === '%') { emitI64BinCall(opTy.unsigned ? '__umoddi3' : '__moddi3'); return; }
      throw new Error(`Unhandled 64-bit op '${op}'`);
    }

    // 32-bit integer ops
    emit(`  MOV R2, R0`);
    emit(`  POP R0`);
    const wrap = opTy.unsigned ? 'WRAPU R0, R0, 32' : 'WRAPS R0, R0, 32';
    switch (op) {
      case '+': emit(`  ADD R0, R0, R2`); emit(`  ${wrap}`); break;
      case '-': emit(`  SUB R0, R0, R2`); emit(`  ${wrap}`); break;
      case '*': emit(`  BMULLO R0, R0, R2`); if (!opTy.unsigned) emit(`  WRAPS R0, R0, 32`); break;
      case '/': emit(`  DIV R0, R0, R2`); emit(`  ${wrap}`); break;
      case '%': emit(`  MOD R0, R0, R2`); emit(`  ${wrap}`); break;
      case '&': emit(`  BAND R0, R0, R2`); if (!opTy.unsigned) emit(`  WRAPS R0, R0, 32`); break;
      case '|': emit(`  BOR R0, R0, R2`);  if (!opTy.unsigned) emit(`  WRAPS R0, R0, 32`); break;
      case '^': emit(`  BXOR R0, R0, R2`); if (!opTy.unsigned) emit(`  WRAPS R0, R0, 32`); break;
      default: throw new Error(`Unhandled 32-bit op '${op}'`);
    }
  }

  // Compare left (on HW stack) vs right (in R0 or R0,R1) -> 0 or 1 in R0
  function emitCompare(op, cmpTy) {
    if (cmpTy.kind === T.TK.FLOAT || cmpTy.kind === T.TK.DOUBLE) {
      if (cmpTy.kind === T.TK.FLOAT) {
        emit(`  MOV R1, R0`);
        emit(`  POP R0`);
        emit(`  CALL_SYM __t5_fcmp`);
      } else {
        emit(`  MOV R2, R0`);
        emit(`  MOV R3, R1`);
        emit(`  POP R1`);
        emit(`  POP R0`);
        emitDoubleBinCall('__t5_dcmp');
      }
      // __t5_fcmp / __t5_dcmp returns: -1 (a<b), 0 (a==b), 1 (a>b), 2 (unordered/NaN)
      const lblT = newLabel('ft'), lblE = newLabel('fe');
      if (op === '==') {
        emit(`  CMPI R0, 0`); emit(`  JZX ${lblT}`);
      } else if (op === '!=') {
        emit(`  CMPI R0, 0`); emit(`  JNZX ${lblT}`);
      } else if (op === '<') {
        emit(`  CMPI R0, -1`); emit(`  JZX ${lblT}`);
      } else if (op === '<=') {
        emit(`  CMPI R0, 0`); emit(`  JNPX ${lblT}`); // -1 or 0
      } else if (op === '>') {
        emit(`  CMPI R0, 1`); emit(`  JZX ${lblT}`);
      } else if (op === '>=') {
        const lblF = newLabel('ff');
        emit(`  CMPI R0, 2`); emit(`  JZX ${lblF}`);
        emit(`  CMPI R0, 0`); emit(`  JNNX ${lblT}`);
        emit(`${lblF}:`);
      }
      emit(`  LI R0, 0`);
      emit(`  JMPX ${lblE}`);
      emit(`${lblT}:`);
      emit(`  LI R0, 1`);
      emit(`${lblE}:`);
      return;
    }

    if (cmpTy.kind === T.TK.LLONG) {
      emit(`  MOV R2, R0`);
      emit(`  MOV R3, R1`);
      emit(`  POP R1`);
      emit(`  POP R0`);
      const lblT = newLabel('c64t'), lblF = newLabel('c64f'), lblE = newLabel('c64e');
      if (op === '==' || op === '!=') {
        emit(`  CMP R0, R2`);
        emit(`  JNZX ${op === '==' ? lblF : lblT}`);
        emit(`  CMP R1, R3`);
        emit(`  JNZX ${op === '==' ? lblF : lblT}`);
        emit(`  JMPX ${op === '==' ? lblT : lblF}`);
      } else {
        if (!cmpTy.unsigned) {
          emit(`  WRAPS R1, R1, 32`);
          emit(`  WRAPS R3, R3, 32`);
        }
        emit(`  CMP R1, R3`);
        if (op === '<' || op === '<=') {
          emit(`  JNX ${lblT}`);
          emit(`  JPX ${lblF}`);
        } else {
          emit(`  JPX ${lblT}`);
          emit(`  JNX ${lblF}`);
        }
        // High limbs equal -> compare low limbs unsigned!
        emit(`  CMP R0, R2`);
        if (op === '<') emit(`  JNX ${lblT}`);
        else if (op === '<=') emit(`  JNPX ${lblT}`);
        else if (op === '>') emit(`  JPX ${lblT}`);
        else if (op === '>=') emit(`  JNNX ${lblT}`);
        emit(`  JMPX ${lblF}`);
      }
      emit(`${lblT}:`);
      emit(`  LI R0, 1`);
      emit(`  JMPX ${lblE}`);
      emit(`${lblF}:`);
      emit(`  LI R0, 0`);
      emit(`${lblE}:`);
      return;
    }

    // 32-bit comparison (both signed and unsigned fit exactly in 27-trit word!)
    emit(`  MOV R2, R0`);
    emit(`  POP R0`);
    emit(`  CMP R0, R2`);
    const lblT = newLabel('ct'), lblE = newLabel('ce');
    const brMap = { '==': 'JZX', '!=': 'JNZX', '<': 'JNX', '<=': 'JNPX', '>': 'JPX', '>=': 'JNNX' };
    emit(`  ${brMap[op]} ${lblT}`);
    emit(`  LI R0, 0`);
    emit(`  JMPX ${lblE}`);
    emit(`${lblT}:`);
    emit(`  LI R0, 1`);
    emit(`${lblE}:`);
  }

  // Function call codegen (ABI-5.md §4)
  function genCall(node) {
    const ft = node.funcType;
    const isVariadic = ft.kind === T.TK.FUNC && ft.isVariadic;
    const retTy = node.type;
    const isSret = T.isAggregate(retTy);

    // If struct return, allocate caller return buffer on C stack
    let sretSize = 0;
    if (isSret) {
      sretSize = align4(Math.max(retTy.size, 4));
      if (sretSize <= ISA.TRYTE_HALF) emit(`  SUBI R8, R8, ${sretSize}`);
      else { emitLoadConst('R3', sretSize); emit(`  SUB R8, R8, R3`); }
      emit(`  PUSH R8`); // save sret pointer on HW stack
    }

    // Determine target: direct symbol or indirect function pointer
    const isDirect = node.callee.kind === 'Var' && node.callee.type.kind === T.TK.FUNC;
    if (!isDirect) {
      genExpr(node.callee);
      emit(`  SUBI R0, R0, ${BIAS}`); // convert C function pointer to machine address
      emit(`  PUSH R0`); // save machine target on HW stack
    }

    // Plan argument placement (registers R0..R2 vs C stack)
    const regPlan = []; // { reg, expr, paramTy, is64 }
    const stackPlan = []; // { off, expr, paramTy, size }
    let nextReg = isSret ? 1 : 0; // R0 reserved for sret if non-variadic struct return
    let stackOff = 0;
    if (isVariadic && isSret) {
      // Variadic + sret: sret goes at stack offset 0
      stackOff += 4;
    }

    const params = (ft.kind === T.TK.FUNC && ft.hasProto) ? ft.params : [];
    for (let i = 0; i < node.args.length; i++) {
      const arg = node.args[i];
      let pTy = i < params.length ? params[i].type : null;
      if (!pTy) {
        // Default argument promotions (C11 6.5.2.2p6)
        const dt = T.decayType(T.unqualType(arg.type));
        if (dt.kind === T.TK.FLOAT) pTy = T.TY_DOUBLE;
        else if (T.isInteger(dt) && dt.size < 4) pTy = T.TY_INT;
        else pTy = dt;
      }

      if (isVariadic || T.isAggregate(pTy)) {
        const sz = align4(Math.max(pTy.size, 4));
        stackPlan.push({ off: stackOff, expr: arg, paramTy: pTy, size: pTy.size });
        stackOff += sz;
      } else if (T.is64Bit(pTy)) {
        if (nextReg + 2 <= 3) {
          regPlan.push({ reg: nextReg, expr: arg, paramTy: pTy, is64: true });
          nextReg += 2;
        } else {
          stackPlan.push({ off: stackOff, expr: arg, paramTy: pTy, size: 8 });
          stackOff += 8;
        }
      } else {
        if (nextReg < 3) {
          regPlan.push({ reg: nextReg, expr: arg, paramTy: pTy, is64: false });
          nextReg += 1;
        } else {
          stackPlan.push({ off: stackOff, expr: arg, paramTy: pTy, size: 4 });
          stackOff += 4;
        }
      }
    }

    // Allocate outgoing C stack argument area
    if (stackOff > 0) {
      if (stackOff <= ISA.TRYTE_HALF) emit(`  SUBI R8, R8, ${stackOff}`);
      else { emitLoadConst('R3', stackOff); emit(`  SUB R8, R8, R3`); }
    }

    // Evaluate and store stack arguments
    for (const sp of stackPlan) {
      if (T.isAggregate(sp.paramTy)) {
        genAddr(sp.expr);
        emit(`  MOV R1, R0`);
        if (sp.off === 0) emit(`  MOV R0, R8`);
        else { emitLoadConst('R3', sp.off); emit(`  ADD R0, R8, R3`); }
        emitMemCopy('R0', 'R1', sp.size);
      } else {
        genExpr(sp.expr);
        emitCast(sp.expr.type, sp.paramTy);
        emitStore(sp.paramTy, 'R8', sp.off);
      }
    }

    // Evaluate register arguments onto HW stack, then pop into R0..R2
    for (const rp of regPlan) {
      genExpr(rp.expr);
      emitCast(rp.expr.type, rp.paramTy);
      if (rp.is64) { emit(`  PUSH R0`); emit(`  PUSH R1`); }
      else emit(`  PUSH R0`);
    }
    for (let i = regPlan.length - 1; i >= 0; i--) {
      const rp = regPlan[i];
      if (rp.is64) {
        emit(`  POP R${rp.reg + 1}`);
        emit(`  POP R${rp.reg}`);
      } else {
        emit(`  POP R${rp.reg}`);
      }
    }

    // Pop indirect target if needed
    if (!isDirect) {
      emit(`  POP R3`);
    }

    // Handle sret pointer
    if (isSret) {
      // Peek/pop sret pointer (it is at top of HW stack now)
      if (isVariadic) {
        emit(`  POP R2`); // wait: don't clobber R2 if non-variadic! In variadic, R0..R2 are unused.
        emit(`  PUSH R2`); // keep sret ptr for after call
        emit(`  PUSH R0`);
        emit(`  MOV R0, R2`);
        emitStore(T.ptrTo(T.TY_VOID), 'R8', 0);
        emit(`  POP R0`);
      } else {
        emit(`  POP R0`);
        emit(`  PUSH R0`); // keep for after call? Actually callee returns sret in R0!
      }
    }

    if (isDirect) {
      const symName = node.callee.symbol.asmName || node.callee.name;
      emit(`  CALL_SYM ${symName}`);
    } else {
      emit(`  CALLX 2`);
      emit(`  JMPX 2`);
      emit(`  JR R3`);
    }

    // Clean up outgoing C stack args
    if (stackOff > 0) {
      if (stackOff <= ISA.TRYTE_HALF) emit(`  ADDI R8, R8, ${stackOff}`);
      else { emitLoadConst('R3', stackOff); emit(`  ADD R8, R8, R3`); }
    }
    if (isSret) {
      emit(`  POP R0`); // return C-space pointer to struct buffer
    }
  }

  // GNU bit builtins
  function genBuiltinBit(node) {
    const nm = node.name;
    genExpr(node.arg);
    if (nm === '__builtin_bswap16') {
      emit(`  WRAPU R0, R0, 16`);
      emit(`  LI R3, 8`);
      emit(`  BSHR R2, R0, R3`);
      emit(`  WRAPU R0, R0, 8`);
      emit(`  BSHL R0, R0, R3`);
      emit(`  BOR R0, R0, R2`);
      emit(`  WRAPU R0, R0, 16`);
      return;
    }
    if (nm === '__builtin_bswap32') {
      emit(`  CALL_SYM __t5_bswap32`);
      return;
    }
    if (nm === '__builtin_bswap64') {
      emit(`  CALL_SYM __t5_bswap64`);
      return;
    }
    if (nm === '__builtin_clz' || nm === '__builtin_clzl') { emit(`  CALL_SYM __t5_clz32`); return; }
    if (nm === '__builtin_clzll') { emit(`  CALL_SYM __t5_clz64`); return; }
    if (nm === '__builtin_ctz' || nm === '__builtin_ctzl') { emit(`  CALL_SYM __t5_ctz32`); return; }
    if (nm === '__builtin_ctzll') { emit(`  CALL_SYM __t5_ctz64`); return; }
    if (nm === '__builtin_popcount' || nm === '__builtin_popcountl') { emit(`  CALL_SYM __t5_popcount32`); return; }
    if (nm === '__builtin_popcountll') { emit(`  CALL_SYM __t5_popcount64`); return; }

  // Inline assembly codegen
  function genAsmStmt(node) {
    // Allocate registers R0..R6 for operands
    const ops = [...node.outputs, ...node.inputs];
    const opRegs = [];
    const usedRegs = [];
    const avail = ['R0', 'R1', 'R2', 'R3', 'R4', 'R5', 'R6'];
    let regCursor = 0;

    // Save callee-saved regs if we borrow R4..R6
    for (let i = 0; i < ops.length; i++) {
      const c = ops[i].constraint;
      if (c.includes('i') || c.includes('n')) {
        opRegs.push(String(ast.evalConstExpr(ops[i].expr)));
      } else {
        const r = avail[regCursor++];
        opRegs.push(r);
        if (['R4', 'R5', 'R6'].includes(r)) usedRegs.push(r);
      }
    }
    for (const r of usedRegs) emit(`  PUSH ${r}`);

    // Load input operands (and '+' read-write outputs) into their assigned registers
    for (let i = 0; i < ops.length; i++) {
      const isOut = i < node.outputs.length;
      const c = ops[i].constraint;
      if (c.includes('i') || c.includes('n')) continue;
      if (!isOut || c.includes('+')) {
        genExpr(ops[i].expr);
        emit(`  PUSH R0`);
      }

    // Pop in reverse order into assigned registers
    for (let i = ops.length - 1; i >= 0; i--) {
      const isOut = i < node.outputs.length;
      const c = ops[i].constraint;
      if (c.includes('i') || c.includes('n')) continue;
      if (!isOut || c.includes('+')) {
        emit(`  POP ${opRegs[i]}`);
      }
    }

    // Substitute %0, %1, %[name] in template
    let rendered = node.template.replace(/%%|%(\d+)|%\[([A-Za-z_][A-Za-z0-9_]*)\]/g, (m, idxStr, sym) => {
      if (m === '%%') return '%';
      if (idxStr !== undefined) return opRegs[parseInt(idxStr, 10)];
      const idx = ops.findIndex(o => o.name === sym);
      if (idx >= 0) return opRegs[idx];
      return m;

    for (const asmLine of rendered.split(/[;\n]/)) {
      const t = asmLine.trim();
      if (t) emit(`  ${t} ; inline-asm`);
    }

    // Store output operands back to their C lvalues
    for (let i = 0; i < node.outputs.length; i++) {
      const r = opRegs[i];
      emit(`  PUSH ${r}`);
    }
    for (let i = node.outputs.length - 1; i >= 0; i--) {
      const out = node.outputs[i];
      genAddr(out.expr);
      emit(`  MOV R2, R0`);
      emit(`  POP R0`);
      emitStore(out.expr.type, 'R2', 0, true);
    }

    for (let i = usedRegs.length - 1; i >= 0; i--) emit(`  POP ${usedRegs[i]}`);

// ============================================================================
// TRITOS 3.0 IN-OS MNEMONIC TABLE & 8x8 FONT GENERATOR
// ============================================================================
const FMT_CODE_T3 = {
  NONE: 0, R3: 1, R2: 2, CMP: 3, CMPI: 4,
  RI: 5, RRI: 6, R1_S: 7, R1_D: 8, J: 9, JREL: 16
};

function generateMnemTableAsmT3() {
  const lines = ['mnem_table:'];
  const directives = [
    { name: '.EQU', op: 100, fmt: 10 },
    { name: '.ORG', op: 100, fmt: 11 },
    { name: '.TRYTE', op: 100, fmt: 12 },
    { name: '.DATA', op: 100, fmt: 12 },
    { name: '.WORD', op: 100, fmt: 13 },
    { name: '.STRING', op: 100, fmt: 14 },
    { name: '.STRINGZ', op: 100, fmt: 15 },
    { name: '.MODE', op: 100, fmt: 17 }
  ];
  for (const d of directives) {
    lines.push(`.word #${tokenHash27(d.name).toString()}`);
    lines.push(`.tryte #${d.op},#${d.fmt}`);
  }
  for (const spec of INSTR_SPECS) {
    lines.push(`.word #${tokenHash27(spec.mnem).toString()}`);
    lines.push(`.tryte #${spec.op},#${FMT_CODE_T3[spec.fmt]}`);
  }
  lines.push('.word #0');
  lines.push('.tryte #0,#0');
  return lines.join('\n');
}

  const lines = ['font_8x8:'];
  for (let g = 0; g < T3_FONT_GLYPHS_64.length; g++) {

const TRITOS3_SRC = buildTritOS3Source(0);
const TRITOS3_SRC_CAPPED = buildTritOS3Source(19182);

/* ============================================================================
 * [INLINE 7/7] Workstation Devices, StudioNet, State Exporter & Debugger UI
 * Provenance: extended from triton.html lines 5158–5574 (state hash, snapshot
 * export/import, 27-color palette & workstation UI) with Triton 3.0 729-color
 * 2-trit-per-channel palette, disk image export/import, StudioNet frame bus,
 * pointer lock, and interactive breakpoint/SPR debugger UI.

// Machine option: singleRamSourceBuffer (when true, caps in-OS assembler source buffer to 19,182 chars)
let SINGLE_RAM_BUFFER_MODE = false;
let ACTIVE_TRITOS3_SRC = TRITOS3_SRC;

function setSingleRamBufferMode(enabled) {
  SINGLE_RAM_BUFFER_MODE = Boolean(enabled);
  ACTIVE_TRITOS3_SRC = SINGLE_RAM_BUFFER_MODE ? TRITOS3_SRC_CAPPED : TRITOS3_SRC;
  if (typeof globalThis !== 'undefined' && globalThis.TritonSystem) {
    globalThis.TritonSystem.singleRamBufferMode = SINGLE_RAM_BUFFER_MODE;
    globalThis.TritonSystem.TRITOS3_SRC = ACTIVE_TRITOS3_SRC;
  }
  return ACTIVE_TRITOS3_SRC;
}

function setNarrowWasmState(enabled) {
  DEFAULT_NARROW_WASM_STATE = Boolean(enabled);
  if (typeof globalThis !== 'undefined' && globalThis.TritonSystem) {
    globalThis.TritonSystem.narrowWasmState = DEFAULT_NARROW_WASM_STATE;
  }
  return DEFAULT_NARROW_WASM_STATE;
}

// StudioNet 12-byte Header + Payload Frame Builder & Checksum (per context/STUDIONET.md)
function computeStudioNetChecksum(bytes, payloadLen) {
  let acc = 0;
  for (let i = 0; i < 10; i++) acc = (acc + bytes[i]) ^ (bytes[i] << (i & 7));
  for (let i = 0; i < payloadLen; i++) acc = (acc + bytes[12 + i]) ^ (bytes[12 + i] << (i & 7));
  return acc & 0xFFFF;
}

function buildStudioNetFrame(dstNode, srcNode, proto, seq, payloadBytes, ttl = 16) {
  const payload = Uint8Array.from(payloadBytes || []);
  const len = Math.min(500, payload.length);
  const frame = new Uint8Array(12 + len);
  frame[0] = dstNode & 0xFF;
  frame[1] = (dstNode >>> 8) & 0xFF;
  frame[2] = srcNode & 0xFF;
  frame[3] = (srcNode >>> 8) & 0xFF;
  frame[4] = proto & 0xFF;
  frame[5] = ttl & 0xFF;
  frame[6] = seq & 0xFF;
  frame[7] = (seq >>> 8) & 0xFF;
  frame[8] = len & 0xFF;
  frame[9] = (len >>> 8) & 0xFF;
  frame.set(payload.subarray(0, len), 12);
  const csum = computeStudioNetChecksum(frame, len);
  frame[10] = csum & 0xFF;
  frame[11] = (csum >>> 8) & 0xFF;
  return frame;
}

function parseStudioNetFrame(frameBytes) {
  const f = Uint8Array.from(frameBytes);
  if (f.length < 12) return null;
  const dstNode = f[0] | (f[1] << 8);
  const srcNode = f[2] | (f[3] << 8);
  const proto = f[4];
  const ttl = f[5];
  const seq = f[6] | (f[7] << 8);
  const len = f[8] | (f[9] << 8);
  const checksum = f[10] | (f[11] << 8);
  const payload = f.slice(12, 12 + len);
  return { dstNode, srcNode, proto, ttl, seq, len, checksum, payload };
}

// Disk Image Export & Import (Byte-for-Byte Round-Trip)
function exportDiskImage(vm) {
  const diskArr = vm instanceof TritonWASM ? vm.disk : vm.disk;
  const buf = new Uint8Array(diskArr.length * 2);
  const dv = new DataView(buf.buffer);
  for (let i = 0; i < diskArr.length; i++) {
    dv.setInt16(i * 2, diskArr[i], true);
  }
  return buf;
}

function importDiskImage(vm, byteArray) {
  const u8 = byteArray instanceof Uint8Array ? byteArray : new Uint8Array(byteArray);
  const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
  const count = Math.min(vm.disk.length, Math.floor(u8.byteLength / 2));
  for (let i = 0; i < count; i++) {
    const val = dv.getInt16(i * 2, true);
    if (vm instanceof TritonWASM) vm.setDisk(i, val);
    else vm.disk[i] = val;
  }
}

// Compute architectural state hash (works identically across TritonJS and TritonWASM in both T2 and T3)
// Provenance: extended from triton.html lines 5160–5196
function computeStateHash(vm) {
  let h = 2166136261 >>> 0;
  const mix = (v) => {
    const lo = v | 0;
    h ^= (lo & 0xFFFF);
    h = Math.imul(h, 16777619) >>> 0;
    h ^= ((lo >> 16) & 0xFFFF);
    h = Math.imul(h, 16777619) >>> 0;
    if (v > 2147483647 || v < -2147483648) {
      const hi = Math.floor(v / 4294967296) | 0;
      h ^= (hi & 0xFFFF);
      h = Math.imul(h, 16777619) >>> 0;
      h ^= ((hi >> 16) & 0xFFFF);
      h = Math.imul(h, 16777619) >>> 0;
    }
  };
  if (vm.archMode === 1) mix(vm.archMode);
  mix(vm.pc);
  mix(vm.sp);
  mix(vm.sf);
  mix(vm.cf);
  mix(vm.of);
  mix(vm.halted);
  mix(vm.steps);
  mix(vm.displayX);
  mix(vm.displayY);
  mix(vm.diskAddr);
  mix(vm.timerTicks);
  if (vm.archMode === 1) {
    mix(vm.priv);
    mix(vm.ie);
    mix(vm.imask);
    mix(vm.ipend);
    mix(vm.vbr);
    mix(vm.ubase);
    mix(vm.ulimit);
    mix(vm.protEn);
    mix(vm.epc);
    mix(vm.esp);
    mix(vm.esr);
    mix(vm.ecause);
    mix(vm.eaddr);
    mix(vm.ksp);
    mix(vm.diskStatus);
    mix(vm.diskErr);
  }
  for (let r = 0; r < 9; r++) {
    const [w0, w1, w2] = vm.getWord(r);
    mix(w0); mix(w1); mix(w2);
  }
  if (vm.archMode === 0) {
    for (let i = 0; i < TRYTE_MOD; i++) {
      const m = vm instanceof TritonWASM ? vm.getMem(i) : vm.mem[i];
      if (m !== 0) { mix(i); mix(m); }
    }
    for (let i = 0; i < TRYTE_MOD; i++) {
      const d = vm instanceof TritonWASM ? vm.i32[25600 + i] : vm.disk[i];
      if (d !== 0) { mix(i); mix(d); }
    }
    for (let i = 0; i < 59049; i++) {
      const p = vm instanceof TritonWASM ? vm.i8[196608 + i] : vm.vram[i];
      if (p !== 0) { mix(i); mix(p); }
    }
  } else {
    const mixSparseI16 = (arr) => {
      const len = arr.length;
      const nPairs = len >> 1;
      const i32 = new Int32Array(arr.buffer, arr.byteOffset, nPairs);
      for (let p = 0; p < nPairs; p++) {
        const w = i32[p];
        if (w !== 0) {
          const i0 = p << 1;
          const v0 = arr[i0];
          if (v0 !== 0) { mix(i0); mix(v0); }
          const v1 = arr[i0 + 1];
          if (v1 !== 0) { mix(i0 + 1); mix(v1); }
        }
      }
      if (len & 1) {
        const last = arr[len - 1];
        if (last !== 0) { mix(len - 1); mix(last); }
      }
    };
    mixSparseI16(vm.mem);
    mixSparseI16(vm.disk);
    mixSparseI16(vm.vram);
    if (vm.diskUnit) { mix(28); mix(vm.diskUnit); }
    if (vm.timerMode) { mix(31); mix(vm.timerMode); }
    // Triton 5.0 extended state (only mixed when non-zero so paging-off hash === Triton 4!)
    if (vm.pgEn || vm.ptbr || vm.asid || vm.pfCause || vm.wfi || vm.tls || vm.scratch) {
      mix(5001); mix(vm.pgEn || 0); mix(vm.ptbr || 0); mix(vm.asid || 0);
      mix(vm.pfCause || 0); mix(vm.wfi || 0); mix(vm.tls || 0); mix(vm.scratch || 0);
    }
    if (vm.units) {
      for (let u = 1; u < vm.units.length; u++) {
        const unit = vm.units[u];
        if (unit && unit.present && unit.map && unit.map.size > 0) {
          mix(1000 + u);
          const secs = [...unit.map.keys()].sort((a, b) => a - b);
          for (const s of secs) {
            const d = unit.map.get(s);
            if (d) {
              for (let i = 0; i < d.length; i++) {
                if (d[i] !== 0) { mix(s * 729 + i); mix(d[i]); }
              }
            }
          }
        }
      }
    }
  }
  return h >>> 0;
}

function exportSelfContainedHTML(templateHtml, jsVm) {
  const snapJson = JSON.stringify(captureSnapshot(jsVm));
  return templateHtml.replace(
    /<script id="triton-snapshot" type="application\/json">[\s\S]*?<\/script>/,
    '<script id="triton-snapshot" type="application/json">' + snapJson + '<\/script>'
  );
}

function extractSnapshotFromHTML(htmlStr) {
  const m = /<script id="triton-snapshot" type="application\/json">([\s\S]*?)<\/script>/.exec(htmlStr);
  if (!m) return null;
  const txt = m[1].trim();
  if (!txt || txt === 'null') return null;
  return JSON.parse(txt);
}

// 27-Color Balanced-Ternary Palette (T2 mode: 1 trit per channel)
// Provenance: carried from triton.html lines 5295–5307
const PALETTE_27 = (() => {
  const levels = [28, 132, 242];
  const pal = {};
  for (let v = -13; v <= 13; v++) {
    const t0 = balRem(v, 3, 1);
    const q1 = balQuot(v, 3, 1);
    const t1 = balRem(q1, 3, 1);
    const t2 = balQuot(q1, 3, 1);
    pal[v] = [levels[t2 + 1], levels[t1 + 1], levels[t0 + 1]];
  }
  return pal;
})();

// 729-Color Balanced-Ternary Palette (T3 mode: 2 trits = 9 levels [-4..+4] per channel R, G, B)
const PALETTE_729 = (() => {
  const levels9 = [0, 32, 64, 96, 128, 160, 192, 224, 255];
  const pal = {};
  for (let v = -364; v <= 364; v++) {
    const bDiad = balRem(v, 9, 4);
    const q1 = balQuot(v, 9, 4);
    const gDiad = balRem(q1, 9, 4);
    const rDiad = balQuot(q1, 9, 4);
    pal[v] = [levels9[rDiad + 4], levels9[gDiad + 4], levels9[bDiad + 4]];
  }
  return pal;
})();

/* === tcc5 Browser Driver === */
(function() {
  let cachedRuntimeObjs = null;

  function compileCToAsm(src, filename) {
    const pp = globalThis.TCC5_PREPROC.preprocess(src, { filename: filename || 'sample.c' });
    const ast = globalThis.TCC5_PARSER.parseProgram(pp, filename || 'sample.c');
    return globalThis.TCC5_CODEGEN.generateAsm(ast, { optLevel: 1 });
  }

  function buildRuntime() {
    if (cachedRuntimeObjs) return cachedRuntimeObjs;
    const rt = globalThis.TCC5_RUNTIME_SOURCES;
    const as = globalThis.TCC5_ASM.assembleT5O;
    cachedRuntimeObjs = [
      as(rt['runtime/crt0.s'], 'runtime/crt0.s'),
      as(compileCToAsm(rt['runtime/rt_mem.c'], 'runtime/rt_mem.c'), 'runtime/rt_mem.c'),
      as(compileCToAsm(rt['runtime/rt_int64.c'], 'runtime/rt_int64.c'), 'runtime/rt_int64.c'),
      as(compileCToAsm(rt['runtime/rt_softfp.c'], 'runtime/rt_softfp.c'), 'runtime/rt_softfp.c')
    ];
    return cachedRuntimeObjs;
  }

  function compileAndLinkBrowser(cSource) {
    const t0 = performance.now();
    const asm = compileCToAsm(cSource, 'sample.c');
    const userObj = globalThis.TCC5_ASM.assembleT5O(asm, 'sample.c');
    const rtObjs = buildRuntime();
    const exe = globalThis.TCC5_LINKER.linkT5X([...rtObjs, userObj]);
    const elapsedMs = (performance.now() - t0).toFixed(1);
    return { asm, userObj, exe, elapsedMs };
  }

  function getTritonSystem() {
    return globalThis.TritonSystem || null;
  }

  function runOnTriton5(exe) {
    const T = getTritonSystem();
    if (!T) throw new Error('triton5.html host not loaded yet');
    const opts = { archMode: 'T3', pageSize: 2187, mmuMode: 'balanced', diskSectors: 2 };
    const jsVm = new T.TritonJS(opts);
    const wasmVm = T.TritonWASM.createSync(opts);
    jsVm.loadProgram(exe.image, 0);
    wasmVm.loadProgram(exe.image, 0);
    jsVm.run(2000000);
    wasmVm.run(2000000);
    const jsHash = jsVm.stateHash ? jsVm.stateHash() : T.computeStateHash(jsVm);
    const wasmHash = wasmVm.stateHash ? wasmVm.stateHash() : T.computeStateHash(wasmVm);
    return {
      consoleOut: jsVm.consoleOut,
      wasmConsoleOut: wasmVm.consoleOut,
      jsSteps: jsVm.steps,
      wasmSteps: wasmVm.steps,
      halted: !!jsVm.halted && !!wasmVm.halted,
      jsHash,
      wasmHash,
      lockstepOk: jsHash === wasmHash && jsVm.consoleOut === wasmVm.consoleOut
    };
  }

  globalThis.TCC5Browser = { compileAndLinkBrowser, runOnTriton5, getTritonSystem };

  function initUI() {
    const srcEl = document.getElementById('c-source');
    const outEl = document.getElementById('console-out');
    const asmEl = document.getElementById('asm-out');
    const cStats = document.getElementById('compile-stats');
    const rStatus = document.getElementById('run-status');
    const aStats = document.getElementById('asm-stats');

    document.getElementById('btn-compile').addEventListener('click', () => {
      try {
        const res = compileAndLinkBrowser(srcEl.value);
        cStats.textContent = 'Compiled in ' + res.elapsedMs + ' ms';
        cStats.className = 'status-ok';
        const secMap = Object.values(res.exe.sections).map(s =>
          s.name.padEnd(12) + ' C=' + s.cAddr + ' M=' + s.machAddr + ' size=' + s.size + ' pages=' + s.pageCount
        ).join('\n');
        aStats.textContent = res.exe.image.length + ' trytes';
        asmEl.textContent = '=== .t5x Section Map (2,187-tryte pages) ===\n' + secMap + '\n\n=== Assembly ===\n' + res.asm;
      } catch (e) {
        cStats.textContent = 'Error';
        cStats.className = 'status-err';
        outEl.textContent = String(e.message || e);
      }
    });

    document.getElementById('btn-run').addEventListener('click', () => {
      try {
        const res = compileAndLinkBrowser(srcEl.value);
        cStats.textContent = 'Compiled in ' + res.elapsedMs + ' ms';
        cStats.className = 'status-ok';
        const secMap = Object.values(res.exe.sections).map(s =>
          s.name.padEnd(12) + ' C=' + s.cAddr + ' M=' + s.machAddr + ' size=' + s.size + ' pages=' + s.pageCount
        ).join('\n');
        aStats.textContent = res.exe.image.length + ' trytes';
        asmEl.textContent = '=== .t5x Section Map (2,187-tryte pages) ===\n' + secMap + '\n\n=== Assembly ===\n' + res.asm;

        const run = runOnTriton5(res.exe);
        outEl.textContent = run.consoleOut + '\n---\n' +
          'Steps: ' + run.jsSteps + ' | Halted: ' + run.halted +
          ' | JS===WASM: ' + (run.lockstepOk ? 'LOCKSTEP OK' : 'MISMATCH') +
          ' (hash ' + run.jsHash + ')';
        rStatus.textContent = run.lockstepOk ? 'JS ≡ WASM LOCKSTEP OK' : 'MISMATCH';
        rStatus.className = run.lockstepOk ? 'status-ok' : 'status-err';
      } catch (e) {
        rStatus.textContent = 'Error';
        rStatus.className = 'status-err';
        outEl.textContent = String(e.message || e);
      }
    });
  }
  if (document.readyState === 'loading') window.addEventListener('DOMContentLoaded', initUI);
  else initUI();
})();
