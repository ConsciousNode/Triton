x\n  CMPI R0, #1\n  JNZX tgvs_tet\n  LT R1, R2, #5 ; level (+5008)\n  CMPI R1, #5\n  JNX tgvs_tet\n  LI R0, #1 ; CURSED16\n  JMPX tgvs_done\ntgvs_hex:\n  LI R0, #2 ; HEX12\n  JMPX tgvs_done\ntgvs_tet:\n  LI R0, #0 ; TET4\ntgvs_done:\n  POP R2\n  POP R1\n  RET\n\ntry_sync_bag_vocab:\n  PUSH R0\n  PUSH R1\n  PUSH R2\n  PUSH R3\n  PUSH R4\n  PUSH R5\n  PUSH R6\n  CALLX try_get_vocab_sig ; R0 = sig\n  LI R1, #5377\n  ADD R6, R8, R1\n  LT R2, R6, #0 ; last_vocab_sig\n  CMP R0, R2\n  JZX tsbv_done\n\n  ; Filter bag[0..bag_len-1] by allowed ids for sig R0\n  ; sig=0 -> 1..4; sig=1 -> 1..16; sig=2 -> 5..16\n  LI R1, #5376\n  ADD R5, R8, R1\n  LT R3, R5, #0 ; bag_len\n  LI R4, #0 ; read idx\n  LI R5, #0 ; write idx\n  LI R1, #5380\n  ADD R1, R1, R8 ; &bag[0]\ntsbv_flt_lp:\n  CMP R4, R3\n  JNNX tsbv_flt_end\n  ADD R6, R1, R4\n  LT R6, R6, #0 ; id\n  CMPI R0, #0\n  JNZX tsbv_chk_hex\n  CMPI R6, #5\n  JNNX tsbv_skip\n  JMPX tsbv_keep\ntsbv_chk_hex:\n  CMPI R0, #2\n  JNZX tsbv_keep\n  CMPI R6, #5\n  JNX tsbv_skip\ntsbv_keep:\n  ADD R7, R1, R5\n  ST R6, R7, #0\n  ADDI R5, R5, #1\ntsbv_skip:\n  ADDI R4, R4, #1\n  JMPX tsbv_flt_lp\ntsbv_flt_end:\n  ; If sig==1 (CURSED16) && last==0 (TET4) -> flush bag\n  CMPI R0, #1\n  JNZX tsbv_save_len\n  CMPI R2, #0\n  JNZX tsbv_save_len\n  LI R5, #0\ntsbv_save_len:\n  LI R1, #5376\n  ADD R6, R8, R1\n  ST R5, R6, #0 ; bag_len = R5\n  ST R0, R6, #1 ; last_vocab_sig = R0\ntsbv_done:\n  POP R6\n  POP R5\n  POP R4\n  POP R3\n  POP R2\n  POP R1\n  POP R0\n  RET\n\ntry_refill_bag:\n  PUSH R0\n  PUSH R1\n  PUSH R2\n  PUSH R3\n  PUSH R4\n  PUSH R5\n  PUSH R6\n  PUSH R7\n  CALLX try_get_vocab_sig ; R0 = 0 (1..4), 1 (1..16), 2 (5..16)\n  LI R1, #5420\n  ADD R5, R8, R1 ; &vocab_tmp[0]\n  CMPI R0, #0\n  JZX trb_tet\n  CMPI R0, #1\n  JZX trb_cur\n  ; HEX12: 12 items 5..16\n  LI R2, #12\n  LI R3, #5\n  JMPX trb_fill\ntrb_cur:\n  LI R2, #16\n  LI R3, #1\n  JMPX trb_fill\ntrb_tet:\n  LI R2, #4\n  LI R3, #1\ntrb_fill:\n  LI R4, #0\ntrb_flp:\n  CMP R4, R2\n  JNNX T R7, R2, #0\n  PUSH R7\n  PUSH R6\n  LI R7, #5019\n  ADD R7, R7, R8\ntrylp_skip_cell:\n  POP R2\n  ADDI R3, R3, #2\n  SUBI R2, R2, #1\n  JMPX trylp_wr_lp\ntrylp_wr_done:\n  POP R2 ; active_id\n  ; lockedRows.size >= 2 iff minR != maxR\n  LI R3, #0\n  CMP R0, R1\n  JZX trylp_span_ok\n  LI R3, #1\ntrylp_span_ok:\n  ; isHexSpan2 = (mode==1 || mode==2) && active_id >= 5 && span2\n  LI R0, #5003\n  ADD R6, R8, R0\n  LT R0, R6, #0 ; mode\n  LI R1, #0\n  CMPI R0, #0\n  JZX trylp_res\n  CMPI R2, #5\n  JNX trylp_res\n  MOV R1, R3\ntrylp_res:\n  LI R0, #1 ; hasLockContext = 1\n  CALLX try_resolve_rows\n\n  ; Check buffer rows 0..3 (48 cells at +5019..5066)\n  LI R7, #5019\n  ADD R7, R7, R8\n  LI R0, #0\ntrylp_buf_lp:\n  CMPI R0, #48\n  JNNX trylp_buf_ok\n  ADD R1, R7, R0\n  LT R2, R1, #0\n  CMPI R2, #0\n  JNZX trylp_gameover\n  ADDI R0, R0, #1\n  JMPX trylp_buf_lp\ntrylp_gameover:\n  LI R1, #5011\n  ADD R6, R8, R1\n  LI R0, #1\n  ST R0, R6, #0 ; gameOver = 1\n  JMPX trylp_done\ntrylp_buf_ok:\n  CALLX try_spawn_next\ntrylp_done:\n  POP R7\n  POP R6\n  POP R5\n  POP R4\n  POP R3\n  POP R2\n  POP R1\n  POP R0\n  RET\n\n; try_resolve_rows(R0 = hasLockContext, R1 = isHexSpan2) -> R0 = count\ntry_resolve_rows:\n  PUSH R1\n  PUSH R2\n  PUSH R3\n  PUSH R4\n  PUSH R5\n  PUSH R6\n  PUSH R7\n  LI R2, #5440\n  ADD R5, R8, R2 ; scratch: row_is_full[0..27]\n  LI R2, #5019\n  ADD R6, R8, R2 ; &board[0]\n  LI R2, #0 ; count = 0\n  PUSH R0\n  LI R3, #0 ; r = 0..27\ntrr_scan_lp:\n  CMPI R3, #28\n  JNNX trr_scan_done\n  MULI R4, R3, #12\n  ADD R4, R4, R6\n  LI R7, #0 ; c = 0..11\ntrr_col_lp:\n  CMPI R7, #12\n  JNNX trr_is_full\n  ADD R0, R4, R7\n  LT R0, R0, #0\n  CMPI R0, #0\n  JZX trr_not_full\n  ADDI R7, R7, #1\n  JMPX trr_col_lp\ntrr_is_full:\n  LI R7, #1\n  ADDI R2, R2, #1\n  JMPX trr_st_full\ntrr_not_full:\n  LI R7, #0\ntrr_st_full:\n  ADD R4, R5, R3\n  ST R7, R4, #0\n  ADDI R3, R3, #1\n  JMPX trr_scan_lp\n\ntrr_scan_done:\n  POP R0\n  CMPI R2, #0\n  JNZX trr_collapse\n  ; count == 0\n  CMPI R0, #0\n  JZX trr_ret0\n  LI R3, #5009\n  ADD R4, R8, R3\n  LI R3, #0\n  ST R3, R4, #0 ; comboStreak = 0\ntrr_ret0:\n  LI R0, #0\n  JMPX trr_ret\n\ntrr_collapse:\n  ; Collapse non-full rows downward from r=27..0 into dst=27..0\n  PUSH R0 ; save hasLockContext\n  PUSH R1 ; save isHexSpan2\n  PUSH R2 ; save count\n  LI R3, #27 ; src r\n  LI R4, #27 ; dst r\ntrr_col_dn:\n  CMPI R3, #0\n  JNX trr_fill_top\n  ADD R0, R5, R3\n  LT R0, R0, #0 ; is_full[r]\n  CMPI R0, #0\n  JNZX trr_col_skip\n  CMP R3, R4\n  JZX trr_col_same\n  ; Copy row R3 -> row R4\n  MULI R0, R4, #12\n  ADD R0, R0, R6\n  MULI R1, R3, #12\n  ADD R1, R1, R6\n  ; __PERTURB_TRY_COLLAPSE__\n  JMPX trr_col_copied\ntrr_col_same:\n  ; __PERTURB_TRY_COLLAPSE_SAME__\ntrr_col_copied:\n  SUBI R4, R4, #1\ntrr_col_skip:\n  SUBI R3, R3, #1\n  JMPX trr_col_dn\ntrr_fill_top:\n  CMPI R4, #0\n  JNX trr_score\n  MULI R0, R4, #12\n  ADD R0, R0, R6\n  LI R1, #0\n  LI R2, #12\n  BFILL R0, R1, R2\n  SUBI R4, R4, #1\n  JMPX trr_fill_top\n\ntrr_score:\n  POP R2 ; count\n  POP R1 ; isHexSpan2\n  POP R0 ; hasLockContext\n  LI R3, #5000\n  ADD R6, R8, R3 ; &TRY_STATE\n\n  ; baseScore = (1:100, 2:300, 3:500, 4+:800+200*(count-4)) * level\n  LI R3, #100\n  CMPI R2, #1\n  JZX trr_base_ok\n  LI R3, #300\n  CMPI R2, #2\n  JZX trr_base_ok\n  LI R3, #500\n  CMPI R2, #3\n  JZX trr_base_ok\n  SUBI R3, R2, #4\n  MULI R3, R3, #200\n  ADDI R3, R3, #800\ntrr_base_ok:\n  LT R4, R6, #8 ; level\n  MUL R3, R3, R4 ; baseScore\n\n  ; comboStreak\n  LT R4, R6, #9 ; comboStreak\n  CMPI R0, #0\n  JZX trr_cmb_noctx\n  ADDI R4, R4, #1\n  JMPX trr_cmb_ok\ntrr_cmb_noctx:\n  CMPI R4, #1\n  JNNX trr_cmb_ok\n  LI R4, #1\ntrr_cmb_ok:\n  ST R4, R6, #9 ; comboStreak\n\n  ; comboIdx = min(4, max(0, comboStreak - 1)) -> half-units [2, 3, 4, 5, 6]\n  SUBI R4, R4, #1\n  CMPI R4, #0\n  JNNX trr_ci0\n  LI R4, #0\ntrr_ci0:\n  CMPI R4, #4\n  JNPX trr_ci1\n  LI R4, #4\ntrr_ci1:\n  LI R5, #try_combo_halves - app11_try_rom\n  ADD R5, R5, R8\n  ADD R5, R5, R4\n  LT R4, , #144\n  LI R3, #8\n  LI R4, #-350\n  SYSCALL #20\n\n  LI R0, #6\n  LI R1, #36\n  MOV R2, R5\n  LI R3, #3\n  LI R4, #COL_GREEN\n  LI R5, #-350\n  SYSCALL #26\n\n  LI R0, #6\n  LI R1, #36\n  LI R2, #144\n  LI R3, #8\n  SYSCALL #24\n\n  LI R7, #0\n  ADDI R6, R8, #1499\n  LI R0, #0\n  ST R0, R6, #0\n  ST R0, R6, #1\n  JMPX calc_ev_lp\n\ncalc_skip_sp:\n  LT R0, R1, #0\n  CMPI R0, #32\n  JNZX css_ret\n  ADDI R1, R1, #1\n  JMPX calc_skip_sp\ncss_ret:\n  RET\n\ncalc_parse_btern:\n  CALLX calc_skip_sp\n  LI R4, #0\ncpbt_lp:\n  LT R0, R1, #0\n  CMPI R0, #'1'\n  JZX cpbt_1\n  CMPI R0, #'0'\n  JZX cpbt_0\n  CMPI R0, #'T'\n  JZX cpbt_t\n  CMPI R0, #'t'\n  JZX cpbt_t\n  RET\ncpbt_1:\n  MULI R4, R4, #3\n  ADDI R4, R4, #1\n  ADDI R1, R1, #1\n  JMPX cpbt_lp\ncpbt_0:\n  MULI R4, R4, #3\n  ADDI R1, R1, #1\n  JMPX cpbt_lp\ncpbt_t:\n  MULI R4, R4, #3\n  SUBI R4, R4, #1\n  ADDI R1, R1, #1\n  JMPX cpbt_lp\n\nstr_calc_title: .stringz \"TRIT CALC\"\nstr_calc_hdr:   .stringz \"EXPR (T,0,1 + - * / & |):\"\nstr_calc_btns1: .stringz \"[T] [0] [1] [+] [-] [*]\"\nstr_calc_btns2: .stringz \"[/] [%] [&] [|] [=] [C]\"\nstr_calc_kmap1: .stringz \"T01+-*\"\nstr_calc_kmap2: .stringz \"/%&|=C\"\nstr_calc_fn:    .stringz \"CALC\"\napp5_calc_end:\n";

function buildTritOSDesktopSource(options = {}) {
  let s = TRITOS_DESKTOP_TEMPLATE;
  s = s.replace('; __PERTURB_COMPOSITOR__', options.perturbCompositor ? 'ADDI R0, R0, #1 ; 1-pixel compositor perturbation' : '; normal compositor');
  s = s.replace('; __PERTURB_SOLITAIRE_SHUFFLE__', (options.perturbSolitaireShuffle || options.perturbShuffle) ? 'CMPI R3, #51\n  JNZX sd_no_p\n  ADDI R6, R6, #1\n  MOD R6, R6, R5\nsd_no_p:' : '; normal shuffle');
  s = s.replace('; __PERTURB_TETRIS_ROTATION__', (options.perturbTetrisRotation || options.perturbTetrisRot) ? '.tryte #0,#0, #1,#1, #2,#1, #1,#2' : '.tryte #1,#0, #1,#1, #2,#1, #1,#2');
  s = s.replace('; __SHEET_EXPR_PARSER__', (options.ignoreSheetPrecedence || options.perturbSheetPrec) ? SHEET_EXPR_FLAT : SHEET_EXPR_NORMAL);
  s = s.replace('; __PERTURB_NET_CHECKSUM__', options.perturbNetChecksum ? 'ADDI R0, R0, #1 ; perturbed checksum' : '; normal checksum');
  if (options.disableTimer) {
    s = s.replace(/; __DISABLE_TIMER__/g, 'LI R0, #0');
  }
  s = s.replace('; __PERTURB_TRY_ROTATION__', options.perturbTryRotation ? '.tryte #0,#0, #0,#1, #0,#2, #1,#3 ; perturbed P1 rot 0' : '.tryte #0,#0, #0,#1, #0,#2, #0,#3 ; P1 rot 0');
  s = s.replace('; __PERTURB_TRY_PRNG__', options.perturbTryPrng ? 'ADDI R1, R1, #1 ; perturbed Mulberry32 inc' : '; normal Mulberry32 inc');
  s = s.replace('; __PERTURB_TRY_COLLAPSE__', options.perturbTryCollapse ? 'LI R2, #11\ntrr_sh_lp1:\n  CMPI R2, #0\n  JNX trr_col_copied\n  ADDI R7, R2, #1\n  CMPI R7, #12\n  JNX trr_sh_c1\n  LI R7, #0\ntrr_sh_c1:\n  ADD R7, R0, R7\n  PUSH R2\n  ADD R2, R1, R2\n  LT R2, R2, #0\n  ST R2, R7, #0\n  POP R2\n  SUBI R2, R2, #1\n  JMPX trr_sh_lp1' : 'LI R2, #12\n  BCOPY R0, R1, R2');
  s = s.replace('; __PERTURB_TRY_COLLAPSE_SAME__', options.perturbTryCollapse ? 'MULI R0, R4, #12\n  ADD R0, R0, R6\n  PUSH R3\n  LT R7, R0, #11\n  LI R2, #11\ntrr_sh_lp2:\n  CMPI R2, #1\n  JNX trr_sh_s2\n  SUBI R3, R2, #1\n  ADD R3, R0, R3\n  LT R3, R3, #0\n  ADD R1, R0, R2\n  ST R3, R1, #0\n  SUBI R2, R2, #1\n  JMPX trr_sh_lp2\ntrr_sh_s2:\n  ST R7, R0, #0\n  POP R3' : '; same row');
  s = s.replace('; __PERTURB_TRY_SCORE__', options.perturbTryScore ? '.tryte #2, #4, #4, #5, #6 ; perturbed combo 1.5->2' : '.tryte #2, #3, #4, #5, #6');
  if (options.disableProtection) {
    s = s.replace(/; __DISABLE_PROTECTION__/g, 'LI R0, #27');
  }
  return s;
}

const TRITOS_DESKTOP_SRC = buildTritOSDesktopSource({});

function bootTritOSDesktop(vm, keepDisk = false, options = {}) {
  const src = (options && Object.keys(options).length > 0) ? buildTritOSDesktopSource(options) : TRITOS_DESKTOP_SRC;
  const built = TritonSystem.assemble(src, { mode: 'T3' });
  vm.defaultArchMode = 1;
  vm.reset(keepDisk);
  for (let i = 0; i < built.trytes.length; i++) {
    if (vm.setDisk) vm.setDisk(i, built.trytes[i]);
    else vm.disk[i] = built.trytes[i];
  }
  vm.loadProgram(built.trytes.slice(0, 32), 0);
  return built;
}

TritonSystem.TRITOS_DESKTOP_SRC = TRITOS_DESKTOP_SRC;
TritonSystem.STANDALONE_CALC_SRC = STANDALONE_CALC_SRC;
TritonSystem.buildTritOSDesktopSource = buildTritOSDesktopSource;
TritonSystem.bootTritOSDesktop = bootTritOSDesktop;

// [INLINE 4/4] Host Framebuffer Canvas Plumbing, StudioNet BroadcastChannel & Read-Only Debug Panel
// Provenance: adapted from triton3.html lines 9665–10043; reaches the machine exclusively through TritonSystem.
if (typeof document !== 'undefined') {
  let _desktopBooted = false;
  window.addEventListener('DOMContentLoaded', () => {
    if (_desktopBooted) return;
    _desktopBooted = true;
    const T = TritonSystem;
    const nodeSel = document.getElementById('node-id-select');
    const urlNodeMatch = /[?#&]node=(\d+)/.exec((window.location.search || '') + (window.location.hash || ''));
    const initialNodeId = window.TRITOS_INITIAL_NODE_ID || (urlNodeMatch ? (parseInt(urlNodeMatch[1], 10) || 3) : ((nodeSel && parseInt(nodeSel.value, 10)) || 3));
    if (nodeSel) nodeSel.value = String(initialNodeId);

    const wasmVm = T.TritonWASM.createSync({ archMode: 'T3', nodeId: initialNodeId });
    const jsVm = new T.TritonJS({ archMode: 'T3', nodeId: initialNodeId });
    bootTritOSDesktop(wasmVm, false);
    bootTritOSDesktop(jsVm, false);
    wasmVm.run(300000);
    jsVm.run(300000);

    // Join BroadcastChannel('studionet-v1') so tabs in the same browser share one StudioNet network
    let studioNetChan = null;
    if (typeof BroadcastChannel !== 'undefined') {
      try {
        studioNetChan = new BroadcastChannel('studionet-v1');
        studioNetChan.onmessage = (ev) => {
          if (ev.data) {
            wasmVm.receiveNetFrame(ev.data);
            wasmVm.run(600000);
            if (modeSel && modeSel.value === 'lockstep') {
              jsVm.receiveNetFrame(ev.data);
              jsVm.run(250000);
            }
            renderFramebuffer();
            updateDebugReadout();
          }
        };
        const txHook = (frame) => {
          try { studioNetChan.postMessage(frame); } catch (_) {}
        };
        wasmVm.txHooks.push(txHook);
      } catch (_) {}
    }

    if (nodeSel) {
      nodeSel.addEventListener('change', () => {
        const nid = parseInt(nodeSel.value, 10) || 3;
        wasmVm.nodeId = nid;
        wasmVm.i32[20595] = nid;
        jsVm.nodeId = nid;
      });
    }

    const canvas = document.getElementById('triton-screen');
    const ctx = canvas.getContext('2d');
    const imgData = ctx.createImageData(T.T3_FB_WIDTH, T.T3_FB_HEIGHT);
    const dbgEl = document.getElementById('dbg-readout');
    const modeSel = document.getElementById('core-mode');
    let lastMouseX = 364, lastMouseY = 230;

    function renderFramebuffer() {
      const vram = wasmVm.vram;
      const data = imgData.data;
      for (let i = 0; i < T.T3_FB_SIZE; i++) {
        const rgb = T.PALETTE_729[vram[i]] || [0, 0, 0];
        const p = i * 4;
        data[p] = rgb[0];
        data[p + 1] = rgb[1];
        data[p + 2] = rgb[2];
        data[p + 3] = 255;
      }
      ctx.putImageData(imgData, 0, 0);
    }

    function updateDebugReadout() {
      const lockstep = modeSel.value === 'lockstep';
      const wHash = T.computeStateHash(wasmVm);
      const jHash = lockstep ? T.computeStateHash(jsVm) : wHash;
      const regs = [];
      for (let r = 0; r < 9; r++) regs.push('R' + r + '=' + wasmVm.getWordNum(r));
      dbgEl.textContent = [
        'CORE: ' + (lockstep ? (wHash === jHash ? 'LOCKSTEP OK' : 'DIVERGENCE!') : 'WASM ONLY'),
        'STATE HASH: 0x' + wHash.toString(16).padStart(8, '0'),
        'STEPS: ' + wasmVm.steps + '  PRIV: ' + (wasmVm.priv ? 'USER' : 'SUP'),
        'NODE ID: 0x' + wasmVm.nodeId.toString(16).padStart(4, '0'),
        'PC: ' + wasmVm.pc + '  SP: ' + wasmVm.sp + '  PSW: ' + (wasmVm.sf + 3 * wasmVm.cf + 9 * wasmVm.of + 27 * wasmVm.priv + 81 * wasmVm.ie) + ' (ESR=' + wasmVm.esr + ')',
        'UBASE..ULIMIT: ' + wasmVm.ubase + '..' + wasmVm.ulimit,
        regs.join('  ')
      ].join('\n');
    }

    function tickFrame() {
      const lockstep = modeSel.value === 'lockstep';
      const budget = lockstep ? 15000 : 80000;
      wasmVm.run(budget);
      if (lockstep) jsVm.run(budget);
      renderFramebuffer();
      updateDebugReadout();
      requestAnimationFrame(tickFrame);
    }

    const SPECIAL_KEYS = {
      ArrowLeft: 128,
      ArrowRight: 129,
      ArrowUp: 130,
      ArrowDown: 131,
      Home: 132,
      End: 133,
      PageUp: 134,
      PageDown: 135,
      Delete: 127,
      Backspace: 8,
      Enter: 10,
      Tab: 9
    };

    function mapKeyEvent(e) {
      if (Object.prototype.hasOwnProperty.call(SPECIAL_KEYS, e.key)) return SPECIAL_KEYS[e.key];
      if (e.ctrlKey && e.key.length === 1) {
        const up = e.key.toUpperCase().charCodeAt(0);
        if (up >= 65 && up <= 90) return up - 64;
      }
      return e.key.length === 1 ? e.key.charCodeAt(0) : (e.keyCode || 0);
    }

    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      let dx = 0, dy = 0;
      if (document.pointerLockElement === canvas) {
        dx = e.movementX | 0;
        dy = e.movementY | 0;
      } else {
        const x = Math.round((e.clientX - rect.left) * (T.T3_FB_WIDTH / rect.width));
        const y = Math.round((e.clientY - rect.top) * (T.T3_FB_HEIGHT / rect.height));
        dx = x - lastMouseX;
        dy = y - lastMouseY;
        lastMouseX = x;
        lastMouseY = y;
      }
      if (dx !== 0 || dy !== 0) {
        wasmVm.pushMouseEvent(dx, dy, e.buttons & 7);
        if (modeSel.value === 'lockstep') jsVm.pushMouseEvent(dx, dy, e.buttons & 7);
      }
    });
    canvas.addEventListener('mousedown', (e) => {
      canvas.focus();
      wasmVm.pushMouseEvent(0, 0, e.buttons & 7);
      if (modeSel.value === 'lockstep') jsVm.pushMouseEvent(0, 0, e.buttons & 7);
    });
    canvas.addEventListener('mouseup', (e) => {
      wasmVm.pushMouseEvent(0, 0, e.buttons & 7);
      wasmVm.run(60000);
      if (modeSel.value === 'lockstep') { jsVm.pushMouseEvent(0, 0, e.buttons & 7); jsVm.run(60000); }
      renderFramebuffer();
      updateDebugReadout();
    });
    canvas.addEventListener('keydown', (e) => {
      e.preventDefault();
      const kc = mapKeyEvent(e);
      wasmVm.pushKeyEvent(kc, 0);
      wasmVm.run(kc === 10 ? 450000 : 80000);
      if (modeSel.value === 'lockstep') { jsVm.pushKeyEvent(kc, 0); jsVm.run(80000); }
      renderFramebuffer();
      updateDebugReadout();
    });
    canvas.addEventListener('keyup', (e) => {
      e.preventDefault();
      const kc = mapKeyEvent(e);
      wasmVm.pushKeyEvent(kc, 1);
      if (modeSel.value === 'lockstep') jsVm.pushKeyEvent(kc, 1);
    });

    document.getElementById('btn-reboot').addEventListener('click', () => {
      bootTritOSDesktop(wasmVm, true);
      bootTritOSDesktop(jsVm, true);
      wasmVm.run(300000);
      if (modeSel.value === 'lockstep') jsVm.run(300000);
    });
    document.getElementById('btn-ptr-lock').addEventListener('click', () => {
      if (canvas.requestPointerLock) canvas.requestPointerLock();
    });
    document.getElementById('btn-export-disk').addEventListener('click', () => {
      const bytes = T.exportDiskImage(wasmVm);
      const blob = new Blob([bytes], { type: 'application/octet-stream' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'tritos-desktop.t3d';
      a.click();
    });
    const diskIn = document.getElementById('disk-file-in');
    document.getElementById('btn-import-disk').addEventListener('click', () => diskIn.click());
    diskIn.addEventListener('change', (ev) => {
      const f = ev.target.files && ev.target.files[0];
      if (!f) return;
      const r = new FileReader();
      r.onload = () => {
        const u8 = new Uint8Array(r.result);
        T.importDiskImage(wasmVm, u8);
        T.importDiskImage(jsVm, u8);
      };
      r.readAsArrayBuffer(f);
    });

    renderFramebuffer();
    updateDebugReadout();
    requestAnimationFrame(tickFrame);
  });
}
