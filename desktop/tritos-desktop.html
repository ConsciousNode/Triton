p over ZORDER from z=0 to ZCOUNT-1\n  LI R8, #TMP_Z\n  LI R0, #0\n  ST R0, R8, #0\nwrr_zloop:\n  LI R8, #ZCOUNT\n  LT R1, R8, #0 ; ZCOUNT\n  LI R8, #TMP_Z\n  LT R0, R8, #0 ; z\n  CMP R0, R1\n  JNN wrr_zdone\n\n  LI R2, #ZORDER\n  ADD R2, R2, R0\n  LT R3, R2, #0 ; winIdx\n  MULI R4, R3, #24\n  ADDI R4, R4, #WINTAB ; R4 = &WINTAB[winIdx]\n\n  LT R0, R4, #0 ; VIS\n  CMPI R0, #0\n  JZ wrr_znext\n\n  ; Check y in [W.y, W.y + W.h)\n  LI R8, #TMP_Y\n  LT R6, R8, #0 ; y\n  LT R1, R4, #3 ; W.y\n  CMP R6, R1\n  JN wrr_znext\n  LT R2, R4, #5 ; W.h\n  ADD R2, R1, R2 ; W.y2\n  CMP R6, R2\n  JNN wrr_znext\n\n  ; Compute horizontal intersection [ix0, ix1) of [rx, rx2) and [W.x, W.x + W.w)\n  LI R8, #TMP_RX\n  LT R0, R8, #0 ; ix0 = rx\n  LT R5, R8, #4 ; ix1 = rx2\n  LT R2, R4, #2 ; W.x\n  LT R3, R4, #4 ; W.w\n  ADD R3, R2, R3 ; W.x2\n\n  CMP R0, R2\n  JNN wrr_ix0_ok\n  MOV R0, R2\nwrr_ix0_ok:\n  CMP R5, R3\n  JNP wrr_ix1_ok\n  MOV R5, R3\nwrr_ix1_ok:\n  SUB R7, R5, R0 ; count = ix1 - ix0\n  CMPI R7, #0\n  JNP wrr_znext\n\n  ; Source address in window buffer = W.buf + (y - W.y) * W.w + (ix0 - W.x)\n  SUB R6, R6, R1 ; dy = y - W.y\n  LT R3, R4, #4 ; W.w\n  MUL R6, R6, R3 ; dy * W.w\n  SUB R2, R0, R2 ; dx = ix0 - W.x\n  ADD R6, R6, R2 ; offset in buf\n  LW R1, R4, #6 ; W.buf\n  ADD R1, R1, R6 ; src = W.buf + offset\n  ADDI R0, R0, #SCAN_BUF ; dst = SCAN_BUF + ix0\n  BCOPY R0, R1, R7\n\nwrr_znext:\n  LI R8, #TMP_Z\n  LT R0, R8, #0\n  ADDI R0, R0, #1\n  ST R0, R8, #0\n  JMP wrr_zloop\n\nwrr_zdone:\n  ; 3. Overlay mouse cursor if y in [CUR_Y, CUR_Y + 6)\n  LI R8, #TMP_Y\n  LT R6, R8, #0 ; y\n  LI R4, #CUR_X\n  LT R1, R4, #1 ; CUR_Y\n  SUB R2, R6, R1 ; cy = y - CUR_Y\n  CMPI R2, #0\n  JN wrr_blit_vram\n  CMPI R2, #6\n  JNN wrr_blit_vram\n  LT R0, R4, #0 ; CUR_X\n  ADDI R0, R0, #SCAN_BUF\n  LI R5, #COL_WHITE\n  ST R5, R0, #0\n  CMPI R2, #0\n  JZ wrr_cur_r0\n  ST R5, R0, #1\n  CMPI R2, #1\n  JZ wrr_cur_r0\n  ST R5, R0, #2\nwrr_cur_r0:\n\nwrr_blit_vram:\n  ; 4. BCOPY rw trytes from SCAN_BUF + rx to FB_BASE + y*729 + rx\n  LI R8, #TMP_RX\n  LT R0, R8, #0 ; rx\n  LT R6, R8, #6 ; y\n  LT R2, R8, #2 ; rw\n  ADDI R1, R0, #SCAN_BUF\n  MULI R3, R6, #729\n  ADD R3, R3, R0\n  LI R0, #1554\n  LMI R0, #762 ; FB_BASE = 15000000\n  ADD R0, R0, R3\n  BCOPY R0, R1, R2\n\n  LI R8, #TMP_Y\n  LT R6, R8, #0\n  ADDI R6, R6, #1\n  ST R6, R8, #0\n  JMP wrr_yloop\n\nwrr_done:\n  POP R8\n  POP R7\n  POP R6\n  POP R5\n  POP R4\n  POP R3\n  POP R2\n  POP R1\n  POP R0\n  RET\n\n; ============================================================================\n; TASKBAR & FAULT BANNER RENDERER (Draws directly to bottom strip y = 462..485)\n; ============================================================================\nwm_draw_taskbar_banner:\n  PUSH R0\n  PUSH R1\n  PUSH R2\n  PUSH R3\n  PUSH R4\n  PUSH R5\n  PUSH R6\n  PUSH R7\n  PUSH R8\n\n  ; Fill taskbar background (y=462..485, 24 rows * 729 = 17,496 trytes at FB_BASE + 336,798)\n  ; Wait: 336,798 = 462 * 729 = 2187 + 17 * 19683\n  LI R0, #1554\n  LMI R0, #762 ; FB_BASE = 15000000\n  ADDI R0, R0, #2187\n  ADDM R0, R0, #17 ; FB_BASE + 462 * 729\n  LI R1, #COL_TASKBAR_BG\n  LI R2, #17496 - 19683\n  LMI R2, #1 ; 17496\n  BFILL R0, R1, R2\n\n  ; Draw top separator line at y=462\n  LI R0, #1554\n  LMI R0, #762\n  ADDI R0, R0, #2187\n  ADDM R0, R0, #17\n  LI R1, #COL_WIN_BORDER\n  LI R2, #729\n  BFILL R0, R1, R2\n\n  ; Draw 6 launcher buttons: \"[TERM] [EDIT] [PAIN] [CLOC] [ASM ] [CALC]\" at y=470\n  LI R0, #6\n  LI R1, #470\n  LI R4, #str_taskbar_btns\n  LI R2, #729 ; screen stride\n  LI R7, #1554\n  LMI R7, #762 ; FB_BASE\nwdtb_lp:\n  LT R3, R4, #0\n  CMPI R3, #0\n  JZ wdtb_chk_fault\n  PUSH R4\n  LI R4, #COL_WHITE\n  LI R5, #COL_TASKBAR_BTN\n  CALL wm_buf_draw_char\n  POP R4\n  ADDI R0, R0, #8\n  ADDI R4, R4, #1\n  JMP wdtb_lp\n\nwdtb_chk_fault:\n  ; Check if K_FAULT_BANNER_ACTIVE == 1\n  LI R1, #K_FAULT_BANNER_ACTIVE\n  LT R0, R1, #0\n  CMPI R0, #0\n  JZ wdtb_done\n\n  ; Draw red fault notification banner on right side of taskbar at x=430, y=470: \"FAULT KILLED TASK\"\n  LI R0, #430\n  LI R1, #470\n  LI R4, #str_fault_banner\nwdtb_flp:\n  LT R3, R4, #0\n  CMPI R3, #0\n  JZ wdtb_done\n  PUSH R4\n  LI R4, #COL_WHITE\n  LI R5, #COL_FAULT_BG\n  CALL wm_buf_draw_char\n  POP R4\n  ADDI R0, R0, #8\n  ADDI R4, R4, #1\n  JMP wdtb_flp\n\nwdtb_done:\n  POP R8\n  POP R7\n  POP R6\n  POP R5\n  POP R4\n  POP R3\n  POP R2\n  POP R1\n  POP R0\n  RET\n\n; ============================================================================\n; BLOCK-DISK FILE SYSTEM (Sector 60 Directory, Persistent Across Reboots)\n; ============================================================================\nfs_sync_read:\n  PUSH R0\n  LI R0, #FS_DIR_LBA\n  OUT R0, #P_DLBA\n  LI R0, #FS_DIR_BUF\n  OUT R0, #P_DDMA\n  LI R0, #1\n  OUT R0, #P_DCNT\n  OUT R0, #P_DCMD\n  POP R0\n  RET\n\nfs_sync_write:\n  PUSH R0\n  LI R0, #FS_DIR_LBA\n  OUT R0, #P_DLBA\n  LI R0, #FS_DIR_BUF\n  OUT R0, #P_DDMA\n  LI R0, #1\n  OUT R0, #P_DCNT\n  LI R0, #2\n  OUT R0, #P_DCMD\n  POP R0\n  RET\n\nfs_init:\n  PUSH R0\n  PUSH R1\n  PUSH R2\n  PUSH R3\n  PUSH R4\n  CALL fs_sync_read\n  LI R1, #FS_MAGIC_ADDR\n  LW R0, R1, #0\n  LI R2, #31337 - 19683\n  LMI R2, #1\n  CMP R0, R2\n  JZ fs_init_done\n\n  ; Format FS_DIR_BUF\n  LI R0, #FS_DIR_BUF\n  LI R1, #0\n  LI R2, #729\n  BFILL R0, R1, R2\n  LI R1, #FS_MAGIC_ADDR\n  LI R0, #31337 - 19683\n  LMI R0, #1\n  SW R0, R1, #0\n  LI R0, #210\n  SW R0, R1, #3 ; NEXT_FREE_LBA = 120 (leaves sectors 0..119 for boot/kernel/seeded files)\n  LI R0, #0\n  SW R0, R1, #6 ; FILE_COUNT = 0\n  CALL fs_sync_write\n\n  ; Create initial default files: HELLO.TXT and DEMO.ASM\n  LI R1, #str_fn_hello\n  LI R2, #str_file_hello\n  LI R3, #33\n  LI R4, #1\n  CALL fs_write\n\n  LI R1, #str_fn_demo\n  LI R2, #str_file_demo_asm\n  LI R3, #str_file_demo_end - str_file_demo_asm\n  LI R4, #3\n  CALL fs_write\n\nfs_init_done:\n  POP R4\n  POP R3\n  POP R2\n  POP R1\n  POP R0\n  RET\n\nfs_norm_name:\n  PUSH R0\n  PUSH R1\n  PUSH R2\n  PUSH R3\n  LI R2, #FS_NAME_TMP\n  LI R3, #8\nfnn_lp:\n  CMPI R3, #0\n  JZ fnn_done\n  LT R0, R1, #0\n  CMPI R0, #0\n  JZ fnn_pad\n  CMPI R0, #32\n  JZ fnn_pad\n  CMPI R0, #97\n  JN fnn_up_ok\n  CMPI R0, #122\n  JP fnn_up_ok\n  SUBI R0, R0, #32\nfnn_up_ok:\n  ST R0, R2, #0\n  ADDI R1, R1, #1\n  ADDI R2, R2, #1\n  SUBI R3, R3, #1\n  JMP fnn_lp\nfnn_pad:\n  LI R0, #0\n  ST R0, R2, #0\n  ADDI R2, R2, #1\n  SUBI R3, R3, #1\n  JMP fnn_lp\nfnn_done:\n  POP R3\n  POP R2\n  POP R1\n  POP R0\n  RET\n\nfs_find:\n  PUSH R0\n  PUSH R1\n  PUSH R2\n  PUSH R4\n  PUSH R5\n  CALL fs_norm_name\n  LI R3, #FS_DIR_BUF\n  LI R4, #44\nff_loop:\n  CMPI R4, #0\n  JZ ff_not_found\n  LT R0, R3, #0\n  CMPI R0, #0\n  JZ ff_next\n  LI R1, #0\nff_cmp_lp:\n  CMPI R1, #8\n  JZ ff_match\n  ADD R2, R3, R1\n  LT R0, R2, #0\n  LI R2, #FS_NAME_TMP\n  ADD R2, R2, R1\n  LT R5, R2, #0\n  CMP R0, R5\n  JNZ ff_next\n  ADDI R1, R1, #1\n  JMP ff_cmp_lp\nff_next:\n  ADDI R3, R3, #16\n  SUBI R4, R4, #1\n  JMP ff_loop\nff_not_found:\n  LI R3, #-1\nff_match:\n  POP R5\n  POP R4\n  POP R2\n  POP R1\n  POP R0\n  RET\n\nfs_write:\n  PUSH R1\n  PUSH R2\n  PUSH R3\n  PUSH R4\n  PUSH R5\n  PUSH R6\n  PUSH R7\n  PUSH R8\n  MOV R0, R3\n  CMPI R0, #0\n  JP fw_calc_sec\n  LI R5, #1\n  JMP fw_sec_ok\nfw_calc_sec:\n  ADDI R0, R0, #728\n  LI R6, #729\n  DIV R5, R0, R6\nfw_sec_ok:\n  MOV R8, R3\n  CALL fs_find\n  CMPI R3, #-1\n  JZ fw_new_file\n  LT R6, R3, #15\n  CMP R6, R5\n  JN fw_alloc_lba_existing\n  LW R7, R3, #9\n  JMP fw_have_slot_and_lba\n\nfw_new_file:\n  LI R3, #FS_DIR_BUF\n  LI R6, #44\nfw_free_lp:\n  CMPI R6, #0\n  JZ fw_dir_full\n  LT R0, R3, #0\n  CMPI R0, #0\n  JZ fw_alloc_new\n  ADDI R3, R3, #16\n  SUBI R6, R6, #1\n  JMP fw_free_lp\n\nfw_alloc_new:\n  LI R6, #FS_FREE_LBA_ADDR\n  LW R7, R6, #0\n  ADD R0, R7, R5\n  CMPI R0, #2187\n  JP fw_disk_full\n  SW R0, R6, #0\n  LW R0, R6, #3\n  ADDI R0, R0, #1\n  SW R0, R6, #3\n  JMP fw_have_slot_and_lba\n\nfw_alloc_lba_existing:\n  LI R6, #FS_FREE_LBA_ADDR\n  LW R7, R6, #0\n  ADD R0, R7, R5\n  CMPI R0, #2187\n  JP fw_disk_full\n  SW R0, R6, #0\n\nfw_have_slot_and_lba:\n  PUSH R2\n  PUSH R3\n  MOV R0, R3\n  LI R1, #FS_NAME_TMP\n  LI R2, #8\n  BCOPY R0, R1, R2\n  POP R3\n  POP R2\n  ST R4, R3, #8\n  SW R7, R3, #9\n  SW R8, R3, #12\n  ST R5, R3, #15\n\n  MULI R0, R7, #729\n  OUT R0, #P_DA\n  MOV R6, R8\nfw_wr_lp:\n  CMPI R6, #0\n  JNP fw_wr_done\n  LT R0, R2, #0\n  OUT R0, #P_DD\n  ADDI R2, R2, #1\n  SUBI R6, R6, #1\n  JMP fw_wr_lp\nfw_wr_done:\n  LI R0, #0\n  OUT R0, #P_DD\n  CALL fs_sync_write\n  LI R0, #0\n  JMP fw_exit\n\nfw_disk_full:\n  LI R0, #-1\n  JMP fw_exit\nfw_dir_full:\n  LI R0, #-2\nfw_exit:\n  POP R8\n  POP R7\n  POP R6\n  POP R5\n  POP R4\n  POP R3\n  POP R2\n  POP R1\n  RET\n\nfs_read:\n  PUSH R1\n  PUSH R2\n  PUSH R3\n  PUSH R4\n  PUSH R5\n  PUSH R6\n  CALL fs_find\n  CMPI R3, #-1\n  JZ fr_nf\n  LW R5, R3, #9\n  LW R6, R3, #12\n  CMP R6, R4\n  JNP fr_len_ok\n  MOV R6, R4\nfr_len_ok:\n  MULI R0, R5, #729\n  OUT R0, #P_DA\n  MOV R1, R6\nfr_rd_lp:\n  CMPI R6, #0\n  JNP fr_rd_done\n  IN R0, #P_DD\n  ST R0, R2, #0\n  ADDI R2, R2, #1\n  SUBI R6, R6, #1\n  JMP fr_rd_lp\nfr_rd_done:\n  LI R0, #0\n  ST R0, R2, #0\n  MOV R0, R1\n  JMP fr_exit\nfr_nf:\n  LI R0, #-1\nfr_exit:\n  POP R6\n  POP R5\n  POP R4\n  POP R3\n  POP R2\n  POP R1\n  RET\n\nfs_delete:\n  PUSH R1\n  PUSH R2\n  PUSH R3\n  CALL fs_find\n  CMPI R3, #-1\n  JZ fd_nf\n  LI R0, #0\n  ST R0, R3, #0\n  LI R1, #FS_COUNT_ADDR\n  LW R2, R1, #0\n  SUBI R2, R2, #1\n  SW R2, R1, #0\n  CALL fs_sync_write\n  LI R0, #0\n  JMP fd_exit\nfd_nf:\n  LI R0, #-1\nfd_exit:\n  POP R3\n  POP R2\n  POP R1\n  RET\n\n; ============================================================================\n; APP REGISTRY INITIALIZATION & KERNEL STRINGS / FONT DATA\n; ============================================================================\ninit_app_registry:\n  LI R8, #APP_REG_BASE\n  ; App 0: Terminal\n  LI R0, #app0_term_rom\n  LMI R0, #1\n  SW R0, R8, #0\n  LI R0, #app0_term_end - app0_term_rom\n  SW R0, R8, #3\n  ADDI R8, R8, #12\n  ; App 1: Editor\n  LI R0, #app1_edit_rom\n  LMI R0, #1\n  SW R0, R8, #0\n  LI R0, #app1_edit_end - app1_edit_rom\n  SW R0, R8, #3\n  ADDI R8, R8, #12\n  ; App 2: Paint\n  LI R0, #app2_paint_rom\n  LMI R0, #1\n  SW R0, R8, #0\n  LI R0, #app2_paint_end - app2_paint_rom\n  SW R0, R8, #3\n  ADDI R8, R8, #12\n  ; App 3: Clock\n  LI R0, #app3_clock_rom\n  LMI R0, #1\n  SW R0, R8, #0\n  LI R0, #app3_clock_end - app3_clock_rom\n  SW R0, R8, #3\n  ADDI R8, R8, #12\n  ; App 4: Assembler\n  LI R0, #app4_asm_rom\n  LMI R0, #1\n  SW R0, R8, #0\n  LI R0, #app4_asm_end - app4_asm_rom\n  SW R0, R8, #3\n  ADDI R8, R8, #12\n  ; App 5: Calculator\n  LI R0, #app5_calc_rom\n  LMI R0, #1\n  SW R0, R8, #0\n  LI R0, #app5_calc_end - app5_calc_rom\n  SW R0, R8, #3\n  RET\n\nstr_taskbar_btns: .stringz \"[TERM]  [EDIT]  [PAINT] [CLOCK] [ASM]   [CALC]\"\nstr_fault_banner: .stringz \"FAULT: TASK KILLED\"\nstr_fn_hello:     .stringz \"HELLO\"\nstr_file_hello:   .stringz \"HELLO FROM TRITOS DESKTOP 1.0 FS!\"\nstr_fn_demo:      .stringz \"DEMO\"\nstr_file_demo_asm: .stringz \".mode T3\\n.org 0\\nLI R0,#420\\nLI R1,#40\\nLI R2,#120\\nLI R3,#60\\nLI R4,#0\\nLI R5,#120\\nSYSCALL #10\\nlp: SYSCALL #2\\nJMPX lp\\n\"\nstr_file_demo_end: .tryte #0\n\n; [INLINE] 8x8 Bitmap Font (Provenance: copied from triton3.html lines 7268–7342)\nfont_8x8:\n.tryte #0,#0,#0,#0,#0,#0,#0,#0\n.tryte #24,#24,#24,#24,#24,#0,#24,#0\n.tryte #102,#102,#36,#0,#0,#0,#0,#0\n.tryte #36,#126,#36,#36,#126,#36,#0,#0\n.tryte #24,#62,#88,#60,#26,#124,#24,#0\n.tryte #98,#100,#8,#16,#38,#70,#0,#0\n.tryte #48,#72,#48,#86,#72,#54,#0,#0\n.tryte #24,#24,#16,#0,#0,#0,#0,#0\n.tryte #12,#24,#48,#48,#48,#24,#12,#0\n.tryte #48,#24,#12,#12,#12,#24,#48,#0\n.tryte #0,#36,#24,#126,#24,#36,#0,#0\n.tryte #0,#24,#24,#126,#24,#24,#0,#0\n.tryte #0,#0,#0,#0,#0,#24,#24,#48\n.tryte #0,#0,#0,#126,#0,#0,#0,#0\n.tryte #0,#0,#0,#0,#0,#24,#24,#0\n.tryte #2,#4,#8,#16,#32,#64,#0,#0\n.tryte #60,#70,#74,#82,#98,#60,#0,#0\n.tryte #24,#56,#24,#24,#24,#126,#0,#0\n.tryte #60,#66,#12,#48,#64,#126,#0,#0\n.tryte #60,#66,#28,#2,#66,#60,#0,#0\n.tryte #12,#20,#36,#68,#126,#4,#0,#0\n.tryte #126,#64,#124,#2,#66,#60,#0,#0\n.tryte #60,#64,#124,#66,#66,#60,#0,#0\n.tryte #126,#2,#4,#8,#16,#16,#0,#0\n.tryte #60,#66,#60,#66,#66,#60,#0,#0\n.tryte #60,#66,#66,#62,#2,#60,#0,#0\n.tryte #0,#24,#24,#0,#24,#24,#0,#0\n.tryte #0,#24,#24,#0,#24,#24,#48,#0\n.tryte #6,#24,#96,#24,#6,#0,#0,#0\n.tryte #0,#0,#126,#0,#126,#0,#0,#0\n.tryte #96,#24,#6,#24,#96,#0,#0,#0\n.tryte #60,#66,#12,#24,#0,#24,#0,#0\n.tryte #60,#66,#94,#86,#94,#64,#60,#0\n.tryte #60,#66,#66,#126,#66,#66,#0,#0\n.tryte #124,#66,#124,#66,#66,#124,#0,#0\n.tryte #60,#66,#64,#64,#66,#60,#0,#0\n.tryte #120,#68,#66,#66,#68,#120,#0,#0\n.tryte #126,#64,#124,#64,#64,#126,#0,#0\n.tryte #126,#64,#124,#64,#64,#64,#0,#0\n.tryte #60,#66,#64,#78,#66,#60,#0,#0\n.tryte #66,#66,#126,#66,#66,#66,#0,#0\n.tryte #62,#8,#8,#8,#8,#62,#0,#0\n.tryte #30,#4,#4,#4,#68,#56,#0,#0\n.tryte #66,#68,#120,#68,#66,#66,#0,#0\n.tryte #64,#64,#64,#64,#64,#126,#0,#0\n.tryte #66,#102,#90,#66,#66,#66,#0,#0\n.tryte #66,#98,#82,#74,#70,#66,#0,#0\n.tryte #60,#66,#66,#66,#66,#60,#0,#0\n.tryte #124,#66,#66,#124,#64,#64,#0,#0\n.tryte #60,#66,#66,#82,#74,#60,#2,#0\n.tryte #124,#66,#66,#124,#68,#66,#0,#0\n.tryte #60,#64,#60,#2,#66,#60,#0,#0\n.tryte #127,#8,#8,#8,#8,#8,#0,#0\n.tryte #66,#66,#66,#66,#66,#60,#0,#0\n.tryte #66,#66,#66,#36,#36,#24,#0,#0\n.tryte #66,#66,#66,#90,#102,#66,#0,#0\n.tryte #66,#36,#24,#24,#36,#66,#0,#0\n.tryte #65,#34,#20,#8,#8,#8,#0,#0\n.tryte #126,#4,#8,#16,#32,#126,#0,#0\n.tryte #60,#32,#32,#32,#32,#60,#0,#0\n.tryte #64,#32,#16,#8,#4,#2,#0,#0\n.tryte #60,#4,#4,#4,#4,#60,#0,#0\n.tryte #24,#36,#66,#0,#0,#0,#0,#0\n.tryte #0,#0,#0,#0,#0,#0,#126,#0\n\n\n; ============================================================================\n; USER-MODE APPLICATIONS (Each runs with PRIV=1, PROT_EN=1 in its own window)\n; ============================================================================\n\n; ----------------------------------------------------------------------------\n; APP 3: LIVE CLOCK (Shows Virtual Clock Ticks in Balanced Ternary & Decimal)\n; Window at (490, 12), size 220x70\n; ----------------------------------------------------------------------------\n.org 19683\napp3_clock_rom:\n  ; Open Window: x=490, y=12, w=220, h=70, title=str_clk_title, bg=-320\n  LI R0, #520\n  LI R1, #12\n  LI R2, #180\n  LI R3, #54\n  LI R4, #str_clk_title - app3_clock_rom\n  ADD R4, R4, R8\n  LI R5, #-320\n  SYSCALL #10\n\n  ; Draw static labels \"DEC:\" at (6, 8) and \"TRN:\" at (6, 26)\n  LI R0, #6\n  LI R1, #8\n  LI R2, #str_clk_dec - app3_clock_rom\n  ADD R2, R2, R8\n  LI R3, #COL_CYAN\n  LI R4, #-320\n  SYSCALL #21\n\n  LI R0, #6\n  LI R1, #26\n  LI R2, #str_clk_trn - app3_clock_rom\n  ADD R2, R2, R8\n  LI R3, #COL_GREEN\n  LI R4, #-320\n  SYSCALL #21\n\n  LI R7, #-1 ; last_ticks\n\nclk_loop:\n  ; Drain any events\n  SYSCALL #25\n  ; Read virtual clock ticks\n  SYSCALL #3 ; R0 = ticks\n  ; Store latest ticks at UBASE + 2000\n  ADDI R6, R8, #2000\n  SW R0, R6, #0\n  MOV R6, R0\n  ; Only redraw window if R7 == -1 or (R6 - R7) >= 8000\n  CMPI R7, #-1\n  JZX clk_do_draw\n  SUB R0, R6, R7\n  CMPI R0, #25000\n  JNNX clk_do_draw\n  SYSCALL #2\n  JMPX clk_loop\nclk_do_draw:\n  MOV R7, R6\n\n  ; Clear & draw Decimal at (40, 8, 128, 8)\n  LI R0, #40\n  LI R1, #8\n  LI R2, #128\n  LI R3, #8\n  LI R4, #-320\n  SYSCALL #20\n  LI R0, #40\n  LI R1, #8\n  MOV R2, R6\n  LI R3, #10\n  LI R4, #COL_WHITE\n  LI R5, #-320\n  SYSCALL #26\n  LI R0, #40\n  LI R1, #8\n  LI R2, #128\n  LI R3, #8\n  SYSCALL #24\n\n  ; Clear & draw Balanced Ternary at (40, 26, 128, 8)\n  LI R0, #40\n  LI R1, #26\n  LI R2, #128\n  LI R3, #8\n  LI R4, #-320\n  SYSCALL #20\n  LI R0, #40\n  LI R1, #26\n  MOV R2, R6\n  LI R3, #3\n  LI R4, #COL_YELLOW\n  LI R5, #-320\n  SYSCALL #26\n  LI R0, #40\n  LI R1, #26\n  LI R2, #128\n  LI R3, #8\n  SYSCALL #24\n\n  ; Yield for next timer slice\n  SYSCALL #2\n  JMPX clk_loop\n\nstr_clk_title: .stringz \"CLOCK\"\nstr_clk_dec:   .stringz \"DEC:\"\nstr_clk_trn:   .stringz \"TRN:\"\napp3_clock_end:\n\n; ----------------------------------------------------------------------------\n; APP 5: TRIT CALCULATOR (Balanced-Ternary Arithmetic + GUI Keypad)\n; Window at (480, 95), size 220x150\n; Supports typing balanced-ternary expressions like \"10T+11\\n\" or clicking GUI buttons!\n; Evaluates +, -, *, /, %, &(TMIN), |(TMAX), ^(TCON) on full 27-trit words!\n; Also stores last result word at UBASE + 2000 and formatted ternary at UBASE + 2100.\n; ----------------------------------------------------------------------------\napp5_calc_rom:\n  ; Open Window at (480, 95), w=220, h=150\n  LI R0, #510\n  LI R1, #75\n  LI R2, #190\n  LI R3, #96\n  LI R4, #str_calc_title - app5_calc_rom\n  ADD R4, R4, R8\n  LI R5, #-315\n  SYSCALL #10\n\n  ; Draw calculator keypad legend\n  LI R0, #6\n  LI R1, #4\n  LI R2, #str_calc_hdr - app5_calc_rom\n  ADD R2, R2, R8\n  LI R3, #COL_CYAN\n  LI R4, #-315\n  SYSCALL #21\n\n  LI R0, #6\n  LI R1, #56\n  LI R2, #str_calc_btns1 - app5_calc_rom\n  ADD R2, R2, R8\n  LI R3, #COL_WHITE\n  LI R4, #-240\n  SYSCALL #21\n\n  LI R0, #6\n  LI R1, #72\n  LI R2, #str_calc_btns2 - app5_calc_rom\n  ADD R2, R2, R8\n  LI R3, #COL_WHITE\n  LI R4, #-240\n  SYSCALL #21\n\n  LI R0, #0\n  LI R1, #0\n  LI R2, #0\n  LI R3, #0\n  SYSCALL #24\n\n  ; Input buffer at UBASE + 1500, length in R7\n  LI R7, #0\n  ADDI R6, R8, #1500\n  LI R0, #0\n  ST R0, R6, #0\n\ncalc_ev_lp:\n  SYSCALL #25\n  CMPI R0, #0\n  JZX calc_idle\n  CMPI R0, #1\n  JZX calc_on_key\n  CMPI R0, #2\n  JZX calc_on_click\n  JMPX calc_ev_lp\n\ncalc_idle:\n  ; If dirty flag at UBASE + 1499 is 1, redraw input once before yielding!\n  ADDI R6, R8, #1499\n  LT R0, R6, #0\n  CMPI R0, #0\n  JZX calc_do_yield\n  LI R0, #0\n  ST R0, R6, #0\n  CALLX calc_redraw_input\ncalc_do_yield:\n  SYSCALL #2\n  JMPX calc_ev_lp\n\ncalc_on_click:\n  ; Map mouse click (R1=client_x, R2=client_y) on keypad rows:\n  ; Row 1 (y in 52..68): \"[T] [0] [1] [+] [-] [*]\" -> each 32px wide\n  ; Row 2 (y in 70..86): \"[/] [%] [&] [|] [=] [C]\" -> each 32px wide\n  CMPI R2, #50\n  JNX calc_ev_lp\n  CMPI R2, #88\n  JPX calc_ev_lp\n  SUBI R0, R1, #6\n  CMPI R0, #0\n  JNX calc_ev_lp\n  LI R3, #32\n  DIV R0, R0, R3 ; col 0..5\n  CMPI R0, #6\n  JNNX calc_ev_lp\n  CMPI R2, #69\n  JNNX calc_click_r2\n  LI R3, #str_calc_kmap1 - app5_calc_rom\n  ADD R3, R3, R8\n  ADD R3, R3, R0\n  LT R1, R3, #0\n  JMPX calc_on_key\ncalc_click_r2:\n  LI R3, #str_calc_kmap2 - app5_calc_rom\n  ADD R3, R3, R8\n  ADD R3, R3, R0\n  LT R1, R3, #0\n\ncalc_on_key:\n  ; R1 = keycode\n  CMPI R1, #13\n  JZX calc_eval\n  CMPI R1, #10\n  JZX calc_eval\n  CMPI R1, #'='\n  JZX calc_eval\n  CMPI R1, #'C'\n  JZX calc_clear\n  CMPI R1, #'c'\n  JZX calc_clear\n  CMPI R1, #8 ; Backspace\n  JZX calc_bs\n\n  ; Append character R1 to input buffer at UBASE + 1500 + R7\n  CMPI R7, #24\n  JNNX calc_ev_lp\n  ADDI R6, R8, #1500\n  ADD R6, R6, R7\n  ST R1, R6, #0\n  LI R0, #0\n  ST R0, R6, #1\n  ADDI R7, R7, #1\n  ADDI R6, R8, #1499\n  LI R0, #1\n  ST R0, R6, #0\n  JMPX calc_ev_lp\n\ncalc_bs:\n  CMPI R7, #0\n  JZX calc_ev_lp\n  SUBI R7, R7, #1\n  ADDI R6, R8, #1500\n  ADD R6, R6, R7\n  LI R0, #0\n  ST R0, R6, #0\n  ADDI R6, R8, #1499\n  LI R0, #1\n  ST R0, R6, #0\n  JMPX calc_ev_lp\n\ncalc_clear:\n  LI R7, #0\n  ADDI R6, R8, #1500\n  LI R0, #0\n  ST R0, R6, #0\n  ADDI R6, R8, #1499\n  LI R0, #1\n  ST R0, R6, #0\n  JMPX calc_ev_lp\n\ncalc_redraw_input:\n  LI R0, #6\n  LI R1, #18\n  LI R2, #176\n  LI R3, #12\n  LI R4, #-340\n  SYSCALL #20\n  LI R0, #6\n  LI R1, #18\n  ADDI R2, R8, #1500\n  LI R3, #COL_WHITE\n  LI R4, #-340\n  SYSCALL #21\n  LI R0, #6\n  LI R1, #18\n  LI R2, #176\n  LI R3, #12\n  SYSCALL #24\n  RET\n\ncalc_eval:\n  ; Parse expression at UBASE + 1500: <operand1> <op> <operand2>\n  ADDI R1, R8, #1500\n  CALLX calc_parse_btern ; returns R4 = operand1, advances R1\n  MOV R5, R4\n  CALLX calc_skip_sp\n  LT R6, R1, #0 ; operator char\n  CMPI R6, #0\n  JZX calc_show_res\n  ADDI R1, R1, #1\n  CALLX calc_skip_sp\n  CALLX calc_parse_btern ; returns R4 = operand2\n  CMPI R6, #'+'\n  JNZX calc_op_sub\n  ADD R5, R5, R4\n  JMPX calc_show_res\ncalc_op_sub:\n  CMPI R6, #'-'\n  JNZX calc_op_mul\n  SUB R5, R5, R4\n  JMPX calc_show_res\ncalc_op_mul:\n  CMPI R6, #'*'\n  JNZX calc_op_div\n  MUL R5, R5, R4\n  JMPX calc_show_res\ncalc_op_div:\n  CMPI R6, #'/'\n  JNZX calc_op_mod\n  DIV R5, R5, R4\n  JMPX calc_show_res\ncalc_op_mod:\n  CMPI R6, #'%'\n  JNZX calc_op_min\n  MOD R5, R5, R4\n  JMPX calc_show_res\ncalc_op_min:\n  CMPI R6, #'&'\n  JNZX calc_op_max\n  TMIN R5, R5, R4\n  JMPX calc_show_res\ncalc_op_max:\n  CMPI R6, #'|'\n  JNZX calc_op_con\n  TMAX R5, R5, R4\n  JMPX calc_show_res\ncalc_op_con:\n  CMPI R6, #'^'\n  JNZX calc_op_xor\n  TCON R5, R5, R4\n  JMPX calc_show_res\ncalc_op_xor:\n  TXOR R5, R5, R4\n\ncalc_show_res:\n  ; Save 27-trit result R5 at UBASE + 2000\n  ADDI R6, R8, #2000\n  SW R5, R6, #0\n\n  ; Clear result display area (6, 34, 204, 16)\n  LI R0, #6\n  LI R1, #34\n  LI R2, #176\n  LI R3, #16\n  LI R4, #-350\n  SYSCALL #20\n\n  ; Draw result in Balanced Ternary at (6, 36)\n  LI R0, #6\n  LI R1, #36\n  MOV R2, R5\n  LI R3, #3\n  LI R4, #COL_GREEN\n  LI R5, #-350\n  SYSCALL #26\n\n  ; Flush result area\n  LI R0, #6\n  LI R1, #34\n  LI R2, #176\n  LI R3, #16\n  SYSCALL #24\n\n  ; Reset input buffer for next expression\n  LI R7, #0\n  ADDI R6, R8, #1500\n  LI R0, #0\n  ST R0, R6, #0\n  JMPX calc_ev_lp\n\ncalc_skip_sp:\n  LT R0, R1, #0\n  CMPI R0, #32\n  JNZX css_ret\n  ADDI R1, R1, #1\n  JMPX calc_skip_sp\ncss_ret:\n  RET\n\ncalc_parse_btern:\n  CALLX calc_skip_sp\n  LI R4, #0\ncpbt_lp:\n  LT R0, R1, #0\n  CMPI R0, #'1'\n  JZX cpbt_1\n  CMPI R0, #'0'\n  JZX cpbt_0\n  CMPI R0, #'T'\n  JZX cpbt_t\n  CMPI R0, #'t'\n  JZX cpbt_t\n  RET\ncpbt_1:\n  MULI R4, R4, #3\n  ADDI R4, R4, #1\n  ADDI R1, R1, #1\n  JMPX cpbt_lp\ncpbt_0:\n  MULI R4, R4, #3\n  ADDI R1, R1, #1\n  JMPX cpbt_lp\ncpbt_t:\n  MULI R4, R4, #3\n  SUBI R4, R4, #1\n  ADDI R1, R1, #1\n  JMPX cpbt_lp\n\nstr_calc_title: .stringz \"TRIT CALC\"\nstr_calc_hdr:   .stringz \"EXPR (T,0,1 + - * / & |):\"\nstr_calc_btns1: .stringz \"[T] [0] [1] [+] [-] [*]\"\nstr_calc_btns2: .stringz \"[/] [%] [&] [|] [=] [C]\"\nstr_calc_kmap1: .stringz \"T01+-*\"\nstr_calc_kmap2: .stringz \"/%&|=C\"\napp5_calc_end:\n\n\n; ----------------------------------------------------------------------------\n; APP 1: TEXT EDITOR (Edit, Save & Load Text Files on Disk)\n; Window at (250, 20), size 220x140\n; Toolbar at top (y=2..14): \"[SAVE]  [LOAD]  [CLR]\"\n; Filename buffer at UBASE + 1400 (default \"NOTE\"), text buffer at UBASE + 1500\n; ----------------------------------------------------------------------------\napp1_edit_rom:\n  LI R0, #250\n  LI R1, #20\n  LI R2, #180\n  LI R3, #96\n  LI R4, #str_edit_title - app1_edit_rom\n  ADD R4, R4, R8\n  LI R5, #-310\n  SYSCALL #10\n\n  ; Initialize default filename \"NOTE\" at UBASE + 1400\n  ADDI R6, R8, #1400\n  LI R0, #'N'\n  ST R0, R6, #0\n  LI R0, #'O'\n  ST R0, R6, #1\n  LI R0, #'T'\n  ST R0, R6, #2\n  LI R0, #'E'\n  ST R0, R6, #3\n  LI R0, #0\n  ST R0, R6, #4\n\n  ; Initialize empty text buffer at UBASE + 1500, length R7 = 0\n  LI R7, #0\n  ADDI R6, R8, #1500\n  LI R0, #0\n  ST R0, R6, #0\n\n  ; Draw toolbar \"[SAVE] [LOAD] [CLR] F:NOTE\" at (4, 2)\n  LI R0, #4\n  LI R1, #2\n  LI R2, #str_edit_bar - app1_edit_rom\n  ADD R2, R2, R8\n  LI R3, #COL_WHITE\n  LI R4, #-230\n  SYSCALL #21\n\n  CALLX edit_redraw\n  JMPX edit_ev_lp\n\nedit_ev_lp:\n  SYSCALL #25\n  CMPI R0, #0\n  JZX edit_idle\n  CMPI R0, #1\n  JZX edit_on_key\n  CMPI R0, #2\n  JZX edit_on_click\n  JMPX edit_ev_lp\n\nedit_idle:\n  ADDI R6, R8, #1499\n  LT R0, R6, #0\n  CMPI R0, #0\n  JZX edit_do_yield\n  LI R0, #0\n  ST R0, R6, #0\n  CALLX edit_redraw\nedit_do_yield:\n  SYSCALL #2\n  JMPX edit_ev_lp\n\nedit_on_click:\n  ; Check toolbar click (y < 14):\n  ; x in 4..52 -> SAVE\n  ; x in 60..108 -> LOAD\n  ; x in 116..156 -> CLEAR\n  CMPI R2, #14\n  JNNX edit_ev_lp\n  CMPI R1, #54\n  JNX edit_do_save\n  CMPI R1, #110\n  JNX edit_do_load\n  CMPI R1, #165\n  JNX edit_do_clear\n  JMPX edit_ev_lp\n\nedit_on_key:\n  ; R1 = keycode\n  ; Ctrl+S (19) or F2 (113) -> Save\n  CMPI R1, #19\n  JZX edit_do_save\n  CMPI R1, #113\n  JZX edit_do_save\n  ; Ctrl+L (12) or F3 (114) -> Load\n  CMPI R1, #12\n  JZX edit_do_load\n  CMPI R1, #114\n  JZX edit_do_load\n  ; Backspace (8)\n  CMPI R1, #8\n  JZX edit_bs\n  ; Ignore CR (13)\n  CMPI R1, #13\n  JZX edit_ev_lp\n\n  ; Append printable char or newline (10) to text buffer at UBASE + 1500 + R7\n  CMPI R7, #512\n  JNNX edit_ev_lp\n  ADDI R6, R8, #1500\n  ADD R6, R6, R7\n  ST R1, R6, #0\n  LI R0, #0\n  ST R0, R6, #1\n  ADDI R7, R7, #1\n  ADDI R6, R8, #1499\n  LI R0, #1\n  ST R0, R6, #0\n  JMPX edit_ev_lp\n\nedit_bs:\n  CMPI R7, #0\n  JZX edit_ev_lp\n  SUBI R7, R7, #1\n  ADDI R6, R8, #1500\n  ADD R6, R6, R7\n  LI R0, #0\n  ST R0, R6, #0\n  ADDI R6, R8, #1499\n  LI R0, #1\n  ST R0, R6, #0\n  JMPX edit_ev_lp\n\nedit_do_clear:\n  LI R7, #0\n  ADDI R6, R8, #1500\n  LI R0, #0\n  ST R0, R6, #0\n  ADDI R6, R8, #1499\n  LI R0, #1\n  ST R0, R6, #0\n  JMPX edit_ev_lp\n\nedit_do_save:\n  ; SYSCALL #32: SYS_FS_WRITE (R0=name_ptr, R1=src_ptr, R2=len, R3=type 1)\n  ADDI R0, R8, #1400\n  ADDI R1, R8, #1500\n  MOV R2, R7\n  LI R3, #1\n  SYSCALL #32\n  ; Show \"SAVED: NOTE\" status at bottom (y=112)\n  LI R0, #4\n  LI R1, #68\n  LI R2, #str_edit_saved - app1_edit_rom\n  ADD R2, R2, R8\n  LI R3, #COL_GREEN\n  LI R4, #-310\n  SYSCALL #21\n  LI R0, #0\n  LI R1, #0\n  LI R2, #0\n  LI R3, #0\n  SYSCALL #24\n  JMPX edit_ev_lp\n\nedit_do_load:\n  ; SYSCALL #31: SYS_FS_READ (R0=name_ptr, R1=dst_ptr, R2=max_len 512)\n  ADDI R0, R8, #1400\n  ADDI R1, R8, #1500\n  LI R2, #512\n  SYSCALL #31\n  CMPI R0, #0\n  JNX edit_ev_lp\n  MOV R7, R0\n  ADDI R6, R8, #1499\n  LI R0, #1\n  ST R0, R6, #0\n  JMPX edit_ev_lp\n\nedit_redraw:\n  ; Clear text area (4, 16, 210, 94)\n  LI R0, #4\n  LI R1, #16\n  LI R2, #170\n  LI R3, #48\n  LI R4, #-340\n  SYSCALL #20\n\n  ; Render up to 4 lines of 25 chars from UBASE + 1500\n  ; For simplicity and speed, copy each line into line scratch UBASE + 1420 and call SYS_WIN_DRAW_TEXT!\n  ADDI R5, R8, #1500 ; src ptr\n  LI R6, #18         ; cur_y = 18\nedit_rd_line:\n  CMPI R6, #58\n  JNNX edit_rd_flush\n  LT R0, R5, #0\n  CMPI R0, #0\n  JZX edit_rd_flush\n  ADDI R4, R8, #1420 ; line scratch\n  LI R3, #0          ; col = 0\nedit_rd_ch:\n  LT R0, R5, #0\n  CMPI R0, #0\n  JZX edit_rd_eol\n  CMPI R0, #10\n  JZX edit_rd_nl\n  ST R0, R4, #0\n  ADDI R4, R4, #1\n  ADDI R5, R5, #1\n  ADDI R3, R3, #1\n  CMPI R3, #20\n  JNX edit_rd_ch\n  JMPX edit_rd_eol\nedit_rd_nl:\n  ADDI R5, R5, #1\nedit_rd_eol:\n  LI R0, #0\n  ST R0, R4, #0\n  PUSH R5\n  PUSH R6\n  LI R0, #6\n  MOV R1, R6\n  ADDI R2, R8, #1420\n  LI R3, #COL_WHITE\n  LI R4, #-340\n  SYSCALL #21\n  POP R6\n  POP R5\n  ADDI R6, R6, #12\n  JMPX edit_rd_line\n\nedit_rd_flush:\n  LI R0, #4\n  LI R1, #16\n  LI R2, #170\n  LI R3, #48\n  SYSCALL #24\n  RET\n\nstr_edit_title: .stringz \"TEXT EDITOR\"\nstr_edit_bar:   .stringz \"[SAVE] [LOAD] [CLR] NOTE\"\nstr_edit_saved: .stringz \"SAVED TO DISK: NOTE     \"\napp1_edit_end:\n\n; ----------------------------------------------------------------------------\n; APP 2: PAINT (729-Color Palette Picker, Mouse Drawing & File Save/Load)\n; Window at (250, 175), size 210x150\n; Toolbar (y=2..12): \"[SAVE] [LOAD] [CLR]\"\n; Palette Picker Strip (y=14..25): 18 color swatches * 10px wide (x=10..189)\n; Canvas Area (x=10..169, y=28..107): 160x80 pixel canvas!\n; Image saved/loaded as file \"ART\" (160 * 20 = 3,200 trytes for fast multi-sector save/load, or 64x48 = 3,072 trytes!)\n; Let's make the Paint canvas 64x48 = 3,072 trytes (4.2 sectors!) at client (10, 28), so saving/loading \"ART\" writes/reads all 3,072 pixels!\n; ----------------------------------------------------------------------------\napp2_paint_rom:\n  LI R0, #250\n  LI R1, #130\n  LI R2, #180\n  LI R3, #96\n  LI R4, #str_paint_title - app2_paint_rom\n  ADD R4, R4, R8\n  LI R5, #-310\n  SYSCALL #10\n\n  ; Default filename \"ART\" at UBASE + 1400\n  ADDI R6, R8, #1400\n  LI R0, #'A'\n  ST R0, R6, #0\n  LI R0, #'R'\n  ST R0, R6, #1\n  LI R0, #'T'\n  ST R0, R6, #2\n  LI R0, #0\n  ST R0, R6, #3\n\n  ; Current brush color in R7 (default 364 = bright white)\n  LI R7, #364\n\n  ; Draw toolbar \"[SAVE] [LOAD] [CLR]\" at (4, 2)\n  LI R0, #4\n  LI R1, #2\n  LI R2, #str_paint_bar - app2_paint_rom\n  ADD R2, R2, R8\n  LI R3, #COL_WHITE\n  LI R4, #-230\n  SYSCALL #21\n\n  ; Draw 729-color palette picker strip at y=14..24 (24 steps of 8px across x=6..197 covering -364..+364)\n  LI R5, #0 ; swatch idx 0..23\npaint_pal_lp:\n  CMPI R5, #20\n  JNNX paint_pal_done\n  MULI R0, R5, #8\n  ADDI R0, R0, #6 ; x = 6 + idx*8\n  LI R1, #14      ; y = 14\n  LI R2, #8       ; w = 8\n  LI R3, #10      ; h = 10\n  MULI R4, R5, #31\n  SUBI R4, R4, #356 ; color spanning [-356 .. +357] across the 729-color ternary palette\n  SYSCALL #20\n  ADDI R5, R5, #1\n  JMPX paint_pal_lp\npaint_pal_done:\n\n  ; Clear 64x48 canvas at (10, 28) to black (-364)\n  LI R0, #10\n  LI R1, #28\n  LI R2, #64\n  LI R3, #48\n  LI R4, #-364\n  SYSCALL #20\n  LI R7, #364\n\n  ; Flush toolbar+palette+canvas (4, 2, 166, 74)\n  LI R0, #4\n  LI R1, #2\n  LI R2, #166\n  LI R3, #74\n  SYSCALL #24\n\npaint_ev_lp:\n  SYSCALL #25\n  CMPI R0, #0\n  JZX paint_idle\n  CMPI R0, #1\n  JZX paint_on_key\n  CMPI R0, #2\n  JZX paint_on_mouse\n  CMPI R0, #3\n  JZX paint_on_mouse\n  JMPX paint_ev_lp\n\npaint_idle:\n  SYSCALL #2\n  JMPX paint_ev_lp\n\npaint_on_key:\n  CMPI R1, #'S'\n  JZX paint_do_save\n  CMPI R1, #'s'\n  JZX paint_do_save\n  CMPI R1, #'L'\n  JZX paint_do_load\n  CMPI R1, #'l'\n  JZX paint_do_load\n  CMPI R1, #'C'\n  JZX paint_do_clear\n  CMPI R1, #'c'\n  JZX paint_do_clear\n  JMPX paint_ev_lp\n\npaint_on_mouse:\n  ; R1 = client_x, R2 = client_y\n  ; 1. Check toolbar click (y < 13)\n  CMPI R2, #13\n  JNNX paint_chk_pal\n  CMPI R1, #54\n  JNX paint_do_save\n  CMPI R1, #110\n  JNX paint_do_load\n  JMPX paint_do_clear\n\npaint_chk_pal:\n  ; 2. Check palette strip click (y in 14..24)\n  CMPI R2, #25\n  JNNX paint_chk_canvas\n  SUBI R0, R1, #6\n  CMPI R0, #0\n  JNX paint_ev_lp\n  LI R3, #8\n  DIV R0, R0, R3 ; swatch idx 0..23\n  CMPI R0, #24\n  JNNX paint_ev_lp\n  MULI R7, R0, #31\n  SUBI R7, R7, #356 ; selected color in R7!\n  JMPX paint_ev_lp\n\npaint_chk_canvas:\n  ; 3. Check canvas stroke (x in 10..73, y in 28..75)\n  CMPI R1, #10\n  JNX paint_ev_lp\n  CMPI R1, #74\n  JNNX paint_ev_lp\n  CMPI R2, #28\n  JNX paint_ev_lp\n  CMPI R2, #76\n  JNNX paint_ev_lp\n\n  ; Plot pixel at (R1, R2) with color R7 and flush 1x1 damage rect\n  MOV R0, R1\n  MOV R1, R2\n  MOV R2, R7\n  PUSH R0\n  PUSH R1\n  SYSCALL #22 ; SYS_WIN_PUT_PIXEL\n  POP R1\n  POP R0\n  LI R2, #1\n  LI R3, #1\n  SYSCALL #24 ; SYS_WIN_FLUSH (1x1 damage rect!)\n  JMPX paint_ev_lp\n\npaint_do_clear:\n  LI R0, #10\n  LI R1, #28\n  LI R2, #64\n  LI R3, #48\n  LI R4, #-364\n  SYSCALL #20\n  LI R0, #10\n  LI R1, #28\n  LI R2, #64\n  LI R3, #48\n  SYSCALL #24\n  JMPX paint_ev_lp\n\npaint_do_save:\n  ; Blit 64x48 canvas (3,072 trytes) from window (10, 28) to user buffer UBASE + 6000 (SYSCALL #27, dir=1)\n  LI R0, #10\n  LI R1, #28\n  LI R2, #64\n  LI R3, #48\n  ADDI R4, R8, #6000\n  LI R5, #1\n  SYSCALL #27\n  ; Write 3,072 trytes to file \"ART\" (type 2 = image)\n  ADDI R0, R8, #1400\n  ADDI R1, R8, #6000\n  LI R2, #3072\n  LI R3, #2\n  SYSCALL #32\n  ; Draw \"SAVED ART\" status at (10, 82)\n  LI R0, #10\n  LI R1, #74\n  LI R2, #str_paint_saved - app2_paint_rom\n  ADD R2, R2, R8\n  LI R3, #COL_GREEN\n  LI R4, #-310\n  SYSCALL #21\n  LI R0, #10\n  LI R1, #74\n  LI R2, #120\n  LI R3, #10\n  SYSCALL #24\n  JMPX paint_ev_lp\n\npaint_do_load:\n  ; Read 3,072 trytes from file \"ART\" into UBASE + 6000\n  ADDI R0, R8, #1400\n  ADDI R1, R8, #6000\n  LI R2, #3072\n  SYSCALL #31\n  CMPI R0, #0\n  JNPX paint_ev_lp\n  ; Blit 64x48 buffer from UBASE + 6000 into window at (10, 28) (SYSCALL #27, dir=0)\n  LI R0, #10\n  LI R1, #28\n  LI R2, #64\n  LI R3, #48\n  ADDI R4, R8, #6000\n  LI R5, #0\n  SYSCALL #27\n  LI R0, #10\n  LI R1, #28\n  LI R2, #64\n  LI R3, #48\n  SYSCALL #24\n  JMPX paint_ev_lp\n\nstr_paint_title: .stringz \"PAINT 729\"\nstr_paint_bar:   .stringz \"[SAVE] [LOAD] [CLR] ART\"\nstr_paint_saved: .stringz \"SAVED ART (3072 PX)\"\napp2_paint_end:\n\n\n; ----------------------------------------------------------------------------\n; APP 4: IN-GUEST ASSEMBLER APP (Self-Hosting Streaming Two-Pass Assembler)\n; Provenance: reused and adapted from triton3.html lines 8178–8889 & 7237–7265\n; Runs in user-mode window [590490, 984150) (UBASE = 30*19683, ULIMIT = 50*19683)\n; Window at (250, 330), size 220x115\n; Toolbar: \"[ASM FILE] [RUN] [SELF]\"\n; Can assemble a source file on disk (e.g. \"DEMO\") or the pre-loaded sector-1 stream,\n; emit machine code into OBUF (35 * 19683 = 688,905), and launch it as a new user task!\n; ----------------------------------------------------------------------------\n.equ SBUF, 5100\n.equ TBUF, 5200\n.equ SPOOL_P, 5310\n.equ LNUM, 5313\n.equ EFLG, 5316\n.equ SYMC, 5319\n.equ PASS, 5322\n.equ OLEN, 5325\n.equ CUR_LBA, 5328\n.equ SEC_IDX, 5331\n.equ RAM_CAP, 5334\n.equ CHAR_CNT, 5337\n.equ SEC_BUF, 5400\n.equ STAB, 6500\n\napp4_asm_rom:\n  ; Open Window at (250, 330), w=220, h=115\n  LI R0, #250\n  LI R1, #260\n  LI R2, #180\n  LI R3, #90\n  LI R4, #str_asm_title - app4_asm_rom\n  ADD R4, R4, R8\n  LI R5, #-315\n  SYSCALL #10\n\n  ; Default source filename \"DEMO\" at UBASE + 5000\n  ADDI R6, R8, #5000\n  LI R0, #'D'\n  ST R0, R6, #0\n  LI R0, #'E'\n  ST R0, R6, #1\n  LI R0, #'M'\n  ST R0, R6, #2\n  LI R0, #'O'\n  ST R0, R6, #3\n  LI R0, #0\n  ST R0, R6, #4\n\n  ; Draw toolbar \"[ASM] [RUN] [SELF] F:DEMO\" at (4, 4)\n  LI R0, #4\n  LI R1, #4\n  LI R2, #str_asm_bar - app4_asm_rom\n  ADD R2, R2, R8\n  LI R3, #COL_WHITE\n  LI R4, #-230\n  SYSCALL #21\n\n  LI R0, #4\n  LI R1, #22\n  LI R2, #str_asm_rdy - app4_asm_rom\n  ADD R2, R2, R8\n  LI R3, #COL_CYAN\n  LI R4, #-315\n  SYSCALL #21\n\n  LI R0, #0\n  LI R1, #0\n  LI R2, #0\n  LI R3, #0\n  SYSCALL #24\n\nasm_ev_lp:\n  SYSCALL #25\n  CMPI R0, #0\n  JZX asm_idle\n  CMPI R0, #1\n  JZX asm_on_key\n  CMPI R0, #2\n  JZX asm_on_click\n  JMPX asm_ev_lp\n\nasm_idle:\n  SYSCALL #2\n  JMPX asm_ev_lp\n\nasm_on_click:\n  ; Toolbar click (y < 16):\n  ; x < 48: [ASM] -> load \"DEMO\" into sector 1.. and assemble!\n  ; x in 48..96: [RUN] -> launch assembled binary at OBUF as new user task!\n  ; x >= 96: [SELF] -> assemble pre-staged source on LBA 1.. directly without overwriting LBA 1!\n  CMPI R2, #18\n  JNNX asm_ev_lp\n  CMPI R1, #48\n  JNX asm_do_file\n  CMPI R1, #96\n  JNX asm_do_run\n  JMPX asm_do_stream\n\nasm_on_key:\n  CMPI R1, #'A'\n  JZX asm_do_file\n  CMPI R1, #'a'\n  JZX asm_do_file\n  CMPI R1, #'R'\n  JZX asm_do_run\n  CMPI R1, #'r'\n  JZX asm_do_run\n  CMPI R1, #'S'\n  JZX asm_do_stream\n  CMPI R1, #'s'\n  JZX asm_do_stream\n  JMPX asm_ev_lp\n\nasm_do_file:\n  ; Copy file named at UBASE + 5000 (\"DEMO\") into Disk LBA 1.. via SYSCALL #37\n  LI R0, #5000\n  LMI R0, #30\n  SYSCALL #37\n  CMPI R0, #0\n  JNX asm_ev_lp\n  JMPX asm_do_stream\n\nasm_do_stream:\n  ; Run two-pass streaming assembler on Disk LBA 1..\n  LI R0, #0\n  LI R1, #RAM_CAP\n  LMI R1, #30\n  SW R0, R1, #0\n  CALLX a_ent\n\n  ; Draw \"ASM OK TRYTE LEN:\" + OLEN at (4, 40) and (4, 56)\n  LI R0, #4\n  LI R1, #38\n  LI R2, #168\n  LI R3, #32\n  LI R4, #-315\n  SYSCALL #20\n\n  LI R0, #4\n  LI R1, #40\n  LI R2, #str_asm_done - app4_asm_rom\n  LMI R2, #30\n  LI R3, #COL_GREEN\n  LI R4, #-315\n  SYSCALL #21\n\n  LI R1, #OLEN\n  LMI R1, #30\n  LW R2, R1, #0\n  LI R0, #4\n  LI R1, #56\n  LI R3, #10\n  LI R4, #COL_YELLOW\n  LI R5, #-315\n  SYSCALL #26\n\n  LI R0, #0\n  LI R1, #0\n  LI R2, #0\n  LI R3, #0\n  SYSCALL #24\n  JMPX asm_ev_lp\n\nasm_do_run:\n  ; Launch assembled binary in OBUF (35 * 19683 = 688,905) of length OLEN as a new use n  CMPI R7, #0\n  JZX term_ev_lp\n  SUBI R7, R7, #1\n  ADDI R6, R8, #2500\n  ADD R6, R6, R7\n  LI R0, #0\n  ST R0, R6, #0\n  ADDI R6, R8, #2499\n  LI R0, #1\n  ST R0, R6, #0\n  JMPX term_ev_lp\n\nterm_draw_cmdline:\n  LI R0, #4\n  LI R1, #18\n  LI R2, #170\n  LI R3, #10\n  LI R4, #-340\n  SYSCALL #20\n  LI R0, #4\n  LI R1, #18\n  LI R2, #str_term_pr - app0_term_rom\n  ADD R2, R2, R8\n  LI R3, #COL_CYAN\n  LI R4, #-340\n  SYSCALL #21\n  LI R0, #20\n  LI R1, #18\n  ADDI R2, R8, #2500\n  LI R3, #COL_WHITE\n  LI R4, #-340\n  SYSCALL #21\n  LI R0, #4\n  LI R1, #18\n  LI R2, #170\n  LI R3, #10\n  SYSCALL #24\n  RET\n\nterm_exec_cmd:\n  ; Clear output area (4, 32, 210, 105)\n  LI R0, #4\n  LI R1, #32\n  LI R2, #170\n  LI R3, #65\n  LI R4, #-340\n  SYSCALL #20\n\n  ADDI R1, R8, #2500\n  CALLX term_skip_sp\n  LT R0, R1, #0\n  CMPI R0, #0\n  JZX term_cmd_done\n  CMPI R0, #'L'\n  JZX term_cmd_l\n  CMPI R0, #'C'\n  JZX term_cmd_cat\n  CMPI R0, #'R'\n  JZX term_cmd_r\n  CMPI R0, #'P'\n  JZX term_cmd_ps\n  CMPI R0, #'K'\n  JZX term_cmd_kill\n  CMPI R0, #'F'\n  JZX term_cmd_fault\n  JMPX term_cmd_done\n\nterm_cmd_l:\n  LT R0, R1, #1\n  CMPI R0, #'O'\n  JZX term_cmd_loop\n  ; LS: list files into UBASE + 2600 via SYSCALL #30\n  ADDI R0, R8, #2600\n  SYSCALL #30\n  MOV R5, R0 ; file count\n  ; Draw file names at y = 34 + i*12\n  ADDI R4, R8, #2600\n  LI R6, #34 ; y\nterm_ls_lp:\n  CMPI R5, #0\n  JNPX term_cmd_done\n  ; Null-terminate 8-char name at R4+8 (temporarily overwrite type tryte with 0)\n  LI R0, #0\n  ST R0, R4, #8\n  PUSH R4\n  PUSH R5\n  PUSH R6\n  LI R0, #6\n  MOV R1, R6\n  MOV R2, R4\n  LI R3, #COL_YELLOW\n  LI R4, #-340\n  SYSCALL #21\n  POP R6\n  POP R5\n  POP R4\n  ADDI R4, R4, #16\n  ADDI R6, R6, #12\n  SUBI R5, R5, #1\n  JMPX term_ls_lp\n\nterm_cmd_loop:\n  ; Spawn an infinite-loop task using code at term_loop_task_code\n  LI R0, #term_loop_task_code - app0_term_rom\n  ADD R0, R0, R8\n  LI R1, #16 ; 16 trytes\n  LI R2, #7  ; app_id 7 = loop task\n  SYSCALL #7\n  JMPX term_cmd_done\n\nterm_loop_task_code:\n  ADDI R0, R0, #1\n  JMPX term_loop_task_code\n\nterm_cmd_cat:\n  CALLX term_skip_word\n  CALLX term_skip_sp\n  ; R1 points to filename; read up to 120 trytes into UBASE + 2600\n  MOV R0, R1\n  ADDI R1, R8, #2600\n  LI R2, #120\n  SYSCALL #31\n  CMPI R0, #0\n  JNX term_cmd_done\n  ; Draw content at (6, 36)\n  LI R0, #6\n  LI R1, #36\n  ADDI R2, R8, #2600\n  LI R3, #COL_WHITE\n  LI R4, #-340\n  SYSCALL #21\n  JMPX term_cmd_done\n\nterm_cmd_r:\n  LT R0, R1, #1\n  CMPI R0, #'M'\n  JZX term_cmd_rm\n  ; RUN <0..5>\n  CALLX term_skip_word\n  CALLX term_skip_sp\n  LT R0, R1, #0\n  SUBI R0, R0, #48\n  SYSCALL #4\n  JMPX term_cmd_done\n\nterm_cmd_rm:\n  CALLX term_skip_word\n  CALLX term_skip_sp\n  MOV R0, R1\n  SYSCALL #33\n  JMPX term_cmd_done\n\nterm_cmd_ps:\n  ; List tasks into UBASE + 2600 via SYSCALL #6\n  ADDI R0, R8, #2600\n  SYSCALL #6\n  ; Draw active task count at (6, 36)\n  MOV R2, R0\n  LI R0, #6\n  LI R1, #36\n  LI R3, #10\n  LI R4, #COL_GREEN\n  LI R5, #-340\n  SYSCALL #26\n  JMPX term_cmd_done\n\nterm_cmd_kill:\n  CALLX term_skip_word\n  CALLX term_skip_sp\n  LT R0, R1, #0\n  SUBI R0, R0, #48\n  SYSCALL #5\n  JMPX term_cmd_done\n\nterm_cmd_fault:\n  CALLX term_skip_word\n  CALLX term_skip_sp\n  LT R0, R1, #0\n  CMPI R0, #'1'\n  JZX fault_prot\n  CMPI R0, #'2'\n  JZX fault_priv\n  CMPI R0, #'3'\n  JZX fault_div0\n  ; Fault 4: Jump to bad address outside physical RAM (-500)\n  LI R0, #-500\n  JR R0\nfault_prot:\n  ; Write to kernel memory address 100 (outside [UBASE, ULIMIT))\n  LI R1, #100\n  LI R0, #999\n  ST R0, R1, #0\n  JMPX term_cmd_done\nfault_priv:\n  ; Execute supervisor instruction MTSPR in user mode\n  LI R0, #0\n  MTSPR R0, #5\n  JMPX term_cmd_done\nfault_div0:\n  ; Divide by zero\n  LI R0, #100\n  LI R1, #0\n  DIV R0, R0, R1\n  JMPX term_cmd_done\n\nterm_cmd_done:\n  LI R7, #0\n  ADDI R6, R8, #2500\n  LI R0, #0\n  ST R0, R6, #0\n  CALLX term_draw_cmdline\n  LI R0, #0\n  LI R1, #0\n  LI R2, #0\n  LI R3, #0\n  SYSCALL #24\n  JMPX term_ev_lp\n\nterm_skip_sp:\n  LT R0, R1, #0\n  CMPI R0, #32\n  JNZX tss_ret\n  ADDI R1, R1, #1\n  JMPX term_skip_sp\ntss_ret:\n  RET\n\nterm_skip_word:\n  LT R0, R1, #0\n  CMPI R0, #0\n  JZX tsw_ret\n  CMPI R0, #32\n  JZX tsw_ret\n  ADDI R1, R1, #1\n  JMPX term_skip_word\ntsw_ret:\n  RET\n\nstr_term_title: .stringz \"TERMINAL\"\nstr_term_ban:   .stringz \"TRITOS DESKTOP SH\"\nstr_term_pr:    .stringz \"> \"\napp0_term_end:\n";

function bootTritOSDesktop(vm, keepDisk = false) {
  const built = TritonSystem.assemble(TRITOS_DESKTOP_SRC, { mode: 'T3' });
  vm.defaultArchMode = 1;
  vm.reset(keepDisk);
  if (!keepDisk) {
    for (let i = 0; i < built.trytes.length; i++) {
      if (vm.setDisk) vm.setDisk(i, built.trytes[i]);
      else vm.disk[i] = built.trytes[i];
    }
  }
  vm.loadProgram(built.trytes.slice(0, 16), 0);
  return built;
}

TritonSystem.TRITOS_DESKTOP_SRC = TRITOS_DESKTOP_SRC;
TritonSystem.bootTritOSDesktop = bootTritOSDesktop;

// [INLINE 4/4] Host Framebuffer Canvas Plumbing & Read-Only Debug Panel (Provenance: adapted from triton3.html lines 9396–9775)
if (typeof document !== 'undefined') {
  window.addEventListener('DOMContentLoaded', () => {
    const wasmVm = TritonWASM.createSync({ archMode: 'T3' });
    const jsVm = new TritonJS({ archMode: 'T3' });
    bootTritOSDesktop(wasmVm, false);
    bootTritOSDesktop(jsVm, false);
    wasmVm.run(300000);
    jsVm.run(300000);

    const canvas = document.getElementById('triton-screen');
    const ctx = canvas.getContext('2d');
    const imgData = ctx.createImageData(T3_FB_WIDTH, T3_FB_HEIGHT);
    const dbgEl = document.getElementById('dbg-readout');
    const modeSel = document.getElementById('core-mode');
    let lastMouseX = 364, lastMouseY = 230;

    function renderFramebuffer() {
      const vram = wasmVm.vram;
      const data = imgData.data;
      for (let i = 0; i < T3_FB_SIZE; i++) {
        const rgb = PALETTE_729[vram[i]] || [0, 0, 0];
        const p = i * 4;
        data[p] = rgb[0];
        data[p + 1] = rgb[1];
        data[p + 2] = rgb[2];
        data[p + 3] = 255;
      }
      ctx.putImageData(imgData, 0, 0);
    }

    function updateDebugReadout() {
      const lockstep = modeSel.value === 'lockstep';
      const wHash = computeStateHash(wasmVm);
      const jHash = lockstep ? computeStateHash(jsVm) : wHash;
      const curTask = wasmVm.mem[5850];
      const numTasks = wasmVm.mem[5851];
      const timerIrqs = wasmVm.mem[5866] + wasmVm.mem[5867] * 19683;
      const kbdIrqs = wasmVm.mem[5869];
      const mouseIrqs = wasmVm.mem[5872];
      const diskIrqs = wasmVm.mem[5875];
      const trapCnt = wasmVm.mem[5854];
      const regs = [];
      for (let r = 0; r < 9; r++) regs.push('R' + r + '=' + wasmVm.getWordNum(r));
      dbgEl.textContent = [
        'CORE: ' + (lockstep ? (wHash === jHash ? 'LOCKSTEP OK' : 'DIVERGENCE!') : 'WASM ONLY'),
        'STATE HASH: 0x' + wHash.toString(16).padStart(8, '0'),
        'STEPS: ' + wasmVm.steps + '  PRIV: ' + (wasmVm.priv ? 'USER' : 'SUP'),
        'PC: ' + wasmVm.pc + '  SP: ' + wasmVm.sp,
        'UBASE..ULIMIT: ' + wasmVm.ubase + '..' + wasmVm.ulimit,
        'CURRENT TASK: ' + curTask + ' (ACTIVE: ' + numTasks + ')',
        'IRQS: TMR=' + timerIrqs + ' KBD=' + kbdIrqs + ' MSE=' + mouseIrqs + ' DSK=' + diskIrqs,
        'TRAPS: ' + trapCnt + ' (LAST CAUSE=' + wasmVm.mem[5857] + ')',
        regs.join('  ')
      ].join('\n');
    }

    function tickFrame() {
      const lockstep = modeSel.value === 'lockstep';
      const budget = lockstep ? 15000 : 80000;
      wasmVm.run(budget);
      if (lockstep) jsVm.run(budget);
      renderFramebuffer();
      updateDebugReadout();
      requestAnimationFrame(tickFrame);
    }

    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      let dx = 0, dy = 0;
      if (document.pointerLockElement === canvas) {
        dx = e.movementX | 0;
        dy = e.movementY | 0;
      } else {
        const x = Math.round((e.clientX - rect.left) * (T3_FB_WIDTH / rect.width));
        const y = Math.round((e.clientY - rect.top) * (T3_FB_HEIGHT / rect.height));
        dx = x - lastMouseX;
        dy = y - lastMouseY;
        lastMouseX = x;
        lastMouseY = y;
      }
      if (dx !== 0 || dy !== 0) {
        wasmVm.pushMouseEvent(dx, dy, e.buttons & 7);
        if (modeSel.value === 'lockstep') jsVm.pushMouseEvent(dx, dy, e.buttons & 7);
      }
    });
    canvas.addEventListener('mousedown', (e) => {
      canvas.focus();
      wasmVm.pushMouseEvent(0, 0, e.buttons & 7);
      if (modeSel.value === 'lockstep') jsVm.pushMouseEvent(0, 0, e.buttons & 7);
    });
    canvas.addEventListener('mouseup', (e) => {
      wasmVm.pushMouseEvent(0, 0, e.buttons & 7);
      if (modeSel.value === 'lockstep') jsVm.pushMouseEvent(0, 0, e.buttons & 7);
    });
    canvas.addEventListener('keydown', (e) => {
      e.preventDefault();
      const kc = e.key.length === 1 ? e.key.charCodeAt(0) : (e.keyCode || 0);
      wasmVm.pushKeyEvent(kc, 0);
      if (modeSel.value === 'lockstep') jsVm.pushKeyEvent(kc, 0);
    });
    canvas.addEventListener('keyup', (e) => {
      e.preventDefault();
      const kc = e.key.length === 1 ? e.key.charCodeAt(0) : (e.keyCode || 0);
      wasmVm.pushKeyEvent(kc, 1);
      if (modeSel.value === 'lockstep') jsVm.pushKeyEvent(kc, 1);
    });

    document.getElementById('btn-reboot').addEventListener('click', () => {
      bootTritOSDesktop(wasmVm, true);
      bootTritOSDesktop(jsVm, true);
      wasmVm.run(300000);
      if (modeSel.value === 'lockstep') jsVm.run(300000);
    });
    document.getElementById('btn-ptr-lock').addEventListener('click', () => {
      if (canvas.requestPointerLock) canvas.requestPointerLock();
    });
    document.getElementById('btn-export-disk').addEventListener('click', () => {
      const bytes = exportDiskImage(wasmVm);
      const blob = new Blob([bytes], { type: 'application/octet-stream' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'tritos-desktop.t3d';
      a.click();
    });
    const diskIn = document.getElementById('disk-file-in');
    document.getElementById('btn-import-disk').addEventListener('click', () => diskIn.click());
    diskIn.addEventListener('change', (ev) => {
      const f = ev.target.files && ev.target.files[0];
      if (!f) return;
      const r = new FileReader();
      r.onload = () => {
        const u8 = new Uint8Array(r.result);
        importDiskImage(wasmVm, u8);
        importDiskImage(jsVm, u8);
      };
      r.readAsArrayBuffer(f);
    });

    renderFramebuffer();
    updateDebugReadout();
    requestAnimationFrame(tickFrame);
  });
}
