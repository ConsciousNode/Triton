// Provenance: carried from triton.html lines 2453–2608
function intToTernaryStr(val, width = 9) {
  const trits = new Array(width).fill(0);
  let v = BigInt(val);
  for (let i = 0; i < width; i++) {
    let r = Number(v % 3n);
    v = (v - BigInt(r)) / 3n;
    if (r === 2) { r = -1; v += 1n; }
    else if (r === -2) { r = 1; v -= 1n; }
    trits[i] = r;
  }
  return trits.reverse().map(t => (t === 1 ? '1' : t === -1 ? 'T' : '0')).join('');
}

function ternaryStrToBigInt(str) {
  let acc = 0n;
  for (let i = 0; i < str.length; i++) {
    const c = str[i];
    let t = 0n;
    if (c === '1' || c === 'P' || c === '+') t = 1n;
    else if (c === 'T' || c === 'N' || c === '-') t = -1n;
    else if (c === '0' || c === 'Z') t = 0n;
    else throw new Error(`Invalid balanced-ternary digit '${c}' in '${str}'`);
    acc = acc * 3n + t;
  }
  return acc;
}

function parseRegister(tok) {
  const m = /^r([0-8])$/i.exec(tok.trim());
  if (!m) throw new Error(`Expected register R0..R8, got '${tok}'`);
  return parseInt(m[1], 10);
}

function encodeInstruction(op, rd, rs1, t1) {
  const ed = balRem(rd, 9, 4);

  const tryte0 = op * 81 + ed * 9 + e1;
  const tryte1 = balRem(t1, TRYTE_MOD, TRYTE_HALF);
  return [tryte0 === 0 ? 0 : tryte0, tryte1 === 0 ? 0 : tryte1];

function decodeInstruction(tryte0, tryte1) {
  const e1 = balRem(tryte0, 9, 4);
  const q1 = balQuot(tryte0, 9, 4);
  const ed = balRem(q1, 9, 4);
  const op = balQuot(q1, 9, 4);
  const rs1 = (e1 + 9) % 9;
  const rd = (ed + 9) % 9;
  const e2 = balRem(tryte1, 9, 4);
  const rs2 = (e2 + 9) % 9;
  const imm9 = balRem(tryte1, TRYTE_MOD, TRYTE_HALF);
  return { op, rd, rs1, rs2, imm9 };

function stripComment(line) {
  let inSingle = false;
  let inDouble = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (c === '\\') { i++; continue; }
    if (c === "'" && !inDouble) inSingle = !inSingle;
    else if (c === '"' && !inSingle) inDouble = !inDouble;
    else if (c === ';' && !inSingle && !inDouble) return line.slice(0, i);

function splitOperands(str) {
  const parts = [];
  let cur = '';
  let inSingle = false;
  let inDouble = false;
  for (let i = 0; i < str.length; i++) {
    const c = str[i];
    if (c === '\\' && i + 1 < str.length) {
      cur += c + str[++i];
      continue;
    }
    if (c === "'" && !inDouble) inSingle = !inSingle;
    else if (c === '"' && !inSingle) inDouble = !inDouble;
    else if (c === ',' && !inSingle && !inDouble) {
      parts.push(cur.trim());
      cur = '';
      continue;
    }
    cur += c;
  }
  if (cur.trim().length > 0) parts.push(cur.trim());
  return parts;

function parseStringLiteral(raw) {
  const s = raw.trim();
  if (s.length < 2 || s[0] !== '"' || s[s.length - 1] !== '"') {
    throw new Error(`Invalid string literal: ${raw}`);
  }
  const codes = [];
  for (let i = 1; i < s.length - 1; i++) {
    if (s[i] === '\\' && i + 1 < s.length - 1) {
      const n = s[++i];
      if (n === 'n') codes.push(10);
      else if (n === 'r') codes.push(13);
      else if (n === 't') codes.push(9);
      else if (n === '0') codes.push(0);
      else if (n === '\\') codes.push(92);
      else if (n === '"') codes.push(34);
      else codes.push(n.charCodeAt(0));
    } else {
      codes.push(s.charCodeAt(i));

function evalImmediate(expr, symbols, allowBig = false, lineNo = 0) {
  let s = expr.trim();

  const plusIdx = s.indexOf('+', 1);
  const minusIdx = s.indexOf('-', 1);
  if (plusIdx > 0 && !s.startsWith("'")) {
    const a = evalImmediate(s.slice(0, plusIdx), symbols, true, lineNo);
    const b = evalImmediate(s.slice(plusIdx + 1), symbols, true, lineNo);
    return allowBig ? a + b : balRem(Number((a + b) % BigInt(TRYTE_MOD)), TRYTE_MOD, TRYTE_HALF);
  }
  if (minusIdx > 0 && !s.startsWith("'") && !/^0t/i.test(s)) {
    const a = evalImmediate(s.slice(0, minusIdx), symbols, true, lineNo);
    const b = evalImmediate(s.slice(minusIdx + 1), symbols, true, lineNo);
    return allowBig ? a - b : balRem(Number((a - b) % BigInt(TRYTE_MOD)), TRYTE_MOD, TRYTE_HALF);
  }

    let ch = s.slice(1, -1);
    let code = ch.charCodeAt(0);
    if (ch === '\\n') code = 10;
    else if (ch === '\\r') code = 13;
    else if (ch === '\\t') code = 9;
    else if (ch === '\\0') code = 0;
    else if (ch === "\\'") code = 39;
    else if (ch === '\\\\') code = 92;
    return allowBig ? BigInt(code) : balRem(code, TRYTE_MOD, TRYTE_HALF);

    let body = s;
    if (body[0] === '+') body = body.slice(1);
    else if (body[0] === '-') { sign = -1n; body = body.slice(1); }
    const v = sign * ternaryStrToBigInt(body.slice(2).toUpperCase());
    return allowBig ? v : balRem(Number(v % BigInt(TRYTE_MOD)), TRYTE_MOD, TRYTE_HALF);
  }
  if (/^[+-]?\d+$/.test(s)) {
    const v = BigInt(s);
    return allowBig ? v : balRem(Number(v % BigInt(TRYTE_MOD)), TRYTE_MOD, TRYTE_HALF);
  }
  const symKey = s.toUpperCase();
  if (Object.prototype.hasOwnProperty.call(symbols, symKey)) {
    const v = BigInt(symbols[symKey]);
    return allowBig ? v : balRem(Number(v % BigInt(TRYTE_MOD)), TRYTE_MOD, TRYTE_HALF);
  }
  throw new Error(`Line ${lineNo + 1}: Undefined label ${symKey}`);
}

function assemble(source, options = {}) {
  const lines = source.replace(/\r\n/g, '\n').split('\n');
  let isT3 = options.mode === 'T3' || options.mode === 1;
  const symbols = {};
  const statements = [];
  let lc = 0;

  for (let lineNo = 0; lineNo < lines.length; lineNo++) {
    let clean = stripComment(lines[lineNo]).trim();
    if (!clean) continue;
    while (true) {
      const m = /^([A-Za-z_.$][A-Za-z0-9_.$]*)\s*:(.*)$/.exec(clean);
      if (!m) break;
      const label = m[1].toUpperCase();
      if (Object.prototype.hasOwnProperty.call(symbols, label)) {
        throw new Error(`Line ${lineNo + 1}: Duplicate label ${label}`);
      }
      symbols[label] = isT3 ? lc : balRem(lc, TRYTE_MOD, TRYTE_HALF);
      clean = m[2].trim();
    }
    if (!clean) continue;
    const firstSpace = clean.search(/\s/);
    const head = (firstSpace < 0 ? clean : clean.slice(0, firstSpace)).toUpperCase();
    const rest = firstSpace < 0 ? '' : clean.slice(firstSpace + 1).trim();

    if (head === '.MODE') {
      const mStr = rest.toUpperCase();
      isT3 = (mStr === 'T3' || mStr === '3');
      continue;
    }
    if (head === '.EQU') {
      const ops = splitOperands(rest);
      if (ops.length !== 2) throw new Error(`Line ${lineNo + 1}: .equ requires name, value`);
      const eqName = ops[0].trim().toUpperCase();
      if (Object.prototype.hasOwnProperty.call(symbols, eqName)) {
        throw new Error(`Line ${lineNo + 1}: Duplicate label ${eqName}`);
      }
      const valBig = evalImmediate(ops[1], symbols, true, lineNo);
      symbols[eqName] = isT3 ? Number(valBig) : balRem(Number(valBig % BigInt(TRYTE_MOD)), TRYTE_MOD, TRYTE_HALF);
      continue;
    }
    if (head === '.ORG') {
      const vBig = evalImmediate(rest, symbols, true, lineNo);
      lc = isT3 ? Number(vBig) : physAddr(Number(vBig));
      statements.push({ kind: 'ORG', lc, lineNo });
      continue;
    }
    if (head === '.TRYTE' || head === '.DATA') {
      const ops = splitOperands(rest);
      statements.push({ kind: 'TRYTE', lc, ops, lineNo });
      lc += ops.length;
      continue;
    }
    if (head === '.WORD') {
      const ops = splitOperands(rest);
      statements.push({ kind: 'WORD', lc, ops, lineNo });
      lc += ops.length * 3;
      continue;
    }
    if (head === '.STRING') {
      const codes = parseStringLiteral(rest);
      statements.push({ kind: 'STRING', lc, codes, lineNo });
      lc += codes.length;
      continue;
    }
    if (head === '.STRINGZ') {
      const codes = [...parseStringLiteral(rest), 0];
      statements.push({ kind: 'STRING', lc, codes, lineNo });
      lc += codes.length;
      continue;
    }
    const spec = MNEM_MAP[head];
    if (!spec) throw new Error(`Line ${lineNo + 1}: Unknown mnemonic or directive '${head}'`);
    if (spec.t3only) isT3 = true;
    const ops = rest ? splitOperands(rest) : [];
    statements.push({ kind: 'INS', lc, spec, ops, lineNo });
    lc += 2;

  // Pass 2: determine required output buffer size
  let maxCapacity = TRYTE_MOD;
  if (isT3) {
    let maxLc = lc;
    for (const st of statements) {
      if (st.lc + 64 > maxLc) maxLc = st.lc + 64;
    }
    maxCapacity = Math.max(TRYTE_MOD, maxLc + 16);
  }
  const mem = new Int16Array(maxCapacity);
  let maxAddr = 0;
  let minAddr = maxCapacity;
  const writeTryte = (addr, val) => {
    const p = isT3 ? addr : physAddr(addr);
    if (p >= 0 && p < mem.length) {
      mem[p] = balRem(val, TRYTE_MOD, TRYTE_HALF);
      if (p < minAddr) minAddr = p;
      if (p + 1 > maxAddr) maxAddr = p + 1;
    }
  };

  for (const st of statements) {
    if (st.kind === 'ORG') continue;
    if (st.kind === 'TRYTE') {
      let a = st.lc;
      for (const op of st.ops) {
        writeTryte(a++, evalImmediate(op, symbols, false, st.lineNo));
      }
      continue;
    }
    if (st.kind === 'WORD') {
      let a = st.lc;
      for (const op of st.ops) {
        const bigV = evalImmediate(op, symbols, true, st.lineNo);
        const [w0, w1, w2] = bigIntToWord(bigV);
        writeTryte(a++, w0);
        writeTryte(a++, w1);
        writeTryte(a++, w2);
      }
      continue;
    }
    if (st.kind === 'STRING') {
      let a = st.lc;
      for (const c of st.codes) {
        writeTryte(a++, c);
      }
      continue;
    }
    if (st.kind === 'INS') {
      const { spec, ops, lineNo } = st;
      let rd = 0, rs1 = 0, t1 = 0;
      switch (spec.fmt) {
        case 'NONE':
          if (ops.length !== 0) throw new Error(`Line ${lineNo + 1}: ${spec.mnem} takes 0 operands`);
          break;
        case 'R3':
          if (ops.length !== 3) throw new Error(`Line ${lineNo + 1}: ${spec.mnem} takes 3 registers`);
          rd = parseRegister(ops[0]);
          rs1 = parseRegister(ops[1]);
          t1 = balRem(parseRegister(ops[2]), 9, 4);
          break;
        case 'R2':
          if (ops.length !== 2) throw new Error(`Line ${lineNo + 1}: ${spec.mnem} takes 2 registers`);
          rd = parseRegister(ops[0]);
          rs1 = parseRegister(ops[1]);
          break;
        case 'CMP':
          if (ops.length !== 2) throw new Error(`Line ${lineNo + 1}: ${spec.mnem} takes 2 registers`);
          rs1 = parseRegister(ops[0]);
          t1 = balRem(parseRegister(ops[1]), 9, 4);
          break;
        case 'CMPI':
          if (ops.length !== 2) throw new Error(`Line ${lineNo + 1}: ${spec.mnem} takes rs1, imm9`);
          rs1 = parseRegister(ops[0]);
          t1 = evalImmediate(ops[1], symbols, false, lineNo);
          break;
        case 'RI':
          if (ops.length !== 2) throw new Error(`Line ${lineNo + 1}: ${spec.mnem} takes rd, imm9`);
          rd = parseRegister(ops[0]);
          t1 = evalImmediate(ops[1], symbols, false, lineNo);
          break;
        case 'RRI':
          if (ops.length !== 3) throw new Error(`Line ${lineNo + 1}: ${spec.mnem} takes rd, rs1, imm9`);
          rd = parseRegister(ops[0]);
          rs1 = parseRegister(ops[1]);
          t1 = evalImmediate(ops[2], symbols, false, lineNo);
          break;
        case 'R1_S':
          if (ops.length !== 1) throw new Error(`Line ${lineNo + 1}: ${spec.mnem} takes rs1`);
          rs1 = parseRegister(ops[0]);
          break;
        case 'R1_D':
          if (ops.length !== 1) throw new Error(`Line ${lineNo + 1}: ${spec.mnem} takes rd`);
          rd = parseRegister(ops[0]);
          break;
        case 'J':
          if (ops.length !== 1) throw new Error(`Line ${lineNo + 1}: ${spec.mnem} takes target`);
          t1 = evalImmediate(ops[0], symbols, false, lineNo);
          break;
        case 'JREL': {
          if (ops.length !== 1) throw new Error(`Line ${lineNo + 1}: ${spec.mnem} takes target or #rel9`);
          const rawOp = ops[0].trim();
          if (rawOp.startsWith('#')) {
            t1 = evalImmediate(rawOp, symbols, false, lineNo);
          } else {
            const targetVal = Number(evalImmediate(rawOp, symbols, true, lineNo));
            const rel = targetVal - (st.lc + 2);
            t1 = balRem(rel, TRYTE_MOD, TRYTE_HALF);
          }
          break;
        }

let CURRENT_SYMBOL_MODE = 'names';
let TRITOS_SRC = TRITOS_SRC_NAMES;
function setSymbolMode(mode) {
if (mode !== 'names' && mode !== 'hashOnly') {
throw new Error('Invalid symbolMode: ' + mode);
}
CURRENT_SYMBOL_MODE = mode;
TRITOS_SRC = mode === 'names' ? TRITOS_SRC_NAMES : TRITOS_SRC_HASHONLY;
if (typeof globalThis !== 'undefined' && globalThis.TritonSystem) {
globalThis.TritonSystem.symbolMode = mode;
globalThis.TritonSystem.TRITOS_SRC = TRITOS_SRC;
}
return TRITOS_SRC;
}
function getSymbolMode() {
return CURRENT_SYMBOL_MODE;
}

// ============================================================================
// TRITOS 3.0 IN-OS MNEMONIC TABLE & 8x8 FONT GENERATOR
// ============================================================================
const FMT_CODE_T3 = {
  NONE: 0, R3: 1, R2: 2, CMP: 3, CMPI: 4,
  RI: 5, RRI: 6, R1_S: 7, R1_D: 8, J: 9, JREL: 16
};

function generateMnemTableAsmT3() {
  const lines = ['mnem_table:'];
  const directives = [
    { name: '.EQU', op: 100, fmt: 10 },
    { name: '.ORG', op: 100, fmt: 11 },
    { name: '.TRYTE', op: 100, fmt: 12 },
    { name: '.DATA', op: 100, fmt: 12 },
    { name: '.WORD', op: 100, fmt: 13 },
    { name: '.STRING', op: 100, fmt: 14 },
    { name: '.STRINGZ', op: 100, fmt: 15 },
    { name: '.MODE', op: 100, fmt: 17 }
  ];
  for (const d of directives) {
    lines.push(`.word #${tokenHash27(d.name).toString()}`);
    lines.push(`.tryte #${d.op},#${d.fmt}`);
  }
  for (const spec of INSTR_SPECS) {
    lines.push(`.word #${tokenHash27(spec.mnem).toString()}`);
    lines.push(`.tryte #${spec.op},#${FMT_CODE_T3[spec.fmt]}`);
  }
  lines.push('.word #0');
  lines.push('.tryte #0,#0');
  return lines.join('\n');
}

function generateFontTableAsmT3() {
  const lines = ['font_8x8:'];
  for (let g = 0; g < T3_FONT_GLYPHS_64.length; g++) {
    const rows = T3_FONT_GLYPHS_64[g].map(v => `#${v}`).join(',');
    lines.push(`.tryte ${rows}`);
  }
  return lines.join('\n');
}

// Machine option: singleRamSourceBuffer (when true, caps in-OS assembler source buffer to 19,182 chars)
let SINGLE_RAM_BUFFER_MODE = false;
let ACTIVE_TRITOS3_SRC = TRITOS3_SRC;

function setSingleRamBufferMode(enabled) {
  SINGLE_RAM_BUFFER_MODE = Boolean(enabled);
  ACTIVE_TRITOS3_SRC = SINGLE_RAM_BUFFER_MODE ? TRITOS3_SRC_CAPPED : TRITOS3_SRC;

  }

// StudioNet 12-byte Header + Payload Frame Builder & Checksum (per context/STUDIONET.md)
function computeStudioNetChecksum(bytes, payloadLen) {
  let acc = 0;
  for (let i = 0; i < 10; i++) acc = (acc + bytes[i]) ^ (bytes[i] << (i & 7));
  for (let i = 0; i < payloadLen; i++) acc = (acc + bytes[12 + i]) ^ (bytes[12 + i] << (i & 7));
  return acc & 0xFFFF;
}

function buildStudioNetFrame(dstNode, srcNode, proto, seq, payloadBytes, ttl = 16) {
  const payload = Uint8Array.from(payloadBytes || []);
  const len = Math.min(500, payload.length);
  const frame = new Uint8Array(12 + len);
  frame[0] = dstNode & 0xFF;
  frame[1] = (dstNode >>> 8) & 0xFF;
  frame[2] = srcNode & 0xFF;
  frame[3] = (srcNode >>> 8) & 0xFF;
  frame[4] = proto & 0xFF;
  frame[5] = ttl & 0xFF;
  frame[6] = seq & 0xFF;
  frame[7] = (seq >>> 8) & 0xFF;
  frame[8] = len & 0xFF;
  frame[9] = (len >>> 8) & 0xFF;
  frame.set(payload.subarray(0, len), 12);
  const csum = computeStudioNetChecksum(frame, len);
  frame[10] = csum & 0xFF;
  frame[11] = (csum >>> 8) & 0xFF;
  return frame;
}

function parseStudioNetFrame(frameBytes) {
  const f = Uint8Array.from(frameBytes);
  if (f.length < 12) return null;
  const dstNode = f[0] | (f[1] << 8);
  const srcNode = f[2] | (f[3] << 8);
  const proto = f[4];
  const ttl = f[5];
  const seq = f[6] | (f[7] << 8);
  const len = f[8] | (f[9] << 8);
  const checksum = f[10] | (f[11] << 8);
  const payload = f.slice(12, 12 + len);
  return { dstNode, srcNode, proto, ttl, seq, len, checksum, payload };
}

// Disk Image Export & Import (Byte-for-Byte Round-Trip)
function exportDiskImage(vm) {
  const diskArr = vm instanceof TritonWASM ? vm.disk : vm.disk;
  const buf = new Uint8Array(diskArr.length * 2);
  const dv = new DataView(buf.buffer);
  for (let i = 0; i < diskArr.length; i++) {
    dv.setInt16(i * 2, diskArr[i], true);
  }
  return buf;
}

function importDiskImage(vm, byteArray) {
  const u8 = byteArray instanceof Uint8Array ? byteArray : new Uint8Array(byteArray);
  const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
  const count = Math.min(vm.disk.length, Math.floor(u8.byteLength / 2));
  for (let i = 0; i < count; i++) {
    const val = dv.getInt16(i * 2, true);
    if (vm instanceof TritonWASM) vm.setDisk(i, val);
    else vm.disk[i] = val;
  }
}

// Compute architectural state hash (works identically across TritonJS and TritonWASM in both T2 and T3)
// Provenance: extended from triton.html lines 5160–5196
function computeStateHash(vm) {
  let h = 2166136261 >>> 0;
  const mix = (v) => {
    h ^= (v & 0xFFFF);
    h = Math.imul(h, 16777619) >>> 0;
    h ^= ((v >> 16) & 0xFFFF);
    h = Math.imul(h, 16777619) >>> 0;
  };
  if (vm.archMode === 1) mix(vm.archMode);
  mix(vm.pc);
  mix(vm.sp);
  mix(vm.sf);
  mix(vm.cf);
  mix(vm.of);
  mix(vm.halted);
  mix(vm.steps);
  mix(vm.displayX);
  mix(vm.displayY);
  mix(vm.diskAddr);
  mix(vm.timerTicks);
  if (vm.archMode === 1) {
    mix(vm.priv);
    mix(vm.ie);
    mix(vm.imask);
    mix(vm.ipend);
    mix(vm.vbr);
    mix(vm.ubase);
    mix(vm.ulimit);
    mix(vm.protEn);
    mix(vm.epc);
    mix(vm.esp);
    mix(vm.esr);
    mix(vm.ecause);
    mix(vm.eaddr);
    mix(vm.ksp);
    mix(vm.diskStatus);
    mix(vm.diskErr);
  }
  for (let r = 0; r < 9; r++) {
    const [w0, w1, w2] = vm.getWord(r);
    mix(w0); mix(w1); mix(w2);
  }
  if (vm.archMode === 0) {
    for (let i = 0; i < TRYTE_MOD; i++) {
      const m = vm instanceof TritonWASM ? vm.getMem(i) : vm.mem[i];
      if (m !== 0) { mix(i); mix(m); }
    }
    for (let i = 0; i < TRYTE_MOD; i++) {
      const d = vm instanceof TritonWASM ? vm.i32[25600 + i] : vm.disk[i];
      if (d !== 0) { mix(i); mix(d); }
    }
    for (let i = 0; i < 59049; i++) {
      const p = vm instanceof TritonWASM ? vm.i8[196608 + i] : vm.vram[i];
      if (p !== 0) { mix(i); mix(p); }
    }
  } else {
    const ramArr = vm.mem;
    for (let i = 0; i < ramArr.length; i++) {
      const m = ramArr[i];
      if (m !== 0) { mix(i); mix(m); }
    }
    const diskArr = vm.disk;
    for (let i = 0; i < diskArr.length; i++) {
      const d = diskArr[i];
      if (d !== 0) { mix(i); mix(d); }
    }
    const vramArr = vm.vram;
    for (let i = 0; i < vramArr.length; i++) {
      const p = vramArr[i];
      if (p !== 0) { mix(i); mix(p); }
    }
  }
  return h >>> 0;
}

function extractSnapshotFromHTML(htmlStr) {
  const m = /<script id="triton-snapshot" type="application\/json">([\s\S]*?)<\/script>/.exec(htmlStr);
  if (!m) return null;
  const txt = m[1].trim();
  if (!txt || txt === 'null') return null;
  return JSON.parse(txt);
}

// Provenance: carried from triton.html lines 5295–5307
const PALETTE_27 = (() => {
  const levels = [28, 132, 242];
  const pal = {};
  for (let v = -13; v <= 13; v++) {
    const t0 = balRem(v, 3, 1);
    const q1 = balQuot(v, 3, 1);
    const t1 = balRem(q1, 3, 1);
    const t2 = balQuot(q1, 3, 1);
    pal[v] = [levels[t2 + 1], levels[t1 + 1], levels[t0 + 1]];
  }
  return pal;
})();

// 729-Color Balanced-Ternary Palette (T3 mode: 2 trits = 9 levels [-4..+4] per channel R, G, B)
const PALETTE_729 = (() => {
  const levels9 = [0, 32, 64, 96, 128, 160, 192, 224, 255];
  const pal = {};
  for (let v = -364; v <= 364; v++) {
    const bDiad = balRem(v, 9, 4);
    const q1 = balQuot(v, 9, 4);
    const gDiad = balRem(q1, 9, 4);
    const rDiad = balQuot(q1, 9, 4);
    pal[v] = [levels9[rDiad + 4], levels9[gDiad + 4], levels9[bDiad + 4]];
  }
  return pal;
})();

const TRITOS_DESKTOP_SRC = ".mode T3\n; ============================================================================\n; TRITOS DESKTOP 1.0 — SUPERVISOR KERNEL, COMPOSITOR, BLOCK FS & SYSCALLS\n; Written 100% in Triton 3.0 Assembly\n; ============================================================================\n\n; --- Hardware I/O Ports (ISA-3.md §5) ---\n.equ P_CH, 0\n.equ P_NM, 1\n.equ P_DX, 2\n.equ P_DY, 3\n.equ P_PX, 4\n.equ P_DC, 5\n.equ P_TM, 6\n.equ P_DA, 7\n.equ P_DD, 8\n.equ P_TP, 9\n.equ P_KC, 10\n.equ P_KD, 11\n.equ P_KT, 12\n.equ P_MC, 13\n.equ P_MX, 14\n.equ P_MY, 15\n.equ P_MB, 16\n.equ P_DLBA, 17\n.equ P_DDMA, 18\n.equ P_DCNT, 19\n.equ P_DCMD, 20\n.equ P_DERR, 21\n\n; --- Kernel Memory Map (0 .. 196,829) ---\n.equ VEC_BASE, 5800\n.equ K_CUR_TASK, 5850\n.equ K_NUM_TASKS, 5851\n.equ K_TRAP_CNT, 5854          ; 3-tryte word\n.equ K_LAST_CAUSE, 5857        ; 3-tryte word\n.equ K_LAST_EADDR, 5860        ; 3-tryte word\n.equ K_LAST_FAULT_TASK, 5863\n.equ K_TIMER_IRQS, 5866        ; 3-tryte word\n.equ K_KBD_IRQS, 5869          ; 3-tryte word\n.equ K_MOUSE_IRQS, 5872        ; 3-tryte word\n.equ K_DISK_IRQS, 5875         ; 3-tryte word\n.equ K_DRAG_WIN, 5878          ; -1 or window idx being dragged\n.equ K_PREV_BTN, 5879          ; previous mouse button state\n.equ K_FAULT_BANNER_ACTIVE, 5880\n.equ K_SAVED_R0, 5883          ; 3-tryte word scratch\n.equ K_SAVED_R1, 5886          ; 3-tryte word scratch\n.equ K_NUM_FMT_BUF, 5900       ; 40-tryte scratch for number formatting\n\n; --- TCB Table (8 tasks * 64 trytes = 512 trytes at 5000..5511) ---\n; +0..26:  R0..R8 (9 * 3 trytes)\n; +27..29: PC (word)\n; +30..32: SP (word)\n; +33..35: ESR (word)\n; +36..38: UBASE (word)\n; +39..41: ULIMIT (word)\n; +42:     STATE (0=FREE, 1=READY, 2=FAULTED)\n; +43:     WIN_ID (-1 if none, else 0..7)\n; +44:     APP_ID (0..7)\n; +45..47: SLICES (word)\n; +48..50: SYSCALLS (word)\n; +51:     EV_HEAD (0..15)\n; +52:     EV_TAIL (0..15)\n; +53:     EV_COUNT (0..16)\n; +54..56: FAULT_CAUSE (word)\n.equ TCB_BASE, 6000\n.equ TCB_SIZE, 64\n\n; --- Per-Task Event Queues (8 tasks * 64 trytes = 512 trytes at 5512..6023) ---\n; Each task has 16 event slots * 4 trytes (type, a, b, c)\n.equ EVQ_BASE, 6512\n\n; --- Block-Disk File System Mirror (Sector 60 -> Mem[6100..6828]) ---\n.equ FS_DIR_LBA, 200\n.equ FS_DIR_BUF, 7100\n.equ FS_MAGIC_ADDR, 7804\n.equ FS_FREE_LBA_ADDR, 7807\n.equ FS_COUNT_ADDR, 7810\n.equ FS_NAME_TMP, 7830\n.equ FS_LIST_TMP, 7850\n\n; --- Compositor Scanline Buffer & Window Table (7000..8300) ---\n.equ SCAN_BUF, 7900\n.equ WINTAB, 8700              ; 8 windows * 24 trytes = 192 trytes (8000..8191)\n.equ ZORDER, 8900              ; 8 trytes (bottom-to-top window indices)\n.equ ZCOUNT, 8908              ; number of open windows\n.equ ACTIVE_WIN, 8909          ; focused window index (-1 if none)\n.equ CUR_X, 8910               ; mouse cursor X (0..728)\n.equ CUR_Y, 8911               ; mouse cursor Y (0..485)\n.equ LAST_REDRAW_TRYTES, 8912  ; 3-tryte word\n.equ TOTAL_REDRAW_TRYTES, 8915 ; 3-tryte word\n.equ REDRAW_COUNT, 8918        ; 3-tryte word\n.equ TMP_RX, 8921\n.equ TMP_RY, 8922\n.equ TMP_RW, 8923\n.equ TMP_RH, 8924\n.equ TMP_RX2, 8925\n.equ TMP_RY2, 8926\n.equ TMP_Y, 8927\n.equ TMP_Z, 8928\n\n; --- App Binary Registry in Kernel Memory (8500..8620) ---\n; 8 entries * 12 trytes:\n; +0..2: ROM_ADDR (word: where app template lives in kernel RAM)\n; +3..5: ROM_LEN  (word: tryte count to copy)\n; +6..8: DEF_X    (tryte), DEF_Y (tryte), DEF_W (tryte)\n; +9:    DEF_H    (tryte)\n.equ APP_REG_BASE, 9000\n\n; --- Colors (729-Color Balanced-Ternary Palette [-364..+364]) ---\n.equ COL_DESKTOP_BG, -280\n.equ COL_TASKBAR_BG, -335\n.equ COL_TASKBAR_BTN, -240\n.equ COL_TASKBAR_ACT, -120\n.equ COL_WIN_BG, -310\n.equ COL_WIN_BORDER, 120\n.equ COL_TITLE_ACT, -110\n.equ COL_TITLE_INACT, -260\n.equ COL_CLOSE_BTN, 280\n.equ COL_WHITE, 364\n.equ COL_BLACK, -364\n.equ COL_GREEN, 76\n.equ COL_YELLOW, 355\n.equ COL_CYAN, -284\n.equ COL_FAULT_BG, 240\n\n; ============================================================================\n; STAGE-0 BOOTLOADER AT Mem[0..17] (DMA-loads 45 sectors = 32,805 trytes from Disk LBA 0)\n; ============================================================================\n.org 0\nboot_reset:\n  LI R0, #0\n  OUT R0, #P_DLBA\n  OUT R0, #P_DDMA\n  LI R0, #45\n  OUT R0, #P_DCNT\n  LI R0, #1\n  OUT R0, #P_DCMD\n  JMP kernel_boot_entry\n\nkernel_boot_entry:\n  ; Set Kernel Stack Pointer (SPR_KSP = 9800) and current SP = 9800\n  LI R0, #9600\n  MTSPR R0, #14 ; SPR_KSP = 9800\n  MTSPR R0, #10 ; SPR_ESP = 9800\n  LI R0, #kernel_init_after_sp\n  MTSPR R0, #9  ; SPR_EPC\n  LI R0, #0\n  MTSPR R0, #11 ; SPR_ESR (Supervisor, IE=0)\n  IRET\n\nkernel_init_after_sp:\n  ; Clear kernel BSS state (4800..8400)\n  LI R0, #5800\n  LI R1, #0\n  LI R2, #3500\n  BFILL R0, R1, R2\n\n  ; Initialize Vector Table at VEC_BASE (4800)\n  LI R0, #VEC_BASE\n  MTSPR R0, #5 ; SPR_VBR = 4800\n  LI R1, #VEC_BASE\n  LI R0, #boot_reset\n  SW R0, R1, #0   ; Vec 0: RESET\n  LI R0, #fault_handler\n  SW R0, R1, #3   ; Vec 1: ILLEGAL_OP\n  SW R0, R1, #6   ; Vec 2: PRIV_VIOL\n  SW R0, R1, #9   ; Vec 3: PROT_VIOL\n  SW R0, R1, #12  ; Vec 4: BAD_ADDR\n  SW R0, R1, #15  ; Vec 5: DIV_ZERO\n  LI R0, #syscall_handler\n  SW R0, R1, #18  ; Vec 6: SYSCALL\n  LI R0, #irq_timer_handler\n  SW R0, R1, #21  ; Vec 7: IRQ_TIMER\n  LI R0, #irq_kbd_handler\n  SW R0, R1, #24  ; Vec 8: IRQ_KBD\n  LI R0, #irq_mouse_handler\n  SW R0, R1, #27  ; Vec 9: IRQ_MOUSE\n  LI R0, #irq_disk_handler\n  SW R0, R1, #30  ; Vec 10: IRQ_DISK\n  LI R0, #irq_net_handler\n  SW R0, R1, #33  ; Vec 11: IRQ_NET\n\n  ; Enable Divide-by-Zero Fault Trap (SPR_TRAP_DIV0 = 1)\n  LI R0, #1\n  MTSPR R0, #15\n\n  ; Initialize Window Manager state\n  LI R1, #ACTIVE_WIN\n  LI R0, #-1\n  ST R0, R1, #0 ; ACTIVE_WIN = -1\n  LI R1, #K_DRAG_WIN\n  ST R0, R1, #0 ; K_DRAG_WIN = -1\n  LI R1, #K_LAST_FAULT_TASK\n  ST R0, R1, #0\n  LI R1, #CUR_X\n  LI R0, #364\n  ST R0, R1, #0 ; CUR_X = 364\n  LI R0, #230\n  ST R0, R1, #1 ; CUR_Y = 230\n\n  ; Mark all 8 TCB WIN_IDs as -1\n  LI R1, #TCB_BASE\n  LI R2, #8\n  LI R0, #-1\ninit_tcb_lp:\n  ST R0, R1, #43 ; WIN_ID = -1\n  ADDI R1, R1, #TCB_SIZE\n  SUBI R2, R2, #1\n  JNZ init_tcb_lp\n\n  ; Populate App Registry (Apps 0..5)\n  CALL init_app_registry\n\n  ; Initialize Block-Disk File System (loads or formats Sector 60)\n  CALL fs_init\n\n  ; Paint initial desktop wallpaper via hardware DISPLAY_CMD (Port 5) + taskbar strip\n  LI R0, #COL_DESKTOP_BG\n  OUT R0, #P_DC\n  CALL wm_draw_taskbar_banner\n  ; Reset redraw counters after initial boot wallpaper so test measurements start clean\n  LI R1, #LAST_REDRAW_TRYTES\n  LI R0, #0\n  SW R0, R1, #0\n  SW R0, R1, #3\n  SW R0, R1, #6\n\n  ; Spawn default desktop apps: Clock (App 3) and Terminal (App 0)\n  LI R0, #3\n  CALL k_spawn_app\n  LI R0, #0\n  CALL k_spawn_app\n\n  ; Configure Hardware Interrupt Mask (IMASK = 31) and Periodic Timer (Period = 2500 steps)\n  LI R0, #31\n  MTSPR R0, #3 ; SPR_IMASK = 31\n  LI R0, #2500\n  OUT R0, #P_TP\n\n  ; Start Task 0!\n  LI R0, #0\n  LI R1, #K_CUR_TASK\n  ST R0, R1, #0\n  JMP sched_restore_current\n\n\n; ============================================================================\n; CONTEXT SAVE / RESTORE & PREEMPTIVE SCHEDULER\n; ============================================================================\n; Save user context on trap/IRQ entry:\n; Before calling k_save_context, handler must do:\n;   PUSH R0\n;   PUSH R1\n; Wait: to keep stack clean on KSP, let's store R0 and R1 directly into fixed kernel scratch words\n; K_SAVED_R0 (4883) and K_SAVED_R1 (4886) using a macro-free pattern:\n; Wait: in T3, ST/SW requires a base register! So if we do:\n;   PUSH R0\n;   PUSH R1\n; on KSP, then inside k_save_context:\n;    caller's return address is at [SP+0..2], saved R1 is at [SP+3..5], saved R0 is at [SP+6..8]!\n;Even simpler: don't CALL k_save_context! Inline or jump to it, or save R0/R1 in handler before CALL!\n\n; Helper: R1 = &TCB[K_CUR_TASK]\nget_cur_tcb_r1:\n  LI R1, #K_CUR_TASK\n  LT R1, R1, #0\n  MULI R1, R1, #TCB_SIZE\n  ADDI R1, R1, #TCB_BASE\n  RET\n\n; Save registers R2..R8 and EPC, ESP, ESR into TCB[K_CUR_TASK], using K_SAVED_R0 and K_SAVED_R1 for R0, R1\nk_save_current_task:\n  PUSH R0\n  PUSH R1\n  CALL get_cur_tcb_r1\n  SW R2, R1, #6\n  SW R3, R1, #9\n  SW R4, R1, #12\n  SW R5, R1, #15\n  SW R6, R1, #18\n  SW R7, R1, #21\n  SW R8, R1, #24\n  LI R0, #K_SAVED_R0\n  LW R2, R0, #0\n  SW R2, R1, #0\n  LW R2, R0, #3 ; K_SAVED_R1\n  SW R2, R1, #3\n  MFSPR R0, #9  ; EPC\n  SW R0, R1, #27\n  MFSPR R0, #10 ; ESP\n  SW R0, R1, #30\n  MFSPR R0, #11 ; ESR\n  SW R0, R1, #33\n  POP R1\n  POP R0\n  RET\n\n; Select next READY task (STATE == 1) in round-robin order starting from (K_CUR_TASK + 1) % 8\nsched_pick_next:\n  LI R1, #K_CUR_TASK\n  LT R0, R1, #0\n  LI R2, #8 ; max 8 checks\nspn_lp:\n  CMPI R2, #0\n  JZ spn_idle\n  ADDI R0, R0, #1\n  CMPI R0, #8\n  JN spn_idx_ok\n  LI R0, #0\nspn_idx_ok:\n  MULI R3, R0, #TCB_SIZE\n  ADDI R3, R3, #TCB_BASE\n  LT R4, R3, #42 ; STATE\n  CMPI R4, #1\n  JZ spn_found\n  SUBI R2, R2, #1\n  JMP spn_lp\nspn_found:\n  LI R1, #K_CUR_TASK\n  ST R0, R1, #0\n  RET\nspn_idle:\n  ; No user task is READY -> enable interrupts in supervisor idle loop\n  LI R0, #81 ; PRIV=0, IE=1\n  MTSPR R0, #11\n  LI R0, #kernel_idle_loop\n  MTSPR R0, #9\n  LI R0, #9500\n  MTSPR R0, #10\n  IRET\n\nkernel_idle_loop:\n  NOP\n  JMP kernel_idle_loop\n\n; Restore current task from TCB[K_CUR_TASK] and IRET to User Mode\nsched_restore_current:\n  LI R1, #K_CUR_TASK\n  LT R0, R1, #0\n  MULI R1, R0, #TCB_SIZE\n  ADDI R1, R1, #TCB_BASE\n  LT R0, R1, #42 ; STATE\n  CMPI R0, #1\n  JNZ spn_idle\n  LW R0, R1, #36 ; UBASE\n  MTSPR R0, #6\n  LW R0, R1, #39 ; ULIMIT\n  MTSPR R0, #7\n  ; Preserve SPR 8 (PROT_EN) as configured on the machine (1 by default, 0 in positive control test 9) (note: if VM created with protectionEnabled: false, test 9 sets SPR 8 to 0 before running rogue task or we preserve SPR 8!)\n  ; Wait: Positive Control Test 9 says: \"With protectionEnabled: false, the fault-isolation test's rogue task corrupts kernel memory\".\n  ; If sched_restore_current overwrites SPR 8 (PROT_EN) with 1, it would re-enable protection even when the VM was initialized with protectionEnabled: false!\n  ; DO NOT overwrite SPR 8 with 1 here! The VM initializes SPR 8 to options.protectionEnabled (1 by default, 0 in positive control)!\n  LW R0, R1, #27 ; EPC\n  MTSPR R0, #9\n  LW R0, R1, #30 ; ESP\n  MTSPR R0, #10\n  LW R0, R1, #33 ; ESR\n  MTSPR R0, #11\n  LW R2, R1, #6\n  LW R3, R1, #9\n  LW R4, R1, #12\n  LW R5, R1, #15\n  LW R6, R1, #18\n  LW R7, R1, #21\n  LW R8, R1, #24\n  LW R0, R1, #0\n  LW R1, R1, #3\n  IRET\n\n; ============================================================================\n; HARDWARE INTERRUPT HANDLERS (Vectors 7..11)\n; ============================================================================\nirq_timer_handler:\n  PUSH R0\n  PUSH R1\n  LI R1, #K_SAVED_R0\n  POP R0 ; original R1\n  SW R0, R1, #3\n  POP R0 ; original R0\n  SW R0, R1, #0\n\n  ; Increment K_TIMER_IRQS\n  LI R1, #K_TIMER_IRQS\n  LW R0, R1, #0\n  ADDI R0, R0, #1\n  SW R0, R1, #0\n\n  ; Check if trapped from Supervisor mode (ESR < 90):\n  ; Wait: ESR = SF + 3*CF + 9*OF + 27*PRIV + 81*IE.\n  ; When trapping from User mode (PRIV=1, IE=1), ESR is in [108-13 .. 108+13] = [95 .. 121].\n  ; When trapping from Supervisor mode (PRIV=0, IE=1), ESR is in [81-13 .. 81+13] = [68 .. 94].\n  MFSPR R0, #11\n  CMPI R0, #95\n  JN irq_timer_from_sup\n\n  CALL k_save_current_task\n  ; Increment current task SLICES counter (+45..47)\n  CALL get_cur_tcb_r1\n  LW R0, R1, #45\n  ADDI R0, R0, #1\n  SW R0, R1, #45\n  JMP irq_timer_idle_ok\n\nirq_timer_from_sup:\n  MFSPR R0, #9 ; EPC\n  CMPI R0, #kernel_idle_loop\n  JZ irq_timer_idle_ok\n  CMPI R0, #kernel_idle_loop + 2\n  JZ irq_timer_idle_ok\n  ; Trapped inside kernel BCOPY/BFILL -> resume kernel immediately without context switch!\n  LI R1, #K_SAVED_R0\n  LW R0, R1, #0\n  LW R1, R1, #3\n  IRET\nirq_timer_idle_ok:\n  CALL k_poll_kbd\n  CALL k_poll_mouse\n  CALL sched_pick_next\n  JMP sched_restore_current\n\nirq_kbd_handler:\n  PUSH R0\n  PUSH R1\n  LI R1, #K_SAVED_R0\n  POP R0\n  SW R0, R1, #3\n  POP R0\n  SW R0, R1, #0\n  MFSPR R0, #11\n  CMPI R0, #95\n  JN irq_kbd_sup\n  CALL k_save_current_task\n  JMP irq_kbd_user_cont\nirq_kbd_sup:\n  LI R1, #K_KBD_IRQS\n  LW R0, R1, #0\n  ADDI R0, R0, #1\n  SW R0, R1, #0\n  CALL k_poll_kbd\n  LI R1, #K_SAVED_R0\n  LW R0, R1, #0\n  LW R1, R1, #3\n  IRET\nirq_kbd_user_cont:\n  LI R1, #K_KBD_IRQS\n  LW R0, R1, #0\n  ADDI R0, R0, #1\n  SW R0, R1, #0\n  CALL k_poll_kbd\n  JMP sched_restore_current\n\nirq_mouse_handler:\n  PUSH R0\n  PUSH R1\n  LI R1, #K_SAVED_R0\n  POP R0\n  SW R0, R1, #3\n  POP R0\n  SW R0, R1, #0\n  MFSPR R0, #11\n  CMPI R0, #95\n  JN irq_mouse_sup\n  CALL k_save_current_task\n  JMP irq_mouse_user_cont\nirq_mouse_sup:\n  LI R1, #K_MOUSE_IRQS\n  LW R0, R1, #0\n  ADDI R0, R0, #1\n  SW R0, R1, #0\n  CALL k_poll_mouse\n  LI R1, #K_SAVED_R0\n  LW R0, R1, #0\n  LW R1, R1, #3\n  IRET\nirq_mouse_user_cont:\n  LI R1, #K_MOUSE_IRQS\n  LW R0, R1, #0\n  ADDI R0, R0, #1\n  SW R0, R1, #0\n  CALL k_poll_mouse\n  JMP sched_restore_current\n\nirq_disk_handler:\n  PUSH R0\n  PUSH R1\n  LI R1, #K_DISK_IRQS\n  LW R0, R1, #0\n  ADDI R0, R0, #1\n  SW R0, R1, #0\n  POP R1\n  POP R0\n  IRET\n\nirq_net_handler:\n  IRET\n\n; ============================================================================\n; FAULT ISOLATION HANDLER (Vectors 1..5: ILLEGAL_OP, PRIV_VIOL, PROT_VIOL, BAD_ADDR, DIV_ZERO)\n; Kills the faulting user task, closes its window, displays fault banner on taskbar, and schedules next task!\n; ============================================================================\nfault_handler:\n  ; Reset SP to KSP (9800) in case fault came from bad SP\n  LI R0, #9600\n  MTSPR R0, #14\n  ; Record K_TRAP_CNT, K_LAST_CAUSE, K_LAST_EADDR, K_LAST_FAULT_TASK\n  LI R1, #K_TRAP_CNT\n  LW R0, R1, #0\n  ADDI R0, R0, #1\n  SW R0, R1, #0\n\n  MFSPR R2, #12 ; ECAUSE\n  SW R2, R1, #3 ; K_LAST_CAUSE\n  MFSPR R3, #13 ; EADDR\n  SW R3, R1, #6 ; K_LAST_EADDR\n\n  LI R4, #K_CUR_TASK\n  LT R0, R4, #0\n  ST R0, R1, #9 ; K_LAST_FAULT_TASK\n  LI R5, #1\n  ST R5, R1, #26 ; K_FAULT_BANNER_ACTIVE = 1\n\n  ; Kill current task (R0 = task_id, R2 = fault_cause)\n  CALL k_kill_task_fault\n\n  ; Pick next task and continue running desktop!\n  CALL sched_pick_next\n  JMP sched_restore_current\n\n; k_kill_task_fault: R0 = task_id, R2 = fault_cause\nk_kill_task_fault:\n  PUSH R0\n  PUSH R1\n  PUSH R2\n  PUSH R3\n  MULI R1, R0, #TCB_SIZE\n  ADDI R1, R1, #TCB_BASE\n  LI R3, #2 ; STATE = 2 (FAULTED/KILLED)\n  ST R3, R1, #42\n  SW R2, R1, #54 ; FAULT_CAUSE\n  LT R3, R1, #43 ; WIN_ID\n  CMPI R3, #-1\n  JZ kktf_no_win\n  LI R0, #-1\n  ST R0, R1, #43\n  MOV R0, R3\n  CALL wm_close_window\nkktf_no_win:\n  ; Redraw taskbar to show fault status message and updated task list\n  CALL wm_draw_taskbar_banner\n  POP R3\n  POP R2\n  POP R1\n  POP R0\n  RET\n\n\n; ============================================================================\n; SYSTEM CALL DISPATCHER (Vector 6: SYSCALL #imm9)\n; ============================================================================\nsyscall_handler:\n  PUSH R0\n  PUSH R1\n  LI R1, #K_SAVED_R0\n  POP R0\n  SW R0, R1, #3 ; save R1\n  POP R0\n  SW R0, R1, #0 ; save R0\n\n  CALL k_save_current_task\n\n  ; Increment current task SYSCALLS counter (+48..50)\n  CALL get_cur_tcb_r1\n  LW R0, R1, #48\n  ADDI R0, R0, #1\n  SW R0, R1, #48\n\n  ; Fast path for SYS_YIELD (ECAUSE == 2): skip k_poll_kbd / k_poll_mouse so idle tasks yield in ~35 steps!\n  MFSPR R6, #12 ; ECAUSE = syscall number\n  CMPI R6, #2\n  JZ sys_yield\n  PUSH R6\n  CALL k_poll_kbd\n  CALL k_poll_mouse\n  POP R6\n\n  ; Load user R0..R8 from TCB!\n  CALL get_cur_tcb_r1\n  LW R0, R1, #0\n  LW R2, R1, #6\n  LW R3, R1, #9\n  LW R4, R1, #12\n  LW R5, R1, #15\n  LW R7, R1, #21\n  LW R8, R1, #24\n  LW R1, R1, #3 ; user R1\n  CMPI R6, #0\n  JZ sys_exit\n  CMPI R6, #1\n  JZ sys_putc\n  CMPI R6, #2\n  JZ sys_yield\n  CMPI R6, #3\n  JZ sys_get_ticks\n  CMPI R6, #4\n  JZ sys_spawn_app\n  CMPI R6, #5\n  JZ sys_kill_task\n  CMPI R6, #6\n  JZ sys_list_tasks\n  CMPI R6, #7\n  JZ sys_exec_buf\n  CMPI R6, #10\n  JZ sys_win_open\n  CMPI R6, #11\n  JZ sys_win_close\n  CMPI R6, #12\n  JZ sys_win_move\n  CMPI R6, #13\n  JZ sys_win_focus\n  CMPI R6, #20\n  JZ sys_win_fill_rect\n  CMPI R6, #21\n  JZ sys_win_draw_text\n  CMPI R6, #22\n  JZ sys_win_put_pixel\n  CMPI R6, #23\n  JZ sys_win_get_pixel\n  CMPI R6, #24\n  JZ sys_win_flush\n  CMPI R6, #25\n  JZ sys_get_event\n  CMPI R6, #26\n  JZ sys_win_draw_num\n  CMPI R6, #27\n  JZ sys_win_blit_buf\n  CMPI R6, #30\n  JZ sys_fs_list\n  CMPI R6, #31\n  JZ sys_fs_read\n  CMPI R6, #32\n  JZ sys_fs_write\n  CMPI R6, #33\n  JZ sys_fs_delete\n  CMPI R6, #36\n  JZ sys_read_sector\n  CMPI R6, #37\n  JZ sys_load_src_sectors\n\n  ; Unknown syscall -> return -1 in user R0\n  LI R0, #-1\n  JMP sys_ret_r0\n\nsys_ret_r0:\n  CALL get_cur_tcb_r1\n  SW R0, R1, #0\n  JMP sched_restore_current\n\n; --- SYSCALL #0: SYS_EXIT ---\nsys_exit:\n  LI R1, #K_CUR_TASK\n  LT R0, R1, #0\n  CALL k_kill_task_clean\n  CALL sched_pick_next\n  JMP sched_restore_current\n\n; --- SYSCALL #1: SYS_PUTC (R0 = char) ---\nsys_putc:\n  OUT R0, #P_CH\n  JMP sched_restore_current\n\n; --- SYSCALL #2: SYS_YIELD ---\nsys_yield:\n  LI R0, #2500\n  OUT R0, #P_TP\n  CALL sched_pick_next\n  JMP sched_restore_current\n\n; --- SYSCALL #3: SYS_GET_TICKS -> R0 = virtual clock steps ---\nsys_get_ticks:\n  IN R0, #P_TM\n  JMP sys_ret_r0\n\n; --- SYSCALL #4: SYS_SPAWN_APP (R0 = app_id 0..5) -> R0 = task_id ---\nsys_spawn_app:\n  CALL k_spawn_app\n  CALL get_cur_tcb_r1\n  SW R0, R1, #0\n  CMPI R0, #0\n  JN sched_restore_current\n  LI R1, #K_CUR_TASK\n  ST R0, R1, #0\n  JMP sched_restore_current\n\n; --- SYSCALL #5: SYS_KILL_TASK (R0 = task_id) -> R0 = status ---\nsys_kill_task:\n  CMPI R0, #0\n  JN skt_err\n  CMPI R0, #8\n  JNN skt_err\n  CALL k_kill_task_clean\n  LI R1, #K_CUR_TASK\n  LT R2, R1, #0\n  CMP R0, R2\n  JNZ skt_ok\n  CALL sched_pick_next\n  JMP sched_restore_current\nskt_ok:\n  LI R0, #0\n  JMP sys_ret_r0\nskt_err:\n  LI R0, #-1\n  JMP sys_ret_r0\n\n; --- SYSCALL #6: SYS_LIST_TASKS (R0 = user_buf_ptr) -> R0 = active_count ---\n; Writes 8 entries of 8 trytes: [task_id, state, app_id, win_id, slices_low, syscalls_low, fault_cause, 0]\nsys_list_tasks:\n  MOV R4, R0 ; user dst buf\n  LI R5, #0  ; task_id = 0\n  LI R6, #0  ; active count\n  LI R7, #TCB_BASE\nslt_lp:\n  CMPI R5, #8\n  JZ slt_done\n  ST R5, R4, #0 ; task_id\n  LT R0, R7, #42 ; STATE\n  ST R0, R4, #1\n  CMPI R0, #1\n  JNZ slt_not_act\n  ADDI R6, R6, #1\nslt_not_act:\n  LT R0, R7, #44 ; APP_ID\n  ST R0, R4, #2\n  LT R0, R7, #43 ; WIN_ID\n  ST R0, R4, #3\n  LT R0, R7, #45 ; SLICES_LOW\n  ST R0, R4, #4\n  LT R0, R7, #48 ; SYSCALLS_LOW\n  ST R0, R4, #5\n  LT R0, R7, #54 ; FAULT_CAUSE\n  ST R0, R4, #6\n  LI R0, #0\n  ST R0, R4, #7\n  ADDI R4, R4, #8\n  ADDI R7, R7, #TCB_SIZE\n  ADDI R5, R5, #1\n  JMP slt_lp\nslt_done:\n  MOV R0, R6\n  JMP sys_ret_r0\n\n; --- SYSCALL #7: SYS_EXEC_BUF (R0 = buf_ptr, R1 = len_trytes, R2 = app_id) -> R0 = new task_id ---\nsys_exec_buf:\n  CALL k_spawn_custom_buf\n  CALL get_cur_tcb_r1\n  SW R0, R1, #0\n  CMPI R0, #0\n  JN sched_restore_current\n  LI R1, #K_CUR_TASK\n  ST R0, R1, #0\n  JMP sched_restore_current\n\n; --- SYSCALL #10: SYS_WIN_OPEN (R0=x, R1=y, R2=w, R3=h, R4=title_ptr, R5=bg_col) -> R0=win_id ---\nsys_win_open:\n  CALL wm_open_window\n  JMP sys_ret_r0\n\n; --- SYSCALL #11: SYS_WIN_CLOSE ---\nsys_win_close:\n  CALL get_cur_tcb_r1\n  LT R0, R1, #43 ; WIN_ID\n  CMPI R0, #-1\n  JZ swc_done\n  LI R2, #-1\n  ST R2, R1, #43\n  CALL wm_close_window\nswc_done:\n  LI R0, #0\n  JMP sys_ret_r0\n\n; --- SYSCALL #12: SYS_WIN_MOVE (R0=win_id, R1=new_x, R2=new_y) ---\n; If R0 == -1, moves calling task's window\nsys_win_move:\n  CMPI R0, #-1\n  JNZ swm_have_id\n  PUSH R1\n  CALL get_cur_tcb_r1\n  LT R0, R1, #43\n  POP R1\nswm_have_id:\n  CALL wm_move_window\n  LI R0, #0\n  JMP sys_ret_r0\n\n; --- SYSCALL #13: SYS_WIN_FOCUS (R0=win_id) ---\nsys_win_focus:\n  CALL wm_focus_window\n  LI R0, #0\n  JMP sys_ret_r0\n\n; --- SYSCALL #20: SYS_WIN_FILL_RECT (R0=rel_x, R1=rel_y, R2=w, R3=h, R4=color) ---\nsys_win_fill_rect:\n  CALL wm_user_fill_rect\n  LI R0, #0\n  JMP sys_ret_r0\n\n; --- SYSCALL #21: SYS_WIN_DRAW_TEXT (R0=rel_x, R1=rel_y, R2=str_ptr, R3=fg, R4=bg) ---\nsys_win_draw_text:\n  CALL wm_user_draw_text\n  LI R0, #0\n  JMP sys_ret_r0\n\n; --- SYSCALL #22: SYS_WIN_PUT_PIXEL (R0=rel_x, R1=rel_y, R2=color) ---\nsys_win_put_pixel:\n  CALL wm_user_put_pixel\n  LI R0, #0\n  JMP sys_ret_r0\n\n; --- SYSCALL #23: SYS_WIN_GET_PIXEL (R0=rel_x, R1=rel_y) -> R0=color ---\nsys_win_get_pixel:\n  CALL wm_user_get_pixel\n  JMP sys_ret_r0\n\n; --- SYSCALL #24: SYS_WIN_FLUSH (R0=rel_x, R1=rel_y, R2=w, R3=h) ---\n; If R2 == 0, flushes entire client area of calling task's window\nsys_win_flush:\n  CALL wm_user_flush\n  LI R0, #0\n  JMP sys_ret_r0\n\n; --- SYSCALL #25: SYS_GET_EVENT -> R0=type (0=none, 1=key, 2=mouse_down, 3=mouse_move), R1=a, R2=b, R3=c ---\nsys_get_event:\n  CALL get_cur_tcb_r1\n  LT R0, R1, #53 ; EV_COUNT\n  CMPI R0, #0\n  JZ sge_empty\n  SUBI R0, R0, #1\n  ST R0, R1, #53\n  LT R2, R1, #51 ; EV_HEAD\n  ADDI R3, R2, #1\n  CMPI R3, #16\n  JN sge_hd_ok\n  LI R3, #0\nsge_hd_ok:\n  ST R3, R1, #51\n  ; Compute event slot addr = EVQ_BASE + task_id*64 + EV_HEAD*4\n  LI R4, #K_CUR_TASK\n  LT R4, R4, #0\n  MULI R4, R4, #64\n  MULI R2, R2, #4\n  ADD R4, R4, R2\n  ADDI R4, R4, #EVQ_BASE\n  LT R0, R4, #0 ; type\n  LT R2, R4, #1 ; a (keycode or rel_x)\n  LT R3, R4, #2 ; b (rel_y)\n  LT R5, R4, #3 ; c (buttons)\n  SW R0, R1, #0 ; user R0 = type\n  SW R2, R1, #3 ; user R1 = a\n  SW R3, R1, #6 ; user R2 = b\n  SW R5, R1, #9 ; user R3 = c\n  JMP sched_restore_current\nsge_empty:\n  LI R0, #0\n  SW R0, R1, #0\n  JMP sched_restore_current\n\n; --- SYSCALL #26: SYS_WIN_DRAW_NUM (R0=rel_x, R1=rel_y, R2=number, R3=base (10 or 3), R4=fg, R5=bg) ---\nsys_win_draw_num:\n  CALL wm_user_draw_num\n  LI R0, #0\n  JMP sys_ret_r0\n\n; --- SYSCALL #27: SYS_WIN_BLIT_BUF (R0=rel_x, R1=rel_y, R2=w, R3=h, R4=user_buf_ptr, R5=dir (0=to_win, 1=from_win)) ---\nsys_win_blit_buf:\n  CALL wm_user_blit_buf\n  LI R0, #0\n  JMP sys_ret_r0\n\n; --- SYSCALL #30: SYS_FS_LIST (R0=user_buf_ptr) -> R0=file_count ---\n; Copies active directory entries (16 trytes each) to user_buf_ptr\nsys_fs_list:\n  MOV R2, R0 ; user dst\n  LI R3, #FS_DIR_BUF\n  LI R4, #44\n  LI R5, #0 ; count\nsfl_lp:\n  CMPI R4, #0\n  JZ sfl_done\n  LT R0, R3, #0\n  CMPI R0, #0\n  JZ sfl_next\n  ; Copy 16 trytes from R3 to R2\n  MOV R0, R2\n  MOV R1, R3\n  LI R6, #16\n  BCOPY R0, R1, R6\n  MOV R2, R0\n  ADDI R5, R5, #1\nsfl_next:\n  ADDI R3, R3, #16\n  SUBI R4, R4, #1\n  JMP sfl_lp\nsfl_done:\n  MOV R0, R5\n  JMP sys_ret_r0\n\n; --- SYSCALL #31: SYS_FS_READ (R0=name_ptr, R1=dst_ptr, R2=max_len) -> R0=len_read (-1 if not found) ---\nsys_fs_read:\n  MOV R4, R2 ; max_len\n  MOV R2, R1 ; dst_ptr\n  MOV R1, R0 ; name_ptr\n  CALL fs_read\n  JMP sys_ret_r0\n\n; --- SYSCALL #32: SYS_FS_WRITE (R0=name_ptr, R1=src_ptr, R2=len, R3=type) -> R0=status (0=OK, -1=disk full) ---\nsys_fs_write:\n  MOV R4, R3 ; type\n  MOV R3, R2 ; len\n  MOV R2, R1 ; src_ptr\n  MOV R1, R0 ; name_ptr\n  CALL fs_write\n  JMP sys_ret_r0\n\n; --- SYSCALL #33: SYS_FS_DELETE (R0=name_ptr) -> R0=status ---\nsys_fs_delete:\n  MOV R1, R0\n  CALL fs_delete\n  JMP sys_ret_r0\n\n; --- SYSCALL #36: SYS_READ_SECTOR (R0=lba, R1=dst_offset_or_zero) ---\n; Used by the in-guest streaming assembler: DMA-reads Disk sector R0 into calling task's SEC_BUF (UBASE + 5400)\nsys_read_sector:\n  OUT R0, #P_DLBA\n  CALL get_cur_tcb_r1\n  LW R2, R1, #36 ; UBASE\n  ADDI R2, R2, #5400\n  OUT R2, #P_DDMA\n  LI R2, #1\n  OUT R2, #P_DCNT\n  OUT R2, #P_DCMD\n  LI R0, #0\n  JMP sys_ret_r0\n\n; --- SYSCALL #37: SYS_LOAD_SRC_SECTORS (R0=name_ptr) -> R0=char_len (-1 if not found) ---\n; Copies named source file from filesystem into Disk Sector 1..N (LBA 1..55) so the streaming assembler can stream it!\n; If R0 == 0, copies the full OS source (already on Disk LBA 1.. or file) or returns length.\nsys_load_src_sectors:\n  MOV R1, R0\n  CALL fs_find\n  CMPI R3, #-1\n  JZ slss_nf\n  LW R5, R3, #9  ; file start_lba\n  LW R6, R3, #12 ; file len_trytes\n  LT R7, R3, #15 ; sector_count\n  ; Copy R7 sectors from LBA R5 to LBA 1 using FS_LIST_TMP.. or stream port!\n  ; Wait: copying via DMA 1 sector at a time through SCAN_BUF (7000..7728):\n  LI R4, #0 ; sector idx\nslss_lp:\n  CMP R4, R7\n  JNN slss_done\n  ADD R0, R5, R4\n  OUT R0, #P_DLBA\n  LI R0, #SCAN_BUF\n  OUT R0, #P_DDMA\n  LI R0, #1\n  OUT R0, #P_DCNT\n  OUT R0, #P_DCMD ; DMA Read into SCAN_BUF\n  ADDI R0, R4, #1 ; dst LBA = 1 + R4\n  OUT R0, #P_DLBA\n  LI R0, #SCAN_BUF\n  OUT R0, #P_DDMA\n  LI R0, #1\n  OUT R0, #P_DCNT\n  LI R0, #2\n  OUT R0, #P_DCMD ; DMA Write from SCAN_BUF to LBA 1 + R4\n  ADDI R4, R4, #1\n  JMP slss_lp\nslss_done:\n  ; Also null-terminate at Disk[729 + len_trytes]\n  LI R0, #729\n  ADD R0, R0, R6\n  OUT R0, #P_DA\n  LI R0, #0\n  OUT R0, #P_DD\n  MOV R0, R6\n  JMP sys_ret_r0\nslss_nf:\n  LI R0, #-1\n  JMP sys_ret_r0\n\n\n; ============================================================================\n; TASK MANAGEMENT (k_spawn_app, k_spawn_custom_buf, k_kill_task_clean, k_push_event)\n; ============================================================================\n\n; k_find_free_task: returns R0 = free task_id (0..7) or -1 if full\nk_find_free_task:\n  PUSH R1\n  PUSH R2\n  LI R0, #0\n  LI R1, #TCB_BASE\nkfft_lp:\n  CMPI R0, #8\n  JZ kfft_full\n  LT R2, R1, #42 ; STATE\n  CMPI R2, #0\n  JZ kfft_ret\n  ADDI R1, R1, #TCB_SIZE\n  ADDI R0, R0, #1\n  JMP kfft_lp\nkfft_full:\n  LI R0, #0\n  LI R1, #TCB_BASE\nkfft_lp2:\n  CMPI R0, #8\n  JZ kfft_none\n  LT R2, R1, #42\n  CMPI R2, #1\n  JNZ kfft_ret\n  ADDI R1, R1, #TCB_SIZE\n  ADDI R0, R0, #1\n  JMP kfft_lp2\nkfft_none:\n  LI R0, #-1\nkfft_ret:\n  POP R2\n  POP R1\n  RET\n\n; k_init_task_slot: R0 = task_id, R1 = app_id, R2 = code_src_addr, R3 = code_len_trytes\n; Copies code into task's UBASE, initializes TCB registers, stack, window, and marks STATE = 1\nk_init_task_slot:\n  PUSH R1\n  PUSH R2\n  PUSH R3\n  PUSH R4\n  PUSH R5\n  PUSH R6\n  PUSH R7\n  PUSH R8\n  MOV R4, R0 ; task_id\n  MOV R5, R1 ; app_id\n  ; Compute UBASE:\n  ; If app_id == 4 (Assembler app), use [590490, 984150) (UBASE = 30*19683, ULIMIT = 50*19683) so it has 393,660 trytes for symbol/spool/output buffers!\n  ; Otherwise, use [ (10 + task_id*2)*19683, (12 + task_id*2)*19683 ) (39,366 trytes per task)\n  CMPI R5, #4\n  JZ kits_asm_bounds\n  MULI R6, R4, #2\n  ADDI R6, R6, #10 ; m = 10 + task_id*2\n  LI R7, #19683 - 19683\n  LMI R7, #1 ; 19683\n  MUL R6, R6, R7 ; UBASE = m * 19683\n  ADD R8, R6, R7\n  ADD R8, R8, R7 ; ULIMIT = UBASE + 39366\n  JMP kits_bounds_ok\nkits_asm_bounds:\n  LI R6, #0\n  LMI R6, #30 ; UBASE = 30 * 19683 = 590,490\n  LI R8, #0\n  LMI R8, #50 ; ULIMIT = 50 * 19683 = 984,150\nkits_bounds_ok:\n  ; Copy R3 trytes from R2 (code_src_addr) to R6 (UBASE)\n  MOV R0, R6\n  MOV R1, R2\n  MOV R2, R3\n  BCOPY R0, R1, R2\n\n  ; Zero-fill TCB[task_id] (64 trytes)\n  MULI R1, R4, #TCB_SIZE\n  ADDI R1, R1, #TCB_BASE\n  MOV R0, R1\n  LI R2, #0\n  LI R3, #TCB_SIZE\n  BFILL R0, R2, R3\n\n  ; Set R8 = UBASE, PC = UBASE, SP = UBASE + 4500, ESR = 108 (PRIV=1, IE=1), UBASE = R6, ULIMIT = R8\n  SW R6, R1, #24 ; R8 = UBASE\n  SW R6, R1, #27 ; PC = UBASE\n  ADDI R0, R6, #4500\n  SW R0, R1, #30 ; SP = UBASE + 4500\n  LI R0, #108    ; PRIV=1 (27) + IE=1 (81) = 108\n  SW R0, R1, #33 ; ESR\n  SW R6, R1, #36 ; UBASE\n  SW R8, R1, #39 ; ULIMIT\n  LI R0, #1\n  ST R0, R1, #42 ; STATE = 1 (READY)\n  LI R0, #-1\n  ST R0, R1, #43 ; WIN_ID = -1\n  ST R5, R1, #44 ; APP_ID = app_id\n\n  ; Clear task's event queue\n  LI R0, #0\n  ST R0, R1, #51 ; EV_HEAD = 0\n  ST R0, R1, #52 ; EV_TAIL = 0\n  ST R0, R1, #53 ; EV_COUNT = 0\n\n  ; Increment K_NUM_TASKS\n  LI R2, #K_NUM_TASKS\n  LT R0, R2, #0\n  ADDI R0, R0, #1\n  ST R0, R2, #0\n\n\n  MOV R0, R4 ; return task_id\n  POP R8\n  POP R7\n  POP R6\n  POP R5\n  POP R4\n  POP R3\n  POP R2\n  POP R1\n  RET\n\n; k_spawn_app: R0 = app_id (0..5). Returns R0 = task_id (or -1)\n; Note: if app_id == 4 (Assembler) and a task with APP_ID == 4 is already running, focus its window instead of duplicating its fixed buffer!\nk_spawn_app:\n  PUSH R1\n  PUSH R2\n  PUSH R3\n  PUSH R4\n  MOV R4, R0 ; app_id\n  CMPI R4, #0\n  JN ksa_err\n  CMPI R4, #6\n  JNN ksa_err\n  ; Look up APP_REG_BASE + app_id * 12\n  MULI R1, R4, #12\n  ADDI R1, R1, #APP_REG_BASE\n  LW R2, R1, #0 ; ROM_ADDR\n  LW R3, R1, #3 ; ROM_LEN\n  CALL k_find_free_task\n  CMPI R0, #-1\n  JZ ksa_err\n  MOV R1, R4 ; app_id\n  CALL k_init_task_slot\n  JMP ksa_done\nksa_err:\n  LI R0, #-1\nksa_done:\n  POP R4\n  POP R3\n  POP R2\n  POP R1\n  RET\n\n; k_spawn_custom_buf: R0 = buf_ptr, R1 = len_trytes, R2 = app_id -> returns R0 = task_id\nk_spawn_custom_buf:\n  PUSH R1\n  PUSH R2\n  PUSH R3\n  PUSH R4\n  MOV R3, R1 ; len_trytes\n  MOV R4, R2 ; app_id\n  MOV R2, R0 ; buf_ptr\n  CALL k_find_free_task\n  CMPI R0, #-1\n  JZ kscb_err\n  MOV R1, R4\n  CALL k_init_task_slot\n  JMP kscb_done\nkscb_err:\n  LI R0, #-1\nkscb_done:\n  POP R4\n  POP R3\n  POP R2\n  POP R1\n  RET\n\n; k_kill_task_clean: R0 = task_id\nk_kill_task_clean:\n  PUSH R0\n  PUSH R1\n  PUSH R2\n  MULI R1, R0, #TCB_SIZE\n  ADDI R1, R1, #TCB_BASE\n  LT R2, R1, #42 ; STATE\n  CMPI R2, #1\n  JNZ kktc_done\n  LI R2, #0\n  ST R2, R1, #42 ; STATE = 0 (FREE)\n  LT R2, R1, #43 ; WIN_ID\n  CMPI R2, #-1\n  JZ kktc_no_win\n  LI R0, #-1\n  ST R0, R1, #43\n  MOV R0, R2\n  CALL wm_close_window\nkktc_no_win:\n  LI R1, #K_NUM_TASKS\n  LT R0, R1, #0\n  SUBI R0, R0, #1\n  ST R0, R1, #0\n  CALL wm_draw_taskbar_banner\nkktc_done:\n  POP R2\n  POP R1\n  POP R0\n  RET\n\n; k_push_event: R0 = task_id, R1 = type, R2 = a, R3 = b, R4 = c\nk_push_event:\n  PUSH R0\n  PUSH R1\n  PUSH R2\n  PUSH R3\n  PUSH R4\n  PUSH R5\n  PUSH R6\n  CMPI R0, #0\n  JN kpe_done\n  CMPI R0, #8\n  JNN kpe_done\n  MULI R5, R0, #TCB_SIZE\n  ADDI R5, R5, #TCB_BASE\n  LT R6, R5, #42 ; STATE\n  CMPI R6, #1\n  JNZ kpe_done\n  LT R6, R5, #53 ; EV_COUNT\n  CMPI R6, #16\n  JNN kpe_done\n  ADDI R6, R6, #1\n  ST R6, R5, #53\n  LT R6, R5, #52 ; EV_TAIL\n  PUSH R6\n  ADDI R6, R6, #1\n  CMPI R6, #16\n  JN kpe_tl_ok\n  LI R6, #0\nkpe_tl_ok:\n  ST R6, R5, #52\n  POP R6 ; old tail\n  MULI R5, R0, #64\n  MULI R6, R6, #4\n  ADD R5, R5, R6\n  ADDI R5, R5, #EVQ_BASE\n  ST R1, R5, #0 ; type\n  ST R2, R5, #1 ; a\n  ST R3, R5, #2 ; b\n  ST R4, R5, #3 ; c\nkpe_done:\n  POP R6\n  POP R5\n  POP R4\n  POP R3\n  POP R2\n  POP R1\n  POP R0\n  RET\n\n; ============================================================================\n; HARDWARE KEYBOARD & MOUSE POLLERS (Routes events to active window & taskbar)\n; ============================================================================\nk_poll_kbd:\n  PUSH R0\n  PUSH R1\n  PUSH R2\n  PUSH R3\n  PUSH R4\n  PUSH R5\nkpk_lp:\n  IN R0, #P_KC ; queued kbd events\n  CMPI R0, #0\n  JNP kpk_done\n  IN R2, #P_KD ; keycode\n  IN R3, #P_KT ; 0=down, 1=up\n  ; Note: if we just read the last event from P_KD and the task that will receive it hasn't opened its window yet,\n  ; let's check ACTIVE_WIN BEFORE dequeueing P_KD, or route to ACTIVE_WIN!\n  CMPI R3, #0\n  JNZ kpk_lp   ; ignore key-up events\n\n  ; Route key-down to ACTIVE_WIN's task!\n  LI R1, #ACTIVE_WIN\n  LT R0, R1, #0\n  CMPI R0, #-1\n  JZ kpk_lp\n  MULI R0, R0, #24\n  ADDI R0, R0, #WINTAB\n  LT R5, R0, #0 ; VIS\n  CMPI R5, #0\n  JZ kpk_lp\n  LT R0, R0, #1 ; TASK_ID\n  LI R1, #1     ; EV_KEY = 1\n  LI R3, #0\n  LI R4, #0\n  CALL k_push_event\n  JMP kpk_lp\nkpk_done:\n  POP R5\n  POP R4\n  POP R3\n  POP R2\n  POP R1\n  POP R0\n  RET\n\nk_poll_mouse:\n  PUSH R0\n  PUSH R1\n  PUSH R2\n  PUSH R3\n  PUSH R4\n  PUSH R5\n  PUSH R6\n  PUSH R7\n  PUSH R8\nkpm_lp:\n  IN R0, #P_MC ; queued mouse events\n  CMPI R0, #0\n  JNP kpm_done\n  IN R1, #P_MX ; dx\n  IN R2, #P_MY ; dy\n  IN R3, #P_MB ; buttons (bit 0 = left)\n\n  ; Load old cursor (CUR_X, CUR_Y)\n  LI R8, #CUR_X\n  LT R4, R8, #0 ; old_x\n  LT R5, R8, #1 ; old_y\n\n  ; Compute new_x = clamp(old_x + dx, 0, 722), new_y = clamp(old_y + dy, 0, 479)\n  ADD R6, R4, R1\n  CMPI R6, #0\n  JNN kpm_x0_ok\n  LI R6, #0\nkpm_x0_ok:\n  CMPI R6, #722\n  JNP kpm_x1_ok\n  LI R6, #722\nkpm_x1_ok:\n  ADD R7, R5, R2\n  CMPI R7, #0\n  JNN kpm_y0_ok\n  LI R7, #0\nkpm_y0_ok:\n  CMPI R7, #479\n  JNP kpm_y1_ok\n  LI R7, #479\nkpm_y1_ok:\n  ST R6, R8, #0 ; CUR_X = new_x\n  ST R7, R8, #1 ; CUR_Y = new_y\n\n  ; Redraw old cursor 6x6 and new cursor 6x6 if moved\n  CMP R4, R6\n  JNZ kpm_moved\n  CMP R5, R7\n  JZ kpm_chk_btn\nkpm_moved:\n  PUSH R1\n  PUSH R2\n  PUSH R3\n  MOV R0, R4\n  MOV R1, R5\n  LI R2, #6\n  LI R3, #6\n  CALL wm_redraw_rect\n  MOV R0, R6\n  MOV R1, R7\n  LI R2, #6\n  LI R3, #6\n  CALL wm_redraw_rect\n  POP R3\n  POP R2\n  POP R1\n\n  ; Check if dragging a window (K_DRAG_WIN != -1 and buttons & 1 != 0)\n  LI R8, #K_DRAG_WIN\n  LT R0, R8, #0\n  CMPI R0, #-1\n  JZ kpm_chk_btn\n  CMPI R3, #0\n  JZ kpm_stop_drag\n  ; Move dragged window R0 by (R1=dx, R2=dy)\n  MULI R4, R0, #24\n  ADDI R4, R4, #WINTAB\n  LT R5, R4, #2 ; W.x\n  ADD R1, R5, R1\n  LT R5, R4, #3 ; W.y\n  ADD R2, R5, R2\n  CALL wm_move_window\n  JMP kpm_lp\nkpm_stop_drag:\n  LI R0, #-1\n  ST R0, R8, #0\n\nkpm_chk_btn:\n  ; Check if left button transitioned from 0 to non-zero (click/down)\n  LI R8, #K_PREV_BTN\n  LT R0, R8, #0\n  ST R3, R8, #0 ; update K_PREV_BTN = R3\n  CMPI R3, #0\n  JZ kpm_release\n  CMPI R0, #0\n  JNZ kpm_drag_client ; button held down -> send mouse drag to active window if in client area\n\n  ; Button just pressed at (R6 = cur_x, R7 = cur_y)!\n  CALL wm_handle_mouse_down\n  JMP kpm_lp\n\nkpm_drag_client:\n  ; Button held while moving: send EV_MOUSE_MOVE (type=3) to ACTIVE_WIN if inside client area\n  CALL wm_send_mouse_to_active\n  JMP kpm_lp\n\nkpm_release:\n  LI R8, #K_DRAG_WIN\n  LI R0, #-1\n  ST R0, R8, #0\n  JMP kpm_lp\n\nkpm_done:\n  POP R8\n  POP R7\n  POP R6\n  POP R5\n  POP R4\n  POP R3\n  POP R2\n  POP R1\n  POP R0\n  RET\n\n\n; ============================================================================\n; WINDOW MANAGER & DAMAGE-BASED COMPOSITOR\n; ============================================================================\n\n; wm_open_window: R0=x, R1=y, R2=w, R3=h, R4=title_ptr, R5=bg_col -> R0=win_id\nwm_open_window:\n  PUSH R1\n  PUSH R2\n  PUSH R3\n  PUSH R4\n  PUSH R5\n  PUSH R6\n  PUSH R7\n  PUSH R8\n\n  ; Find free window slot (0..7) where VIS == 0, or use K_CUR_TASK\n  LI R6, #K_CUR_TASK\n  LT R6, R6, #0 ; win_id = task_id (1-to-1 mapping with task slot 0..7!)\n  MULI R8, R6, #24\n  ADDI R8, R8, #WINTAB ; R8 = &WINTAB[win_id]\n\n  ; Clamp w <= 220, h <= 160 so backing buffer W*H <= 35,200 trytes\n  CMPI R2, #220\n  JNP wow_w_ok\n  LI R2, #220\nwow_w_ok:\n  CMPI R3, #160\n  JNP wow_h_ok\n  LI R3, #160\nwow_h_ok:\n  ; Backing buffer address: 30000 + win_id * 19683\n  ; Wait: 30000 + win_id * 19683 gives 19,683 trytes per window!\n  ; Let's give each window 2 * 19683 = 39,366 trytes at (52 + win_id * 2) * 19683 (Mem[1,023,516 .. 1,338,444])!\n  ; Look how much RAM we have: 4,782,969 trytes!\n  ; Using (52 + win_id * 2) * 19683 gives EVERY window 39,366 trytes of dedicated backing buffer in kernel RAM!\n  PUSH R0\n  MULI R7, R6, #2\n  ADDI R7, R7, #52\n  LI R0, #0\n  LMI R0, #1 ; 19683\n  MUL R7, R7, R0 ; R7 = (52 + win_id*2) * 19683\n  POP R0\n\n  ; Populate WINTAB[win_id]\n  LI R6, #1\n  ST R6, R8, #0 ; VIS = 1\n  LI R6, #K_CUR_TASK\n  LT R6, R6, #0\n  ST R6, R8, #1 ; TASK_ID\n  ST R0, R8, #2 ; X\n  ST R1, R8, #3 ; Y\n  ST R2, R8, #4 ; W\n  ST R3, R8, #5 ; H\n  SW R7, R8, #6 ; BUF_ADDR\n  ST R5, R8, #9 ; BG_COL\n  LI R0, #COL_TITLE_ACT\n  ST R0, R8, #10 ; TITLE_COL\n\n  ; Copy up to 12 chars of title from R4 into WINTAB + 11..22\n  ADDI R0, R8, #11\n  LI R1, #12\nwow_title_lp:\n  CMPI R1, #0\n  JZ wow_title_done\n  LT R2, R4, #0\n  ST R2, R0, #0\n  CMPI R2, #0\n  JZ wow_title_pad_next\n  ADDI R4, R4, #1\nwow_title_pad_next:\n  ADDI R0, R0, #1\n  SUBI R1, R1, #1\n  JMP wow_title_lp\nwow_title_done:\n  LI R2, #0\n  ST R2, R8, #23\n\n  ; Record WIN_ID in TCB[K_CUR_TASK]\n  PUSH R1\n  CALL get_cur_tcb_r1\n  ST R6, R1, #43 ; TCB.WIN_ID = win_id\n  POP R1\n\n  ; Paint initial window frame + titlebar + body into backing buffer\n  MOV R0, R6\n  CALL wm_paint_decorations_full\n\n  ; Add win_id (R6) to top of ZORDER and set ACTIVE_WIN = R6\n  MOV R0, R6\n  CALL wm_focus_window\n\n  ; (wm_focus_window above already redrew the window rectangle on screen!)\n\n  MOV R0, R6 ; return win_id\n  POP R8\n  POP R7\n  POP R6\n  POP R5\n  POP R4\n  POP R3\n  POP R2\n  POP R1\n  RET\n\n; wm_paint_decorations_full: R0 = win_id (fills client body + border + titlebar)\nwm_paint_decorations_full:\n  PUSH R0\n  PUSH R1\n  PUSH R2\n  PUSH R3\n  PUSH R4\n  PUSH R5\n  PUSH R6\n  PUSH R7\n  PUSH R8\n  MULI R8, R0, #24\n  ADDI R8, R8, #WINTAB\n  LT R2, R8, #4 ; W\n  LT R3, R8, #5 ; H\n  LW R7, R8, #6 ; BUF_ADDR\n  LT R5, R8, #9 ; BG_COL\n\n  ; Fill entire W*H buffer with BG_COL\n  MOV R0, R7\n  MOV R1, R5\n  MUL R4, R2, R3\n  BFILL R0, R1, R4\n\n  ; Now draw titlebar and border\n  POP R8\n  POP R7\n  POP R6\n  POP R5\n  POP R4\n  POP R3\n  POP R2\n  POP R1\n  POP R0\n  JMP wm_paint_titlebar\n\n; wm_paint_titlebar: R0 = win_id (repaints only top 12 rows + 1px border, preserving client body)\nwm_paint_titlebar:\n  PUSH R0\n  PUSH R1\n  PUSH R2\n  PUSH R3\n  PUSH R4\n  PUSH R5\n  PUSH R6\n  PUSH R7\n  PUSH R8\n  MOV R6, R0 ; win_id\n  MULI R8, R6, #24\n  ADDI R8, R8, #WINTAB\n  LT R0, R8, #0 ; VIS\n  CMPI R0, #0\n  JZ wpt_done\n  LT R2, R8, #4 ; W\n  LT R3, R8, #5 ; H\n  LW R7, R8, #6 ; BUF_ADDR\n\n  ; Determine titlebar color: COL_TITLE_ACT if ACTIVE_WIN == win_id, else COL_TITLE_INACT\n  LI R1, #ACTIVE_WIN\n  LT R0, R1, #0\n  LI R5, #COL_TITLE_INACT\n  CMP R0, R6\n  JNZ wpt_col_ok\n  LI R5, #COL_TITLE_ACT\nwpt_col_ok:\n  ST R5, R8, #10\n\n  ; Fill top 12 rows (12 * W trytes) with titlebar color R5\n  MOV R0, R7\n  MOV R1, R5\n  MULI R4, R2, #12\n  BFILL R0, R1, R4\n\n  ; Fill top border row (1 * W trytes) with COL_WIN_BORDER\n  MOV R0, R7\n  LI R1, #COL_WIN_BORDER\n  MOV R4, R2\n  BFILL R0, R1, R4\n\n  ; Fill row 11 (separator under titlebar) with COL_WIN_BORDER\n  MULI R4, R2, #11\n  ADD R0, R7, R4\n  LI R1, #COL_WIN_BORDER\n  MOV R4, R2\n  BFILL R0, R1, R4\n\n  ; Fill bottom border row ((H-1) * W) with COL_WIN_BORDER\n  SUBI R4, R3, #1\n  MUL R4, R4, R2\n  ADD R0, R7, R4\n  LI R1, #COL_WIN_BORDER\n  MOV R4, R2\n  BFILL R0, R1, R4\n\n  ; Draw left and right 1px border columns for rows 1..H-2\n  MOV R0, R7\n  LI R1, #COL_WIN_BORDER\n  MOV R4, R3\n  SUBI R5, R2, #1\nwpt_lr_lp:\n  CMPI R4, #0\n  JZ wpt_lr_done\n  ST R1, R0, #0\n  ADD R6, R0, R5\n  ST R1, R6, #0\n  ADD R0, R0, R2\n  SUBI R4, R4, #1\n  JMP wpt_lr_lp\nwpt_lr_done:\n\n  ; Draw close button [X] at right side of titlebar: x = W - 11, y = 2, size 9x8, color COL_CLOSE_BTN\n  SUBI R4, R2, #11 ; close_x = W - 11\n  LI R5, #2        ; close_y = 2\n  LI R6, #8        ; 8 rows\nwpt_cls_lp:\n  CMPI R6, #0\n  JZ wpt_cls_done\n  MUL R0, R5, R2\n  ADD R0, R0, R4\n  ADD R0, R0, R7\n  LI R1, #COL_CLOSE_BTN\n  LI R3, #9\n  BFILL R0, R1, R3\n  ADDI R5, R5, #1\n  SUBI R6, R6, #1\n  JMP wpt_cls_lp\nwpt_cls_done:\n\n  ; Draw 'X' character on close button at (W - 10, 2)\n  SUBI R0, R2, #10\n  LI R1, #2\n  LI R3, #'X'\n  LI R4, #COL_WHITE\n  LI R5, #COL_CLOSE_BTN\n  CALL wm_buf_draw_char\n\n  ; Draw window title string (WINTAB + 11) at (5, 2)\n  LI R0, #5\n  LI R1, #2\n  ADDI R4, R8, #11 ; title_ptr\n  LT R5, R8, #10   ; titlebar bg\nwpt_str_lp:\n  LT R3, R4, #0\n  CMPI R3, #0\n  JZ wpt_done\n  PUSH R4\n  LI R4, #COL_WHITE\n  CALL wm_buf_draw_char\n  POP R4\n  ADDI R0, R0, #8\n  ADDI R4, R4, #1\n  JMP wpt_str_lp\n\nwpt_done:\n  POP R8\n  POP R7\n  POP R6\n  POP R5\n  POP R4\n  POP R3\n  POP R2\n  POP R1\n  POP R0\n  RET\n\n; wm_buf_draw_char: draws 8x8 glyph R3 into window buffer (R7=BUF_ADDR, R2=W) at (R0=x, R1=y) with fg=R4, bg=R5\nwm_buf_draw_char:\n  PUSH R0\n  PUSH R1\n  PUSH R2\n  PUSH R3\n  PUSH R4\n  PUSH R5\n  PUSH R6\n  PUSH R7\n  PUSH R8\n  ; Normalize char R3 to 0..63 index in font_8x8\n  CMPI R3, #97\n  JN wbdc_up_ok\n  CMPI R3, #122\n  JP wbdc_up_ok\n  SUBI R3, R3, #32\nwbdc_up_ok:\n  SUBI R3, R3, #32\n  CMPI R3, #0\n  JN wbdc_zero\n  CMPI R3, #63\n  JNP wbdc_idx_ok\nwbdc_zero:\n  LI R3, #0\nwbdc_idx_ok:\n  MULI R3, R3, #8\n  ADDI R3, R3, #font_8x8 ; R3 = &font_8x8[glyph * 8]\n\n  ; Compute destination pixel pointer R6 = R7 (BUF_ADDR) + R1 (y) * R2 (W) + R0 (x)\n  MUL R6, R1, R2\n  ADD R6, R6, R0\n  ADD R6, R6, R7\n\n  LI R8, #8 ; 8 rows\nwbdc_row_lp:\n  CMPI R8, #0\n  JZ wbdc_done\n  LT R0, R3, #0 ; glyph row byte (0..127)\n  ; Unrolled 8-column binary threshold check (128, 64, 32, 16, 8, 4, 2, 1)\n  CMPI R0, #128\n  JN wbdc_c0_bg\n  SUBI R0, R0, #128\n  ST R4, R6, #0\n  JMP wbdc_c1\nwbdc_c0_bg:\n  ST R5, R6, #0\nwbdc_c1:\n  CMPI R0, #64\n  JN wbdc_c1_bg\n  SUBI R0, R0, #64\n  ST R4, R6, #1\n  JMP wbdc_c2\nwbdc_c1_bg:\n  ST R5, R6, #1\nwbdc_c2:\n  CMPI R0, #32\n  JN wbdc_c2_bg\n  SUBI R0, R0, #32\n  ST R4, R6, #2\n  JMP wbdc_c3\nwbdc_c2_bg:\n  ST R5, R6, #2\nwbdc_c3:\n  CMPI R0, #16\n  JN wbdc_c3_bg\n  SUBI R0, R0, #16\n  ST R4, R6, #3\n  JMP wbdc_c4\nwbdc_c3_bg:\n  ST R5, R6, #3\nwbdc_c4:\n  CMPI R0, #8\n  JN wbdc_c4_bg\n  SUBI R0, R0, #8\n  ST R4, R6, #4\n  JMP wbdc_c5\nwbdc_c4_bg:\n  ST R5, R6, #4\nwbdc_c5:\n  CMPI R0, #4\n  JN wbdc_c5_bg\n  SUBI R0, R0, #4\n  ST R4, R6, #5\n  JMP wbdc_c6\nwbdc_c5_bg:\n  ST R5, R6, #5\nwbdc_c6:\n  CMPI R0, #2\n  JN wbdc_c6_bg\n  SUBI R0, R0, #2\n  ST R4, R6, #6\n  JMP wbdc_c7\nwbdc_c6_bg:\n  ST R5, R6, #6\nwbdc_c7:\n  CMPI R0, #1\n  JN wbdc_c7_bg\n  ST R4, R6, #7\n  JMP wbdc_nx_row\nwbdc_c7_bg:\n  ST R5, R6, #7\nwbdc_nx_row:\n  ADDI R3, R3, #1\n  ADD R6, R6, R2 ; advance by window stride W\n  SUBI R8, R8, #1\n  JMP wbdc_row_lp\nwbdc_done:\n  POP R8\n  POP R7\n  POP R6\n  POP R5\n  POP R4\n  POP R3\n  POP R2\n  POP R1\n  POP R0\n  RET\n\n\n; wm_focus_window: R0 = win_id (brings R0 to top of ZORDER, updates ACTIVE_WIN, repaints old & new titlebars)\nwm_focus_window:\n  PUSH R0\n  PUSH R1\n  PUSH R2\n  PUSH R3\n  PUSH R4\n  PUSH R5\n  PUSH R6\n  MOV R4, R0 ; target win_id\n  CMPI R4, #0\n  JN wfw_done\n  CMPI R4, #8\n  JNN wfw_done\n  MULI R5, R4, #24\n  ADDI R5, R5, #WINTAB\n  LT R0, R5, #0 ; VIS\n  CMPI R0, #0\n  JZ wfw_done\n\n  ; Save previous ACTIVE_WIN in R6\n  LI R1, #ACTIVE_WIN\n  LT R6, R1, #0\n  ST R4, R1, #0 ; ACTIVE_WIN = R4\n\n  ; Remove R4 from ZORDER if already present\n  LI R1, #ZCOUNT\n  LT R2, R1, #0 ; count\n  LI R3, #0     ; i = 0\nwfw_find_lp:\n  CMP R3, R2\n  JNN wfw_append\n  LI R1, #ZORDER\n  ADD R1, R1, R3\n  LT R0, R1, #0\n  CMP R0, R4\n  JZ wfw_shift\n  ADDI R3, R3, #1\n  JMP wfw_find_lp\n\nwfw_shift:\n  ADDI R0, R3, #1\n  CMP R0, R2\n  JNN wfw_put_top\n  LI R1, #ZORDER\n  ADD R1, R1, R3\n  LT R0, R1, #1\n  ST R0, R1, #0\n  ADDI R3, R3, #1\n  JMP wfw_shift\n\nwfw_put_top:\n  SUBI R3, R2, #1\n  LI R1, #ZORDER\n  ADD R1, R1, R3\n  ST R4, R1, #0\n  JMP wfw_repaint_titles\n\nwfw_append:\n  LI R1, #ZORDER\n  ADD R1, R1, R2\n  ST R4, R1, #0\n  ADDI R2, R2, #1\n  LI R1, #ZCOUNT\n  ST R2, R1, #0\n\nwfw_repaint_titles:\n  CMPI R6, #-1\n  JZ wfw_rep_new\n  CMP R6, R4\n  JZ wfw_rep_new\n  MOV R0, R6\n  CALL wm_paint_titlebar\n  MULI R5, R6, #24\n  ADDI R5, R5, #WINTAB\n  LT R0, R5, #2 ; X\n  LT R1, R5, #3 ; Y\n  LT R2, R5, #4 ; W\n  LI R3, #12    ; titlebar height\n  CALL wm_redraw_rect\n\nwfw_rep_new:\n  MOV R0, R4\n  CALL wm_paint_titlebar\n  MULI R5, R4, #24\n  ADDI R5, R5, #WINTAB\n  LT R0, R5, #2 ; X\n  LT R1, R5, #3 ; Y\n  LT R2, R5, #4 ; W\n  LT R3, R5, #5 ; H\n  CALL wm_redraw_rect\n\nwfw_done:\n  POP R6\n  POP R5\n  POP R4\n  POP R3\n  POP R2\n  POP R1\n  POP R0\n  RET\n\n; wm_close_window: R0 = win_id\nwm_close_window:\n  PUSH R0\n  PUSH R1\n  PUSH R2\n  PUSH R3\n  PUSH R4\n  PUSH R5\n  MOV R4, R0\n  CMPI R4, #0\n  JN wcw_done\n  CMPI R4, #8\n  JNN wcw_done\n  MULI R5, R4, #24\n  ADDI R5, R5, #WINTAB\n  LT R0, R5, #0 ; VIS\n  CMPI R0, #0\n  JZ wcw_done\n  LI R0, #0\n  ST R0, R5, #0 ; VIS = 0\n\n  ; Remove R4 from ZORDER\n  LI R1, #ZCOUNT\n  LT R2, R1, #0\n  LI R3, #0\nwcw_find:\n  CMP R3, R2\n  JNN wcw_z_done\n  LI R1, #ZORDER\n  ADD R1, R1, R3\n  LT R0, R1, #0\n  CMP R0, R4\n  JZ wcw_shift\n  ADDI R3, R3, #1\n  JMP wcw_find\nwcw_shift:\n  ADDI R0, R3, #1\n  CMP R0, R2\n  JNN wcw_dec_z\n  LI R1, #ZORDER\n  ADD R1, R1, R3\n  LT R0, R1, #1\n  ST R0, R1, #0\n  ADDI R3, R3, #1\n  JMP wcw_shift\nwcw_dec_z:\n  SUBI R2, R2, #1\n  LI R1, #ZCOUNT\n  ST R2, R1, #0\nwcw_z_done:\n  LI R1, #ZCOUNT\n  LT R2, R1, #0\n  CMPI R2, #0\n  JZ wcw_no_act\n  SUBI R2, R2, #1\n  LI R1, #ZORDER\n  ADD R1, R1, R2\n  LT R0, R1, #0\n  LI R1, #ACTIVE_WIN\n  ST R0, R1, #0\n  CALL wm_paint_titlebar\n  MULI R1, R0, #24\n  ADDI R1, R1, #WINTAB\n  LT R0, R1, #2\n  LT R2, R1, #4\n  LT R1, R1, #3\n  LI R3, #12\n  CALL wm_redraw_rect\n  JMP wcw_redraw\nwcw_no_act:\n  LI R0, #-1\n  LI R1, #ACTIVE_WIN\n  ST R0, R1, #0\nwcw_redraw:\n  LT R0, R5, #2\n  LT R1, R5, #3\n  LT R2, R5, #4\n  LT R3, R5, #5\n  CALL wm_redraw_rect\nwcw_done:\n  POP R5\n  POP R4\n  POP R3\n  POP R2\n  POP R1\n  POP R0\n  RET\n\n; wm_move_window: R0 = win_id, R1 = new_x, R2 = new_y\nwm_move_window:\n  PUSH R0\n  PUSH R1\n  PUSH R2\n  PUSH R3\n  PUSH R4\n  PUSH R5\n  PUSH R6\n  PUSH R7\n  PUSH R8\n  MOV R4, R0 ; win_id\n  MOV R7, R2 ; new_y\n  CMPI R4, #0\n  JN wmw_done\n  CMPI R4, #8\n  JNN wmw_done\n  MULI R8, R4, #24\n  ADDI R8, R8, #WINTAB\n  LT R0, R8, #0 ; VIS\n  CMPI R0, #0\n  JZ wmw_done\n\n  LT R5, R8, #2 ; old_x\n  LT R6, R8, #3 ; old_y\n  LT R2, R8, #4 ; W\n  LT R3, R8, #5 ; H\n\n  ; Clamp new_x in [0, 729 - W] and new_y in [0, 460 - H]\n  CMPI R1, #0\n  JNN wmw_nx0_ok\n  LI R1, #0\nwmw_nx0_ok:\n  LI R0, #729\n  SUB R0, R0, R2\n  CMP R1, R0\n  JNP wmw_nx1_ok\n  MOV R1, R0\nwmw_nx1_ok:\n  CMPI R7, #0\n  JNN wmw_ny0_ok\n  LI R7, #0\nwmw_ny0_ok:\n  LI R0, #460\n  SUB R0, R0, R3\n  CMP R7, R0\n  JNP wmw_ny1_ok\n  MOV R7, R0\nwmw_ny1_ok:\n  ST R1, R8, #2 ; W.x = new_x\n  ST R7, R8, #3 ; W.y = new_y\n\n  ; Redraw old rectangle (old_x, old_y, W, H) so vacated region is repainted!\n  MOV R0, R5\n  MOV R1, R6\n  CALL wm_redraw_rect\n\n  ; Redraw new rectangle (new_x, new_y, W, H)\n  LT R0, R8, #2\n  LT R1, R8, #3\n  CALL wm_redraw_rect\n\nwmw_done:\n  POP R8\n  POP R7\n  POP R6\n  POP R5\n  POP R4\n  POP R3\n  POP R2\n  POP R1\n  POP R0\n  RET\n\n; ============================================================================\n; MOUSE HIT-TESTING (Taskbar Launcher, Window Focus, Titlebar Drag, Close [X], Client Click)\n; ============================================================================\n; Called when mouse button pressed at (R6 = cur_x, R7 = cur_y)\nwm_handle_mouse_down:\n  PUSH R0\n  PUSH R1\n  PUSH R2\n  PUSH R3\n  PUSH R4\n  PUSH R5\n  PUSH R6\n  PUSH R7\n  PUSH R8\n\n  ; 1. Check if click is in the Taskbar (y >= 462)\n  CMPI R7, #462\n  JN whmd_windows\n\n  ; Taskbar launcher buttons: 6 buttons at x = 4 + app_id * 68, width = 64 (for app_id 0..5)\n  SUBI R0, R6, #4\n  CMPI R0, #0\n  JN whmd_done\n  LI R1, #68\n  DIV R2, R0, R1 ; app_id = (x - 4) / 68\n  CMPI R2, #6\n  JNN whmd_done\n  ; Clear fault banner if active and launch app R2!\n  LI R1, #K_FAULT_BANNER_ACTIVE\n  LI R0, #0\n  ST R0, R1, #0\n  MOV R0, R2\n  CALL k_spawn_app\n  CMPI R0, #0\n  JN whmd_done\n  LI R1, #K_CUR_TASK\n  ST R0, R1, #0\n  JMP whmd_done\n\nwhmd_windows:\n  ; 2. Search ZORDER from top-most (ZCOUNT - 1) down to 0\n  LI R1, #ZCOUNT\n  LT R2, R1, #0\n  SUBI R2, R2, #1 ; z = ZCOUNT - 1\nwhmd_zlp:\n  CMPI R2, #0\n  JN whmd_done\n  LI R1, #ZORDER\n  ADD R1, R1, R2\n  LT R3, R1, #0 ; win_id\n  MULI R8, R3, #24\n  ADDI R8, R8, #WINTAB\n  LT R0, R8, #0 ; VIS\n  CMPI R0, #0\n  JZ whmd_znext\n  LT R4, R8, #2 ; W.x\n  CMP R6, R4\n  JN whmd_znext\n  LT R5, R8, #4 ; W.w\n  ADD R5, R4, R5 ; W.x2\n  CMP R6, R5\n  JNN whmd_znext\n  LT R4, R8, #3 ; W.y\n  CMP R7, R4\n  JN whmd_znext\n  LT R5, R8, #5 ; W.h\n  ADD R5, R4, R5 ; W.y2\n  CMP R7, R5\n  JNN whmd_znext\n\n  ; Hit Window R3! First focus it (bring to top of ZORDER)\n  MOV R0, R3\n  CALL wm_focus_window\n\n  ; Compute window-relative coordinates: rel_x = R6 - W.x, rel_y = R7 - W.y\n  LT R4, R8, #2 ; W.x\n  SUB R4, R6, R4 ; rel_x\n  LT R5, R8, #3 ; W.y\n  SUB R5, R7, R5 ; rel_y\n\n  ; Check if click is in the 12px titlebar (rel_y < 12)\n  CMPI R5, #12\n  JNN whmd_client_click\n\n  ; Inside titlebar! Check if click is on the Close button [X] (rel_x >= W.w - 13)\n  LT R0, R8, #4 ; W.w\n  SUBI R0, R0, #13\n  CMP R4, R0\n  JN whmd_start_drag\n\n  ; Clicked Close button [X]! Kill the window's owner task cleanly!\n  LT R0, R8, #1 ; TASK_ID\n  CALL k_kill_task_clean\n  JMP whmd_done\n\nwhmd_start_drag:\n  ; Start dragging window R3!\n  LI R1, #K_DRAG_WIN\n  ST R3, R1, #0\n  JMP whmd_done\n\nwhmd_client_click:\n  ; Click inside client area! Send EV_MOUSE_DOWN (type=2, a=rel_x - 1, b=rel_y - 12, c=1) to window's task!\n  LT R0, R8, #1 ; TASK_ID\n  LI R1, #2     ; EV_MOUSE_DOWN\n  SUBI R2, R4, #1  ; client_x = rel_x - 1\n  SUBI R3, R5, #12 ; client_y = rel_y - 12\n  LI R4, #1     ; button = 1\n  CALL k_push_event\n  JMP whmd_done\n\nwhmd_znext:\n  SUBI R2, R2, #1\n  JMP whmd_zlp\n\nwhmd_done:\n  POP R8\n  POP R7\n  POP R6\n  POP R5\n  POP R4\n  POP R3\n  POP R2\n  POP R1\n  POP R0\n  RET\n\n; wm_send_mouse_to_active: sends EV_MOUSE_MOVE (type=3) to ACTIVE_WIN when dragging inside client area\nwm_send_mouse_to_active:\n  PUSH R0\n  PUSH R1\n  PUSH R2\n  PUSH R3\n  PUSH R4\n  PUSH R8\n  LI R1, #ACTIVE_WIN\n  LT R0, R1, #0\n  CMPI R0, #-1\n  JZ wsmta_done\n  MULI R8, R0, #24\n  ADDI R8, R8, #WINTAB\n  LT R0, R8, #0 ; VIS\n  CMPI R0, #0\n  JZ wsmta_done\n  LT R2, R8, #2 ; W.x\n  SUB R2, R6, R2\n  SUBI R2, R2, #1 ; client_x\n  CMPI R2, #0\n  JN wsmta_done\n  LT R3, R8, #3 ; W.y\n  SUB R3, R7, R3\n  SUBI R3, R3, #12 ; client_y\n  CMPI R3, #0\n  JN wsmta_done\n  LT R0, R8, #1 ; TASK_ID\n  LI R1, #3     ; EV_MOUSE_MOVE = 3\n  LI R4, #1\n  CALL k_push_event\nwsmta_done:\n  POP R8\n  POP R4\n  POP R3\n  POP R2\n  POP R1\n  POP R0\n  RET\n\n\n; ============================================================================\n; USER WINDOW DRAWING OPERATIONS (Operate on Calling Task's Window Backing Buffer)\n; Client coordinates (0, 0) map to window buffer offset (x + 1, y + 12)\n; ============================================================================\n\n; Helper: get current task's WINTAB entry in R8 (or 0 if none/invisible)\nwm_get_cur_win_r8:\n  PUSH R0\n  PUSH R1\n  CALL get_cur_tcb_r1\n  LT R0, R1, #43 ; WIN_ID\n  CMPI R0, #0\n  JN wgcw_none\n  CMPI R0, #8\n  JNN wgcw_none\n  MULI R8, R0, #24\n  ADDI R8, R8, #WINTAB\n  LT R0, R8, #0 ; VIS\n  CMPI R0, #0\n  JZ wgcw_none\n  POP R1\n  POP R0\n  RET\nwgcw_none:\n  LI R8, #0\n  POP R1\n  POP R0\n  RET\n\n; wm_user_fill_rect: R0=rel_x, R1=rel_y, R2=w, R3=h, R4=color\nwm_user_fill_rect:\n  PUSH R0\n  PUSH R1\n  PUSH R2\n  PUSH R3\n  PUSH R4\n  PUSH R5\n  PUSH R6\n  PUSH R7\n  PUSH R8\n  CALL wm_get_cur_win_r8\n  CMPI R8, #0\n  JZ wufr_done\n  ADDI R0, R0, #1  ; win_x = rel_x + 1\n  ADDI R1, R1, #12 ; win_y = rel_y + 12\n  LT R5, R8, #4    ; W.w\n  LT R6, R8, #5    ; W.h\n  SUBI R5, R5, #1  ; max x = W.w - 1\n  SUBI R6, R6, #1  ; max y = W.h - 1\n  CMPI R0, #1\n  JNN wufr_x0_ok\n  LI R0, #1\nwufr_x0_ok:\n  CMPI R1, #12\n  JNN wufr_y0_ok\n  LI R1, #12\nwufr_y0_ok:\n  ADD R7, R0, R2\n  CMP R7, R5\n  JNP wufr_x1_ok\n  SUB R2, R5, R0\nwufr_x1_ok:\n  ADD R7, R1, R3\n  CMP R7, R6\n  JNP wufr_y1_ok\n  SUB R3, R6, R1\nwufr_y1_ok:\n  CMPI R2, #0\n  JNP wufr_done\n  CMPI R3, #0\n  JNP wufr_done\n\n  LT R5, R8, #4 ; W.w\n  LW R7, R8, #6 ; BUF_ADDR\n  MUL R6, R1, R5\n  ADD R6, R6, R0\n  ADD R6, R6, R7 ; row start addr\nwufr_row_lp:\n  CMPI R3, #0\n  JZ wufr_done\n  MOV R0, R6\n  MOV R1, R4 ; color\n  MOV R7, R2 ; width\n  BFILL R0, R1, R7\n  ADD R6, R6, R5 ; next row\n  SUBI R3, R3, #1\n  JMP wufr_row_lp\nwufr_done:\n  POP R8\n  POP R7\n  POP R6\n  POP R5\n  POP R4\n  POP R3\n  POP R2\n  POP R1\n  POP R0\n  RET\n\n; wm_user_draw_text: R0=rel_x, R1=rel_y, R2=str_ptr, R3=fg, R4=bg\nwm_user_draw_text:\n  PUSH R0\n  PUSH R1\n  PUSH R2\n  PUSH R3\n  PUSH R4\n  PUSH R5\n  PUSH R6\n  PUSH R7\n  PUSH R8\n  CALL wm_get_cur_win_r8\n  CMPI R8, #0\n  JZ wudt_done\n  ADDI R0, R0, #1  ; x = rel_x + 1\n  ADDI R1, R1, #12 ; y = rel_y + 12\n  MOV R6, R2       ; str_ptr\n  MOV R5, R4       ; bg\n  MOV R4, R3       ; fg\n  LT R2, R8, #4    ; W.w\n  LW R7, R8, #6    ; BUF_ADDR\nwudt_lp:\n  LT R3, R6, #0\n  CMPI R3, #0\n  JZ wudt_done\n  ; Check x + 8 < W.w\n  ADDI R8, R0, #8\n  CMP R8, R2\n  JNN wudt_done\n  CALL wm_buf_draw_char\n  ADDI R0, R0, #8\n  ADDI R6, R6, #1\n  JMP wudt_lp\nwudt_done:\n  POP R8\n  POP R7\n  POP R6\n  POP R5\n  POP R4\n  POP R3\n  POP R2\n  POP R1\n  POP R0\n  RET\n\n; wm_user_put_pixel: R0=rel_x, R1=rel_y, R2=color\nwm_user_put_pixel:\n  PUSH R0\n  PUSH R1\n  PUSH R2\n  PUSH R3\n  PUSH R4\n  PUSH R8\n  CALL wm_get_cur_win_r8\n  CMPI R8, #0\n  JZ wupp_done\n  ADDI R0, R0, #1\n  ADDI R1, R1, #12\n  LT R3, R8, #4 ; W.w\n  LT R4, R8, #5 ; W.h\n  SUBI R3, R3, #1\n  SUBI R4, R4, #1\n  CMPI R0, #1\n  JN wupp_done\n  CMP R0, R3\n  JNN wupp_done\n  CMPI R1, #12\n  JN wupp_done\n  CMP R1, R4\n  JNN wupp_done\n  LT R3, R8, #4 ; W.w\n  MUL R1, R1, R3\n  ADD R1, R1, R0\n  LW R4, R8, #6 ; BUF_ADDR\n  ADD R1, R1, R4\n  ST R2, R1, #0\nwupp_done:\n  POP R8\n  POP R4\n  POP R3\n  POP R2\n  POP R1\n  POP R0\n  RET\n\n; wm_user_get_pixel: R0=rel_x, R1=rel_y -> R0=color\nwm_user_get_pixel:\n  PUSH R1\n  PUSH R2\n  PUSH R3\n  PUSH R4\n  PUSH R8\n  CALL wm_get_cur_win_r8\n  CMPI R8, #0\n  JZ wugp_zero\n  ADDI R0, R0, #1\n  ADDI R1, R1, #12\n  LT R3, R8, #4 ; W.w\n  MUL R1, R1, R3\n  ADD R1, R1, R0\n  LW R4, R8, #6 ; BUF_ADDR\n  ADD R1, R1, R4\n  LT R0, R1, #0\n  JMP wugp_done\nwugp_zero:\n  LI R0, #0\nwugp_done:\n  POP R8\n  POP R4\n  POP R3\n  POP R2\n  POP R1\n  RET\n\n; wm_user_flush: R0=rel_x, R1=rel_y, R2=w, R3=h\nwm_user_flush:\n  PUSH R0\n  PUSH R1\n  PUSH R2\n  PUSH R3\n  PUSH R4\n  PUSH R5\n  PUSH R8\n  CALL wm_get_cur_win_r8\n  CMPI R8, #0\n  JZ wuf_done\n  LT R4, R8, #2 ; W.x\n  LT R5, R8, #3 ; W.y\n  CMPI R2, #0\n  JZ wuf_full_client\n  ADD R0, R0, R4\n  ADDI R0, R0, #1\n  ADD R1, R1, R5\n  ADDI R1, R1, #12\n  CALL wm_redraw_rect\n  JMP wuf_done\nwuf_full_client:\n  ADDI R0, R4, #1\n  ADDI R1, R5, #12\n  LT R2, R8, #4\n  SUBI R2, R2, #2\n  LT R3, R8, #5\n  SUBI R3, R3, #13\n  CALL wm_redraw_rect\nwuf_done:\n  POP R8\n  POP R5\n  POP R4\n  POP R3\n  POP R2\n  POP R1\n  POP R0\n  RET\n\n; wm_user_blit_buf: R0=rel_x, R1=rel_y, R2=w, R3=h, R4=user_buf_ptr, R5=dir (0=user_to_win, 1=win_to_user)\nwm_user_blit_buf:\n  PUSH R0\n  PUSH R1\n  PUSH R2\n  PUSH R3\n  PUSH R4\n  PUSH R5\n  PUSH R6\n  PUSH R7\n  PUSH R8\n  CALL wm_get_cur_win_r8\n  CMPI R8, #0\n  JZ wubb_done\n  ADDI R0, R0, #1\n  ADDI R1, R1, #12\n  LT R6, R8, #4 ; W.w\n  LW R7, R8, #6 ; BUF_ADDR\n  MUL R1, R1, R6\n  ADD R1, R1, R0\n  ADD R7, R7, R1 ; win row start\nwubb_row_lp:\n  CMPI R3, #0\n  JNP wubb_done\n  CMPI R5, #0\n  JNZ wubb_from_win\n  ; dir == 0: copy R2 trytes from R4 (user) to R7 (win)\n  MOV R0, R7\n  MOV R1, R4\n  MOV R8, R2\n  BCOPY R0, R1, R8\n  JMP wubb_nx\nwubb_from_win:\n  ; dir == 1: copy R2 trytes from R7 (win) to R4 (user)\n  MOV R0, R4\n  MOV R1, R7\n  MOV R8, R2\n  BCOPY R0, R1, R8\nwubb_nx:\n  ADD R7, R7, R6\n  ADD R4, R4, R2\n  SUBI R3, R3, #1\n  JMP wubb_row_lp\nwubb_done:\n  POP R8\n  POP R7\n  POP R6\n  POP R5\n  POP R4\n  POP R3\n  POP R2\n  POP R1\n  POP R0\n  RET\n\n; wm_user_draw_num: R0=rel_x, R1=rel_y, R2=num, R3=base (10 or 3), R4=fg, R5=bg\n; Formats 27-trit signed integer R2 into K_NUM_FMT_BUF in decimal (R3=10) or balanced ternary (R3=3) and draws it!\nwm_user_draw_num:\n  PUSH R0\n  PUSH R1\n  PUSH R2\n  PUSH R3\n  PUSH R4\n  PUSH R5\n  PUSH R6\n  PUSH R7\n  PUSH R8\n  MOV R6, R0 ; save rel_x\n  MOV R7, R1 ; save rel_y\n  MOV R0, R2 ; number\n  MOV R1, R3 ; base\n  CALL k_format_num\n  ; Now K_NUM_FMT_BUF holds null-terminated string!\n  MOV R0, R6\n  MOV R1, R7\n  LI R2, #K_NUM_FMT_BUF\n  MOV R3, R4 ; fg\n  MOV R4, R5 ; bg\n  CALL wm_user_draw_text\n  POP R8\n  POP R7\n  POP R6\n  POP R5\n  POP R4\n  POP R3\n  POP R2\n  POP R1\n  POP R0\n  RET\n\n; k_format_num: R0 = 27-trit number, R1 = base (10 or 3) -> writes null-terminated string at K_NUM_FMT_BUF\nk_format_num:\n  PUSH R0\n  PUSH R1\n  PUSH R2\n  PUSH R3\n  PUSH R4\n  PUSH R5\n  PUSH R6\n  LI R2, #K_NUM_FMT_BUF\n  CMPI R1, #3\n  JZ kfn_tern\n\n  ; Decimal formatting\n  CMPI R0, #0\n  JP kfn_dec_pos\n  JN kfn_dec_neg\n  LI R3, #'0'\n  ST R3, R2, #0\n  LI R3, #0\n  ST R3, R2, #1\n  JMP kfn_done\nkfn_dec_neg:\n  LI R3, #'-'\n  ST R3, R2, #0\n  ADDI R2, R2, #1\n  NEG R0, R0\nkfn_dec_pos:\n  LI R3, #K_NUM_FMT_BUF + 20 ; reverse digit stack\n  LI R4, #0 ; count\n  LI R5, #10\nkfn_dec_lp:\n  CMPI R0, #0\n  JZ kfn_dec_rev\n  MOD R6, R0, R5\n  DIV R0, R0, R5\n  ADDI R6, R6, #48\n  ST R6, R3, #0\n  ADDI R3, R3, #1\n  ADDI R4, R4, #1\n  JMP kfn_dec_lp\nkfn_dec_rev:\n  CMPI R4, #0\n  JZ kfn_dec_term\n  SUBI R3, R3, #1\n  SUBI R4, R4, #1\n  LT R0, R3, #0\n  ST R0, R2, #0\n  ADDI R2, R2, #1\n  JMP kfn_dec_rev\nkfn_dec_term:\n  LI R0, #0\n  ST R0, R2, #0\n  JMP kfn_done\n\nkfn_tern:\n  ; Balanced-ternary formatting ('T', '0', '1')\n  CMPI R0, #0\n  JNZ kfn_tern_nz\n  LI R3, #'0'\n  ST R3, R2, #0\n  LI R3, #0\n  ST R3, R2, #1\n  JMP kfn_done\nkfn_tern_nz:\n  LI R3, #K_NUM_FMT_BUF + 20\n  LI R4, #0\n  LI R5, #3\nkfn_tern_lp:\n  CMPI R0, #0\n  JZ kfn_dec_rev\n  MOD R6, R0, R5\n  DIV R0, R0, R5\n  CMPI R6, #2\n  JNZ kfn_t_chk_n2\n  LI R6, #-1\n  ADDI R0, R0, #1\n  JMP kfn_t_ch\nkfn_t_chk_n2:\n  CMPI R6, #-2\n  JNZ kfn_t_ch\n  LI R6, #1\n  SUBI R0, R0, #1\nkfn_t_ch:\n  CMPI R6, #0\n  JZ kfn_t_0\n  JP kfn_t_1\n  LI R6, #'T'\n  JMP kfn_t_st\nkfn_t_0:\n  LI R6, #'0'\n  JMP kfn_t_st\nkfn_t_1:\n  LI R6, #'1'\nkfn_t_st:\n  ST R6, R3, #0\n  ADDI R3, R3, #1\n  ADDI R4, R4, #1\n  JMP kfn_tern_lp\n\nkfn_done:\n  POP R6\n  POP R5\n  POP R4\n  POP R3\n  POP R2\n  POP R1\n  POP R0\n  RET\n\n\n; ============================================================================\n; DAMAGE-BASED SCANLINE COMPOSITOR (wm_redraw_rect)\n; Redraws only rectangle (R0=rx, R1=ry, R2=rw, R3=rh) using SCAN_BUF + BFILL/BCOPY\n; ============================================================================\nwm_redraw_rect:\n  PUSH R0\n  PUSH R1\n  PUSH R2\n  PUSH R3\n  PUSH R4\n  PUSH R5\n  PUSH R6\n  PUSH R7\n  PUSH R8\n\n  ; Clamp rx, ry, rw, rh to [0..729) x [0..486)\n  CMPI R0, #0\n  JNN wrr_x0_ok\n  ADD R2, R2, R0\n  LI R0, #0\nwrr_x0_ok:\n  CMPI R1, #0\n  JNN wrr_y0_ok\n  ADD R3, R3, R1\n  LI R1, #0\nwrr_y0_ok:\n  ADD R4, R0, R2 ; rx2 = rx + rw\n  CMPI R4, #729\n  JNP wrr_x2_ok\n  LI R4, #729\n  SUB R2, R4, R0\nwrr_x2_ok:\n  ADD R5, R1, R3 ; ry2 = ry + rh\n  CMPI R5, #486\n  JNP wrr_y2_ok\n  LI R5, #486\n  SUB R3, R5, R1\nwrr_y2_ok:\n  CMPI R2, #0\n  JNP wrr_done\n  CMPI R3, #0\n  JNP wrr_done\n\n  LI R8, #TMP_RX\n  ST R0, R8, #0 ; TMP_RX\n  ST R1, R8, #1 ; TMP_RY\n  ST R2, R8, #2 ; TMP_RW\n  ST R3, R8, #3 ; TMP_RH\n  ST R4, R8, #4 ; TMP_RX2\n  ST R5, R8, #5 ; TMP_RY2\n  ST R1, R8, #6 ; TMP_Y = ry\n\n  ; Record trytes written = rw * rh in LAST_REDRAW_TRYTES, TOTAL_REDRAW_TRYTES, REDRAW_COUNT\n  MUL R6, R2, R3\n  LI R7, #LAST_REDRAW_TRYTES\n  SW R6, R7, #0\n  LW R0, R7, #3\n  ADD R0, R0, R6\n  SW R0, R7, #3\n  LW R0, R7, #6\n  ADDI R0, R0, #1\n  SW R0, R7, #6\n\nwrr_yloop:\n  LI R8, #TMP_RX\n  LT R6, R8, #6 ; y = TMP_Y\n  LT R5, R8, #5 ; ry2 = TMP_RY2\n  CMP R6, R5\n  JNN wrr_done\n\n  ; 1. Fill SCAN_BUF + rx with desktop/taskbar background for rw trytes\n  LT R0, R8, #0 ; rx\n  ADDI R0, R0, #SCAN_BUF\n  LT R2, R8, #2 ; rw\n  LI R1, #COL_DESKTOP_BG\n  CMPI R6, #462\n  JN wrr_bg_fill\n  LI R1, #COL_TASKBAR_BG\nwrr_bg_fill:\n  BFILL R0, R1, R2\n\n  ; 2. Loo
