R2, R5, #5\n  LI R0, #8\n  LI R1, #20\n  LI R3, #10\n  LI R4, #COL_WHITE\n  LI R5, #-120\n  SYSCALL #26\n\n  ; Draw Waste pile at (34, 15, 22, 18)\n  ADDI R5, R8, #5000\n  LT R1, R5, #6 ; waste_len\n  CMPI R1, #0\n  JNPX sr_founds\n  SUBI R1, R1, #1\n  ADDI R0, R5, #49\n  ADD R0, R0, R1\n  LT R2, R0, #0 ; top waste card\n  LI R0, #34\n  LI R1, #15\n  CALLX sol_draw_card\n\nsr_founds:\n  ; Draw 4 Foundations at x = 90 + f*30, y = 15\n  LI R6, #0 ; f = 0..3\nsr_f_lp:\n  CMPI R6, #4\n  JNNX sr_tabs\n  MULI R0, R6, #30\n  ADDI R0, R0, #90\n  LI R1, #15\n  ADDI R5, R8, #5007\n  ADD R5, R5, R6\n  LT R2, R5, #0 ; found_len[f]\n  CMPI R2, #0\n  JPX sr_f_card\n  ; Empty foundation slot\n  PUSH R0\n  LI R2, #22\n  LI R3, #18\n  LI R4, #-250\n  SYSCALL #20\n  POP R0\n  JMPX sr_f_nx\nsr_f_card:\n  SUBI R2, R2, #1\n  MULI R3, R6, #13\n  ADD R2, R3, R2 ; card = f*13 + (found_len[f] - 1)\n  CALLX sol_draw_card\nsr_f_nx:\n  ADDI R6, R6, #1\n  JMPX sr_f_lp\n\nsr_tabs:\n  ; Draw 7 Tableau piles c = 0..6 at x = 6 + c*30, y = 40 + r*5\n  LI R6, #0 ; c = 0..6\nsr_tc_lp:\n  CMPI R6, #7\n  JNNX sr_chk_win\n  ADDI R5, R8, #5011\n  ADD R5, R5, R6\n  LT R7, R5, #0 ; tab_len[c]\n  LI R4, #0 ; r = 0\nsr_tr_lp:\n  CMP R4, R7\n  JNNX sr_tc_nx\n  MULI R0, R6, #30\n  ADDI R0, R0, #6 ; x\n  MULI R1, R4, #5\n  ADDI R1, R1, #40 ; y\n  ; Check if r < tab_down[c]\n  ADDI R5, R8, #5018\n  ADD R5, R5, R6\n  LT R3, R5, #0 ; tab_down[c]\n  CMP R4, R3\n  JNNX sr_tr_up\n  ; Face-down card back\n  PUSH R4\n  LI R2, #24\n  LI R3, #10\n  LI R4, #-140\n  SYSCALL #20\n  POP R4\n  JMPX sr_tr_nx\nsr_tr_up:\n  MULI R5, R6, #19\n  ADD R5, R5, R4\n  ADDI R5, R5, #5073\n  ADD R5, R5, R8\n  LT R2, R5, #0 ; card ID\n  CALLX sol_draw_card\nsr_tr_nx:\n  ADDI R4, R4, #1\n  JMPX sr_tr_lp\nsr_tc_nx:\n  ADDI R6, R6, #1\n  JMPX sr_tc_lp\n\nsr_chk_win:\n  ADDI R5, R8, #5002\n  LT R0, R5, #0 ; won\n  CMPI R0, #0\n  JZX sr_flush\n  LI R0, #20\n  LI R1, #60\n  LI R2, #176\n  LI R3, #20\n  LI R4, #COL_GREEN\n  SYSCALL #20\n  LI R0, #32\n  LI R1, #66\n  LI R2, #str_sol_win - app6_sol_rom\n  ADD R2, R2, R8\n  LI R3, #COL_BLACK\n  LI R4, #COL_GREEN\n  SYSCALL #21\n\nsr_flush:\n  LI R0, #0\n  LI R1, #0\n  LI R2, #0\n  LI R3, #0\n  SYSCALL #24\n  POP R7\n  POP R6\n  POP R5\n  POP R4\n  POP R3\n  POP R2\n  POP R1\n  POP R0\n  RET\n\n; sol_draw_card: R0=x, R1=y, R2=card_id (0..51)\nsol_draw_card:\n  PUSH R0\n  PUSH R1\n  PUSH R2\n  PUSH R3\n  PUSH R4\n  PUSH R5\n  PUSH R6\n  MOV R5, R0 ; x\n  MOV R6, R1 ; y\n  ; Fill card face (24x12) with white (364)\n  LI R2, #24\n  LI R3, #12\n  LI R4, #COL_WHITE\n  SYSCALL #20\n  ; Re-read card_id from stack [SP + 12] -> simpler: pop/push or use scratch\n  ADDI R4, R8, #5280\n  ; Wait: save R2 at UBASE + 5290 before SYSCALL #20!\n  POP R6\n  POP R5\n  POP R4\n  POP R3\n  POP R2\n  POP R1\n  POP R0\n  PUSH R0\n  PUSH R1\n  PUSH R2\n  PUSH R3\n  PUSH R4\n  PUSH R5\n  PUSH R6\n  ADDI R4, R8, #5280\n  LI R3, #13\n  DIV R5, R2, R3 ; suit 0..3\n  MOD R6, R2, R3 ; rank 0..12\n  LI R3, #str_sol_ranks - app6_sol_rom\n  ADD R3, R3, R8\n  ADD R3, R3, R6\n  LT R3, R3, #0\n  ST R3, R4, #0 ; rank char\n  LI R3, #str_sol_suits - app6_sol_rom\n  ADD R3, R3, R8\n  ADD R3, R3, R5\n  LT R3, R3, #0\n  ST R3, R4, #1 ; suit char\n  LI R3, #0\n  ST R3, R4, #2\n  ; Color: Red (292) for suit 1,3; Black (-364) for suit 0,2\n  LI R3, #2\n  MOD R5, R5, R3\n  LI R3, #COL_BLACK\n  CMPI R5, #0\n  JZX sdc_txt\n  LI R3, #COL_RED\nsdc_txt:\n  ADDI R0, R0, #2\n  ADDI R1, R1, #2\n  MOV R2, R4\n  LI R4, #COL_WHITE\n  SYSCALL #21\n  POP R6\n  POP R5\n  POP R4\n  POP R3\n  POP R2\n  POP R1\n  POP R0\n  RET\n\nstr_sol_title: .stringz \"SOLITAIRE\"\nstr_sol_bar:   .stringz \"[NEW] [D1/3] [SAVE] SOL\"\nstr_sol_win:   .stringz \"YOU WIN! SOLITAIRE!\"\nstr_sol_ranks: .stringz \"A23456789TJQK\"\nstr_sol_suits: .stringz \"SHCD\"\nstr_sol_fn:    .stringz \"SOL\"\napp6_sol_end:\n\n; ----------------------------------------------------------------------------\n; APP 7: TETRIS (APP_ID = 7)\n; 10x20 well, 7 standard tetrominoes (I,O,T,S,Z,J,L), rotation with 6-point wall kicks,\n; soft & hard drop, line clears, score, level, speed, virtual-clock gravity,\n; piece generator LCG S = (S * 127 + 259) % 6561; piece = S % 7,\n; high score persisted in \"TETHI\", board & score saved to \"TETRIS\" on 'P' / [SAVE].\n; Memory layout (relative to R8 = UBASE):\n;   +5000..5214: TET_STATE (215 trytes, saved to \"TETRIS\"):\n;     +5000..5002: score (word)\n;     +5003..5005: high_score (word)\n;     +5006: lines\n;     +5007: level\n;     +5008: game_over\n;     +5009: cur_piece (0..6)\n;     +5010: cur_rot (0..3)\n;     +5011: cur_px\n;     +5012: cur_py\n;     +5013: pieces_spawned\n;     +5014: seed\n;     +5015..5214: grid[0..199] (20 rows * 10 cols)\n;   +5220..5222: prng_s (word)\n;   +5223..5225: last_grav_ticks (word)\n;   +5226: next_seed (-1 or accumulated digits)\n;   +5227: dirty\n; ----------------------------------------------------------------------------\napp7_tet_rom:\n  LI R0, #240\n  LI R1, #14\n  LI R2, #180\n  LI R3, #148\n  LI R4, #str_tet_title - app7_tet_rom\n  ADD R4, R4, R8\n  LI R5, #-320\n  SYSCALL #10\n\n  ; Load persisted high_score from \"TETHI\" if present\n  ADDI R6, R8, #5000\n  LI R0, #0\n  SW R0, R6, #3 ; high_score = 0\n  LI R0, #str_tet_hifn - app7_tet_rom\n  ADD R0, R0, R8\n  ADDI R1, R8, #5003\n  LI R2, #3\n  SYSCALL #31\n\n  ADDI R6, R8, #5000\n  LI R0, #1\n  ST R0, R6, #14 ; seed = 1\n  LI R0, #-1\n  ST R0, R6, #226 ; next_seed = -1\n\n  CALLX tet_new_game\n  CALLX tet_redraw\n\ntet_ev_lp:\n  SYSCALL #25\n  CMPI R0, #0\n  JZX tet_check_grav\n  CMPI R0, #1\n  JZX tet_on_key\n  CMPI R0, #2\n  JZX tet_on_click\n  JMPX tet_ev_lp\n\ntet_check_grav:\n  ; Check virtual-clock gravity if game_over == 0\n  ADDI R6, R8, #5000\n  LT R0, R6, #8 ; game_over\n  CMPI R0, #0\n  JNZX tet_idle_draw\n  SYSCALL #3 ; R0 = current ticks\n  ADDI R6, R8, #5223\n  LW R1, R6, #0 ; last_grav_ticks\n  SUB R2, R0, R1\n  ; gravity_period = max(40000, 200000 - (level - 1) * 15000) -> use 180000 steps at level 1\n  LI R3, #0\n  LMI R3, #10 ; 196,830 steps\n  CMP R2, R3\n  JNX tet_idle_draw\n  SW R0, R6, #0 ; update last_grav_ticks\n  LI R0, #0     ; soft_drop_bonus = 0\n  CALLX tet_step_down\n  ADDI R6, R8, #5227\n  LI R0, #1\n  ST R0, R6, #0\n\ntet_idle_draw:\n  ADDI R6, R8, #5227\n  LT R0, R6, #0\n  CMPI R0, #0\n  JZX tet_do_yield\n  LI R0, #0\n  ST R0, R6, #0\n  CALLX tet_redraw\ntet_do_yield:\n  SYSCALL #2\n  JMPX tet_ev_lp\n\ntet_on_click:\n  CMPI R2, #13\n  JNNX tet_ev_lp\n  CMPI R1, #50\n  JNX tet_cmd_new\n  JMPX tet_cmd_save\n\ntet_on_key:\n  CMPI R1, #200\n  JZX tet_trig_fault\n  CMPI R1, #201\n  JZX tet_trig_loop\n\n  ; Digits '0'..'9' accumulate next_seed\n  CMPI R1, #48\n  JNX tet_key_act\n  CMPI R1, #57\n  JPX tet_key_act\n  SUBI R1, R1, #48\n  ADDI R6, R8, #5226\n  LT R0, R6, #0\n  CMPI R0, #-1\n  JNZX tet_seed_acc\n  ST R1, R6, #0\n  JMPX tet_ev_lp\ntet_seed_acc:\n  MULI R0, R0, #10\n  ADD R0, R0, R1\n  ST R0, R6, #0\n  JMPX tet_ev_lp\n\ntet_trig_fault:\n  LI R1, #100\n  LI R0, #999\n  ST R0, R1, #0\n  JMPX tet_ev_lp\ntet_trig_loop:\n  JMPX tet_trig_loop\n\ntet_key_act:\n  CMPI R1, #'N'\n  JZX tet_cmd_new\n  CMPI R1, #'n'\n  JZX tet_cmd_new\n  CMPI R1, #'P'\n  JZX tet_cmd_save\n  CMPI R1, #'p'\n  JZX tet_cmd_save\n  CMPI R1, #'V'\n  JZX tet_cmd_save\n  CMPI R1, #'v'\n  JZX tet_cmd_save\n\n  ; Ignore movement keys if game_over == 1\n  ADDI R6, R8, #5008\n  LT R0, R6, #0\n  CMPI R0, #0\n  JNZX tet_ev_lp\n\n  CMPI R1, #'A'\n  JZX tet_mv_left\n  CMPI R1, #'a'\n  JZX tet_mv_left\n  CMPI R1, #128 ; ArrowLeft\n  JZX tet_mv_left\n\n  CMPI R1, #'D'\n  JZX tet_mv_right\n  CMPI R1, #'d'\n  JZX tet_mv_right\n  CMPI R1, #129 ; ArrowRight\n  JZX tet_mv_right\n\n  CMPI R1, #'W'\n  JZX tet_mv_rot\n  CMPI R1, #'w'\n  JZX tet_mv_rot\n  CMPI R1, #130 ; ArrowUp\n  JZX tet_mv_rot\n\n  CMPI R1, #'S'\n  JZX tet_mv_soft\n  CMPI R1, #'s'\n  JZX tet_mv_soft\n  CMPI R1, #131 ; ArrowDown\n  JZX tet_mv_soft\n\n  CMPI R1, #32 ; Space -> hard drop\n  JZX tet_mv_hard\n  JMPX tet_ev_lp\n\ntet_cmd_new:\n  ADDI R6, R8, #5226\n  LT R0, R6, #0\n  CMPI R0, #-1\n  JZX tet_new_go\n  ADDI R5, R8, #5014\n  ST R0, R5, #0\n  LI R0, #-1\n  ST R0, R6, #0\ntet_new_go:\n  CALLX tet_new_game\n  ADDI R6, R8, #5227\n  LI R0, #1\n  ST R0, R6, #0\n  JMPX tet_ev_lp\n\ntet_cmd_save:\n  LI R0, #str_tet_fn - app7_tet_rom\n  ADD R0, R0, R8\n  ADDI R1, R8, #5000\n  LI R2, #215\n  LI R3, #1\n  SYSCALL #32\n  LI R0, #str_tet_hifn - app7_tet_rom\n  ADD R0, R0, R8\n  ADDI R1, R8, #5003\n  LI R2, #3\n  LI R3, #1\n  SYSCALL #32\n  JMPX tet_ev_lp\n\ntet_mv_left:\n  ADDI R6, R8, #5009\n  LT R0, R6, #0 ; piece\n  LT R1, R6, #1 ; rot\n  LT R2, R6, #2 ; px\n  LT R3, R6, #3 ; py\n  SUBI R2, R2, #1\n  CALLX tet_check_col\n  CMPI R0, #0\n  JNZX tet_ev_lp\n  ST R2, R6, #2\n  ADDI R6, R8, #5227\n  LI R0, #1\n  ST R0, R6, #0\n  JMPX tet_ev_lp\n\ntet_mv_right:\n  ADDI R6, R8, #5009\n  LT R0, R6, #0\n  LT R1, R6, #1\n  LT R2, R6, #2\n  LT R3, R6, #3\n  ADDI R2, R2, #1\n  CALLX tet_check_col\n  CMPI R0, #0\n  JNZX tet_ev_lp\n  ST R2, R6, #2\n  ADDI R6, R8, #5227\n  LI R0, #1\n  ST R0, R6, #0\n  JMPX tet_ev_lp\n\ntet_mv_rot:\n  ; Try 6 wall kicks in tet_kicks for new_rot = (cur_rot + 1) % 4\n  ADDI R6, R8, #5009\n  LT R4, R6, #1 ; cur_rot\n  ADDI R4, R4, #1\n  CMPI R4, #4\n  JNX tmr_rot_ok\n  LI R4, #0\ntmr_rot_ok:\n  LI R5, #0 ; kick idx 0..5\ntmr_kick_lp:\n  CMPI R5, #6\n  JNNX tet_ev_lp\n  LI R7, #tet_kicks - app7_tet_rom\n  ADD R7, R7, R8\n  MULI R0, R5, #2\n  ADD R7, R7, R0\n  LT R2, R6, #2 ; cur_px\n  LT R0, R7, #0 ; kx\n  ADD R2, R2, R0\n  LT R3, R6, #3 ; cur_py\n  LT R0, R7, #1 ; ky\n  ADD R3, R3, R0\n  LT R0, R6, #0 ; cur_piece\n  MOV R1, R4    ; new_rot\n  CALLX tet_check_col\n  CMPI R0, #0\n  JZX tmr_kick_accept\n  ADDI R5, R5, #1\n  JMPX tmr_kick_lp\ntmr_kick_accept:\n  ST R4, R6, #1 ; cur_rot = new_rot\n  ST R2, R6, #2 ; cur_px\n  ST R3, R6, #3 ; cur_py\n  ADDI R6, R8, #5227\n  LI R0, #1\n  ST R0, R6, #0\n  JMPX tet_ev_lp\n\ntet_mv_soft:\n  LI R0, #1 ; +1 score if soft drop moves down\n  CALLX tet_step_down\n  ADDI R6, R8, #5227\n  LI R0, #1\n  ST R0, R6, #0\n  JMPX tet_ev_lp\n\ntet_mv_hard:\n  ADDI R6, R8, #5009\ntmh_lp:\n  LT R0, R6, #0\n  LT R1, R6, #1\n  LT R2, R6, #2\n  LT R3, R6, #3\n  ADDI R3, R3, #1\n  CALLX tet_check_col\n  CMPI R0, #0\n  JNZX tmh_lock\n  ST R3, R6, #3 ; cur_py++\n  ; Add +2 to score\n  ADDI R5, R8, #5000\n  LW R0, R5, #0\n  ADDI R0, R0, #2\n  SW R0, R5, #0\n  JMPX tmh_lp\ntmh_lock:\n  CALLX tet_lock_piece\n  ADDI R6, R8, #5227\n  LI R0, #1\n  ST R0, R6, #0\n  JMPX tet_ev_lp\n\n; tet_step_down: R0 = bonus_per_step (1 for soft drop, 0 for gravity)\ntet_step_down:\n  PUSH R0\n  PUSH R1\n  PUSH R2\n  PUSH R3\n  PUSH R6\n  MOV R4, R0\n  ADDI R6, R8, #5009\n  LT R0, R6, #0\n  LT R1, R6, #1\n  LT R2, R6, #2\n  LT R3, R6, #3\n  ADDI R3, R3, #1\n  CALLX tet_check_col\n  CMPI R0, #0\n  JNZX tsd_lock\n  ST R3, R6, #3\n  ADDI R6, R8, #5000\n  LW R0, R6, #0\n  ADD R0, R0, R4\n  SW R0, R6, #0\n  JMPX tsd_done\ntsd_lock:\n  CALLX tet_lock_piece\ntsd_done:\n  POP R6\n  POP R3\n  POP R2\n  POP R1\n  POP R0\n  RET\n\n; tet_new_game: resets board, score, lines, level, prng_s = seed, and spawns first piece\ntet_new_game:\n  PUSH R0\n  PUSH R1\n  PUSH R2\n  PUSH R6\n  ADDI R6, R8, #5000\n  LI R0, #0\n  SW R0, R6, #0 ; score = 0\n  ST R0, R6, #6 ; lines = 0\n  LI R0, #1\n  ST R0, R6, #7 ; level = 1\n  LI R0, #0\n  ST R0, R6, #8 ; game_over = 0\n  ST R0, R6, #13 ; pieces_spawned = 0\n  LT R0, R6, #14 ; seed\n  SW R0, R6, #220 ; prng_s = seed\n\n  ; Clear 200-cell well (+5015..5214)\n  ADDI R0, R8, #5015\n  LI R1, #0\n  LI R2, #200\n  BFILL R0, R1, R2\n\n  SYSCALL #3\n  SW R0, R6, #223 ; last_grav_ticks = ticks\n  CALLX tet_spawn_piece\n  POP R6\n  POP R2\n  POP R1\n  POP R0\n  RET\n\n; tet_spawn_piece: advances PRNG S = (S * 127 + 259) % 6561, piece = S % 7, px=3, py=0, rot=0\ntet_spawn_piece:\n  PUSH R0\n  PUSH R1\n  PUSH R2\n  PUSH R3\n  PUSH R4\n  PUSH R6\n  ADDI R6, R8, #5000\n  LW R0, R6, #220 ; prng_s\n  MULI R0, R0, #127\n  ADDI R0, R0, #259\n  LI R1, #6561\n  MOD R0, R0, R1\n  CMPI R0, #0\n  JNNX tsp_pos\n  ADD R0, R0, R1\ntsp_pos:\n  SW R0, R6, #220\n  LI R1, #7\n  MOD R0, R0, R1 ; piece = S % 7\n  ST R0, R6, #9  ; cur_piece\n  LI R1, #0\n  ST R1, R6, #10 ; cur_rot = 0\n  LI R2, #3\n  ST R2, R6, #11 ; cur_px = 3\n  LI R3, #0\n  ST R3, R6, #12 ; cur_py = 0\n  LT R4, R6, #13\n  ADDI R4, R4, #1\n  ST R4, R6, #13 ; pieces_spawned++\n\n  ; Check immediate collision -> game_over = 1\n  CALLX tet_check_col\n  CMPI R0, #0\n  JZX tsp_done\n  LI R0, #1\n  ST R0, R6, #8 ; game_over = 1\n  CALLX tet_update_hi\ntsp_done:\n  POP R6\n  POP R4\n  POP R3\n  POP R2\n  POP R1\n  POP R0\n  RET\n\n; tet_check_col: R0=piece, R1=rot, R2=px, R3=py -> returns R0 = 0 if valid, 1 if collision\ntet_check_col:\n  PUSH R1\n  PUSH R2\n  PUSH R3\n  PUSH R4\n  PUSH R5\n  PUSH R6\n  PUSH R7\n  MULI R4, R0, #32\n  MULI R5, R1, #8\n  ADD R4, R4, R5\n  LI R5, #tet_shapes - app7_tet_rom\n  ADD R5, R5, R8\n  ADD R4, R4, R5 ; R4 = &tet_shapes[piece][rot][0]\n  LI R5, #4 ; 4 blocks\ntcc_lp:\n  CMPI R5, #0\n  JNPX tcc_ok\n  LT R6, R4, #0 ; dx\n  ADD R6, R6, R2 ; bx = px + dx\n  CMPI R6, #0\n  JNX tcc_bad\n  CMPI R6, #10\n  JNNX tcc_bad\n  LT R7, R4, #1 ; dy\n  ADD R7, R7, R3 ; by = py + dy\n  CMPI R7, #0\n  JNX tcc_bad\n  CMPI R7, #20\n  JNNX tcc_bad\n  MULI R7, R7, #10\n  ADD R7, R7, R6\n  ADDI R7, R7, #5015\n  ADD R7, R7, R8\n  LT R6, R7, #0\n  CMPI R6, #0\n  JNZX tcc_bad\n  ADDI R4, R4, #2\n  SUBI R5, R5, #1\n  JMPX tcc_lp\ntcc_ok:\n  LI R0, #0\n  JMPX tcc_ret\ntcc_bad:\n  LI R0, #1\ntcc_ret:\n  POP R7\n  POP R6\n  POP R5\n  POP R4\n  POP R3\n  POP R2\n  POP R1\n  RET\n\n; tet_lock_piece: writes cur_piece blocks to grid, clears completed lines, updates score/level/high_score, spawns next\ntet_lock_piece:\n  PUSH R0\n  PUSH R1\n  PUSH R2\n  PUSH R3\n  PUSH R4\n  PUSH R5\n  PUSH R6\n  PUSH R7\n  ADDI R6, R8, #5009\n  LT R0, R6, #0 ; piece\n  LT R1, R6, #1 ; rot\n  LT R2, R6, #2 ; px\n  LT R3, R6, #3 ; py\n  MULI R4, R0, #32\n  MULI R5, R1, #8\n  ADD R4, R4, R5\n  LI R5, #tet_shapes - app7_tet_rom\n  ADD R5, R5, R8\n  ADD R4, R4, R5\n  ADDI R7, R0, #1 ; color_id = piece + 1\n  LI R5, #4\ntlp_wr_lp:\n  CMPI R5, #0\n  JNPX tlp_scan_lines\n  LT R0, R4, #0\n  ADD R0, R0, R2 ; bx\n  LT R1, R4, #1\n  ADD R1, R1, R3 ; by\n  MULI R1, R1, #10\n  ADD R1, R1, R0\n  ADDI R1, R1, #5015\n  ADD R1, R1, R8\n  ST R7, R1, #0\n  ADDI R4, R4, #2\n  SUBI R5, R5, #1\n  JMPX tlp_wr_lp\n\ntlp_scan_lines:\n  LI R4, #0  ; cleared_count = 0\n  LI R5, #19 ; row y = 19 down to 0\ntlp_row_lp:\n  CMPI R5, #0\n  JNX tlp_score_lines\n  ; Check if row R5 is full (all 10 cells != 0)\n  MULI R0, R5, #10\n  ADDI R0, R0, #5015\n  ADD R0, R0, R8\n  LI R1, #0\ntlp_chk_col:\n  CMPI R1, #10\n  JNNX tlp_row_full\n  ADD R2, R0, R1\n  LT R3, R2, #0\n  CMPI R3, #0\n  JZX tlp_row_next\n  ADDI R1, R1, #1\n  JMPX tlp_chk_col\n\ntlp_row_full:\n  ADDI R4, R4, #1 ; cleared_count++\n  ; Shift rows R5-1 .. 0 down by 1 row\n  MOV R1, R5 ; dst_r = R5\ntlp_shift_lp:\n  CMPI R1, #0\n  JNPX tlp_clear_top\n  SUBI R2, R1, #1 ; src_r = dst_r - 1\n  MULI R3, R1, #10\n  ADDI R3, R3, #5015\n  ADD R3, R3, R8 ; dst row ptr\n  MULI R2, R2, #10\n  ADDI R2, R2, #5015\n  ADD R2, R2, R8 ; src row ptr\n  LI R6, #10\n  BCOPY R3, R2, R6\n  SUBI R1, R1, #1\n  JMPX tlp_shift_lp\ntlp_clear_top:\n  ADDI R0, R8, #5015\n  LI R1, #0\n  LI R2, #10\n  BFILL R0, R1, R2\n  ; Re-check same row index R5 since rows shifted down!\n  JMPX tlp_row_lp\n\ntlp_row_next:\n  SUBI R5, R5, #1\n  JMPX tlp_row_lp\n\ntlp_score_lines:\n  CMPI R4, #0\n  JNPX tlp_finish\n  ADDI R6, R8, #5000\n  LT R0, R6, #6 ; lines\n  ADD R0, R0, R4\n  ST R0, R6, #6 ; lines += cleared_count\n  LI R1, #10\n  DIV R0, R0, R1\n  ADDI R0, R0, #1\n  ST R0, R6, #7 ; level = 1 + lines / 10\n\n  ; Base points: 1->100, 2->300, 3->500, 4->800\n  LI R1, #100\n  CMPI R4, #1\n  JZX tlp_add_pts\n  LI R1, #300\n  CMPI R4, #2\n  JZX tlp_add_pts\n  LI R1, #500\n  CMPI R4, #3\n  JZX tlp_add_pts\n  LI R1, #800\ntlp_add_pts:\n  LT R2, R6, #7 ; level\n  MUL R1, R1, R2\n  LW R0, R6, #0\n  ADD R0, R0, R1\n  SW R0, R6, #0\n\ntlp_finish:\n  CALLX tet_update_hi\n  SYSCALL #3\n  ADDI R6, R8, #5223\n  SW R0, R6, #0 ; reset gravity timer\n  CALLX tet_spawn_piece\n  POP R7\n  POP R6\n  POP R5\n  POP R4\n  POP R3\n  POP R2\n  POP R1\n  POP R0\n  RET\n\ntet_update_hi:\n  PUSH R0\n  PUSH R1\n  PUSH R2\n  PUSH R3\n  ADDI R2, R8, #5000\n  LW R0, R2, #0 ; score\n  LW R1, R2, #3 ; high_score\n  CMP R0, R1\n  JNPX tuhi_done\n  SW R0, R2, #3 ; high_score = score\n  LI R0, #str_tet_hifn - app7_tet_rom\n  ADD R0, R0, R8\n  ADDI R1, R8, #5003\n  LI R2, #3\n  LI R3, #1\n  SYSCALL #32\ntuhi_done:\n  POP R3\n  POP R2\n  POP R1\n  POP R0\n  RET\n\ntet_redraw:\n  PUSH R0\n  PUSH R1\n  PUSH R2\n  PUSH R3\n  PUSH R4\n  PUSH R5\n  PUSH R6\n  PUSH R7\n\n  ; Clear window body\n  LI R0, #0\n  LI R1, #0\n  LI R2, #178\n  LI R3, #135\n  LI R4, #-320\n  SYSCALL #20\n\n  ; Toolbar at (4, 2)\n  LI R0, #4\n  LI R1, #2\n  LI R2, #str_tet_bar - app7_tet_rom\n  ADD R2, R2, R8\n  LI R3, #COL_WHITE\n  LI R4, #-230\n  SYSCALL #21\n\n  ; Draw 10x20 well background at (8, 14, 60, 120) (each cell 6x6 px)\n  LI R0, #8\n  LI R1, #14\n  LI R2, #60\n  LI R3, #120\n  LI R4, #COL_BLACK\n  SYSCALL #20\n\n  ; Draw locked blocks in grid\n  LI R5, #0 ; y = 0..19\ntrd_ylp:\n  CMPI R5, #20\n  JNNX trd_cur_piece\n  LI R6, #0 ; x = 0..9\ntrd_xlp:\n  CMPI R6, #10\n  JNNX trd_ynx\n  MULI R0, R5, #10\n  ADD R0, R0, R6\n  ADDI R0, R0, #5015\n  ADD R0, R0, R8\n  LT R4, R0, #0 ; cell value 0..7\n  CMPI R4, #0\n  JZX trd_xnx\n  MULI R4, R4, #80\n  SUBI R4, R4, #220 ; vivid 729-color per piece type\n  MULI R0, R6, #6\n  ADDI R0, R0, #8\n  MULI R1, R5, #6\n  ADDI R1, R1, #14\n  LI R2, #5\n  LI R3, #5\n  SYSCALL #20\ntrd_xnx:\n  ADDI R6, R6, #1\n  JMPX trd_xlp\ntrd_ynx:\n  ADDI R5, R5, #1\n  JMPX trd_ylp\n\ntrd_cur_piece:\n  ; Draw active falling piece\n  ADDI R6, R8, #5009\n  LT R0, R6, #0 ; piece\n  LT R1, R6, #1 ; rot\n  LT R5, R6, #2 ; px\n  LT R7, R6, #3 ; py\n  MULI R2, R0, #32\n  MULI R3, R1, #8\n  ADD R2, R2, R3\n  LI R3, #tet_shapes - app7_tet_rom\n  ADD R3, R3, R8\n  ADD R6, R2, R3 ; shape ptr\n  LI R4, #COL_CYAN\n  LI R3, #4\ntrd_cp_lp:\n  CMPI R3, #0\n  JNPX trd_hud\n  LT R0, R6, #0\n  ADD R0, R0, R5\n  MULI R0, R0, #6\n  ADDI R0, R0, #8\n  LT R1, R6, #1\n  ADD R1, R1, R7\n  MULI R1, R1, #6\n  ADDI R1, R1, #14\n  PUSH R3\n  LI R2, #5\n  LI R3, #5\n  SYSCALL #20\n  POP R3\n  ADDI R6, R6, #2\n  SUBI R3, R3, #1\n  JMPX trd_cp_lp\n\ntrd_hud:\n  ; Draw Score, High Score, Lines, Level on right panel (x=76)\n  LI R0, #76\n  LI R1, #18\n  LI R2, #str_tet_sc - app7_tet_rom\n  ADD R2, R2, R8\n  LI R3, #COL_CYAN\n  LI R4, #-320\n  SYSCALL #21\n  ADDI R6, R8, #5000\n  LW R2, R6, #0 ; score\n  LI R0, #76\n  LI R1, #28\n  LI R3, #10\n  LI R4, #COL_WHITE\n  LI R5, #-320\n  SYSCALL #26\n\n  LI R0, #76\n  LI R1, #44\n  LI R2, #str_tet_hi - app7_tet_rom\n  ADD R2, R2, R8\n  LI R3, #COL_YELLOW\n  LI R4, #-320\n  SYSCALL #21\n  ADDI R6, R8, #5003\n  LW R2, R6, #0 ; high_score\n  LI R0, #76\n  LI R1, #54\n  LI R3, #10\n  LI R4, #COL_WHITE\n  LI R5, #-320\n  SYSCALL #26\n\n  LI R0, #76\n  LI R1, #70\n  LI R2, #str_tet_ln - app7_tet_rom\n  ADD R2, R2, R8\n  LI R3, #COL_GREEN\n  LI R4, #-320\n  SYSCALL #21\n  ADDI R6, R8, #5006\n  LT R2, R6, #0 ; lines\n  LI R0, #76\n  LI R1, #80\n  LI R3, #10\n  LI R4, #COL_WHITE\n  LI R5, #-320\n  SYSCALL #26\n\n  ADDI R6, R8, #5008\n  LT R0, R6, #0 ; game_over\n  CMPI R0, #0\n  JZX trd_flush\n  LI R0, #76\n  LI R1, #104\n  LI R2, #str_tet_over - app7_tet_rom\n  ADD R2, R2, R8\n  LI R3, #COL_RED\n  LI R4, #-320\n  SYSCALL #21\n\ntrd_flush:\n  LI R0, #0\n  LI R1, #0\n  LI R2, #0\n  LI R3, #0\n  SYSCALL #24\n  POP R7\n  POP R6\n  POP R5\n  POP R4\n  POP R3\n  POP R2\n  POP R1\n  POP R0\n  RET\n\n; 7 Tetrominoes x 4 Rotations x 8 trytes (dx0,dy0, dx1,dy1, dx2,dy2, dx3,dy3)\ntet_shapes:\n  ; 0: I\n  .tryte #0,#1, #1,#1, #2,#1, #3,#1\n  .tryte #2,#0, #2,#1, #2,#2, #2,#3\n  .tryte #0,#2, #1,#2, #2,#2, #3,#2\n  .tryte #1,#0, #1,#1, #1,#2, #1,#3\n  ; 1: O\n  .tryte #1,#0, #2,#0, #1,#1, #2,#1\n  .tryte #1,#0, #2,#0, #1,#1, #2,#1\n  .tryte #1,#0, #2,#0, #1,#1, #2,#1\n  .tryte #1,#0, #2,#0, #1,#1, #2,#1\n  ; 2: T\n  .tryte #1,#0, #0,#1, #1,#1, #2,#1\n  ; __PERTURB_TETRIS_ROTATION__\n  .tryte #0,#1, #1,#1, #2,#1, #1,#2\n  .tryte #1,#0, #0,#1, #1,#1, #1,#2\n  ; 3: S\n  .tryte #1,#0, #2,#0, #0,#1, #1,#1\n  .tryte #1,#0, #1,#1, #2,#1, #2,#2\n  .tryte #1,#1, #2,#1, #0,#2, #1,#2\n  .tryte #0,#0, #0,#1, #1,#1, #1,#2\n  ; 4: Z\n  .tryte #0,#0, #1,#0, #1,#1, #2,#1\n  .tryte #2,#0, #1,#1, #2,#1, #1,#2\n  .tryte #0,#1, #1,#1, #1,#2, #2,#2\n  .tryte #1,#0, #0,#1, #1,#1, #0,#2\n  ; 5: J\n  .tryte #0,#0, #0,#1, #1,#1, #2,#1\n  .tryte #1,#0, #2,#0, #1,#1, #1,#2\n  .tryte #0,#1, #1,#1, #2,#1, #2,#2\n  .tryte #1,#0, #1,#1, #0,#2, #1,#2\n  ; 6: L\n  .tryte #2,#0, #0,#1, #1,#1, #2,#1\n  .tryte #1,#0, #1,#1, #1,#2, #2,#2\n  .tryte #0,#1, #1,#1, #2,#1, #0,#2\n  .tryte #0,#0, #1,#0, #1,#1, #1,#2\n\ntet_kicks:\n  .tryte #0,#0, #-1,#0, #1,#0, #-2,#0, #2,#0, #0,#-1\n\nstr_tet_title: .stringz \"TETRIS\"\nstr_tet_bar:   .stringz \"[NEW] [SAVE] TETRIS\"\nstr_tet_sc:    .stringz \"SCORE:\"\nstr_tet_hi:    .stringz \"HIGH:\"\nstr_tet_ln:    .stringz \"LINES:\"\nstr_tet_over:  .stringz \"GAME OVER\"\nstr_tet_fn:    .stringz \"TETRIS\"\nstr_tet_hifn:  .stringz \"TETHI\"\napp7_tet_end:\n\n; ----------------------------------------------------------------------------\n; APP 8: WRITE WORD PROCESSOR (APP_ID = 8)\n; Multi-line documents with 24-col word wrap, cursor movement (arrows 128..131,\n; home 132, end 133, pgup 134, pgdn 135), insert, delete (127), backspace (8),\n; open (Ctrl+O=15), save (Ctrl+S=19), save-as (Ctrl+W=23), status line (L, C, W).\n; Memory layout (relative to R8 = UBASE):\n;   +5000..5015: filename (default \"DOC\")\n;   +5020..5022: doc_len (word)\n;   +5023..5025: cursor_pos (word)\n;   +5026:       scroll_row\n;   +5027:       mode (0=edit, 1=open_fn, 2=saveas_fn)\n;   +5028:       fn_len\n;   +5029:       dirty\n;   +5030:       cur_line (1-based)\n;   +5031:       cur_col (1-based)\n;   +5032:       word_cnt\n;   +5033:       total_lines\n;   +5040..5080: line_scratch\n;   +5100..5999: line_starts[0..299] & line_ends[0..299] (5100..5399 starts, 5400..5699 ends)\n;   +6000..9800: doc_buf (up to 3,800 chars)\n; ----------------------------------------------------------------------------\napp8_write_rom:\n  LI R0, #60\n  LI R1, #24\n  LI R2, #210\n  LI R3, #140\n  LI R4, #str_wr_title - app8_write_rom\n  ADD R4, R4, R8\n  LI R5, #-310\n  SYSCALL #10\n\n  ADDI R6, R8, #5000\n  LI R0, #'D'\n  ST R0, R6, #0\n  LI R0, #'O'\n  ST R0, R6, #1\n  LI R0, #'C'\n  ST R0, R6, #2\n  LI R0, #0\n  ST R0, R6, #3\n\n  SW R0, R6, #20 ; doc_len = 0\n  SW R0, R6, #23 ; cursor_pos = 0\n  ST R0, R6, #26 ; scroll_row = 0\n  ST R0, R6, #27 ; mode = 0\n  ST R0, R6, #28 ; fn_len = 0\n  LI R0, #1\n  ST R0, R6, #29 ; dirty = 1\n  ADDI R6, R8, #6000\n  LI R0, #0\n  ST R0, R6, #0\n\n  CALLX wr_recompute_layout\n  CALLX wr_redraw\n\nwr_ev_lp:\n  SYSCALL #25\n  CMPI R0, #0\n  JZX wr_idle\n  CMPI R0, #1\n  JZX wr_on_key\n  CMPI R0, #2\n  JZX wr_on_click\n  JMPX wr_ev_lp\n\nwr_idle:\n  ADDI R6, R8, #5029\n  LT R0, R6, #0\n  CMPI R0, #0\n  JZX wr_do_yield\n  LI R0, #0\n  ST R0, R6, #0\n  CALLX wr_recompute_layout\n  CALLX wr_redraw\nwr_do_yield:\n  SYSCALL #2\n  JMPX wr_ev_lp\n\nwr_on_click:\n  CMPI R2, #13\n  JNNX wr_ev_lp\n  CMPI R1, #48\n  JNX wr_start_open\n  CMPI R1, #96\n  JNX wr_do_save\n  JMPX wr_start_saveas\n\nwr_on_key:\n  CMPI R1, #200\n  JZX wr_trig_fault\n  CMPI R1, #201\n  JZX wr_trig_loop\n\n  ; Check if in filename input mode (mode == 1 or 2)\n  ADDI R6, R8, #5000\n  LT R0, R6, #27 ; mode\n  CMPI R0, #0\n  JNZX wr_key_fn_mode\n\n  ; Mode 0 (document editing):\n  CMPI R1, #19 ; Ctrl+S -> save\n  JZX wr_do_save\n  CMPI R1, #15 ; Ctrl+O -> open by filename\n  JZX wr_start_open\n  CMPI R1, #23 ; Ctrl+W -> save-as by filename\n  JZX wr_start_saveas\n  CMPI R1, #8  ; Backspace\n  JZX wr_do_bs\n  CMPI R1, #127 ; Delete\n  JZX wr_do_del\n  CMPI R1, #128 ; Left\n  JZX wr_cur_left\n  CMPI R1, #129 ; Right\n  JZX wr_cur_right\n  CMPI R1, #130 ; Up\n  JZX wr_cur_up\n  CMPI R1, #131 ; Down\n  JZX wr_cur_down\n  CMPI R1, #132 ; Home\n  JZX wr_cur_home\n  CMPI R1, #133 ; End\n  JZX wr_cur_end\n  CMPI R1, #134 ; PageUp\n  JZX wr_cur_pgup\n  CMPI R1, #135 ; PageDown\n  JZX wr_cur_pgdn\n\n  ; Map CR (13) to LF (10)\n  CMPI R1, #13\n  JNZX wr_chk_ins\n  LI R1, #10\nwr_chk_ins:\n  CMPI R1, #10\n  JZX wr_do_ins\n  CMPI R1, #32\n  JNX wr_ev_lp\n  CMPI R1, #126\n  JPX wr_ev_lp\n\nwr_do_ins:\n  ; Insert char R1 at cursor_pos (+5023), shifting doc_buf[cursor_pos..doc_len] right by 1\n  ADDI R6, R8, #5000\n  LW R2, R6, #20 ; doc_len\n  LI R0, #3700\n  CMP R2, R0\n  JNNX wr_ev_lp\n  LW R3, R6, #23 ; cursor_pos\n  ; Shift backwards from i = doc_len down to cursor_pos\n  MOV R4, R2 ; i = doc_len\n  ADDI R5, R8, #6000\nwr_ins_sh_lp:\n  CMP R4, R3\n  JNX wr_ins_put\n  ADD R0, R5, R4\n  LT R7, R0, #0\n  ST R7, R0, #1\n  SUBI R4, R4, #1\n  JMPX wr_ins_sh_lp\nwr_ins_put:\n  ADD R0, R5, R3\n  ST R1, R0, #0\n  ADDI R2, R2, #1\n  SW R2, R6, #20 ; doc_len++\n  ADDI R3, R3, #1\n  SW R3, R6, #23 ; cursor_pos++\n  LI R0, #1\n  ST R0, R6, #29 ; dirty = 1\n  JMPX wr_ev_lp\n\nwr_trig_fault:\n  LI R1, #100\n  LI R0, #999\n  ST R0, R1, #0\n  JMPX wr_ev_lp\nwr_trig_loop:\n  JMPX wr_trig_loop\n\nwr_do_bs:\n  ADDI R6, R8, #5000\n  LW R3, R6, #23 ; cursor_pos\n  CMPI R3, #0\n  JNPX wr_ev_lp\n  SUBI R3, R3, #1\n  SW R3, R6, #23\n  JMPX wr_do_del\n\nwr_do_del:\n  ADDI R6, R8, #5000\n  LW R2, R6, #20 ; doc_len\n  LW R3, R6, #23 ; cursor_pos\n  CMP R3, R2\n  JNNX wr_ev_lp\n  ; Shift doc_buf[cursor_pos + 1 .. doc_len] left by 1 using BCOPY\n  ADDI R5, R8, #6000\n  ADD R0, R5, R3 ; dst = &doc_buf[cursor_pos]\n  ADDI R1, R0, #1 ; src = &doc_buf[cursor_pos + 1]\n  SUB R4, R2, R3 ; count = doc_len - cursor_pos (includes null terminator)\n  BCOPY R0, R1, R4\n  SUBI R2, R2, #1\n  SW R2, R6, #20 ; doc_len--\n  LI R0, #1\n  ST R0, R6, #29 ; dirty = 1\n  JMPX wr_ev_lp\n\nwr_cur_left:\n  ADDI R6, R8, #5000\n  LW R3, R6, #23\n  CMPI R3, #0\n  JNPX wr_ev_lp\n  SUBI R3, R3, #1\n  SW R3, R6, #23\n  LI R0, #1\n  ST R0, R6, #29\n  JMPX wr_ev_lp\n\nwr_cur_right:\n  ADDI R6, R8, #5000\n  LW R2, R6, #20\n  LW R3, R6, #23\n  CMP R3, R2\n  JNNX wr_ev_lp\n  ADDI R3, R3, #1\n  SW R3, R6, #23\n  LI R0, #1\n  ST R0, R6, #29\n  JMPX wr_ev_lp\n\nwr_cur_up:\n  CALLX wr_recompute_layout\n  ADDI R6, R8, #5000\n  LT R0, R6, #30 ; cur_line (1-based)\n  CMPI R0, #1\n  JNPX wr_ev_lp\n  SUBI R0, R0, #2 ; target 0-based line = cur_line - 2\n  JMPX wr_move_to_line_col\n\nwr_cur_down:\n  CALLX wr_recompute_layout\n  ADDI R6, R8, #5000\n  LT R0, R6, #30 ; cur_line (1-based)\n  LT R1, R6, #33 ; total_lines\n  CMP R0, R1\n  JNNX wr_ev_lp\n  ; target 0-based line = cur_line\n  JMPX wr_move_to_line_col\n\nwr_cur_pgup:\n  CALLX wr_recompute_layout\n  ADDI R6, R8, #5000\n  LT R0, R6, #30\n  SUBI R0, R0, #9 ; (cur_line - 1) - 8\n  CMPI R0, #0\n  JNNX wr_move_to_line_col\n  LI R0, #0\n  JMPX wr_move_to_line_col\n\nwr_cur_pgdn:\n  CALLX wr_recompute_layout\n  ADDI R6, R8, #5000\n  LT R0, R6, #30\n  ADDI R0, R0, #7 ; (cur_line - 1) + 8\n  LT R1, R6, #33 ; total_lines\n  SUBI R1, R1, #1\n  CMP R0, R1\n  JNPX wr_move_to_line_col\n  MOV R0, R1\n\nwr_move_to_line_col:\n  ; R0 = target 0-based visual line index; preserve cur_col (1-based at +5031)\n  ADDI R6, R8, #5000\n  LT R1, R6, #31\n  SUBI R1, R1, #1 ; 0-based col\n  ADDI R2, R8, #5100\n  ADD R2, R2, R0\n  LT R3, R2, #0 ; line_start[R0]\n  ADDI R2, R8, #5400\n  ADD R2, R2, R0\n  LT R4, R2, #0 ; line_end[R0]\n  ADD R3, R3, R1\n  CMP R3, R4\n  JNPX wmtlc_ok\n  MOV R3, R4\nwmtlc_ok:\n  SW R3, R6, #23 ; cursor_pos\n  LI R0, #1\n  ST R0, R6, #29\n  JMPX wr_ev_lp\n\nwr_cur_home:\n  CALLX wr_recompute_layout\n  ADDI R6, R8, #5000\n  LT R0, R6, #30\n  SUBI R0, R0, #1\n  ADDI R2, R8, #5100\n  ADD R2, R2, R0\n  LT R3, R2, #0\n  SW R3, R6, #23\n  LI R0, #1\n  ST R0, R6, #29\n  JMPX wr_ev_lp\n\nwr_cur_end:\n  CALLX wr_recompute_layout\n  ADDI R6, R8, #5000\n  LT R0, R6, #30\n  SUBI R0, R0, #1\n  ADDI R2, R8, #5400\n  ADD R2, R2, R0\n  LT R3, R2, #0\n  SW R3, R6, #23\n  LI R0, #1\n  ST R0, R6, #29\n  JMPX wr_ev_lp\n\nwr_start_open:\n  ADDI R6, R8, #5000\n  LI R0, #1\n  ST R0, R6, #27 ; mode = 1 (open)\n  LI R0, #0\n  ST R0, R6, #28 ; fn_len = 0\n  JMPX wr_ev_lp\n\nwr_start_saveas:\n  ADDI R6, R8, #5000\n  LI R0, #2\n  ST R0, R6, #27 ; mode = 2 (saveas)\n  LI R0, #0\n  ST R0, R6, #28 ; fn_len = 0\n  JMPX wr_ev_lp\n\nwr_key_fn_mode:\n  ; R1 = key while typing filename for OPEN (mode=1) or SAVE-AS (mode=2)\n  CMPI R1, #13\n  JZX wr_fn_commit\n  CMPI R1, #10\n  JZX wr_fn_commit\n  LT R2, R6, #28 ; fn_len\n  CMPI R2, #8\n  JNNX wr_ev_lp\n  ADD R3, R6, R2\n  ST R1, R3, #0\n  LI R4, #0\n  ST R4, R3, #1\n  ADDI R2, R2, #1\n  ST R2, R6, #28\n  JMPX wr_ev_lp\n\nwr_fn_commit:\n  LT R0, R6, #27 ; mode (1=open, 2=saveas)\n  LI R1, #0\n  ST R1, R6, #27 ; back to mode 0\n  CMPI R0, #1\n  JZX wr_do_open\n  JMPX wr_do_save\n\nwr_do_save:\n  ADDI R0, R8, #5000 ; filename\n  ADDI R1, R8, #6000 ; doc_buf\n  LW R2, R0, #20     ; doc_len\n  LI R3, #1\n  SYSCALL #32\n  ADDI R6, R8, #5029\n  LI R0, #1\n  ST R0, R6, #0\n  JMPX wr_ev_lp\n\nwr_do_open:\n  ADDI R0, R8, #5000\n  ADDI R1, R8, #6000\n  LI R2, #3700\n  SYSCALL #31\n  CMPI R0, #0\n  JNX wr_ev_lp\n  ADDI R6, R8, #5000\n  SW R0, R6, #20 ; doc_len = R0\n  LI R1, #0\n  SW R1, R6, #23 ; cursor_pos = 0\n  ST R1, R6, #26 ; scroll_row = 0\n  LI R1, #1\n  ST R1, R6, #29 ; dirty = 1\n  JMPX wr_ev_lp\n\n; wr_recompute_layout: computes greedy 24-col word wrap line_starts/line_ends, cursor (line, col), scroll_row, and word_cnt\nwr_recompute_layout:\n  PUSH R0\n  PUSH R1\n  PUSH R2\n  PUSH R3\n  PUSH R4\n  PUSH R5\n  PUSH R6\n  PUSH R7\n\n  ADDI R6, R8, #5000\n  LW R2, R6, #20 ; doc_len\n  ADDI R5, R8, #6000 ; doc_buf\n\n  ; 1. Compute word_cnt\n  LI R0, #0 ; i = 0\n  LI R1, #0 ; in_word = 0\n  LI R3, #0 ; words = 0\nwrl_wc_lp:\n  CMP R0, R2\n  JNNX wrl_wc_done\n  ADD R4, R5, R0\n  LT R4, R4, #0\n  CMPI R4, #32\n  JZX wrl_wc_sp\n  CMPI R4, #10\n  JZX wrl_wc_sp\n  CMPI R1, #0\n  JNZX wrl_wc_nx\n  LI R1, #1\n  ADDI R3, R3, #1\n  JMPX wrl_wc_nx\nwrl_wc_sp:\n  LI R1, #0\nwrl_wc_nx:\n  ADDI R0, R0, #1\n  JMPX wrl_wc_lp\nwrl_wc_done:\n  ST R3, R6, #32 ; word_cnt\n\n  ; 2. Compute wrapped visual lines (width = 24 chars)\n  LI R0, #0 ; pos = 0\n  LI R1, #0 ; line_idx = 0\nwrl_ln_lp:\n  ADDI R3, R8, #5100\n  ADD R3, R3, R1\n  ST R0, R3, #0 ; line_starts[line_idx] = pos\n  CMP R0, R2\n  JNNX wrl_ln_empty_end\n\n  ; Scan up to 24 chars from pos (R0)\n  MOV R3, R0 ; scan = pos\n  LI R4, #-1 ; last_space = -1\n  ADDI R7, R0, #24 ; limit = pos + 24\n  CMP R7, R2\n  JNPX wrl_sc_lp\n  MOV R7, R2\nwrl_sc_lp:\n  CMP R3, R7\n  JNNX wrl_sc_lim\n  ADD R4, R5, R3\n  LT R4, R4, #0 ; ch = doc_buf[scan]\n  CMPI R4, #10 ; newline?\n  JZX wrl_sc_nl\n  ADDI R3, R3, #1\n  JMPX wrl_sc_lp\n\nwrl_sc_nl:\n  ; Line ends at R3, next line starts at R3 + 1\n  ADDI R4, R8, #5400\n  ADD R4, R4, R1\n  ST R3, R4, #0 ; line_ends[line_idx] = R3\n  ADDI R0, R3, #1\n  ADDI R1, R1, #1\n  CMP R0, R2\n  JNPX wrl_ln_lp\n  JMPX wrl_ln_done\n\nwrl_sc_lim:\n  ; Reached limit R7 without newline. If R7 == doc_len, line ends at R7!\n  CMP R7, R2\n  JZX wrl_sc_eof\n  ; Otherwise, look backwards from R7 down to R0 + 1 for a space (32) to word-wrap!\n  MOV R4, R7\nwrl_bk_lp:\n  CMP R4, R0\n  JNPX wrl_hard_wrap\n  ADD R3, R5, R4\n  LT R3, R3, #0\n  CMPI R3, #32\n  JZX wrl_wrap_sp\n  SUBI R4, R4, #1\n  JMPX wrl_bk_lp\nwrl_wrap_sp:\n  ADDI R3, R8, #5400\n  ADD R3, R3, R1\n  ST R4, R3, #0 ; line_ends[line_idx] = space_pos\n  ADDI R0, R4, #1 ; next line starts after space\n  ADDI R1, R1, #1\n  JMPX wrl_ln_lp\n\nwrl_hard_wrap:\n  ADDI R3, R8, #5400\n  ADD R3, R3, R1\n  ST R7, R3, #0\n  MOV R0, R7\n  ADDI R1, R1, #1\n  JMPX wrl_ln_lp\n\nwrl_sc_eof:\n  ADDI R3, R8, #5400\n  ADD R3, R3, R1\n  ST R2, R3, #0\n  ADDI R1, R1, #1\n  JMPX wrl_ln_done\n\nwrl_ln_empty_end:\n  ADDI R3, R8, #5400\n  ADD R3, R3, R1\n  ST R0, R3, #0\n  ADDI R1, R1, #1\n\nwrl_ln_done:\n  ST R1, R6, #33 ; total_lines = R1\n\n  ; 3. Locate cursor_pos (+5023) in visual lines 0..R1-1\n  LW R2, R6, #23 ; cursor_pos\n  LI R0, #0 ; l = 0\nwrl_cur_lp:\n  ADDI R3, R0, #1\n  CMP R3, R1\n  JNNX wrl_cur_found\n  ADDI R4, R8, #5100\n  ADD R4, R4, R3\n  LT R4, R4, #0 ; next line start\n  CMP R2, R4\n  JNX wrl_cur_found\n  ADDI R0, R0, #1\n  JMPX wrl_cur_lp\nwrl_cur_found:\n  ADDI R4, R8, #5100\n  ADD R4, R4, R0\n  LT R4, R4, #0 ; line_start[l]\n  SUB R3, R2, R4\n  ADDI R3, R3, #1 ; 1-based col\n  ST R3, R6, #31\n  ADDI R3, R0, #1 ; 1-based line\n  ST R3, R6, #30\n\n  ; Adjust scroll_row (+5026) so 0-based line R0 is in [scroll_row, scroll_row + 7]\n  LT R4, R6, #26 ; scroll_row\n  CMP R0, R4\n  JNNX wrl_sc_chk_bot\n  ST R0, R6, #26\n  JMPX wrl_done\nwrl_sc_chk_bot:\n  SUBI R5, R0, #7\n  CMP R4, R5\n  JNNX wrl_done\n  ST R5, R6, #26\n\nwrl_done:\n  POP R7\n  POP R6\n  POP R5\n  POP R4\n  POP R3\n  POP R2\n  POP R1\n  POP R0\n  RET\n\nwr_redraw:\n  PUSH R0\n  PUSH R1\n  PUSH R2\n  PUSH R3\n  PUSH R4\n  PUSH R5\n  PUSH R6\n  PUSH R7\n\n  ; Clear window body\n  LI R0, #0\n  LI R1, #0\n  LI R2, #208\n  LI R3, #127\n  LI R4, #-310\n  SYSCALL #20\n\n  ; Toolbar at (4, 2)\n  LI R0, #4\n  LI R1, #2\n  LI R2, #str_wr_bar - app8_write_rom\n  ADD R2, R2, R8\n  LI R3, #COL_WHITE\n  LI R4, #-230\n  SYSCALL #21\n\n  ; Text area background (4, 15, 200, 88)\n  LI R0, #4\n  LI R1, #15\n  LI R2, #200\n  LI R3, #88\n  LI R4, #-340\n  SYSCALL #20\n\n  ; Draw up to 8 visible wrapped lines starting at scroll_row\n  ADDI R6, R8, #5000\n  LT R4, R6, #26 ; scroll_row\n  LT R5, R6, #33 ; total_lines\n  LI R7, #0 ; vis_r = 0..7\nwrd_ln_lp:\n  CMPI R7, #8\n  JNNX wrd_status\n  ADD R0, R4, R7 ; line_idx = scroll_row + vis_r\n  CMP R0, R5\n  JNNX wrd_status\n\n  ; Copy doc_buf[line_start..line_end-1] into line_scratch (UBASE + 5040)\n  ADDI R1, R8, #5100\n  ADD R1, R1, R0\n  LT R1, R1, #0 ; start\n  ADDI R2, R8, #5400\n  ADD R2, R2, R0\n  LT R2, R2, #0 ; end\n  SUB R3, R2, R1 ; len\n  ADDI R0, R8, #5040\n  ADDI R2, R8, #6000\n  ADD R1, R2, R1\n  BCOPY R0, R1, R3\n  LI R1, #0\n  ST R1, R0, #0 ; null-terminate\n\n  LI R0, #6\n  MULI R1, R7, #10\n  ADDI R1, R1, #18 ; y = 18 + vis_r * 10\n  ADDI R2, R8, #5040\n  LI R3, #COL_WHITE\n  LI R4, #-340\n  SYSCALL #21\n  ADDI R6, R8, #5000\n  LT R4, R6, #26\n  LT R5, R6, #33\n  ADDI R7, R7, #1\n  JMPX wrd_ln_lp\n\nwrd_status:\n  ; Draw status bar at y=108: \"L:<line> C:<col> W:<words>\"\n  LI R0, #4\n  LI R1, #108\n  LI R2, #str_wr_st_l - app8_write_rom\n  ADD R2, R2, R8\n  LI R3, #COL_CYAN\n  LI R4, #-310\n  SYSCALL #21\n\n  ADDI R6, R8, #5000\n  LT R2, R6, #30 ; cur_line\n  LI R0, #20\n  LI R1, #108\n  LI R3, #10\n  LI R4, #COL_YELLOW\n  LI R5, #-310\n  SYSCALL #26\n\n  LI R0, #56\n  LI R1, #108\n  LI R2, #str_wr_st_c - app8_write_rom\n  ADD R2, R2, R8\n  LI R3, #COL_CYAN\n  LI R4, #-310\n  SYSCALL #21\n\n  LT R2, R6, #31 ; cur_col\n  LI R0, #72\n  LI R1, #108\n  LI R3, #10\n  LI R4, #COL_YELLOW\n  LI R5, #-310\n  SYSCALL #26\n\n  LI R0, #104\n  LI R1, #108\n  LI R2, #str_wr_st_w - app8_write_rom\n  ADD R2, R2, R8\n  LI R3, #COL_CYAN\n  LI R4, #-310\n  SYSCALL #21\n\n  LT R2, R6, #32 ; word_cnt\n  LI R0, #120\n  LI R1, #108\n  LI R3, #10\n  LI R4, #COL_GREEN\n  LI R5, #-310\n  SYSCALL #26\n\n  LI R0, #160\n  LI R1, #108\n  ADDI R2, R8, #5000 ; filename\n  LI R3, #COL_WHITE\n  LI R4, #-310\n  SYSCALL #21\n\n  LI R0, #0\n  LI R1, #0\n  LI R2, #0\n  LI R3, #0\n  SYSCALL #24\n  POP R7\n  POP R6\n  POP R5\n  POP R4\n  POP R3\n  POP R2\n  POP R1\n  POP R0\n  RET\n\nstr_wr_title: .stringz \"WRITE\"\nstr_wr_bar:   .stringz \"[OPEN] [SAVE] [SAVEAS]\"\nstr_wr_st_l:  .stringz \"L:\"\nstr_wr_st_c:  .stringz \"C:\"\nstr_wr_st_w:  .stringz \"W:\"\napp8_write_end:\n\n; ----------------------------------------------------------------------------\n; APP 9: SHEET SPREADSHEET (APP_ID = 9)\n; 10 columns x 30 rows (A1..J30 = 300 cells).\n; Cell holds integer, text, or formula: =, + - * /, ( ), cell refs, SUM(A1:B9), MIN, MAX.\n; Recalculates on edit, detects circular references (#CYCLE!) and division by zero (#DIV/0!).\n; Saves/loads documented plain-text format (\"SHEET\" on disk: <Col><Row>:<raw>=<val>).\n; Memory layout (relative to R8 = UBASE):\n;   +5000: cur_col (0..9)\n;   +5001: cur_row (0..29)\n;   +5002: in_len (0..31)\n;   +5003: dirty\n;   +5010..5049: in_buf (40 trytes: supports \"@A1 =1+2\" or direct cell typing)\n;   +5050..5065: sheet_fn (\"SHEET\")\n;   +5100..5399: CELL_TYPE[0..299] (0=empty, 1=num, 2=text, 3=#DIV/0!, 4=#CYCLE!)\n;   +5400..5699: CELL_VISIT[0..299] (0=unvisited, 1=visiting, 2=done)\n;   +5700..6599: CELL_VAL[0..299] (300 * 3-tryte words = 900 trytes)\n;   +6600..13799: FORMULA_BUF[0..299] (300 * 24 trytes = 7,200 trytes)\n;   +14000..22000: file_io_buf (for saving/loading plain-text \"SHEET\")\n; ----------------------------------------------------------------------------\napp9_sheet_rom:\n  LI R0, #80\n  LI R1, #28\n  LI R2, #220\n  LI R3, #140\n  LI R4, #str_sh_title - app9_sheet_rom\n  ADD R4, R4, R8\n  LI R5, #-315\n  SYSCALL #10\n\n  ADDI R6, R8, #5050\n  LI R0, #'S'\n  ST R0, R6, #0\n  LI R0, #'H'\n  ST R0, R6, #1\n  LI R0, #'E'\n  ST R0, R6, #2\n  LI R0, #'E'\n  ST R0, R6, #3\n  LI R0, #'T'\n  ST R0, R6, #4\n  LI R0, #0\n  ST R0, R6, #5\n\n  CALLX sh_clear_all\n  CALLX sh_redraw\n\nsh_ev_lp:\n  SYSCALL #25\n  CMPI R0, #0\n  JZX sh_idle\n  CMPI R0, #1\n  JZX sh_on_key\n  CMPI R0, #2\n  JZX sh_on_click\n  JMPX sh_ev_lp\n\nsh_idle:\n  ADDI R6, R8, #5003\n  LT R0, R6, #0\n  CMPI R0, #0\n  JZX sh_do_yield\n  LI R0, #0\n  ST R0, R6, #0\n  CALLX sh_recalc_all\n  CALLX sh_redraw\nsh_do_yield:\n  SYSCALL #2\n  JMPX sh_ev_lp\n\nsh_on_click:\n  CMPI R2, #13\n  JNNX sh_click_grid\n  CMPI R1, #50\n  JNX sh_do_save\n  CMPI R1, #100\n  JNX sh_do_load\n  CALLX sh_clear_all\n  ADDI R6, R8, #5003\n  LI R0, #1\n  ST R0, R6, #0\n  JMPX sh_ev_lp\n\nsh_click_grid:\n  ; Grid cells: cols 0..3 at x = 24 + c*46, rows 0..6 at y = 36 + r*12\n  CMPI R1, #24\n  JNX sh_ev_lp\n  CMPI R2, #36\n  JNX sh_ev_lp\n  SUBI R0, R1, #24\n  LI R3, #46\n  DIV R0, R0, R3\n  CMPI R0, #4\n  JNNX sh_ev_lp\n  SUBI R3, R2, #36\n  LI R4, #12\n  DIV R3, R3, R4\n  CMPI R3, #7\n  JNNX sh_ev_lp\n  ADDI R6, R8, #5000\n  ST R0, R6, #0 ; cur_col\n  ST R3, R6, #1 ; cur_row\n  LI R0, #1\n  ST R0, R6, #3 ; dirty\n  JMPX sh_ev_lp\n\nsh_on_key:\n  CMPI R1, #200\n  JZX sh_trig_fault\n  CMPI R1, #201\n  JZX sh_trig_loop\n\n  CMPI R1, #19 ; Ctrl+S -> save\n  JZX sh_do_save\n  CMPI R1, #12 ; Ctrl+L -> load\n  JZX sh_do_load\n  CMPI R1, #14 ; Ctrl+N -> clear all\n  JZX sh_cmd_clear\n\n  CMPI R1, #128 ; Left\n  JZX sh_nav_left\n  CMPI R1, #129 ; Right\n  JZX sh_nav_right\n  CMPI R1, #9   ; Tab -> Right\n  JZX sh_nav_right\n  CMPI R1, #130 ; Up\n  JZX sh_nav_up\n  CMPI R1, #131 ; Down\n  JZX sh_nav_down\n\n  CMPI R1, #13\n  JZX sh_commit_in\n  CMPI R1, #10\n  JZX sh_commit_in\n  CMPI R1, #8\n  JZX sh_in_bs\n\n  ADDI R6, R8, #5000\n  LT R2, R6, #2 ; in_len\n  CMPI R2, #34\n  JNNX sh_ev_lp\n  ADDI R3, R6, #10\n  ADD R3, R3, R2\n  ST R1, R3, #0\n  LI R0, #0\n  ST R0, R3, #1\n  ADDI R2, R2, #1\n  ST R2, R6, #2\n  JMPX sh_ev_lp\n\nsh_trig_fault:\n  LI R1, #100\n  LI R0, #999\n  ST R0, R1, #0\n  JMPX sh_ev_lp\nsh_trig_loop:\n  JMPX sh_trig_loop\n\nsh_cmd_clear:\n  CALLX sh_clear_all\n  JMPX sh_ev_lp\n\nsh_in_bs:\n  ADDI R6, R8, #5000\n  LT R2, R6, #2\n  CMPI R2, #0\n  JNPX sh_ev_lp\n  SUBI R2, R2, #1\n  ST R2, R6, #2\n  ADDI R3, R6, #10\n  ADD R3, R3, R2\n  LI R0, #0\n  ST R0, R3, #0\n  JMPX sh_ev_lp\n\nsh_nav_left:\n  ADDI R6, R8, #5000\n  LT R0, R6, #0\n  CMPI R0, #0\n  JNPX sh_ev_lp\n  SUBI R0, R0, #1\n  ST R0, R6, #0\n  LI R0, #1\n  ST R0, R6, #3\n  JMPX sh_ev_lp\n\nsh_nav_right:\n  ADDI R6, R8, #5000\n  LT R0, R6, #0\n  CMPI R0, #9\n  JNNX sh_ev_lp\n  ADDI R0, R0, #1\n  ST R0, R6, #0\n  LI R0, #1\n  ST R0, R6, #3\n  JMPX sh_ev_lp\n\nsh_nav_up:\n  ADDI R6, R8, #5000\n  LT R0, R6, #1\n  CMPI R0, #0\n  JNPX sh_ev_lp\n  SUBI R0, R0, #1\n  ST R0, R6, #1\n  LI R0, #1\n  ST R0, R6, #3\n  JMPX sh_ev_lp\n\nsh_nav_down:\n  ADDI R6, R8, #5000\n  LT R0, R6, #1\n  CMPI R0, #29\n  JNNX sh_ev_lp\n  ADDI R0, R0, #1\n  ST R0, R6, #1\n  LI R0, #1\n  ST R0, R6, #3\n  JMPX sh_ev_lp\n\nsh_commit_in:\n  ; Commit in_buf (+5010):\n  ; If in_buf starts with '@', format is \"@<Col><Row> <content>\" (sets cur_col, cur_row and stores <content>)\n  ; Otherwise stores in_buf into (cur_col, cur_row).\n  ADDI R6, R8, #5000\n  LT R0, R6, #2 ; in_len\n  CMPI R0, #0\n  JNPX sh_ev_lp\n  ADDI R1, R6, #10 ; &in_buf[0]\n  LT R0, R1, #0\n  CMPI R0, #'@'\n  JNZX sh_commit_cur\n  ADDI R1, R1, #1\n  CALLX sh_parse_cell_ref ; advances R1, returns R0 = cell_idx (row*10 + col)\n  CMPI R0, #0\n  JNX sh_clear_in\n  LI R2, #10\n  DIV R3, R0, R2 ; row\n  MOD R2, R0, R2 ; col\n  ST R2, R6, #0 ; cur_col\n  ST R3, R6, #1 ; cur_row\n  ; Skip single space or ':' after cell ref\n  LT R2, R1, #0\n  CMPI R2, #32\n  JZX sh_sk1\n  CMPI R2, #':'\n  JNZX sh_store_cell\nsh_sk1:\n  ADDI R1, R1, #1\n  JMPX sh_store_cell\n\nsh_commit_cur:\n  LT R2, R6, #0 ; cur_col\n  LT R3, R6, #1 ; cur_row\n  MULI R0, R3, #10\n  ADD R0, R0, R2 ; cell_idx\n\nsh_store_cell:\n  ; Copy up to 23 chars from R1 into FORMULA_BUF + R0 * 24\n  MULI R2, R0, #24\n  ADDI R2, R2, #6600\n  ADD R2, R2, R8\n  LI R3, #23\nsh_sc_lp:\n  CMPI R3, #0\n  JNPX sh_sc_term\n  LT R4, R1, #0\n  CMPI R4, #0\n  JZX sh_sc_term\n  ST R4, R2, #0\n  ADDI R1, R1, #1\n  ADDI R2, R2, #1\n  SUBI R3, R3, #1\n  JMPX sh_sc_lp\nsh_sc_term:\n  LI R4, #0\n  ST R4, R2, #0\n  ADDI R6, R8, #5000\n  LI R0, #1\n  ST R0, R6, #3 ; dirty = 1\n\nsh_clear_in:\n  ADDI R6, R8, #5000\n  LI R0, #0\n  ST R0, R6, #2 ; in_len = 0\n  ST R0, R6, #10 ; in_buf[0] = 0\n  JMPX sh_ev_lp\n\nsh_clear_all:\n  PUSH R0\n  PUSH R1\n  PUSH R2\n  ADDI R0, R8, #5000\n  LI R1, #0\n  ST R1, R0, #0\n  ST R1, R0, #1\n  ST R1, R0, #2\n  ST R1, R0, #3\n  ST R1, R0, #10\n  ADDI R0, R8, #5100\n  LI R1, #0\n  LI R2, #1500\n  BFILL R0, R1, R2\n  ADDI R0, R8, #6600\n  LI R1, #0\n  LI R2, #300\nsca_fb_lp:\n  CMPI R2, #0\n  JNPX sca_fb_dn\n  ST R1, R0, #0\n  ADDI R0, R0, #24\n  SUBI R2, R2, #1\n  JMPX sca_fb_lp\nsca_fb_dn:\n  POP R2\n  POP R1\n  POP R0\n  RET\n\n; sh_recalc_all: clears CELL_VISIT[0..299] and evaluates all 300 cells\nsh_recalc_all:\n  PUSH R0\n  PUSH R1\n  PUSH R2\n  ADDI R0, R8, #5400\n  LI R1, #0\n  LI R2, #300\n  BFILL R0, R1, R2\n  LI R0, #0 ; cell_idx = 0..299\nsra_lp:\n  CMPI R0, #300\n  JNNX sra_done\n  MULI R1, R0, #24\n  ADDI R1, R1, #6600\n  ADD R1, R1, R8\n  LT R1, R1, #0\n  CMPI R1, #0\n  JZX sra_nx\n  CALLX sh_eval_cell\nsra_nx:\n  ADDI R0, R0, #1\n  JMPX sra_lp\nsra_done:\n  POP R2\n  POP R1\n  POP R0\n  RET\n\n; sh_eval_cell: R0 = cell_idx (0..299) -> returns R2 = evaluated value, R3 = error (0=ok, 3=div0, 4=cycle)\nsh_eval_cell:\n  PUSH R0\n  PUSH R1\n  PUSH R4\n  PUSH R5\n  PUSH R6\n  PUSH R7\n  MOV R4, R0 ; cell_idx\n\n  ; Check CELL_VISIT[cell_idx]\n  ADDI R1, R8, #5400\n  ADD R1, R1, R4\n  LT R0, R1, #0\n  CMPI R0, #2\n  JZX sec_memoized\n  CMPI R0, #1\n  JZX sec_cycle\n\n  ; Mark CELL_VISIT[cell_idx] = 1 (visiting)\n  LI R0, #1\n  ST R0, R1, #0\n\n  ; Inspect FORMULA_BUF + cell_idx * 24\n  MULI R5, R4, #24\n  ADDI R5, R5, #6600\n  ADD R5, R5, R8\n  LT R0, R5, #0\n  CMPI R0, #0\n  JZX sec_empty\n  CMPI R0, #'='\n  JZX sec_formula\n\n  ; Check if literal signed integer or text\n  MOV R6, R5\n  CALLX sh_try_parse_int ; returns R0 = val, R1 = 1 if valid integer else 0\n  CMPI R1, #1\n  JZX sec_store_num\n  ; Literal text!\n  ADDI R1, R8, #5100\n  ADD R1, R1, R4\n  LI R0, #2 ; CELL_TYPE = 2 (text)\n  ST R0, R1, #0\n  MULI R1, R4, #3\n  ADDI R1, R1, #5700\n  ADD R1, R1, R8\n  LI R0, #0\n  SW R0, R1, #0\n  ADDI R1, R8, #5400\n  ADD R1, R1, R4\n  LI R0, #2\n  ST R0, R1, #0\n  LI R2, #0\n  LI R3, #0\n  JMPX sec_ret\n\nsec_empty:\n  ADDI R1, R8, #5100\n  ADD R1, R1, R4\n  LI R0, #0\n  ST R0, R1, #0\n  MULI R1, R4, #3\n  ADDI R1, R1, #5700\n  ADD R1, R1, R8\n  SW R0, R1, #0\n  ADDI R1, R8, #5400\n  ADD R1, R1, R4\n  LI R0, #2\n  ST R0, R1, #0\n  LI R2, #0\n  LI R3, #0\n  JMPX sec_ret\n\nsec_formula:\n  ADDI R6, R5, #1 ; expr cursor past '='\n  LI R7, #0       ; error accumulator = 0\n  CALLX sh_parse_expr ; returns R0 = val, R7 = error\n  CMPI R7, #0\n  JNZX sec_store_err\n\nsec_store_num:\n  ADDI R1, R8, #5100\n  ADD R1, R1, R4\n  LI R2, #1 ; CELL_TYPE = 1 (number)\n  ST R2, R1, #0\n  MULI R1, R4, #3\n  ADDI R1, R1, #5700\n  ADD R1, R1, R8\n  SW R0, R1, #0\n  ADDI R1, R8, #5400\n  ADD R1, R1, R4\n  LI R2, #2\n  ST R2, R1, #0\n  MOV R2, R0\n  LI R3, #0\n  JMPX sec_ret\n\nsec_store_err:\n  ADDI R1, R8, #5100\n  ADD R1, R1, R4\n  ST R7, R1, #0 ; CELL_TYPE = 3 (#DIV/0!) or 4 (#CYCLE!)\n  MULI R1, R4, #3\n  ADDI R1, R1, #5700\n  ADD R1, R1, R8\n  LI R0, #0\n  SW R0, R1, #0\n  ADDI R1, R8, #5400\n  ADD R1, R1, R4\n  LI R0, #2\n  ST R0, R1, #0\n  LI R2, #0\n  MOV R3, R7\n  JMPX sec_ret\n\nsec_cycle:\n  ADDI R1, R8, #5100\n  ADD R1, R1, R4\n  LI R0, #4 ; #CYCLE!\n  ST R0, R1, #0\n  MULI R1, R4, #3\n  ADDI R1, R1, #5700\n  ADD R1, R1, R8\n  LI R0, #0\n  SW R0, R1, #0\n  ADDI R1, R8, #5400\n  ADD R1, R1, R4\n  LI R0, #2\n  ST R0, R1, #0\n  LI R2, #0\n  LI R3, #4\n  JMPX sec_ret\n\nsec_memoized:\n  ADDI R1, R8, #5100\n  ADD R1, R1, R4\n  LT R3, R1, #0 ; CELL_TYPE\n  MULI R1, R4, #3\n  ADDI R1, R1, #5700\n  ADD R1, R1, R8\n  LW R2, R1, #0 ; CELL_VAL\n  CMPI R3, #3\n  JNNX sec_ret ; error 3 or 4\n  LI R3, #0\nsec_ret:\n  POP R7\n  POP R6\n  POP R5\n  POP R4\n  POP R1\n  POP R0\n  RET\n\n; sh_try_parse_int: R6 = str_ptr -> R0 = val, R1 = 1 if entire string is signed decimal integer else 0\nsh_try_parse_int:\n  PUSH R2\n  PUSH R3\n  PUSH R4\n  PUSH R6\n  LI R2, #1 ; sign = +1\n  LT R0, R6, #0\n  CMPI R0, #'+'\n  JZX stpi_sk_s\n  CMPI R0, #'-'\n  JNZX stpi_chk_d\n  LI R2, #-1\nstpi_sk_s:\n  ADDI R6, R6, #1\nstpi_chk_d:\n  LT R0, R6, #0\n  CMPI R0, #48\n  JNX stpi_no\n  CMPI R0, #57\n  JPX stpi_no\n  LI R3, #0 ; acc = 0\nstpi_lp:\n  LT R0, R6, #0\n  CMPI R0, #0\n  JZX stpi_ok\n  CMPI R0, #48\n  JNX stpi_no\n  CMPI R0, #57\n  JPX stpi_no\n  SUBI R0, R0, #48\n  MULI R3, R3, #10\n  ADD R3, R3, R0\n  ADDI R6, R6, #1\n  JMPX stpi_lp\nstpi_ok:\n  MUL R0, R3, R2\n  LI R1, #1\n  JMPX stpi_ret\nstpi_no:\n  LI R0, #0\n  LI R1, #0\nstpi_ret:\n  POP R6\n  POP R4\n  POP R3\n  POP R2\n  RET\n\nsh_skip_sp:\n  PUSH R0\nsh_ss_lp:\n  LT R0, R6, #0\n  CMPI R0, #32\n  JNZX sh_ss_ret\n  ADDI R6, R6, #1\n  JMPX sh_ss_lp\nsh_ss_ret:\n  POP R0\n  RET\n\n; __SHEET_EXPR_PARSER__\n\nsh_parse_factor:\n  PUSH R1\n  PUSH R2\n  PUSH R3\n  PUSH R4\n  PUSH R5\n  CALLX sh_skip_sp\n  LT R0, R6, #0\n  CMPI R0, #'+'\n  JZX spf_uplus\n  CMPI R0, #'-'\n  JZX spf_uminus\n  CMPI R0, #'('\n  JZX spf_paren\n\n  ; Check for SUM(, MIN(, MAX(\n  CMPI R0, #'S'\n  JZX spf_func_sum\n  CMPI R0, #'s'\n  JZX spf_func_sum\n  CMPI R0, #'M'\n  JZX spf_func_m\n  CMPI R0, #'m'\n  JZX spf_func_m\n\n  ; Check for CellRef ('A'..'J' or 'a'..'j')\n  CMPI R0, #'a'\n  JNX spf_chk_ucol\n  CMPI R0, #'j'\n  JPX spf_num\n  JMPX spf_cell_ref\nspf_chk_ucol:\n  CMPI R0, #'A'\n  JNX spf_num\n  CMPI R0, #'J'\n  JNPX spf_cell_ref\n\nspf_num:\n  LI R0, #0\nspf_num_lp:\n  LT R1, R6, #0\n  CMPI R1, #48\n  JNX spf_ret\n  CMPI R1, #57\n  JPX spf_ret\n  SUBI R1, R1, #48\n  MULI R0, R0, #10\n  ADD R0, R0, R1\n  ADDI R6, R6, #1\n  JMPX spf_num_lp\n\nspf_uplus:\n  ADDI R6, R6, #1\n  CALLX sh_parse_factor\n  JMPX spf_ret\n\nspf_uminus:\n  ADDI R6, R6, #1\n  CALLX sh_parse_factor\n  NEG R0, R0\n  JMPX spf_ret\n\nspf_paren:\n  ADDI R6, R6, #1\n  CALLX sh_parse_expr\n  CALLX sh_skip_sp\n  LT R1, R6, #0\n  CMPI R1, #')'\n  JNZX spf_ret\n  ADDI R6, R6, #1\n  JMPX spf_ret\n\nspf_cell_ref:\n  MOV R1, R6\n  CALLX sh_parse_cell_ref\n  MOV R6, R1\n  CMPI R0, #0\n  JNX spf_zero_ret\n  PUSH R6\n  PUSH R7\n  CALLX sh_eval_cell ; R2 = val, R3 = err\n  POP R7\n  POP R6\n  CMPI R3, #0\n  JZX spf_cr_ok\n  CMPI R3, #4\n  JZX spf_cr_set_err\n  CMPI R7, #0\n  JNZX spf_cr_ok\nspf_cr_set_err:\n  MOV R7, R3\nspf_cr_ok:\n  MOV R0, R2\n  JMPX spf_ret\n\nspf_zero_ret:\n  LI R0, #0\n  JMPX spf_ret\n\nspf_func_sum:\n  LI R5, #0 ; op = 0 (SUM)\n  ADDI R6, R6, #4 ; skip \"SUM(\"\n  JMPX spf_func_range\nspf_func_m:\n  LT R1, R6, #1\n  LI R5, #1 ; op = 1 (MIN)\n  CMPI R1, #'I'\n  JZX spf_func_m_go\n  CMPI R1, #'i'\n  JZX spf_func_m_go\n  LI R5, #2 ; op = 2 (MAX)\nspf_func_m_go:\n  ADDI R6, R6, #4 ; skip \"MIN(\" or \"MAX(\"\n\nspf_func_range:\n  ; Parse first cell ref: c1, r1\n  MOV R1, R6\n  CALLX sh_parse_cell_ref ; R0 = r1*10 + c1\n  MOV R6, R1\n  MOV R2, R0 ; start_idx\n  LT R0, R6, #0\n  CMPI R0, #':'\n  JNZX spf_fr_p2\n  ADDI R6, R6, #1\nspf_fr_p2:\n  MOV R1, R6\n  CALLX sh_parse_cell_ref ; R0 = r2*10 + c2\n  MOV R6, R1\n  MOV R3, R0 ; end_idx\n  LT R0, R6, #0\n  CMPI R0, #')'\n  JNZX spf_fr_exec\n  ADDI R6, R6, #1\nspf_fr_exec:\n  ; Decompose R2 -> (r1, c1) and R3 -> (r2, c2)\n  ; Iterate r = r1 .. r2, c = c1 .. c2\n  PUSH R6\n  LI R0, #10\n  DIV R1, R2, R0 ; r1\n  MOD R2, R2, R0 ; c1\n  DIV R4, R3, R0 ; r2\n  MOD R3, R3, R0 ; c2\n  ; Initialize accumulator in R6 and first_flag on stack\n  LI R6, #0 ; acc = 0\n  CMPI R5, #0\n  JZX spf_fr_init_ok\n  ; For MIN/MAX, initialize acc from first cell in range\n  MULI R0, R1, #10\n  ADD R0, R0, R2\n  PUSH R1\n  PUSH R2\n  PUSH R3\n  PUSH R7\n  CALLX sh_eval_cell\n  POP R7\n  CMPI R3, #0\n  JZX spf_fr_i0\n  MOV R7, R3\nspf_fr_i0:\n  MOV R6, R2\n  POP R3\n  POP R2\n  POP R1\nspf_fr_init_ok:\n  ; Loop r = R1 .. R4\nspf_fr_rlp:\n  CMP R1, R4\n  JPX spf_fr_done\n  PUSH R2 ; save c1\nspf_fr_clp:\n  CMP R2, R3\n  JPX spf_fr_rnx\n  MULI R0, R1, #10\n  ADD R0, R0, R2\n  PUSH R1\n  PUSH R2\n  PUSH R3\n  PUSH R6\n  PUSH R7\n  CALLX sh_eval_cell ; R2 = val, R3 = err\n  POP R7\n  POP R6\n  CMPI R3, #0\n  JZX spf_fr_no_err\n  CMPI R3, #4\n  JZX spf_fr_st_err\n  CMPI R7, #0\n  JNZX spf_fr_no_err\nspf_fr_st_err:\n  MOV R7, R3\nspf_fr_no_err:\n  CMPI R5, #0\n  JZX spf_fr_do_sum\n  CMPI R5, #1\n  JZX spf_fr_do_min\n  ; MAX:\n  CMP R2, R6\n  JNPX spf_fr_cnx\n  MOV R6, R2\n  JMPX spf_fr_cnx\nspf_fr_do_min:\n  CMP R2, R6\n  JNNX spf_fr_cnx\n  MOV R6, R2\n  JMPX spf_fr_cnx\nspf_fr_do_sum:\n  ADD R6, R6, R2\nspf_fr_cnx:\n  POP R3\n  POP R2\n  POP R1\n  ADDI R2, R2, #1\n  JMPX spf_fr_clp\nspf_fr_rnx:\n  POP R2 ; restore c1\n  ADDI R1, R1, #1\n  JMPX spf_fr_rlp\nspf_fr_done:\n  MOV R0, R6\n  POP R6\n\nspf_ret:\n  POP R5\n  POP R4\n  POP R3\n  POP R2\n  POP R1\n  RET\n\n; sh_parse_cell_ref: R1 = str_ptr -> advances R1, returns R0 = row*10 + col (or -1 if invalid)\nsh_parse_cell_ref:\n  PUSH R2\n  PUSH R3\n  LT R0, R1, #0\n  CMPI R0, #'a'\n  JNX spcr_u\n  CMPI R0, #'j'\n  JPX spcr_bad\n  SUBI R2, R0, #97 ; col 0..9\n  JMPX spcr_row\nspcr_u:\n  CMPI R0, #'A'\n  JNX spcr_bad\n  CMPI R0, #'J'\n  JPX spcr_bad\n  SUBI R2, R0, #65 ; col 0..9\nspcr_row:\n  ADDI R1, R1, #1\n  LI R3, #0 ; row_num\nspcr_rlp:\n  LT R0, R1, #0\n  CMPI R0, #48\n  JNX spcr_rdone\n  CMPI R0, #57\n  JPX spcr_rdone\n  SUBI R0, R0, #48\n  MULI R3, R3, #10\n  ADD R3, R3, R0\n  ADDI R1, R1, #1\n  JMPX spcr_rlp\nspcr_rdone:\n  CMPI R3, #1\n  JNX spcr_bad\n  CMPI R3, #30\n  JPX spcr_bad\n  SUBI R3, R3, #1\n  MULI R0, R3, #10\n  ADD R0, R0, R2\n  JMPX spcr_ret\nspcr_bad:\n  LI R0, #-1\nspcr_ret:\n  POP R3\n  POP R2\n  RET\n\n; sh_do_save: serializes all non-empty cells to file_io_buf (UBASE + 14000) as \"<Col><Row>:<raw>=<val>\" and writes \"SHEET\"\nsh_do_save:\n  CALLX sh_recalc_all\n  LI R5, #14000 - 19683\n  LMI R5, #1 ; 14000\n  ADD R5, R5, R8 ; dst ptr in file_io_buf\n  LI R4, #0 ; cell_idx = 0..299\nsds_cell_lp:\n  CMPI R4, #300\n  JNNX sds_wr_disk\n  ADDI R0, R8, #5100\n  ADD R0, R0, R4\n  LT R6, R0, #0 ; CELL_TYPE\n  CMPI R6, #0\n  JZX sds_nx_cell\n\n  ; Emit <Col> ('A' + cell_idx % 10)\n  LI R0, #10\n  MOD R1, R4, R0\n  ADDI R1, R1, #65\n  ST R1, R5, #0\n  ADDI R5, R5, #1\n  ; Emit <Row> (1 + cell_idx / 10)\n  DIV R0, R4, R0\n  ADDI R0, R0, #1\n  CALLX sh_append_int\n  ; Emit ':'\n  LI R0, #':'\n  ST R0, R5, #0\n  ADDI R5, R5, #1\n  ; Emit raw formula string from FORMULA_BUF + cell_idx * 24\n  MULI R1, R4, #24\n  ADDI R1, R1, #6600\n  ADD R1, R1, R8\n  CALLX sh_append_str\n  ; Emit '='\n  LI R0, #'='\n  ST R0, R5, #0\n  ADDI R5, R5, #1\n  ; Emit evaluated value or error string\n  CMPI R6, #1\n  JZX sds_em_num\n  CMPI R6, #2\n  JZX sds_em_txt\n  CMPI R6, #3\n  JZX sds_em_div0\n  ; #CYCLE!\n  LI R1, #str_sh_cycle - app9_sheet_rom\n  ADD R1, R1, R8\n  CALLX sh_append_str\n  JMPX sds_em_nl\nsds_em_div0:\n  LI R1, #str_sh_div0 - app9_sheet_rom\n  ADD R1, R1, R8\n  CALLX sh_append_str\n  JMPX sds_em_nl\nsds_em_txt:\n  MULI R1, R4, #24\n  ADDI R1, R1, #6600\n  ADD R1, R1, R8\n  CALLX sh_append_str\n  JMPX sds_em_nl\nsds_em_num:\n  MULI R1, R4, #3\n  ADDI R1, R1, #5700\n  ADD R1, R1, R8\n  LW R0, R1, #0\n  CALLX sh_append_int\nsds_em_nl:\n  LI R0, #10\n  ST R0, R5, #0\n  ADDI R5, R5, #1\nsds_nx_cell:\n  ADDI R4, R4, #1\n  JMPX sds_cell_lp\n\nsds_wr_disk:\n  LI R0, #0\n  ST R0, R5, #0\n  LI R1, #14000 - 19683\n  LMI R1, #1\n  ADD R1, R1, R8 ; start of file_io_buf\n  SUB R2, R5, R1 ; byte length\n  ADDI R0, R8, #5050 ; \"SHEET\"\n  LI R3, #1\n  SYSCALL #32\n  JMPX sh_ev_lp\n\n; sh_append_str: copies null-terminated string at R1 into R5, advancing R5\nsh_append_str:\n  PUSH R0\n  PUSH R1\nsas_lp:\n  LT R0, R1, #0\n  CMPI R0, #0\n  JZX sas_done\n  ST R0, R5, #0\n  ADDI R1, R1, #1\n  ADDI R5, R5, #1\n  JMPX sas_lp\nsas_done:\n  POP R1\n  POP R0\n  RET\n\n; sh_append_int: formats signed integer R0 in decimal at R5, advancing R5\nsh_append_int:\n  PUSH R0\n  PUSH R1\n  PUSH R2\n  PUSH R3\n  PUSH R4\n  CMPI R0, #0\n  JPX sai_pos\n  JNX sai_neg\n  LI R1, #'0'\n  ST R1, R5, #0\n  ADDI R5, R5, #1\n  JMPX sai_done\nsai_neg:\n  LI R1, #'-'\n  ST R1, R5, #0\n  ADDI R5, R5, #1\n  NEG R0, R0\nsai_pos:\n  ADDI R2, R8, #5070 ; reverse digit scratch\n  LI R3, #0 ; count\n  LI R4, #10\nsai_lp:\n  CMPI R0, #0\n  JZX sai_rev\n  MOD R1, R0, R4\n  DIV R0, R0, R4\n  ADDI R1, R1, #48\n  ST R1, R2, #0\n  ADDI R2, R2, #1\n  ADDI R3, R3, #1\n  JMPX sai_lp\nsai_rev:\n  CMPI R3, #0\n  JZX sai_done\n  SUBI R2, R2, #1\n  SUBI R3, R3, #1\n  LT R1, R2, #0\n  ST R1, R5, #0\n  ADDI R5, R5, #1\n  JMPX sai_rev\nsai_done:\n  POP R4\n  POP R3\n  POP R2\n  POP R1\n  POP R0\n  RET\n\n; sh_do_load: reads \"SHEET\" into file_io_buf, parses \"<Col><Row>:<raw>=...\" lines, and recalculates\nsh_do_load:\n  CALLX sh_clear_all\n  ADDI R0, R8, #5050\n  LI R1, #14000 - 19683\n  LMI R1, #1\n  ADD R1, R1, R8\n  LI R2, #7000\n  SYSCALL #31\n  CMPI R0, #0\n  JNPX sh_ev_lp\n  LI R1, #14000 - 19683\n  LMI R1, #1\n  ADD R1, R1, R8 ; cursor in file_io_buf\nsdl_line_lp:\n  LT R0, R1, #0\n  CMPI R0, #0\n  JZX sdl_done\n  CMPI R0, #10\n  JZX sdl_sk_nl\n  CALLX sh_parse_cell_ref ; R0 = cell_idx, advances R1\n  CMPI R0, #0\n  JNX sdl_done\n  LT R2, R1, #0\n  CMPI R2, #':'\n  JNZX sdl_done\n  ADDI R1, R1, #1\n  MULI R2, R0, #24\n  ADDI R2, R2, #6600\n  ADD R2, R2, R8 ; dst in FORMULA_BUF\n  ; Copy up to last '=' on the line (or newline)\n  ; Wait: a formula starts with '=', so copy first char, then copy until '=' or 'NL'!\n  LT R3, R1, #0\n  CMPI R3, #0\n  JZX sdl_done\n  CMPI R3, #10\n  JZX sdl_sk_nl\n  ST R3, R2, #0\n  ADDI R1, R1, #1\n  ADDI R2, R2, #1\nsdl_cp_raw:\n  LT R3, R1, #0\n  CMPI R3, #0\n  JZX sdl_term_raw\n  CMPI R3, #10\n  JZX sdl_term_raw\n  CMPI R3, #'='\n  JZX sdl_term_raw\n  ST R3, R2, #0\n  ADDI R1, R1, #1\n  ADDI R2, R2, #1\n  JMPX sdl_cp_raw\nsdl_term_raw:\n  LI R3, #0\n  ST R3, R2, #0\n  ; Skip rest of line up to 'NL'\nsdl_sk_eol:\n  LT R3, R1, #0\n  CMPI R3, #0\n  JZX sdl_done\n  CMPI R3, #10\n  JZX sdl_sk_nl\n  ADDI R1, R1, #1\n  JMPX sdl_sk_eol\nsdl_sk_nl:\n  ADDI R1, R1, #1\n  JMPX sdl_line_lp\nsdl_done:\n  CALLX sh_recalc_all\n  ADDI R6, R8, #5003\n  LI R0, #1\n  ST R0, R6, #0\n  JMPX sh_ev_lp\n\nsh_redraw:\n  PUSH R0\n  PUSH R1\n  PUSH R2\n  PUSH R3\n  PUSH R4\n  PUSH R5\n  PUSH R6\n  PUSH R7\n\n  LI R0, #0\n  LI R1, #0\n  LI R2, #218\n  LI R3, #120\n  LI R4, #-315\n  SYSCALL #20\n\n  ; Toolbar at (4, 2)\n  LI R0, #4\n  LI R1, #2\n  LI R2, #str_sh_bar - app9_sheet_rom\n  ADD R2, R2, R8\n  LI R3, #COL_WHITE\n  LI R4, #-230\n  SYSCALL #21\n\n  ; Column headers at (24, 16)\n  LI R0, #4\n  LI R1, #16\n  LI R2, #str_sh_hdr - app9_sheet_rom\n  ADD R2, R2, R8\n  LI R3, #COL_CYAN\n  LI R4, #-315\n  SYSCALL #21\n\n  ; Draw visible rows r = 0..7, cols c = 0..3\n  LI R6, #0 ; r = 0..7\nshrd_rlp:\n  CMPI R6, #8\n  JNNX shrd_flush\n  MULI R1, R6, #12\n  ADDI R1, R1, #28 ; y = 28 + r * 12\n  ; Row number R6 + 1 at x = 4\n  LI R0, #4\n  ADDI R2, R6, #1\n  LI R3, #10\n  LI R4, #COL_CYAN\n  LI R5, #-315\n  SYSCALL #26\n\n  LI R7, #0 ; c = 0..3\nshrd_clp:\n  CMPI R7, #4\n  JNNX shrd_rnx\n  MULI R0, R6, #10\n  ADD R0, R0, R7 ; cell_idx = r*10 + c\n  ADDI R2, R8, #5100\n  ADD R2, R2, R0\n  LT R3, R2, #0 ; CELL_TYPE\n  CMPI R3, #0\n  JZX shrd_cnx\n\n  MULI R4, R7, #48\n  ADDI R4, R4, #26 ; x = 26 + c * 48\n  MULI R1, R6, #12\n  ADDI R1, R1, #28 ; y\n  CMPI R3, #1\n  JZX shrd_c_num\n  CMPI R3, #2\n  JZX shrd_c_txt\n  CMPI R3, #3\n  JZX shrd_c_div0\n  ; #CYCLE!\n  MOV R0, R4\n  LI R2, #str_sh_cycle - app9_sheet_rom\n  ADD R2, R2, R8\n  LI R3, #COL_RED\n  LI R4, #-315\n  SYSCALL #21\n  JMPX shrd_cnx\nshrd_c_div0:\n  MOV R0, R4\n  LI R2, #str_sh_div0 - app9_sheet_rom\n  ADD R2, R2, R8\n  LI R3, #COL_RED\n  LI R4, #-315\n  SYSCALL #21\n  JMPX shrd_cnx\nshrd_c_txt:\n  MULI R2, R0, #24\n  ADDI R2, R2, #6600\n  ADD R2, R2, R8\n  MOV R0, R4\n  LI R3, #COL_YELLOW\n  LI R4, #-315\n  SYSCALL #21\n  JMPX shrd_cnx\nshrd_c_num:\n  MULI R2, R0, #3\n  ADDI R2, R2, #5700\n  ADD R2, R2, R8\n  LW R2, R2, #0\n  MOV R0, R4\n  LI R3, #10\n  LI R4, #COL_WHITE\n  LI R5, #-315\n  SYSCALL #26\n\nshrd_cnx:\n  ADDI R7, R7, #1\n  JMPX shrd_clp\nshrd_rnx:\n  ADDI R6, R6, #1\n  JMPX shrd_rlp\n\nshrd_flush:\n  LI R0, #0\n  LI R1, #0\n  LI R2, #0\n  LI R3, #0\n  SYSCALL #24\n  POP R7\n  POP R6\n  POP R5\n  POP R4\n  POP R3\n  POP R2\n  POP R1\n  POP R0\n  RET\n\nstr_sh_title: .stringz \"SHEET\"\nstr_sh_bar:   .stringz \"[SAVE] [LOAD] [CLR] SHEET\"\nstr_sh_hdr:   .stringz \"R   A     B     C     D\"\nstr_sh_div0:  .stringz \"#DIV/0!\"\nstr_sh_cycle: .stringz \"#CYCLE!\"\napp9_sheet_end:\n\n; ----------------------------------------------------------------------------\n; APP 10: STUDIONET v2 CLIENT & SERVER (APP_ID = 10)\n; Speaks StudioNet 16-byte wire format (spiralos/STUDIONET.md \u00a72 & os/net.sp):\n;   - Chat: SDP (proto 2) on port 4200, flags PSH, payload = msg + NUL (shows sender hex ID)\n;   - Ping: SDP (proto 2) on port 7, flags PSH / ACK|PSH, shows RTT in virtual steps or NO REPLY\n;   - File push: SSP (proto 3) on port 4300 (and 4301 for multi-chunk), byte ('B') & tryte ('T') modes\n; Memory layout (relative to R8 = UBASE):\n;   +5000..5119: net_stat_buf (populated by SYSCALL #45 SYS_NET_STATUS, saved to \"NET\")\n;   +5120..5122: peer_node (3-tryte word; default: 4 if local_node==3, else 3)\n;   +5123:       in_len\n;   +5124..5126: last_state_sig (3-tryte word)\n;   +5127:       dirty\n;   +5130..5189: in_buf (chat input or command)\n;   +5300..5315: send_fn_buf (default \"BIGFILE\")\n; ----------------------------------------------------------------------------\napp10_net_rom:\n  LI R0, #270\n  LI R1, #32\n  LI R2, #240\n  LI R3, #140\n  LI R4, #str_net_title - app10_net_rom\n  ADD R4, R4, R8\n  LI R5, #-320\n  SYSCALL #10\n\n  ; Determine default peer_node: if local_node == 3 -> peer = 4, else peer = 3\n  SYSCALL #40 ; R0 = local node_id\n  ADDI R6, R8, #5120\n  LI R1, #4\n  CMPI R0, #3\n  JZX net_peer_ok\n  LI R1, #3\nnet_peer_ok:\n  SW R1, R6, #0 ; peer_node\n  LI R0, #0\n  ST R0, R6, #3 ; in_len = 0\n  LI R0, #-1\n  SW R0, R6, #4 ; last_state_sig = -1\n  LI R0, #1\n  ST R0, R6, #7 ; dirty = 1\n  LI R0, #0\n  ST R0, R6, #10 ; in_buf[0] = 0\n\n  ; Default file to send: \"BIGFILE\" at UBASE + 5300\n  ADDI R6, R8, #5300\n  LI R0, #'B'\n  ST R0, R6, #0\n  LI R0, #'I'\n  ST R0, R6, #1\n  LI R0, #'G'\n  ST R0, R6, #2\n  LI R0, #'F'\n  ST R0, R6, #3\n  LI R0, #'I'\n  ST R0, R6, #4\n  LI R0, #'L'\n  ST R0, R6, #5\n  LI R0, #'E'\n  ST R0, R6, #6\n  LI R0, #0\n  ST R0, R6, #7\n\n  CALLX net_refresh_and_draw\n\nnet_ev_lp:\n  SYSCALL #25\n  CMPI R0, #0\n  JZX net_idle\n  CMPI R0, #1\n  JZX net_on_key\n  CMPI R0, #2\n  JZX net_on_click\n  JMPX net_ev_lp\n\nnet_idle:\n  ; Poll SYS_NET_STATUS (#45) to see if rx_pkts, last_rtt, or status_msg changed\n  ADDI R0, R8, #5000\n  SYSCALL #45 ; R0 = rx_pkts\n  ADDI R5, R8, #5000\n  LW R1, R5, #15 ; last_rtt\n  MULI R1, R1, #17\n  ADD R0, R0, R1\n  LT R1, R5, #100 ; status_msg[0]\n  ADD R0, R0, R1\n  ADDI R6, R8, #5120\n  LW R1, R6, #4 ; last_state_sig\n  CMP R0, R1\n  JZX net_chk_dirty\n  SW R0, R6, #4\n  LI R0, #1\n  ST R0, R6, #7\nnet_chk_dirty:\n  LT R0, R6, #7\n  CMPI R0, #0\n  JZX net_do_yield\n  LI R0, #0\n  ST R0, R6, #7\n  CALLX net_refresh_and_draw\nnet_do_yield:\n  SYSCALL #2\n  JMPX net_ev_lp\n\nnet_on_click:\n  CMPI R2, #14\n  JNNX net_ev_lp\n  CMPI R1, #50\n  JNX net_do_ping\n  CMPI R1, #108\n  JNX net_do_send_file\n  CMPI R1, #160\n  JNX net_do_send_chat\n  JMPX net_do_save_stat\n\nnet_on_key:\n  CMPI R1, #200\n  JZX net_trig_fault\n  CMPI R1, #201\n  JZX net_trig_loop\n\n  CMPI R1, #16 ; Ctrl+P -> Ping peer\n  JZX net_do_ping\n  CMPI R1, #20 ; Ctrl+T -> Set peer_node from decimal in_buf\n  JZX net_do_set_peer\n  CMPI R1, #6  ; Ctrl+F -> Send file\n  JZX net_do_send_file\n  CMPI R1, #19 ; Ctrl+S -> Save net status to \"NET\"\n  JZX net_do_save_stat\n  CMPI R1, #13 ; Enter -> Send chat message\n  JZX net_do_send_chat\n  CMPI R1, #10\n  JZX net_do_send_chat\n  CMPI R1, #8\n  JZX net_in_bs\n\n  ADDI R6, R8, #5120\n  LT R2, R6, #3 ; in_len\n  CMPI R2, #48\n  JNNX net_ev_lp\n  ADDI R3, R6, #10\n  ADD R3, R3, R2\n  ST R1, R3, #0\n  LI R0, #0\n  ST R0, R3, #1\n  ADDI R2, R2, #1\n  ST R2, R6, #3\n  LI R0, #1\n  ST R0, R6, #7\n  JMPX net_ev_lp\n\nnet_trig_fault:\n  LI R1, #100\n  LI R0, #999\n  ST R0, R1, #0\n  JMPX net_ev_lp\nnet_trig_loop:\n  JMPX net_trig_loop\n\nnet_in_bs:\n  ADDI R6, R8, #5120\n  LT R2, R6, #3\n  CMPI R2, #0\n  JNPX net_ev_lp\n  SUBI R2, R2, #1\n  ST R2, R6, #3\n  ADDI R3, R6, #10\n  ADD R3, R3, R2\n  LI R0, #0\n  ST R0, R3, #0\n  LI R0, #1\n  ST R0, R6, #7\n  JMPX net_ev_lp\n\nnet_do_ping:\n  ADDI R6, R8, #5120\n  LW R0, R6, #0 ; peer_node\n  SYSCALL #43   ; SYS_NET_PING\n  LI R0, #1\n  ST R0, R6, #7\n  JMPX net_ev_lp\n\nnet_do_set_peer:\n  ADDI R6, R8, #5120\n  LT R2, R6, #3 ; in_len\n  CMPI R2, #0\n  JNPX net_ev_lp\n  ADDI R3, R6, #10\n  LI R0, #0\nndsp_lp:\n  CMPI R2, #0\n  JNPX ndsp_done\n  LT R1, R3, #0\n  SUBI R1, R1, #48\n  MULI R0, R0, #10\n  ADD R0, R0, R1\n  ADDI R3, R3, #1\n  SUBI R2, R2, #1\n  JMPX ndsp_lp\nndsp_done:\n  SW R0, R6, #0 ; peer_node = parsed int\n  LI R0, #0\n  ST R0, R6, #3 ; in_len = 0\n  ST R0, R6, #10\n  LI R0, #1\n  ST R0, R6, #7\n  JMPX net_ev_lp\n\nnet_do_send_file:\n  ADDI R6, R8, #5120\n  LT R2, R6, #3 ; if in_len > 0, copy in_buf (+5130) to +5300\n  CMPI R2, #0\n  JNPX ndsf_go\n  ADDI R0, R8, #5300\n  ADDI R1, R6, #10\n  ADDI R2, R2, #1\n  BCOPY R0, R1, R2\n  LI R0, #0\n  ST R0, R6, #3\n  ST R0, R6, #10\nndsf_go:\n  ADDI R6, R8, #5120\n  LW R0, R6, #0 ; peer_node\n  ADDI R1, R8, #5300\n  SYSCALL #44   ; SYS_NET_SEND_FILE\n  LI R0, #1\n  ST R0, R6, #7\n  JMPX net_ev_lp\n\nnet_do_send_chat:\n  ; Send SDP chat on port 4200: payload = in_buf (+5130), len = in_len + 1 (includes NUL)\n  ADDI R6, R8, #5120\n  LT R4, R6, #3 ; in_len\n  CMPI R4, #0\n  JNPX net_ev_lp\n  LW R0, R6, #0 ; dst_node = peer_node\n  ADDI R1, R6, #10 ; msg_ptr (+5130)\n  ADDI R2, R4, #1  ; msg_len = in_len + 1 (includes NUL)\n  SYSCALL #41   ; SYS_NET_SEND\n\n  ; Reset in_len = 0\n  LI R0, #0\n  ST R0, R6, #3\n  LI R0, #1\n  ST R0, R6, #7\n  JMPX net_ev_lp\n\nnet_do_save_stat:\n  ADDI R0, R8, #5000\n  SYSCALL #45\n  LI R0, #str_net_fn - app10_net_rom\n  ADD R0, R0, R8\n  ADDI R1, R8, #5000\n  LI R2, #100\n  LI R3, #1\n  SYSCALL #32\n  JMPX net_ev_lp\n\nnet_refresh_and_draw:\n  PUSH R0\n  PUSH R1\n  PUSH R2\n  PUSH R3\n  PUSH R4\n  PUSH R5\n  PUSH R6\n\n  ADDI R0, R8, #5000\n  SYSCALL #45\n\n  LI R0, #0\n  LI R1, #0\n  LI R2, #238\n  LI R3, #127\n  LI R4, #-320\n  SYSCALL #20\n\n  ; Toolbar at (4, 2)\n  LI R0, #4\n  LI R1, #2\n  LI R2, #str_net_bar - app10_net_rom\n  ADD R2, R2, R8\n  LI R3, #COL_WHITE\n  LI R4, #-230\n  SYSCALL #21\n\n  ; Node ID & RX stats at y=18\n  LI R0, #6\n  LI R1, #18\n  LI R2, #str_net_nd - app10_net_rom\n  ADD R2, R2, R8\n  LI R3, #COL_CYAN\n  LI R4, #-320\n  SYSCALL #21\n\n  ADDI R6, R8, #5000\n  LW R2, R6, #0 ; node_id\n  LI R0, #48\n  LI R1, #18\n  LI R3, #10\n  LI R4, #COL_WHITE\n  LI R5, #-320\n  SYSCALL #26\n\n  LI R0, #80\n  LI R1, #18\n  LI R2, #str_net_rx - app10_net_rom\n  ADD R2, R2, R8\n  LI R3, #COL_CYAN\n  LI R4, #-320\n  SYSCALL #21\n\n  LW R2, R6, #6 ; rx_pkts\n  LI R0, #112\n  LI R1, #18\n  LI R3, #10\n  LI R4, #COL_GREEN\n  LI R5, #-320\n  SYSCALL #26\n\n  ; Ping RTT (or NO REPLY) at y=34 (client x=48 -> screen x=319, y=78)\n  LI R0, #6\n  LI R1, #34\n  LI R2, #str_net_rtt - app10_net_rom\n  ADD R2, R2, R8\n  LI R3, #COL_CYAN\n  LI R4, #-320\n  SYSCALL #21\n\n  LW R2, R6, #15 ; last_rtt\n  CMPI R2, #0\n  JNX nrad_no_reply\n  LI R0, #48\n  LI R1, #34\n  LI R3, #10\n  LI R4, #COL_YELLOW\n  LI R5, #-320\n  SYSCALL #26\n  JMPX nrad_tx_line\nnrad_no_reply:\n  LI R0, #48\n  LI R1, #34\n  ADDI R2, R8, #5100 ; status_msg (\"NO REPLY\")\n  LI R3, #COL_YELLOW\n  LI R4, #-320\n  SYSCALL #21\n\nnrad_tx_line:\n  ; Last TX chat at y=52\n  LI R0, #6\n  LI R1, #52\n  LI R2, #str_net_txc - app10_net_rom\n  ADD R2, R2, R8\n  LI R3, #COL_CYAN\n  LI R4, #-320\n  SYSCALL #21\n\n  LI R0, #38\n  LI R1, #52\n  ADDI R2, R8, #5130 ; in_buf / last sent\n  LI R3, #COL_WHITE\n  LI R4, #-320\n  SYSCALL #21\n\n  ; Last RX Chat message (<HEX4>:<msg>) at y=70 (client x=38 -> screen x=309, y=114)\n  LI R0, #6\n  LI R1, #70\n  LI R2, #str_net_rxc - app10_net_rom\n  ADD R2, R2, R8\n  LI R3, #COL_GREEN\n  LI R4, #-320\n  SYSCALL #21\n\n  LI R0, #38\n  LI R1, #70\n  ADDI R2, R8, #5020 ; last_chat (+20 in net_stat_buf)\n  LI R3, #COL_YELLOW\n  LI R4, #-320\n  SYSCALL #21\n\n  ; Last RX File at y=88\n  LI R0, #6\n  LI R1, #88\n  LI R2, #str_net_sfp - app10_net_rom\n  ADD R2, R2, R8\n  LI R3, #COL_CYAN\n  LI R4, #-320\n  SYSCALL #21\n\n  LI R0, #54\n  LI R1, #88\n  ADDI R2, R8, #5084 ; last_file (+84 in net_stat_buf)\n  LI R3, #COL_WHITE\n  LI R4, #-320\n  SYSCALL #21\n\n  ; Status message (e.g. \"TOO BIG FOR SPIRALOS\", \"ACK OK\", \"NO REPLY\") at y=104 (screen x=277, y=148)\n  LI R0, #6\n  LI R1, #104\n  ADDI R2, R8, #5100 ; status_msg (+100 in net_stat_buf)\n  LI R3, #COL_YELLOW\n  LI R4, #-320\n  SYSCALL #21\n\n  LI R0, #0\n  LI R1, #0\n  LI R2, #0\n  LI R3, #0\n  SYSCALL #24\n\n  POP R6\n  POP R5\n  POP R4\n  POP R3\n  POP R2\n  POP R1\n  POP R0\n  RET\n\nstr_net_title: .stringz \"STUDIONET\"\nstr_net_bar:   .stringz \"[PING] [SENDF] [CHAT] [SV]\"\nstr_net_nd:    .stringz \"NODE:\"\nstr_net_rx:    .stringz \"RX:\"\nstr_net_rtt:   .stringz \"RTT:\"\nstr_net_txc:   .stringz \"TX:\"\nstr_net_rxc:   .stringz \"RX:\"\nstr_net_sfp:   .stringz \"FILE:\"\nstr_net_fn:    .stringz \"NET\"\napp10_net_end:\n\n; ----------------------------------------------------------------------------\n; APP 11: TRYTRIS (APP_ID = 11)\n; Triangular falling-piece game matching trytris/index.html TrytrisEngine.\n; Memory layout (relative to R8 = UBASE):\n;   +5000..5354: TRY_STATE (355 trytes, saved to \"TRYSTATE\"):\n;     +5000..5002: seed (word)\n;     +5003:       mode (0=NORMAL, 1=CURSED, 2=HEXIAMOND)\n;     +5004..5006: score (word)\n;     +5007:       lines\n;     +5008:       level (1..15)\n;     +5009:       comboStreak\n;     +5010:       backToBackActive (0/1)\n;     +5011:       gameOver (0/1)\n;     +5012:       active_id (0 or 1..16)\n;     +5013:       active_rot (0..5)\n;     +5014:       active_r\n;     +5015:       active_c\n;     +5016..5018: next_ids[0..2]\n;     +5019..5354: board[0..335] (28 rows * 12 cols)\n;   +5360..5362: high_score (word, persisted in \"TRYHI\")\n;   +5363..5365: prng_a (word, Mulberry32 state)\n;   +5366..5368: last_grav_ticks (word)\n;   +5369..5371: pending_seed (word, -1 if none)\n;   +5372:       pending_mode (0..2)\n;   +5373:       pending_level (1..15)\n;   +5374:       lockstep (0=LIVE, 1=LOCK)\n;   +5375:       dirty (0/1)\n;   +5376:       bag_len (0..31)\n;   +5377:       last_vocab_sig (-1, 0=TET4, 1=CURSED16, 2=HEX12)\n;   +5380..5411: bag[0..31]\n;   +5420..5435: vocab_tmp[0..15]\n;   +5440..5471: scratch[0..31]\n;   +6000..15503: board_fb (66 x 144 pixels)\n;   +16000..26367: tzf_fb (72 x 144 pixels)\n; ----------------------------------------------------------------------------\napp11_try_rom:\n  LI R0, #10\n  LI R1, #10\n  LI R2, #240\n  LI R3, #159\n  LI R4, #str_try_title - app11_try_rom\n  ADD R4, R4, R8\n  LI R5, #-320\n  SYSCALL #10\n\n  ; Load persisted high_score from \"TRYHI\"\n  LI R1, #5360\n  ADD R6, R8, R1\n  LI R0, #0\n  SW R0, R6, #0\n  LI R0, #str_try_hifn - app11_try_rom\n  ADD R0, R0, R8\n  MOV R1, R6\n  LI R2, #3\n  SYSCALL #31\n\n  ; Init config: seed=42, pending_seed=-1, pending_mode=0, pending_level=1, lockstep=0\n  LI R1, #5000\n  ADD R6, R8, R1\n  LI R0, #42\n  SW R0, R6, #0\n  LI R1, #5369\n  ADD R6, R8, R1\n  LI R0, #-1\n  SW R0, R6, #0 ; pending_seed = -1\n  LI R0, #0\n  ST R0, R6, #3 ; pending_mode = 0\n  LI R0, #1\n  ST R0, R6, #4 ; pending_level = 1\n  LI R0, #0\n  ST R0, R6, #5 ; lockstep = 0\n  ST R0, R6, #6 ; dirty = 0\n\n  CALLX try_reset\n  CALLX try_redraw\n\ntry_ev_lp:\n  SYSCALL #25\n  CMPI R0, #0\n  JZX try_check_grav\n  CMPI R0, #1\n  JZX try_on_key\n  JMPX try_ev_lp\n\ntry_check_grav:\n  LI R1, #5374\n  ADD R6, R8, R1\n  LT R0, R6, #0 ; lockstep\n  CMPI R0, #0\n  JNZX try_idle_draw\n  LI R1, #5011\n  ADD R6, R8, R1\n  LT R0, R6, #0 ; gameOver\n  CMPI R0, #0\n  JNZX try_idle_draw\n\n  SYSCALL #3 ; R0 = current virtual ticks\n  LI R1, #5366\n  ADD R6, R8, R1\n  LW R1, R6, #0 ; last_grav_ticks\n  SUB R2, R0, R1\n  ; interval = max(22000, 170000 - (level - 1) * 10000) (200 steps/ms)\n  LI R1, #5008\n  ADD R5, R8, R1\n  LT R3, R5, #0 ; level 1..15\n  SUBI R3, R3, #1\n  LI R4, #10000 - 19683\n  LMI R4, #1\n  MUL R3, R3, R4\n  LI R4, #-7247\n  LMI R4, #9 ; -7247 + 9*19683 = 170000\n  SUB R4, R4, R3\n  LI R3, #2317\n  LMI R3, #1 ; 2317 + 19683 = 22000\n  CMP R4, R3\n  JNNX tcg_int_ok\n  MOV R4, R3\ntcg_int_ok:\n  CMP R2, R4\n  JNX try_idle_draw\n  SW R0, R6, #0 ; update last_grav_ticks\n  LI R0, #0\n  CALLX try_tick\n  LI R1, #5375\n  ADD R6, R8, R1\n  LI R0, #1\n  ST R0, R6, #0\n\ntry_idle_draw:\n  LI R1, #5375\n  ADD R6, R8, R1\n  LT R0, R6, #0 ; dirty\n  CMPI R0, #0\n  JZX try_do_yield\n  LI R0, #0\n  ST R0, R6, #0\n  CALLX try_redraw\ntry_do_yield:\n  SYSCALL #2\n  JMPX try_ev_lp\n\ntry_on_key:\n  CMPI R1, #200\n  JZX try_trig_fault\n  CMPI R1, #201\n  JZX try_trig_loop\n\n  ; Digits '0'..'9' accumulate pending_seed\n  CMPI R1, #48\n  JNX try_key_act\n  CMPI R1, #57\n  JPX try_key_act\n  SUBI R1, R1, #48\n  LI R2, #5369\n  ADD R6, R8, R2\n  LW R0, R6, #0 ; pending_seed\n  CMPI R0, #-1\n  JNZX tok_seed_acc\n  SW R1, R6, #0\n  JMPX tok_mark_dirty\ntok_seed_acc:\n  MULI R0, R0, #10\n  ADD R0, R0, R1\n  LI R2, #c_pow32 - app11_try_rom\n  ADD R2, R2, R8\n  LW R2, R2, #0\n  MOD R0, R0, R2\n  SW R0, R6, #0\ntok_mark_dirty:\n  LI R2, #5375\n  ADD R6, R8, R2\n  LI R0, #1\n  ST R0, R6, #0\n  JMPX try_ev_lp\n\ntry_trig_fault:\n  LI R1, #100\n  LI R0, #999\n  ST R0, R1, #0\n  JMPX try_ev_lp\ntry_trig_loop:\n  JMPX try_trig_loop\n\ntry_key_act:\n  CMPI R1, #'M'\n  JZX try_cmd_mode\n  CMPI R1, #'m'\n  JZX try_cmd_mode\n  CMPI R1, #'U'\n  JZX try_cmd_lvl_up\n  CMPI R1, #'u'\n  JZX try_cmd_lvl_up\n  CMPI R1, #'D'\n  JZX try_cmd_lvl_dn\n  CMPI R1, #'d'\n  JZX try_cmd_lvl_dn\n  CMPI R1, #'K'\n  JZX try_cmd_lockstep\n  CMPI R1, #'k'\n  JZX try_cmd_lockstep\n  CMPI R1, #13\n  JZX try_cmd_new\n  CMPI R1, #10\n  JZX try_cmd_new\n\n  ; Gameplay / lockstep actions: L, R, X, Z, Space, N, S (and arrows)\n  CMPI R1, #'L'\n  JZX try_act_left\n  CMPI R1, #'l'\n  JZX try_act_left\n  CMPI R1, #128\n  JZX try_act_left\n  CMPI R1, #'R'\n  JZX try_act_right\n  CMPI R1, #'r'\n  JZX try_act_right\n  CMPI R1, #129\n  JZX try_act_right\n  CMPI R1, #'X'\n  JZX try_act_rotcw\n  CMPI R1, #'x'\n  JZX try_act_rotcw\n  CMPI R1, #130\n  JZX try_act_rotcw\n  CMPI R1, #'Z'\n  JZX try_act_rotccw\n  CMPI R1, #'z'\n  JZX try_act_rotccw\n  CMPI R1, #32\n  JZX try_act_hard\n  CMPI R1, #'N'\n  JZX try_act_null\n  CMPI R1, #'n'\n  JZX try_act_null\n  CMPI R1, #'S'\n  JZX try_act_soft\n  CMPI R1, #'s'\n  JZX try_act_soft\n  CMPI R1, #131\n  JZX try_act_soft\n  JMPX try_ev_lp\n\ntry_cmd_mode:\n  LI R2, #5372\n  ADD R6, R8, R2\n  LT R0, R6, #0\n  ADDI R0, R0, #1\n  CMPI R0, #3\n  JNX tcm_ok\n  LI R0, #0\ntcm_ok:\n  ST R0, R6, #0\n  JMPX tok_mark_dirty\n\ntry_cmd_lvl_up:\n  LI R2, #5373\n  ADD R6, R8, R2\n  LT R0, R6, #0\n  ADDI R0, R0, #1\n  CMPI R0, #16\n  JNX tclu_ok\n  LI R0, #1\ntclu_ok:\n  ST R0, R6, #0\n  JMPX tok_mark_dirty\n\ntry_cmd_lvl_dn:\n  LI R2, #5373\n  ADD R6, R8, R2\n  LT R0, R6, #0\n  SUBI R0, R0, #1\n  CMPI R0, #1\n  JNNX tcld_ok\n  LI R0, #15\ntcld_ok:\n  ST R0, R6, #0\n  JMPX tok_mark_dirty\n\ntry_cmd_lockstep:\n  LI R2, #5374\n  ADD R6, R8, R2\n  LT R0, R6, #0\n  LI R1, #1\n  SUB R0, R1, R0\n  ST R0, R6, #0\n  LI R2, #5375\n  ADD R5, R8, R2\n  LI R1, #1\n  ST R1, R5, #0\n  CMPI R0, #0\n  JZX try_ev_lp\n  CALLX try_write_state\n  JMPX try_ev_lp\n\ntry_cmd_new:\n  LI R2, #5369\n  ADD R6, R8, R2\n  LW R0, R6, #0 ; pending_seed\n  CMPI R0, #-1\n  JZX tcn_keep_seed\n  LI R2, #5000\n  ADD R5, R8, R2\n  SW R0, R5, #0 ; seed = pending_seed\n  LI R0, #-1\n  SW R0, R6, #0 ; pending_seed = -1\ntcn_keep_seed:\n  CALLX try_reset\n  JMPX try_post_action\n\ntry_act_left:\n  LI R0, #1\n  JMPX try_do_tick\ntry_act_right:\n  LI R0, #2\n  JMPX try_do_tick\ntry_act_rotcw:\n  LI R0, #3\n  JMPX try_do_tick\ntry_act_rotccw:\n  LI R0, #4\n  JMPX try_do_tick\ntry_act_hard:\n  LI R0, #5\n  JMPX try_do_tick\ntry_act_null:\n  LI R0, #0\ntry_do_tick:\n  CALLX try_tick\n  JMPX try_post_action\ntry_act_soft:\n  CALLX try_soft_drop\n\ntry_post_action:\n  LI R2, #5375\n  ADD R6, R8, R2\n  LI R0, #1\n  ST R0, R6, #0 ; dirty = 1\n  LI R2, #5374\n  ADD R6, R8, R2\n  LT R0, R6, #0 ; lockstep\n  CMPI R0, #0\n  JZX try_ev_lp\n  CALLX try_write_state\n  JMPX try_ev_lp\n\n; ----------------------------------------------------------------------------\n; try_write_state: writes 355-tryte TRY_STATE (+5000) to disk file \"TRYSTATE\"\n; ----------------------------------------------------------------------------\ntry_write_state:\n  PUSH R0\n  PUSH R1\n  PUSH R2\n  PUSH R3\n  LI R0, #str_try_stfn - app11_try_rom\n  ADD R0, R0, R8\n  LI R1, #5000\n  ADD R1, R1, R8\n  LI R2, #355\n  LI R3, #1\n  SYSCALL #32\n  POP R3\n  POP R2\n  POP R1\n  POP R0\n  RET\n\n; ----------------------------------------------------------------------------\n; try_reset: reset(seed, pending_mode) followed by setLevel(pending_level)\n; ----------------------------------------------------------------------------\ntry_reset:\n  PUSH R0\n  PUSH R1\n  PUSH R2\n  PUSH R3\n  PUSH R6\n\n  LI R1, #5000\n  ADD R6, R8, R1\n  LW R0, R6, #0 ; seed\n  LI R1, #5363\n  ADD R5, R8, R1\n  SW R0, R5, #0 ; prng_a = seed\n\n  LI R1, #5372\n  ADD R5, R8, R1\n  LT R0, R5, #0 ; pending_mode\n  ST R0, R6, #3 ; mode\n\n  LI R0, #0\n  SW R0, R6, #4 ; score = 0\n  ST R0, R6, #7 ; lines = 0\n  ST R0, R6, #9 ; comboStreak = 0\n  ST R0, R6, #10 ; backToBackActive = 0\n  ST R0, R6, #11 ; gameOver = 0\n  ST R0, R6, #12 ; active_id = 0\n  ST R0, R6, #13 ; active_rot = 0\n  ST R0, R6, #14 ; active_r = 0\n  ST R0, R6, #15 ; active_c = 0\n  LI R0, #1\n  ST R0, R6, #8 ; level = 1\n\n  ; Clear bag_len=0, last_vocab_sig=-1\n  LI R1, #5376\n  ADD R5, R8, R1\n  LI R0, #0\n  ST R0, R5, #0\n  LI R0, #-1\n  ST R0, R5, #1\n\n  ; Clear 336-cell board (+5019..5354)\n  LI R0, #5019\n  ADD R0, R0, R8\n  LI R1, #0\n  LI R2, #336\n  BFILL R0, R1, R2\n\n  ; Spawn first piece at level 1 (during reset)\n  CALLX try_spawn_next\n\n  ; Apply setLevel(pending_level)\n  LI R1, #5373\n  ADD R5, R8, R1\n  LT R0, R5, #0\n  ST R0, R6, #8 ; level = pending_level\n\n  ; Update next 3 preview in TRY_STATE (+5016..5018)\n  CALLX try_update_next3\n\n  SYSCALL #3\n  LI R1, #5366\n  ADD R5, R8, R1\n  SW R0, R5, #0 ; last_grav_ticks = ticks\n\n  POP R6\n  POP R3\n  POP R2\n  POP R1\n  POP R0\n  RET\n\n; ----------------------------------------------------------------------------\n; 32-bit Unsigned Arithmetic & Mulberry32 PRNG\n; try_xor32(R0, R1) -> R0\n; try_imul32(R0, R1) -> R0\n; try_mulberry32() -> R0 (0..4294967295)\n; ----------------------------------------------------------------------------\ntry_xor32:\n  PUSH R1\n  PUSH R2\n  PUSH R3\n  PUSH R4\n  PUSH R5\n  PUSH R6\n  PUSH R7\n  LI R2, #0 ; result\n  LI R3, #1 ; multiplier = 16^k\n  LI R4, #8 ; 8 nibbles\n  LI R7, #try_xor_tbl - app11_try_rom\n  ADD R7, R7, R8\ntx32_lp:\n  CMPI R4, #0\n  JNPX tx32_done\n  LI R5, #16\n  MOD R6, R0, R5\n  DIV R0, R0, R5\n  MOD R5, R1, R5\n  PUSH R4\n  LI R4, #16\n  DIV R1, R1, R4\n  MULI R6, R6, #16\n  ADD R6, R6, R5\n  ADD R6, R6, R7\n  LT R6, R6, #0 ; nibble xor\n  MUL R6, R6, R3\n  ADD R2, R2, R6\n  MULI R3, R3, #16\n  POP R4\n  SUBI R4, R4, #1\n  JMPX tx32_lp\ntx32_done:\n  MOV R0, R2\n  POP R7\n  POP R6\n  POP R5\n  POP R4\n  POP R3\n  POP R2\n  POP R1\n  RET\n\ntry_imul32:\n  PUSH R1\n  PUSH R2\n  PUSH R3\n  PUSH R4\n  PUSH R5\n  PUSH R6\n  LI R2, #c_pow16 - app11_try_rom\n  ADD R2, R2, R8\n  LW R2, R2, #0 ; 65536\n  MOD R3, R0, R2 ; a_lo\n  DIV R4, R0, R2 ; a_hi\n  MOD R5, R1, R2 ; b_lo\n  DIV R6, R1, R2 ; b_hi\n  MUL R4, R4, R5 ; a_hi * b_lo\n  MUL R6, R3, R6 ; a_lo * b_hi\n  ADD R4, R4, R6\n  MOD R4, R4, R2 ; mid % 65536\n  MUL R4, R4, R2 ; mid * 65536\n  MUL R3, R3, R5 ; a_lo * b_lo\n  ADD R0, R3, R4\n  LI R2, #c_pow32 - app11_try_rom\n  ADD R2, R2, R8\n  LW R2, R2, #0 ; 4294967296\n  MOD R0, R0, R2\n  POP R6\n  POP R5\n  POP R4\n  POP R3\n  POP R2\n  POP R1\n  RET\n\ntry_mulberry32:\n  PUSH R1\n  PUSH R2\n  PUSH R3\n  PUSH R4\n  PUSH R5\n  PUSH R6\n  LI R1, #5363\n  ADD R6, R8, R1\n  LW R0, R6, #0 ; a\n  LI R2, #c_mul_inc - app11_try_rom\n  ADD R2, R2, R8\n  LW R1, R2, #0 ; 0x6D2B79F5\n  ; __PERTURB_TRY_PRNG__\n  ADD R0, R0, R1\n  LI R2, #c_pow32 - app11_try_rom\n  ADD R2, R2, R8\n  LW R4, R2, #0 ; 2^32\n  MOD R0, R0, R4\n  SW R0, R6, #0 ; a = t\n\n  MOV R5, R0 ; t\n  LI R2, #c_pow15 - app11_try_rom\n  ADD R2, R2, R8\n  LW R2, R2, #0 ; 32768\n  DIV R1, R5, R2\n  MOV R0, R5\n  CALLX try_xor32 ; R0 = t ^ (t >>> 15)\n\n  LI R2, #2\n  MOD R1, R5, R2\n  CMPI R1, #0\n  JNZX tm32_odd1\n  ADDI R1, R5, #1\n  JMPX tm32_m1\ntm32_odd1:\n  MOV R1, R5\ntm32_m1:\n  CALLX try_imul32\n  MOV R5, R0 ; t = imul(t ^ (t>>>15), t | 1)\n\n  LI R2, #128\n  DIV R1, R5, R2\n  CALLX try_xor32 ; R0 = t ^ (t >>> 7)\n\n  ; u2 = (t - (t % 64)) + 61 + ((t / 2) % 2) * 2\n  LI R2, #64\n  MOD R1, R5, R2\n  SUB R1, R5, R1\n  ADDI R1, R1, #61\n  LI R2, #2\n  DIV R3, R5, R2\n  MOD R3, R3, R2\n  MULI R3, R3, #2\n  ADD R1, R1, R3 ; u2 = t | 61\n\n  CALLX try_imul32\n  ADD R1, R5, R0\n  MOD R1, R1, R4 ; (t + imul(...)) % 2^32\n  MOV R0, R5\n  CALLX try_xor32\n  MOV R5, R0 ; t ^= u3\n\n  LI R2, #c_pow14 - app11_try_rom\n  ADD R2, R2, R8\n  LW R2, R2, #0 ; 16384\n  DIV R1, R5, R2\n  MOV R0, R5\n  CALLX try_xor32 ; R0 = t ^ (t >>> 14)\n\n  POP R6\n  POP R5\n  POP R4\n  POP R3\n  POP R2\n  POP R1\n  RET\n\n; ----------------------------------------------------------------------------\n; Bag Generator:\n; try_get_vocab_sig() -> R0 (0=TET4, 1=CURSED16, 2=HEX12)\n; try_sync_bag_vocab()\n; try_refill_bag()\n; try_next_piece() -> R0 (piece id 1..16)\n; try_update_next3()\n; ----------------------------------------------------------------------------\ntry_get_vocab_sig:\n  PUSH R1\n  PUSH R2\n  LI R1, #5003\n  ADD R2, R8, R1\n  LT R0, R2, #0 ; mode\n  CMPI R0, #2\n  JZX tgvs_he
