          const r1 = this.step();
          if (r1) {
            total += 1;
            skipped = this._tryFastForwardLoop(maxSteps - total);
          }
        }
        if (skipped > 0) {
          total += skipped;
          continue;
        }
      }
      const chunk = Math.min(20000, maxSteps - total);
      const ran = this.exports.run(chunk);
      this._syncHostTriggers();
      total += ran;
      if (ran === 0) break;
    }
    return total;
  }
}

const MNEM_MAP = {};

  OP_MAP[spec.op] = spec;
  if (spec.aliases) {
    for (const a of spec.aliases) MNEM_MAP[a] = spec;
  }

// Provenance: carried from triton.html lines 2453–2608
function intToTernaryStr(val, width = 9) {
  const trits = new Array(width).fill(0);
  let v = BigInt(val);
  for (let i = 0; i < width; i++) {
    let r = Number(v % 3n);
    v = (v - BigInt(r)) / 3n;
    if (r === 2) { r = -1; v += 1n; }
    else if (r === -2) { r = 1; v -= 1n; }
    trits[i] = r;
  }
  return trits.reverse().map(t => (t === 1 ? '1' : t === -1 ? 'T' : '0')).join('');
}

function ternaryStrToBigInt(str) {
  let acc = 0n;
  for (let i = 0; i < str.length; i++) {
    const c = str[i];
    let t = 0n;
    if (c === '1' || c === 'P' || c === '+') t = 1n;
    else if (c === 'T' || c === 'N' || c === '-') t = -1n;
    else if (c === '0' || c === 'Z') t = 0n;
    else throw new Error(`Invalid balanced-ternary digit '${c}' in '${str}'`);
    acc = acc * 3n + t;
  }
  return acc;
}

function parseRegister(tok) {
  const m = /^r([0-8])$/i.exec(tok.trim());
  if (!m) throw new Error(`Expected register R0..R8, got '${tok}'`);
  return parseInt(m[1], 10);
}

function encodeInstruction(op, rd, rs1, t1) {
  const ed = balRem(rd, 9, 4);
  const e1 = balRem(rs1, 9, 4);
  const tryte0 = op * 81 + ed * 9 + e1;
  const tryte1 = balRem(t1, TRYTE_MOD, TRYTE_HALF);
  return [tryte0 === 0 ? 0 : tryte0, tryte1 === 0 ? 0 : tryte1];
}

function decodeInstruction(tryte0, tryte1) {
  const e1 = balRem(tryte0, 9, 4);
  const q1 = balQuot(tryte0, 9, 4);
  const ed = balRem(q1, 9, 4);
  const op = balQuot(q1, 9, 4);
  const rs1 = (e1 + 9) % 9;
  const rd = (ed + 9) % 9;
  const e2 = balRem(tryte1, 9, 4);
  const rs2 = (e2 + 9) % 9;
  const imm9 = balRem(tryte1, TRYTE_MOD, TRYTE_HALF);
  return { op, rd, rs1, rs2, imm9 };
}

function stripComment(line) {
  let inSingle = false;
  let inDouble = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (c === '\\') { i++; continue; }
    if (c === "'" && !inDouble) inSingle = !inSingle;
    else if (c === '"' && !inSingle) inDouble = !inDouble;
    else if (c === ';' && !inSingle && !inDouble) return line.slice(0, i);
  }
  return line;
}

function splitOperands(str) {
  const parts = [];
  let cur = '';
  let inSingle = false;
  let inDouble = false;
  for (let i = 0; i < str.length; i++) {
    const c = str[i];
    if (c === '\\' && i + 1 < str.length) {
      cur += c + str[++i];
      continue;
    }
    if (c === "'" && !inDouble) inSingle = !inSingle;
    else if (c === '"' && !inSingle) inDouble = !inDouble;
    else if (c === ',' && !inSingle && !inDouble) {
      parts.push(cur.trim());
      cur = '';
      continue;
    }
    cur += c;
  }
  if (cur.trim().length > 0) parts.push(cur.trim());
  return parts;
}

function parseStringLiteral(raw) {
  const s = raw.trim();
  if (s.length < 2 || s[0] !== '"' || s[s.length - 1] !== '"') {
    throw new Error(`Invalid string literal: ${raw}`);
  }
  const codes = [];
  for (let i = 1; i < s.length - 1; i++) {
    if (s[i] === '\\' && i + 1 < s.length - 1) {
      const n = s[++i];
      if (n === 'n') codes.push(10);
      else if (n === 'r') codes.push(13);
      else if (n === 't') codes.push(9);
      else if (n === '0') codes.push(0);
      else if (n === '\\') codes.push(92);
      else if (n === '"') codes.push(34);
      else codes.push(n.charCodeAt(0));
    } else {
      codes.push(s.charCodeAt(i));
    }
  }
  return codes;
}

function evalImmediate(expr, symbols, allowBig = false, lineNo = 0) {
  let s = expr.trim();
  if (s.startsWith('#')) s = s.slice(1).trim();
  const plusIdx = s.indexOf('+', 1);
  const minusIdx = s.indexOf('-', 1);
  if (plusIdx > 0 && !s.startsWith("'")) {
    const a = evalImmediate(s.slice(0, plusIdx), symbols, true, lineNo);
    const b = evalImmediate(s.slice(plusIdx + 1), symbols, true, lineNo);
    return allowBig ? a + b : balRem(Number((a + b) % BigInt(TRYTE_MOD)), TRYTE_MOD, TRYTE_HALF);
  }
  if (minusIdx > 0 && !s.startsWith("'") && !/^0t/i.test(s)) {
    const a = evalImmediate(s.slice(0, minusIdx), symbols, true, lineNo);
    const b = evalImmediate(s.slice(minusIdx + 1), symbols, true, lineNo);
    return allowBig ? a - b : balRem(Number((a - b) % BigInt(TRYTE_MOD)), TRYTE_MOD, TRYTE_HALF);
  }
  if (s.startsWith("'") && s.endsWith("'") && s.length >= 3) {
    let ch = s.slice(1, -1);
    let code = ch.charCodeAt(0);
    if (ch === '\\n') code = 10;
    else if (ch === '\\r') code = 13;
    else if (ch === '\\t') code = 9;
    else if (ch === '\\0') code = 0;
    else if (ch === "\\'") code = 39;
    else if (ch === '\\\\') code = 92;
    return allowBig ? BigInt(code) : balRem(code, TRYTE_MOD, TRYTE_HALF);
  }
  if (/^[+-]?0t[T01NPZ+-]+$/i.test(s)) {
    let sign = 1n;
    let body = s;
    if (body[0] === '+') body = body.slice(1);
    else if (body[0] === '-') { sign = -1n; body = body.slice(1); }
    const v = sign * ternaryStrToBigInt(body.slice(2).toUpperCase());
    return allowBig ? v : balRem(Number(v % BigInt(TRYTE_MOD)), TRYTE_MOD, TRYTE_HALF);
  }
  if (/^[+-]?\d+$/.test(s)) {
    const v = BigInt(s);
    return allowBig ? v : balRem(Number(v % BigInt(TRYTE_MOD)), TRYTE_MOD, TRYTE_HALF);
  }
  const symKey = s.toUpperCase();
  if (Object.prototype.hasOwnProperty.call(symbols, symKey)) {
    const v = BigInt(symbols[symKey]);
    return allowBig ? v : balRem(Number(v % BigInt(TRYTE_MOD)), TRYTE_MOD, TRYTE_HALF);
  }
  throw new Error(`Line ${lineNo + 1}: Undefined label ${symKey}`);
}

function assemble(source, options = {}) {
  const lines = source.replace(/\r\n/g, '\n').split('\n');
  let isT3 = options.mode === 'T3' || options.mode === 1;
  const symbols = {};
  const statements = [];
  let lc = 0;

  for (let lineNo = 0; lineNo < lines.length; lineNo++) {
    let clean = stripComment(lines[lineNo]).trim();
    if (!clean) continue;
    while (true) {
      const m = /^([A-Za-z_.$][A-Za-z0-9_.$]*)\s*:(.*)$/.exec(clean);
      if (!m) break;
      const label = m[1].toUpperCase();
      if (Object.prototype.hasOwnProperty.call(symbols, label)) {
        throw new Error(`Line ${lineNo + 1}: Duplicate label ${label}`);
      }
      symbols[label] = isT3 ? lc : balRem(lc, TRYTE_MOD, TRYTE_HALF);
      clean = m[2].trim();
    }
    if (!clean) continue;
    const firstSpace = clean.search(/\s/);
    const head = (firstSpace < 0 ? clean : clean.slice(0, firstSpace)).toUpperCase();
    const rest = firstSpace < 0 ? '' : clean.slice(firstSpace + 1).trim();

    if (head === '.MODE') {
      const mStr = rest.toUpperCase();
      isT3 = (mStr === 'T3' || mStr === '3');
      continue;
    }
    if (head === '.EQU') {
      const ops = splitOperands(rest);
      if (ops.length !== 2) throw new Error(`Line ${lineNo + 1}: .equ requires name, value`);
      const eqName = ops[0].trim().toUpperCase();
      if (Object.prototype.hasOwnProperty.call(symbols, eqName)) {
        throw new Error(`Line ${lineNo + 1}: Duplicate label ${eqName}`);
      }
      const valBig = evalImmediate(ops[1], symbols, true, lineNo);
      symbols[eqName] = isT3 ? Number(valBig) : balRem(Number(valBig % BigInt(TRYTE_MOD)), TRYTE_MOD, TRYTE_HALF);
      continue;
    }
    if (head === '.ORG') {
      const vBig = evalImmediate(rest, symbols, true, lineNo);
      lc = isT3 ? Number(vBig) : physAddr(Number(vBig));
      statements.push({ kind: 'ORG', lc, lineNo });
      continue;
    }
    if (head === '.TRYTE' || head === '.DATA') {
      const ops = splitOperands(rest);
      statements.push({ kind: 'TRYTE', lc, ops, lineNo });
      lc += ops.length;
      continue;
    }
    if (head === '.WORD') {
      const ops = splitOperands(rest);
      statements.push({ kind: 'WORD', lc, ops, lineNo });
      lc += ops.length * 3;
      continue;
    }
    if (head === '.STRING') {
      const codes = parseStringLiteral(rest);
      statements.push({ kind: 'STRING', lc, codes, lineNo });
      lc += codes.length;
      continue;
    }
    if (head === '.STRINGZ') {
      const codes = [...parseStringLiteral(rest), 0];
      statements.push({ kind: 'STRING', lc, codes, lineNo });
      lc += codes.length;
      continue;
    }
    const spec = MNEM_MAP[head];
    if (!spec) throw new Error(`Line ${lineNo + 1}: Unknown mnemonic or directive '${head}'`);
    if (spec.t3only) isT3 = true;
    const ops = rest ? splitOperands(rest) : [];
    statements.push({ kind: 'INS', lc, spec, ops, lineNo });
    lc += 2;
  }

  // Pass 2: determine required output buffer size
  let maxCapacity = TRYTE_MOD;
  if (isT3) {
    let maxLc = lc;
    for (const st of statements) {
      if (st.lc + 64 > maxLc) maxLc = st.lc + 64;
    }
    maxCapacity = Math.max(TRYTE_MOD, maxLc + 16);
  }
  const mem = new Int16Array(maxCapacity);
  let maxAddr = 0;
  let minAddr = maxCapacity;
  const writeTryte = (addr, val) => {
    const p = isT3 ? addr : physAddr(addr);
    if (p >= 0 && p < mem.length) {
      mem[p] = balRem(val, TRYTE_MOD, TRYTE_HALF);
      if (p < minAddr) minAddr = p;
      if (p + 1 > maxAddr) maxAddr = p + 1;
    }
  };

  for (const st of statements) {
    if (st.kind === 'ORG') continue;
    if (st.kind === 'TRYTE') {
      let a = st.lc;
      for (const op of st.ops) {
        writeTryte(a++, evalImmediate(op, symbols, false, st.lineNo));
      }
      continue;
    }
    if (st.kind === 'WORD') {
      let a = st.lc;
      for (const op of st.ops) {
        const bigV = evalImmediate(op, symbols, true, st.lineNo);
        const [w0, w1, w2] = bigIntToWord(bigV);
        writeTryte(a++, w0);
        writeTryte(a++, w1);
        writeTryte(a++, w2);
      }
      continue;
    }
    if (st.kind === 'STRING') {
      let a = st.lc;
      for (const c of st.codes) {
        writeTryte(a++, c);
      }
      continue;
    }
    if (st.kind === 'INS') {
      const { spec, ops, lineNo } = st;
      let rd = 0, rs1 = 0, t1 = 0;
      switch (spec.fmt) {
        case 'NONE':
          if (ops.length !== 0) throw new Error(`Line ${lineNo + 1}: ${spec.mnem} takes 0 operands`);
          break;
        case 'R3':
          if (ops.length !== 3) throw new Error(`Line ${lineNo + 1}: ${spec.mnem} takes 3 registers`);
          rd = parseRegister(ops[0]);
          rs1 = parseRegister(ops[1]);
          t1 = balRem(parseRegister(ops[2]), 9, 4);
          break;
        case 'R2':
          if (ops.length !== 2) throw new Error(`Line ${lineNo + 1}: ${spec.mnem} takes 2 registers`);
          rd = parseRegister(ops[0]);
          rs1 = parseRegister(ops[1]);
          break;
        case 'CMP':
          if (ops.length !== 2) throw new Error(`Line ${lineNo + 1}: ${spec.mnem} takes 2 registers`);
          rs1 = parseRegister(ops[0]);
          t1 = balRem(parseRegister(ops[1]), 9, 4);
          break;
        case 'CMPI':
          if (ops.length !== 2) throw new Error(`Line ${lineNo + 1}: ${spec.mnem} takes rs1, imm9`);
          rs1 = parseRegister(ops[0]);
          t1 = evalImmediate(ops[1], symbols, false, lineNo);
          break;
        case 'RI':
          if (ops.length !== 2) throw new Error(`Line ${lineNo + 1}: ${spec.mnem} takes rd, imm9`);
          rd = parseRegister(ops[0]);
          t1 = evalImmediate(ops[1], symbols, false, lineNo);
          break;
        case 'RRI':
          if (ops.length !== 3) throw new Error(`Line ${lineNo + 1}: ${spec.mnem} takes rd, rs1, imm9`);
          rd = parseRegister(ops[0]);
          rs1 = parseRegister(ops[1]);
          t1 = evalImmediate(ops[2], symbols, false, lineNo);
          break;
        case 'R1_S':
          if (ops.length !== 1) throw new Error(`Line ${lineNo + 1}: ${spec.mnem} takes rs1`);
          rs1 = parseRegister(ops[0]);
          break;
        case 'R1_D':
          if (ops.length !== 1) throw new Error(`Line ${lineNo + 1}: ${spec.mnem} takes rd`);
          rd = parseRegister(ops[0]);
          break;
        case 'J':
          if (ops.length !== 1) throw new Error(`Line ${lineNo + 1}: ${spec.mnem} takes target`);
          t1 = evalImmediate(ops[0], symbols, false, lineNo);
          break;
        case 'JREL': {
          if (ops.length !== 1) throw new Error(`Line ${lineNo + 1}: ${spec.mnem} takes target or #rel9`);
          const rawOp = ops[0].trim();
          if (rawOp.startsWith('#')) {
            t1 = evalImmediate(rawOp, symbols, false, lineNo);
          } else {
            const targetVal = Number(evalImmediate(rawOp, symbols, true, lineNo));
            const rel = targetVal - (st.lc + 2);
            t1 = balRem(rel, TRYTE_MOD, TRYTE_HALF);
          }
          break;
        }
      }
      const [ins0, ins1] = encodeInstruction(spec.op, rd, rs1, t1);
      writeTryte(st.lc, ins0);
      writeTryte(st.lc + 1, ins1);
    }
  }
  const length = maxAddr > 0 ? maxAddr : 0;
  const trytes = Array.from(mem.slice(0, length));
  return { trytes, mem: mem.slice(0, Math.max(TRYTE_MOD, length)), symbols, length, mode: isT3 ? 'T3' : 'T2' };
}

function disassembleInstruction(tryte0, tryte1) {
  const { op, rd, rs1, rs2, imm9 } = decodeInstruction(tryte0, tryte1);
  const spec = OP_MAP[op];
  if (!spec) {
    return `.tryte #${tryte0}, #${tryte1}`;
  }
  switch (spec.fmt) {
    case 'NONE':
      if (rd !== 0 || rs1 !== 0 || imm9 !== 0) return `.tryte #${tryte0}, #${tryte1}`;
      return `${spec.mnem}`;
    case 'R3':
      if (imm9 < -4 || imm9 > 4) return `.tryte #${tryte0}, #${tryte1}`;
      return `${spec.mnem} R${rd}, R${rs1}, R${rs2}`;
    case 'R2':
      if (imm9 !== 0) return `.tryte #${tryte0}, #${tryte1}`;
      return `${spec.mnem} R${rd}, R${rs1}`;
    case 'CMP':
      if (rd !== 0 || imm9 < -4 || imm9 > 4) return `.tryte #${tryte0}, #${tryte1}`;
      return `${spec.mnem} R${rs1}, R${rs2}`;
    case 'CMPI':
      if (rd !== 0) return `.tryte #${tryte0}, #${tryte1}`;
      return `${spec.mnem} R${rs1}, #0t${intToTernaryStr(imm9, 9)}`;
    case 'RI':
      if (rs1 !== 0) return `.tryte #${tryte0}, #${tryte1}`;
      return `${spec.mnem} R${rd}, #0t${intToTernaryStr(imm9, 9)}`;
    case 'RRI':
      return `${spec.mnem} R${rd}, R${rs1}, #0t${intToTernaryStr(imm9, 9)}`;
    case 'R1_S':

let CURRENT_SYMBOL_MODE = 'names';
let TRITOS_SRC = TRITOS_SRC_NAMES;
function setSymbolMode(mode) {
if (mode !== 'names' && mode !== 'hashOnly') {
throw new Error('Invalid symbolMode: ' + mode);
}
CURRENT_SYMBOL_MODE = mode;
TRITOS_SRC = mode === 'names' ? TRITOS_SRC_NAMES : TRITOS_SRC_HASHONLY;
if (typeof globalThis !== 'undefined' && globalThis.TritonSystem) {
globalThis.TritonSystem.symbolMode = mode;
globalThis.TritonSystem.TRITOS_SRC = TRITOS_SRC;
}
return TRITOS_SRC;
}
function getSymbolMode() {
return CURRENT_SYMBOL_MODE;
}

// ============================================================================
// TRITOS 3.0 IN-OS MNEMONIC TABLE & 8x8 FONT GENERATOR
// ============================================================================
const FMT_CODE_T3 = {
  NONE: 0, R3: 1, R2: 2, CMP: 3, CMPI: 4,
  RI: 5, RRI: 6, R1_S: 7, R1_D: 8, J: 9, JREL: 16
};

function generateMnemTableAsmT3() {
  const lines = ['mnem_table:'];
  const directives = [
    { name: '.EQU', op: 100, fmt: 10 },
    { name: '.ORG', op: 100, fmt: 11 },
    { name: '.TRYTE', op: 100, fmt: 12 },
    { name: '.DATA', op: 100, fmt: 12 },
    { name: '.WORD', op: 100, fmt: 13 },
    { name: '.STRING', op: 100, fmt: 14 },
    { name: '.STRINGZ', op: 100, fmt: 15 },
    { name: '.MODE', op: 100, fmt: 17 }
  ];
  for (const d of directives) {
    lines.push(`.word #${tokenHash27(d.name).toString()}`);
    lines.push(`.tryte #${d.op},#${d.fmt}`);
  }
  for (const spec of INSTR_SPECS) {
    lines.push(`.word #${tokenHash27(spec.mnem).toString()}`);
    lines.push(`.tryte #${spec.op},#${FMT_CODE_T3[spec.fmt]}`);
  }
  lines.push('.word #0');
  lines.push('.tryte #0,#0');
  return lines.join('\n');
}

function generateFontTableAsmT3() {
  const lines = ['font_8x8:'];
  for (let g = 0; g < T3_FONT_GLYPHS_64.length; g++) {
    const rows = T3_FONT_GLYPHS_64[g].map(v => `#${v}`).join(',');
    lines.push(`.tryte ${rows}`);
  }
  return lines.join('\n');
}

// StudioNet 12-byte Header + Payload Frame Builder & Checksum (per context/STUDIONET.md)
function computeStudioNetChecksum(bytes, payloadLen) {
  let acc = 0;
  for (let i = 0; i < 10; i++) acc = (acc + bytes[i]) ^ (bytes[i] << (i & 7));
  for (let i = 0; i < payloadLen; i++) acc = (acc + bytes[12 + i]) ^ (bytes[12 + i] << (i & 7));
  return acc & 0xFFFF;
}

function buildStudioNetFrame(dstNode, srcNode, proto, seq, payloadBytes, ttl = 16) {
  const payload = Uint8Array.from(payloadBytes || []);
  const len = Math.min(500, payload.length);
  const frame = new Uint8Array(12 + len);
  frame[0] = dstNode & 0xFF;
  frame[1] = (dstNode >>> 8) & 0xFF;
  frame[2] = srcNode & 0xFF;
  frame[3] = (srcNode >>> 8) & 0xFF;
  frame[4] = proto & 0xFF;
  frame[5] = ttl & 0xFF;
  frame[6] = seq & 0xFF;
  frame[7] = (seq >>> 8) & 0xFF;
  frame[8] = len & 0xFF;
  frame[9] = (len >>> 8) & 0xFF;
  frame.set(payload.subarray(0, len), 12);
  const csum = computeStudioNetChecksum(frame, len);
  frame[10] = csum & 0xFF;
  frame[11] = (csum >>> 8) & 0xFF;
  return frame;
}

function parseStudioNetFrame(frameBytes) {
  const f = Uint8Array.from(frameBytes);
  if (f.length < 12) return null;
  const dstNode = f[0] | (f[1] << 8);
  const srcNode = f[2] | (f[3] << 8);
  const proto = f[4];
  const ttl = f[5];
  const seq = f[6] | (f[7] << 8);
  const len = f[8] | (f[9] << 8);
  const checksum = f[10] | (f[11] << 8);
  const payload = f.slice(12, 12 + len);
  return { dstNode, srcNode, proto, ttl, seq, len, checksum, payload };
}

// Disk Image Export & Import (Byte-for-Byte Round-Trip)
function exportDiskImage(vm) {
  const diskArr = vm instanceof TritonWASM ? vm.disk : vm.disk;
  const buf = new Uint8Array(diskArr.length * 2);
  const dv = new DataView(buf.buffer);
  for (let i = 0; i < diskArr.length; i++) {
    dv.setInt16(i * 2, diskArr[i], true);
  }
  return buf;
}

function importDiskImage(vm, byteArray) {
  const u8 = byteArray instanceof Uint8Array ? byteArray : new Uint8Array(byteArray);
  const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
  const count = Math.min(vm.disk.length, Math.floor(u8.byteLength / 2));
  for (let i = 0; i < count; i++) {
    const val = dv.getInt16(i * 2, true);
    if (vm instanceof TritonWASM) vm.setDisk(i, val);
    else vm.disk[i] = val;
  }
}

// Compute architectural state hash (works identically across TritonJS and TritonWASM in both T2 and T3)
// Provenance: extended from triton.html lines 5160–5196
function computeStateHash(vm) {
  let h = 2166136261 >>> 0;
  const mix = (v) => {
    const lo = v | 0;
    h ^= (lo & 0xFFFF);
    h = Math.imul(h, 16777619) >>> 0;
    h ^= ((lo >> 16) & 0xFFFF);
    h = Math.imul(h, 16777619) >>> 0;
    if (v > 2147483647 || v < -2147483648) {
      const hi = Math.floor(v / 4294967296) | 0;
      h ^= (hi & 0xFFFF);
      h = Math.imul(h, 16777619) >>> 0;
      h ^= ((hi >> 16) & 0xFFFF);
      h = Math.imul(h, 16777619) >>> 0;
    }
  };
  if (vm.archMode === 1) mix(vm.archMode);
  mix(vm.pc);
  mix(vm.sp);
  mix(vm.sf);
  mix(vm.cf);
  mix(vm.of);
  mix(vm.halted);
  mix(vm.steps);
  mix(vm.displayX);
  mix(vm.displayY);
  mix(vm.diskAddr);
  mix(vm.timerTicks);
  if (vm.archMode === 1) {
    mix(vm.priv);
    mix(vm.ie);
    mix(vm.imask);
    mix(vm.ipend);
    mix(vm.vbr);
    mix(vm.ubase);
    mix(vm.ulimit);
    mix(vm.protEn);
    mix(vm.epc);
    mix(vm.esp);
    mix(vm.esr);
    mix(vm.ecause);
    mix(vm.eaddr);
    mix(vm.ksp);
    mix(vm.diskStatus);
    mix(vm.diskErr);
  }
  for (let r = 0; r < 9; r++) {
    const [w0, w1, w2] = vm.getWord(r);
    mix(w0); mix(w1); mix(w2);
  }
  if (vm.archMode === 0) {
    for (let i = 0; i < TRYTE_MOD; i++) {
      const m = vm instanceof TritonWASM ? vm.getMem(i) : vm.mem[i];
      if (m !== 0) { mix(i); mix(m); }
    }
    for (let i = 0; i < TRYTE_MOD; i++) {
      const d = vm instanceof TritonWASM ? vm.i32[25600 + i] : vm.disk[i];
      if (d !== 0) { mix(i); mix(d); }
    }
    for (let i = 0; i < 59049; i++) {
      const p = vm instanceof TritonWASM ? vm.i8[196608 + i] : vm.vram[i];
      if (p !== 0) { mix(i); mix(p); }
    }
  } else {
    const ramArr = vm.mem;
    for (let i = 0; i < ramArr.length; i++) {
      const m = ramArr[i];
      if (m !== 0) { mix(i); mix(m); }
    }
    const diskArr = vm.disk;
    for (let i = 0; i < diskArr.length; i++) {
      const d = diskArr[i];
      if (d !== 0) { mix(i); mix(d); }
    }
    const vramArr = vm.vram;
    for (let i = 0; i < vramArr.length; i++) {
      const p = vramArr[i];
      if (p !== 0) { mix(i); mix(p); }
    }
  }
  return h >>> 0;
}

function extractSnapshotFromHTML(htmlStr) {

  const levels = [28, 132, 242];
  const pal = {};
  for (let v = -13; v <= 13; v++) {
    const t0 = balRem(v, 3, 1);
    const q1 = balQuot(v, 3, 1);

const TRITOS_DESKTOP_TEMPLATE = ".mode T3\n; ============================================================================\n; TRITOS DESKTOP 1.1.1 \u2014 SUPERVISOR KERNEL, DRIVER LIBRARY, COMPOSITOR,\n; BLOCK FS, STUDIONET v2 (16-BYTE HEADER) & 11 DESKTOP APPLICATIONS\n; Written 100% in Triton 3.1 Assembly (ConsciousNode SoftWorks, MIT)\n; ============================================================================\n\n; --- Hardware I/O Ports (ISA-3.md \u00a75) ---\n.equ P_CH, 0\n.equ P_NM, 1\n.equ P_DX, 2\n.equ P_DY, 3\n.equ P_PX, 4\n.equ P_DC, 5\n.equ P_TM, 6\n.equ P_DA, 7\n.equ P_DD, 8\n.equ P_TP, 9\n.equ P_KC, 10\n.equ P_KD, 11\n.equ P_KT, 12\n.equ P_MC, 13\n.equ P_MX, 14\n.equ P_MY, 15\n.equ P_MB, 16\n.equ P_DLBA, 17\n.equ P_DDMA, 18\n.equ P_DCNT, 19\n.equ P_DCMD, 20\n.equ P_DERR, 21\n.equ P_NST, 22\n.equ P_NID, 23\n.equ P_NTX, 24\n.equ P_NRX, 25\n.equ P_NTF, 26\n.equ P_NRF, 27\n\n; --- Kernel & Driver Memory Map ---\n.equ VEC_BASE, 5800\n.equ K_CUR_TASK, 5850\n.equ K_NUM_TASKS, 5851\n.equ K_TRAP_CNT, 5854          ; 3-tryte word\n.equ K_LAST_CAUSE, 5857        ; 3-tryte word\n.equ K_LAST_EADDR, 5860        ; 3-tryte word\n.equ K_LAST_FAULT_TASK, 5863\n.equ K_TIMER_IRQS, 5866        ; 3-tryte word (owned by timer driver)\n.equ K_KBD_IRQS, 5869          ; 3-tryte word (owned by keyboard driver)\n.equ K_MOUSE_IRQS, 5872        ; 3-tryte word (owned by mouse driver)\n.equ K_DISK_IRQS, 5875         ; 3-tryte word (owned by disk driver)\n.equ K_DRAG_WIN, 5878          ; -1 or window idx being dragged (owned by mouse driver)\n.equ K_PREV_BTN, 5879          ; previous mouse button state (owned by mouse driver)\n.equ K_FAULT_BANNER_ACTIVE, 5880\n.equ K_SAVED_R0, 5883          ; 3-tryte word scratch\n.equ K_SAVED_R1, 5886          ; 3-tryte word scratch\n.equ K_NUM_FMT_BUF, 5900       ; 40-tryte scratch for number formatting\n\n.equ TCB_BASE, 6000\n.equ TCB_SIZE, 64\n.equ EVQ_BASE, 6512\n\n.equ FS_DIR_LBA, 200\n.equ FS_DIR_BUF, 7100\n.equ FS_MAGIC_ADDR, 7804\n.equ FS_FREE_LBA_ADDR, 7807\n.equ FS_COUNT_ADDR, 7810\n.equ FS_NAME_TMP, 7830\n.equ FS_LIST_TMP, 7850\n\n.equ SCAN_BUF, 7900\n.equ WINTAB, 8700\n.equ ZORDER, 8900\n.equ ZCOUNT, 8908\n.equ ACTIVE_WIN, 8909\n.equ CUR_X, 8910               ; cursor X (owned by mouse driver)\n.equ CUR_Y, 8911               ; cursor Y (owned by mouse driver)\n.equ LAST_REDRAW_TRYTES, 8912  ; 3-tryte word (owned by framebuffer driver)\n.equ TOTAL_REDRAW_TRYTES, 8915 ; 3-tryte word (owned by framebuffer driver)\n.equ REDRAW_COUNT, 8918        ; 3-tryte word (owned by framebuffer driver)\n.equ TMP_RX, 8921              ; compositor scratch 8921..8928 (owned by framebuffer driver)\n.equ TMP_RY, 8922\n.equ TMP_RW, 8923\n.equ TMP_RH, 8924\n.equ TMP_RX2, 8925\n.equ TMP_RY2, 8926\n.equ TMP_Y, 8927\n.equ TMP_Z, 8928\n\n; --- StudioNet Driver v2 Kernel Memory (9805..9849, 11300..19600) ---\n.equ K_NET_IRQS, 9700            ; 3-tryte word\n.equ K_NET_RX_PKTS, 9703         ; 3-tryte word\n.equ K_NET_DROP_PKTS, 9706       ; 3-tryte word\n.equ K_NET_TX_PKTS, 9709         ; 3-tryte word\n.equ K_NET_SEQ, 9712             ; 3-tryte word\n.equ K_NET_HEAD, 9715            ; 1 tryte (0..9)\n.equ K_NET_TAIL, 9716            ; 1 tryte (0..9)\n.equ K_NET_COUNT, 9717           ; 1 tryte (0..10)\n.equ K_NET_PING_REPLIES, 9718    ; 3-tryte word\n.equ K_NET_LAST_RTT, 9721        ; 3-tryte word (>0 steps, -1 on NO REPLY)\n.equ K_NET_PING_SENT_TICKS, 9724 ; 3-tryte word\n.equ K_NET_CHAT_COUNT, 9727      ; 1 tryte\n.equ K_NET_SFP_RX_COUNT, 9728    ; 1 tryte\n.equ K_NET_PING_PENDING, 9729    ; 1 tryte (0 or 1)\n.equ K_NET_LAST_SRC, 9730        ; 3-tryte word (0..65535)\n.equ K_SFP_RX_TOTAL, 9733        ; 3-tryte word\n.equ K_SFP_RX_GOT, 9736          ; 3-tryte word\n.equ K_SFP_RX_FIN, 9739          ; 1 tryte\n.equ K_NET_DST_TMP, 9740         ; 3-tryte word\n.equ K_NET_MODE_TMP, 9743        ; 1 tryte ('B' or 'T')\n.equ K_NET_IDX_TMP, 9744         ; 1 tryte (chunk_idx)\n\n.equ K_NET_LAST_CHAT, 12200      ; 64 trytes (12200..12263)\n.equ K_NET_LAST_FILE, 12264      ; 16 trytes (12264..12279)\n.equ K_NET_STATUS_MSG, 12280     ; 20 trytes (12280..12299)\n.equ K_SFP_RX_NAME, 12300        ; 16 trytes (12300..12315)\n.equ K_NET_TX_BUF, 12320         ; 520 trytes (12320..12839)\n.equ K_NET_Q_BASE, 12840         ; 10 slots * 516 trytes (12840..17999)\n.equ K_SFP_BUF, 59049            ; 5952 trytes (59049..65000)\n\n; --- Colors (729-Color Balanced-Ternary Palette [-364..+364]) ---\n.equ COL_DESKTOP_BG, -280\n.equ COL_TASKBAR_BG, -335\n.equ COL_TASKBAR_BTN, -240\n.equ COL_TASKBAR_ACT, -120\n.equ COL_WIN_BG, -310\n.equ COL_WIN_BORDER, 120\n.equ COL_TITLE_ACT, -110\n.equ COL_TITLE_INACT, -260\n.equ COL_CLOSE_BTN, 280\n.equ COL_WHITE, 364\n.equ COL_BLACK, -364\n.equ COL_GREEN, 76\n.equ COL_YELLOW, 355\n.equ COL_CYAN, -284\n.equ COL_RED, 292\n.equ COL_FAULT_BG, 240\n\n.org 0\n; ==== DRIVER disk v1 ====\n; Ports: P_DA (7), P_DD (8), P_DLBA (17), P_DDMA (18), P_DCNT (19), P_DCMD (20), P_DERR (21)\n; Memory: 5875..5877\n; IRQ: 10\n; Entries: drv_disk_boot, drv_disk_irq, drv_disk_read, drv_disk_write, drv_disk_write_tryte\ndrv_disk_boot:\n  JMP drv_disk_boot_impl\ndrv_disk_irq:\n  JMP drv_disk_irq_impl\ndrv_disk_read:\n  JMP drv_disk_read_impl\ndrv_disk_write:\n  JMP drv_disk_write_impl\ndrv_disk_write_tryte:\n  JMP drv_disk_write_tryte_impl\n; --- End Entry Table ---\n\ndrv_disk_boot_impl:\n  LI R0, #0\n  OUT R0, #P_DLBA\n  OUT R0, #P_DDMA\n  LI R0, #75\n  OUT R0, #P_DCNT\n  LI R0, #1\n  OUT R0, #P_DCMD\n  JMP kernel_boot_entry\n\ndrv_disk_irq_impl:\n  PUSH R0\n  PUSH R1\n  LI R1, #K_DISK_IRQS\n  LW R0, R1, #0\n  ADDI R0, R0, #1\n  SW R0, R1, #0\n  POP R1\n  POP R0\n  IRET\n\n; drv_disk_read: R0=lba, R1=dma_addr, R2=sector_count -> R0=0 (OK) or -disk_err\ndrv_disk_read_impl:\n  OUT R0, #P_DLBA\n  OUT R1, #P_DDMA\n  OUT R2, #P_DCNT\n  LI R0, #1\n  OUT R0, #P_DCMD\n  IN R0, #P_DCMD\n  CMPI R0, #1\n  JZ ddr_ok\n  IN R0, #P_DERR\n  NEG R0, R0\n  RET\nddr_ok:\n  LI R0, #0\n  RET\n\n; drv_disk_write: R0=lba, R1=dma_addr, R2=sector_count -> R0=0 (OK) or -disk_err\ndrv_disk_write_impl:\n  OUT R0, #P_DLBA\n  OUT R1, #P_DDMA\n  OUT R2, #P_DCNT\n  LI R0, #2\n  OUT R0, #P_DCMD\n  IN R0, #P_DCMD\n  CMPI R0, #1\n  JZ ddw_ok\n  IN R0, #P_DERR\n  NEG R0, R0\n  RET\nddw_ok:\n  LI R0, #0\n  RET\n\n; drv_disk_write_tryte: R0=disk_tryte_offset, R1=tryte_value -> R0=0\ndrv_disk_write_tryte_impl:\n  OUT R0, #P_DA\n  OUT R1, #P_DD\n  LI R0, #0\n  RET\n; ==== END DRIVER disk ====\n\n; ============================================================================\n; KERNEL INITIALIZATION & VECTOR TABLE SETUP\n; ============================================================================\nkernel_boot_entry:\n  LI R0, #9000\n  ADDI R0, R0, #1190\n  MTSPR R0, #14 ; SPR_KSP = 10190\n  MTSPR R0, #10 ; SPR_ESP = 10190\n  LI R0, #kernel_init_after_sp\n  MTSPR R0, #9  ; SPR_EPC\n  LI R0, #0\n  MTSPR R0, #11 ; SPR_ESR (Supervisor, IE=0)\n  IRET\n\nkernel_init_after_sp:\n  ; Clear kernel BSS state (5800..8929)\n  LI R0, #5800\n  LI R1, #0\n  LI R2, #3130\n  BFILL R0, R1, R2\n\n  ; Initialize Vector Table at VEC_BASE (5800)\n  LI R0, #VEC_BASE\n  MTSPR R0, #5\n  LI R1, #VEC_BASE\n  LI R0, #drv_disk_boot\n  SW R0, R1, #0   ; Vec 0: RESET\n  LI R0, #fault_handler\n  SW R0, R1, #3   ; Vec 1: ILLEGAL_OP\n  SW R0, R1, #6   ; Vec 2: PRIV_VIOL\n  SW R0, R1, #9   ; Vec 3: PROT_VIOL\n  SW R0, R1, #12  ; Vec 4: BAD_ADDR\n  SW R0, R1, #15  ; Vec 5: DIV_ZERO\n  LI R0, #syscall_handler\n  SW R0, R1, #18  ; Vec 6: SYSCALL\n  LI R0, #drv_timer_irq\n  SW R0, R1, #21  ; Vec 7: IRQ_TIMER\n  LI R0, #drv_kbd_irq\n  SW R0, R1, #24  ; Vec 8: IRQ_KBD\n  LI R0, #drv_mouse_irq\n  SW R0, R1, #27  ; Vec 9: IRQ_MOUSE\n  LI R0, #drv_disk_irq\n  SW R0, R1, #30  ; Vec 10: IRQ_DISK\n  LI R0, #drv_net_irq\n  SW R0, R1, #33  ; Vec 11: IRQ_NET\n\n  ; Enable Divide-by-Zero Fault Trap (SPR_TRAP_DIV0 = 1)\n  LI R0, #1\n  MTSPR R0, #15\n\n  ; Initialize Window Manager state\n  LI R1, #ACTIVE_WIN\n  LI R0, #-1\n  ST R0, R1, #0\n  LI R1, #K_LAST_FAULT_TASK\n  ST R0, R1, #0\n\n  ; Mark all 8 TCB WIN_IDs as -1\n  LI R1, #TCB_BASE\n  LI R2, #8\n  LI R0, #-1\ninit_tcb_lp:\n  ST R0, R1, #43\n  ADDI R1, R1, #TCB_SIZE\n  SUBI R2, R2, #1\n  JNZ init_tcb_lp\n\n  ; Initialize Hardware Drivers via their Entry Tables\n  CALL drv_kbd_init\n  CALL drv_mouse_init\n  CALL drv_net_init\n\n  ; Initialize Block-Disk File System\n  CALL fs_init\n\n  ; Initialize Framebuffer Wallpaper & Taskbar via Framebuffer Driver Entry Table\n  CALL drv_fb_init\n\n  ; Spawn default desktop apps: Clock (App 3) and Terminal (App 0)\n  LI R0, #3\n  CALL k_spawn_app\n  LI R0, #0\n  CALL k_spawn_app\n\n  ; Configure Hardware Interrupt Mask (IMASK = 31) and Periodic Timer (Period = 2500 steps)\n  LI R0, #31\n  MTSPR R0, #3\n  LI R0, #2500\n  ; __DISABLE_TIMER__\n  CALL drv_timer_init\n\n  ; Start Task 0\n  LI R0, #0\n  LI R1, #K_CUR_TASK\n  ST R0, R1, #0\n  JMP sched_restore_current\n\n; ============================================================================\n; CONTEXT SAVE / RESTORE & PREEMPTIVE SCHEDULER\n; ============================================================================\nget_cur_tcb_r1:\n  LI R1, #K_CUR_TASK\n  LT R1, R1, #0\n  MULI R1, R1, #TCB_SIZE\n  ADDI R1, R1, #TCB_BASE\n  RET\n\nk_save_current_task:\n  PUSH R0\n  PUSH R1\n  CALL get_cur_tcb_r1\n  SW R2, R1, #6\n  SW R3, R1, #9\n  SW R4, R1, #12\n  SW R5, R1, #15\n  SW R6, R1, #18\n  SW R7, R1, #21\n  SW R8, R1, #24\n  LI R0, #K_SAVED_R0\n  LW R2, R0, #0\n  SW R2, R1, #0\n  LW R2, R0, #3\n  SW R2, R1, #3\n  MFSPR R0, #9\n  SW R0, R1, #27\n  MFSPR R0, #10\n  SW R0, R1, #30\n  MFSPR R0, #11\n  SW R0, R1, #33\n  POP R1\n  POP R0\n  RET\n\nsched_pick_next:\n  LI R1, #K_CUR_TASK\n  LT R0, R1, #0\n  LI R2, #8\nspn_lp:\n  CMPI R2, #0\n  JZ spn_idle\n  ADDI R0, R0, #1\n  CMPI R0, #8\n  JN spn_idx_ok\n  LI R0, #0\nspn_idx_ok:\n  MULI R3, R0, #TCB_SIZE\n  ADDI R3, R3, #TCB_BASE\n  LT R4, R3, #42\n  CMPI R4, #1\n  JZ spn_found\n  SUBI R2, R2, #1\n  JMP spn_lp\nspn_found:\n  LI R1 VER net v2 ====\n; Ports: P_NST (22), P_NID (23), P_NTX (24), P_NRX (25), P_NTF (26), P_NRF (27)\n; Memory: 9700..9744, 12200..17999, 59049..65000\n; IRQ: 11\n; Entries: drv_net_init, drv_net_irq, drv_net_poll, drv_net_get_id, drv_net_send, drv_net_ping, drv_net_send_file, drv_net_status\ndrv_net_init:\n  JMPX drv_net_init_impl\ndrv_net_irq:\n  JMPX drv_net_irq_impl\ndrv_net_poll:\n  JMPX drv_net_poll_impl\ndrv_net_get_id:\n  JMPX drv_net_get_id_impl\ndrv_net_send:\n  JMPX drv_net_send_impl\ndrv_net_ping:\n  JMPX drv_net_ping_impl\ndrv_net_send_file:\n  JMPX drv_net_send_file_impl\ndrv_net_status:\n  JMPX drv_net_status_impl\n; --- End Entry Table ---\n\nstr_net_ok_payload: .stringz \"OK\"\nstr_net_ack_ok:     .stringz \"ACK OK\"\nstr_net_noreply:    .stringz \"NO REPLY\"\nstr_net_toobig:     .stringz \"TOO BIG FOR SPIRALOS\"\nstr_net_nf:         .stringz \"FILE NOT FOUND\"\n\n.org 10200\n; drv_net_init_impl: clears net driver BSS (9700..9744, 11300..19600), sets K_NET_SEQ = 100, probes P_NST\ndrv_net_init_impl:\n  PUSH R1\n  PUSH R2\n  LI R0, #9700\n  LI R1, #0\n  LI R2, #45\n  BFILL R0, R1, R2\n  LI R0, #12200 - 19683\n  LMI R0, #1\n  LI R1, #0\n  LI R2, #5800\n  BFILL R0, R1, R2\n  LI R0, #0\n  LMI R0, #3\n  LI R1, #0\n  LI R2, #5952\n  BFILL R0, R1, R2\n  LI R1, #K_NET_SEQ\n  LI R0, #100\n  SW R0, R1, #0\n  IN R0, #P_NST\ndni_drain_lp:\n  IN R0, #P_NRX\n  CMPI R0, #0\n  JNPX dni_done\n  LI R0, #1\n  OUT R0, #P_NRX\n  JMPX dni_drain_lp\ndni_done:\n  LI R0, #0\n  POP R2\n  POP R1\n  RET\n\n; drv_net_get_id_impl: returns R0 = local 16-bit StudioNet Node ID from Port 23 (P_NID)\ndrv_net_get_id_impl:\n  IN R0, #P_NID\n  RET\n\n; drv_net_irq_impl: Vector 11 (IRQ_NET) interrupt handler\ndrv_net_irq_impl:\n  PUSH R0\n  PUSH R1\n  LI R1, #K_SAVED_R0\n  POP R0\n  SW R0, R1, #3\n  POP R0\n  SW R0, R1, #0\n  MFSPR R0, #11\n  CMPI R0, #95\n  JNX dni_sup\n  CALL k_save_current_task\n  LI R1, #K_NET_IRQS\n  LW R0, R1, #0\n  ADDI R0, R0, #1\n  SW R0, R1, #0\n  CALLX drv_net_poll_impl\n  JMP sched_restore_current\ndni_sup:\n  PUSH R2\n  PUSH R3\n  PUSH R4\n  PUSH R5\n  PUSH R6\n  PUSH R7\n  PUSH R8\n  LI R1, #K_NET_IRQS\n  LW R0, R1, #0\n  ADDI R0, R0, #1\n  SW R0, R1, #0\n  CALLX drv_net_poll_impl\n  POP R8\n  POP R7\n  POP R6\n  POP R5\n  POP R4\n  POP R3\n  POP R2\n  LI R1, #K_SAVED_R0\n  LW R0, R1, #0\n  LW R1, R1, #3\n  IRET\n\n; drv_net_send_impl: builds and transmits 16-byte StudioNet header + payload\n; Inputs:\n;   R0 = dst_node (u16)\n;   R1 = proto (u8: 1=SNS, 2=SDP, 3=SSP)\n;   R2 = flags (u8: 1=SYN, 2=ACK, 4=PSH, 8=FIN)\n;   R3 = sport (u16)\n;   R4 = dport (u16)\n;   R5 = ack (u16)\n;   R7 = payload_ptr\n;   R8 = payload_len (0..480)\n; Output:\n;   R0 = total frame bytes sent (16 + payload_len)\ndrv_net_send_impl:\n  PUSH R1\n  PUSH R2\n  PUSH R3\n  PUSH R4\n  PUSH R5\n  PUSH R6\n  PUSH R7\n  PUSH R8\n  CMPI R8, #0\n  JNX dns_zero_len\n  CMPI R8, #480\n  JNPX dns_len_ok\n  LI R8, #480\n  JMPX dns_len_ok\ndns_zero_len:\n  LI R8, #0\ndns_len_ok:\n  LI R6, #K_NET_TX_BUF - 19683\n  LMI R6, #1 ; R6 = K_NET_TX_BUF\n  PUSH R4 ; save dport\n  PUSH R5 ; save ack\n  LI R4, #256\n  ; 0..1: dst_node u16 LE\n  MOD R5, R0, R4\n  ST R5, R6, #0\n  DIV R5, R0, R4\n  MOD R5, R5, R4\n  ST R5, R6, #1\n  ; 2..3: src_node u16 LE (from Port 23 P_NID)\n  IN R0, #P_NID\n  MOD R5, R0, R4\n  ST R5, R6, #2\n  DIV R5, R0, R4\n  MOD R5, R5, R4\n  ST R5, R6, #3\n  ; 4: proto u8\n  MOD R5, R1, R4\n  ST R5, R6, #4\n  ; 5: flags u8\n  MOD R5, R2, R4\n  ST R5, R6, #5\n  ; 6..7: sport u16 LE\n  MOD R5, R3, R4\n  ST R5, R6, #6\n  DIV R5, R3, R4\n  MOD R5, R5, R4\n  ST R5, R6, #7\n  POP R2 ; ack\n  POP R1 ; dport\n  ; 8..9: dport u16 LE\n  MOD R5, R1, R4\n  ST R5, R6, #8\n  DIV R5, R1, R4\n  MOD R5, R5, R4\n  ST R5, R6, #9\n  ; 10..11: seq u16 LE (post-increment K_NET_SEQ, starting at 100)\n  LI R3, #K_NET_SEQ\n  LW R0, R3, #0\n  ADDI R1, R0, #1\n  SW R1, R3, #0\n  MOD R5, R0, R4\n  ST R5, R6, #10\n  DIV R5, R0, R4\n  MOD R5, R5, R4\n  ST R5, R6, #11\n  ; 12..13: ack u16 LE\n  MOD R5, R2, R4\n  ST R5, R6, #12\n  DIV R5, R2, R4\n  MOD R5, R5, R4\n  ST R5, R6, #13\n  ; 14..15: len u16 LE\n  MOV R0, R8\n  ; __PERTURB_NET_CHECKSUM__\n  MOD R5, R0, R4\n  ST R5, R6, #14\n  DIV R5, R0, R4\n  MOD R5, R5, R4\n  ST R5, R6, #15\n  ; Copy R8 payload bytes (masked to 0..255) from R7 into K_NET_TX_BUF + 16\n  LI R3, #0\ndns_cp_lp:\n  CMP R3, R8\n  JNNX dns_cp_done\n  ADD R0, R7, R3\n  LT R0, R0, #0\n  MOD R0, R0, R4\n  CMPI R0, #0\n  JNNX dns_b_pos\n  ADDI R0, R0, #256\ndns_b_pos:\n  ADD R5, R6, R3\n  ADDI R5, R5, #16\n  ST R0, R5, #0\n  ADDI R3, R3, #1\n  JMPX dns_cp_lp\ndns_cp_done:\n  ; Push 16 + R8 bytes to Port 26 (P_NTF) and trigger Port 24 (P_NTX)\n  ADDI R5, R8, #16\n  LI R3, #0\ndns_tx_lp:\n  CMP R3, R5\n  JNNX dns_tx_trig\n  ADD R0, R6, R3\n  LT R0, R0, #0\n  OUT R0, #P_NTF\n  ADDI R3, R3, #1\n  JMPX dns_tx_lp\ndns_tx_trig:\n  OUT R5, #P_NTX\n  LI R1, #K_NET_TX_PKTS\n  LW R0, R1, #0\n  ADDI R0, R0, #1\n  SW R0, R1, #0\n  MOV R0, R5\n  POP R8\n  POP R7\n  POP R6\n  POP R5\n  POP R4\n  POP R3\n  POP R2\n  POP R1\n  RET\n\n; drv_net_ping_impl: R0 = dst_node -> sends SDP port-7 PSH request (\"PING\") and starts RTT timer\ndrv_net_ping_impl:\n  PUSH R1\n  PUSH R2\n  PUSH R3\n  PUSH R4\n  PUSH R5\n  PUSH R7\n  PUSH R8\n  PUSH R0 ; save dst_node\n  CALL drv_timer_read\n  LI R1, #K_NET_PING_SENT_TICKS\n  SW R0, R1, #0\n  LI R1, #K_NET_PING_PENDING\n  LI R0, #1\n  ST R0, R1, #0\n  LI R1, #K_NET_LAST_RTT\n  LI R0, #0\n  SW R0, R1, #0\n  LI R1, #K_NET_STATUS_MSG - 19683\n  LMI R1, #1\n  ST R0, R1, #0\n  ; Store 4-byte payload \"PING\" at K_NET_TX_BUF + 200\n  LI R7, #K_NET_TX_BUF - 19683\n  LMI R7, #1\n  ADDI R7, R7, #200\n  LI R2, #'P'\n  ST R2, R7, #0\n  LI R2, #'I'\n  ST R2, R7, #1\n  LI R2, #'N'\n  ST R2, R7, #2\n  LI R2, #'G'\n  ST R2, R7, #3\n  POP R0 ; dst_node\n  LI R1, #2 ; PROTO_SDP = 2\n  LI R2, #4 ; FLAG_PSH = 4\n  LI R3, #7 ; sport = 7\n  LI R4, #7 ; dport = 7\n  LI R5, #0 ; ack = 0\n  LI R8, #4 ; payload_len = 4\n  CALLX drv_net_send_impl\n  LI R0, #0\n  POP R8\n  POP R7\n  POP R5\n  POP R4\n  POP R3\n  POP R2\n  POP R1\n  RET\n\n; drv_net_fmt_hex4: formats 16-bit integer R6 as 4 uppercase hex chars + ':' at R0[0..4]\ndrv_net_fmt_hex4:\n  PUSH R1\n  PUSH R2\n  PUSH R3\n  PUSH R4\n  PUSH R6\n  LI R1, #3 ; pos = 3..0\n  LI R2, #16\ndnfh_lp:\n  CMPI R1, #0\n  JNX dnfh_colon\n  MOD R3, R6, R2\n  DIV R6, R6, R2\n  CMPI R3, #10\n  JNX dnfh_dig\n  ADDI R3, R3, #55 ; 'A' - 10\n  JMPX dnfh_st\ndnfh_dig:\n  ADDI R3, R3, #48 ; '0'\ndnfh_st:\n  ADD R4, R0, R1\n  ST R3, R4, #0\n  SUBI R1, R1, #1\n  JMPX dnfh_lp\ndnfh_colon:\n  LI R3, #':'\n  ST R3, R0, #4\n  POP R6\n  POP R4\n  POP R3\n  POP R2\n  POP R1\n  RET\n\n; drv_net_poll_impl: drains hardware NIC RX queue into 10-slot K_NET_Q_BASE, validates 16-byte header,\n; dispatches SDP Chat (4200), SDP Ping (7), SSP File Push & ACK (4300/4301), and checks Ping timeout\ndrv_net_poll_impl:\n  PUSH R0\n  PUSH R1\n  PUSH R2\n  PUSH R3\n  PUSH R4\n  PUSH R5\n  PUSH R6\n  PUSH R7\n  PUSH R8\n  LI R8, #0 ; burst accepted counter (caps at 10 per drain burst)\nknrd_hw_lp:\n  IN R0, #P_NRX ; pending RX frame length\n  CMPI R0, #0\n  JNPX knrd_process\n  ; Drop and count if burst >= 10, K_NET_COUNT >= 10, frame_len < 16, or frame_len > 512\n  CMPI R8, #10\n  JNNX knrd_drop_hw\n  LI R1, #K_NET_COUNT\n  LT R2, R1, #0\n  CMPI R2, #10\n  JNNX knrd_drop_hw\n  CMPI R0, #16\n  JNX knrd_drop_hw\n  CMPI R0, #512\n  JPX knrd_drop_hw\n\n  ; Accept frame into K_NET_Q_BASE + K_NET_TAIL * 516\n  ADDI R2, R2, #1\n  ST R2, R1, #0 ; K_NET_COUNT++\n  ADDI R8, R8, #1\n  LI R1, #K_NET_TAIL\n  LT R3, R1, #0\n  ADDI R4, R3, #1\n  CMPI R4, #10\n  JNX knrd_tl_ok\n  LI R4, #0\nknrd_tl_ok:\n  ST R4, R1, #0\n  MULI R3, R3, #516\n  LI R4, #K_NET_Q_BASE - 19683\n  LMI R4, #1\n  ADD R4, R4, R3\n  ST R0, R4, #0 ; slot[0] = frame_len\n  ADDI R4, R4, #4\n  MOV R5, R0 ; count = frame_len\nknrd_rd_lp:\n  CMPI R5, #0\n  JNPX knrd_rd_done\n  IN R6, #P_NRF\n  ST R6, R4, #0\n  ADDI R4, R4, #1\n  SUBI R5, R5, #1\n  JMPX knrd_rd_lp\nknrd_rd_done:\n  LI R0, #1\n  OUT R0, #P_NRX ; pop hardware RX frame\n  JMPX knrd_hw_lp\n\nknrd_drop_hw:\n  LI R1, #K_NET_DROP_PKTS\n  LW R0, R1, #0\n  ADDI R0, R0, #1\n  SW R0, R1, #0\n  LI R0, #1\n  OUT R0, #P_NRX\n  JMPX knrd_hw_lp\n\nknrd_process:\n  LI R1, #K_NET_COUNT\n  LT R0, R1, #0\n  CMPI R0, #0\n  JNPX knrd_chk_timeout\n  SUBI R0, R0, #1\n  ST R0, R1, #0\n  LI R1, #K_NET_HEAD\n  LT R2, R1, #0\n  ADDI R3, R2, #1\n  CMPI R3, #10\n  JNX knrd_hd_ok\n  LI R3, #0\nknrd_hd_ok:\n  ST R3, R1, #0\n  MULI R2, R2, #516\n  LI R4, #K_NET_Q_BASE - 19683\n  LMI R4, #1\n  ADD R4, R4, R2\n  LT R3, R4, #0 ; frame_len\n  ADDI R4, R4, #4 ; R4 = &frame[0]\n\n  ; Validate 16-byte StudioNet header: payload_len = frame[14] + frame[15]*256\n  LT R5, R4, #14\n  LT R6, R4, #15\n  MULI R6, R6, #256\n  ADD R5, R5, R6 ; R5 = payload_len\n  CMPI R5, #0\n  JNX knrd_bad_frame\n  CMPI R5, #480\n  JPX knrd_bad_frame\n  ADDI R0, R5, #16\n  CMP R3, R0\n  JNZX knrd_bad_frame\n\n  ; Extract src_node = frame[2] + frame[3]*256, proto = frame[4], flags = frame[5]\n  LT R6, R4, #2\n  LT R7, R4, #3\n  MULI R7, R7, #256\n  ADD R6, R6, R7 ; R6 = src_node\n  LT R7, R4, #4  ; R7 = proto\n  LT R8, R4, #5  ; R8 = flags\n\n  ; Extract sport = frame[6] + frame[7]*256 -> R1, dport = frame[8] + frame[9]*256 -> R2\n  LT R1, R4, #6\n  LT R0, R4, #7\n  MULI R0, R0, #256\n  ADD R1, R1, R0 ; R1 = sport\n  LT R2, R4, #8\n  LT R0, R4, #9\n  MULI R0, R0, #256\n  ADD R2, R2, R0 ; R2 = dport\n\n  CMPI R7, #2\n  JZX knrd_proto_sdp\n  CMPI R7, #3\n  JZX knrd_proto_ssp\n  JMPX knrd_bad_frame\n\nknrd_bad_frame:\n  LI R1, #K_NET_DROP_PKTS\n  LW R0, R1, #0\n  ADDI R0, R0, #1\n  SW R0, R1, #0\n  JMPX knrd_process\n\nknrd_count_valid_rx:\n  PUSH R0\n  PUSH R1\n  LI R1, #K_NET_RX_PKTS\n  LW R0, R1, #0\n  ADDI R0, R0, #1\n  SW R0, R1, #0\n  LI R1, #K_NET_LAST_SRC\n  SW R6, R1, #0\n  POP R1\n  POP R0\n  RET\n\nknrd_proto_sdp:\n  ; R2 = dport, R8 = flags, R5 = payload_len\n  CMPI R2, #4200\n  JZX knrd_sdp_chat\n  CMPI R2, #7\n  JZX knrd_sdp_ping\n  JMPX knrd_bad_frame\n\nknrd_sdp_chat:\n  ; Require PSH flag (flags >= 4) and payload_len >= 1\n  CMPI R8, #4\n  JNX knrd_bad_frame\n  CMPI R5, #1\n  JNX knrd_bad_frame\n  CALLX knrd_count_valid_rx\n  ; Format \"<HEX4>:<msg>\" into K_NET_LAST_CHAT\n  LI R0, #K_NET_LAST_CHAT - 19683\n  LMI R0, #1\n  CALLX drv_net_fmt_hex4\n  ADDI R0, R0, #5 ; dst after \"XXXX:\"\n  ADDI R1, R4, #16 ; src payload\n  MOV R3, R5\n  CMPI R3, #57\n  JNPX knrd_chat_len_ok\n  LI R3, #57\nknrd_chat_len_ok:\n  MOV R2, R3\n  BCOPY R0, R1, R2\n  LI R1, #0\n  ST R1, R0, #0 ; ensure NUL termination\n  LI R1, #K_NET_CHAT_COUNT\n  LT R0, R1, #0\n  ADDI R0, R0, #1\n  ST R0, R1, #0\n  JMPX knrd_process\n\nknrd_sdp_ping:\n  ; Distinguish request (flags == PSH = 4) vs reply (flags == ACK|PSH = 6 or ACK = 2)\n  CMPI R8, #4\n  JZX knrd_ping_req\n  CMPI R8, #6\n  JZX knrd_ping_rep\n  CMPI R8, #2\n  JZX knrd_ping_rep\n  JMPX knrd_bad_frame\n\nknrd_ping_req:\n  CALLX knrd_count_valid_rx\n  ; Extract seq = frame[10] + frame[11]*256, compute ack = (seq + 1) & 0xFFFF\n  LT R0, R4, #10\n  LT R3, R4, #11\n  MULI R3, R3, #256\n  ADD R0, R0, R3\n  ADDI R0, R0, #1\n  LI R3, #65536 - 19683\n  LMI R3, #3\n  MOD R0, R0, R3 ; R0 = ack\n  ; Send SDP port-7 reply: dst=R6, proto=2, flags=6 (ACK|PSH), sport=7, dport=R1(req.sport), ack=R0, payload=R4+16, len=R5\n  MOV R8, R5\n  ADDI R7, R4, #16\n  MOV R5, R0 ; ack\n  MOV R4, R1 ; dport = req.sport\n  LI R3, #7  ; sport = 7\n  LI R2, #6  ; flags = ACK|PSH (6)\n  LI R1, #2  ; PROTO_SDP (2)\n  MOV R0, R6 ; dst = src_node\n  CALLX drv_net_send_impl\n  JMPX knrd_process\n\nknrd_ping_rep:\n  CALLX knrd_count_valid_rx\n  CALL drv_timer_read\n  LI R1, #K_NET_PING_SENT_TICKS\n  LW R2, R1, #0\n  SUB R0, R0, R2\n  CMPI R0, #1\n  JNNX knrd_rtt_ok\n  LI R0, #1\nknrd_rtt_ok:\n  LI R1, #K_NET_LAST_RTT\n  SW R0, R1, #0\n  LI R1, #K_NET_PING_REPLIES\n  LW R0, R1, #0\n  ADDI R0, R0, #1\n  SW R0, R1, #0\n  LI R1, #K_NET_PING_PENDING\n  LI R0, #0\n  ST R0, R1, #0\n  LI R1, #K_NET_STATUS_MSG - 19683\n  LMI R1, #1\n  ST R0, R1, #0\n  JMPX knrd_process\n\nknrd_proto_ssp:\n  ; R2 = dport, R1 = sport, R8 = flags, R5 = payload_len\n  ; Check for SSP ACK (flags == 2) on port 4300 or 4301\n  CMPI R8, #2\n  JZX knrd_ssp_ack\n  ; Otherwise require dport == 4300 or dport == 4301, PSH set (flags >= 4), and payload_len > 32\n  CMPI R2, #4300\n  JZX knrd_ssp_push_chk\n  CMPI R2, #4301\n  JZX knrd_ssp_push_chk\n  JMPX knrd_bad_frame\n\nknrd_ssp_ack:\n  CMPI R1, #4300\n  JZX knrd_ssp_ack_ok\n  CMPI R1, #4301\n  JZX knrd_ssp_ack_ok\n  CMPI R2, #4300\n  JZX knrd_ssp_ack_ok\n  CMPI R2, #4301\n  JZX knrd_ssp_ack_ok\n  JMPX knrd_bad_frame\nknrd_ssp_ack_ok:\n  CMPI R5, #2\n  JNX knrd_bad_frame\n  CALLX knrd_count_valid_rx\n  CALL drv_timer_read\n  LI R1, #K_NET_PING_SENT_TICKS\n  LW R2, R1, #0\n  SUB R0, R0, R2\n  CMPI R0, #1\n  JNNX knrd_ack_rtt_ok\n  LI R0, #1\nknrd_ack_rtt_ok:\n  LI R1, #K_NET_LAST_RTT\n  SW R0, R1, #0\n  LI R1, #K_NET_PING_REPLIES\n  LW R0, R1, #0\n  ADDI R0, R0, #1\n  SW R0, R1, #0\n  LI R0, #K_NET_STATUS_MSG - 19683\n  LMI R0, #1\n  LI R1, #str_net_ack_ok\n  LI R2, #7\n  BCOPY R0, R1, R2\n  JMPX knrd_process\n\nknrd_ssp_push_chk:\n  CMPI R8, #4\n  JNX knrd_bad_frame\n  CMPI R5, #33\n  JNX knrd_bad_frame\n  CALLX knrd_count_valid_rx\n\n  ; 1. Immediately send SSP ACK (\"OK\", 2 bytes, ack = seq + 1) back to src_node (R6)\n  PUSH R1\n  PUSH R2\n  PUSH R4\n  PUSH R5\n  PUSH R6\n  PUSH R8\n  LT R0, R4, #10\n  LT R3, R4, #11\n  MULI R3, R3, #256\n  ADD R0, R0, R3\n  ADDI R5, R0, #1\n  LI R3, #65536 - 19683\n  LMI R3, #3\n  MOD R5, R5, R3 ; ack = (seq + 1) & 0xFFFF\n  MOV R3, R2     ; sport = rx.dport (4300 or 4301)\n  MOV R4, R1     ; dport = rx.sport\n  MOV R0, R6     ; dst = src_node\n  LI R1, #3      ; PROTO_SSP = 3\n  LI R2, #2      ; FLAG_ACK = 2\n  LI R7, #str_net_ok_payload\n  LI R8, #2      ; len = 2 (\"OK\")\n  CALLX drv_net_send_impl\n  POP R8\n  POP R6\n  POP R5\n  POP R4\n  POP R2\n  POP R1\n\n  ; 2. Inspect 32-byte name block at R4 + 16\n  ADDI R1, R4, #16 ; R1 = &block[0]\n  SUBI R5, R5, #32 ; R5 = data_bytes = payload_len - 32\n\n  ; Check if TritOS metadata block: block[8] == 0 and (block[24] == 'B' or block[24] == 'T')\n  LT R0, R1, #8\n  CMPI R0, #0\n  JNZX knrd_spiral_file\n  LT R7, R1, #24 ; mode byte\n  CMPI R7, #'B'\n  JZX knrd_tritos_file\n  CMPI R7, #'T'\n  JZX knrd_tritos_file\n\nknrd_spiral_file:\n  ; File pushed by SpiralOS (single frame, no mode byte):\n  ; Lands as a byte-mode file, with the name cut to TritOS's 8 characters, uppercased\n  CALL fs_norm_name ; normalizes R1[0..7] uppercase into FS_NAME_TMP\n  LI R0, #K_NET_LAST_FILE - 19683\n  LMI R0, #1\n  LI R2, #FS_NAME_TMP\n  LI R3, #8\n  BCOPY R0, R2, R3\n  LI R2, #0\n  ST R2, R0, #0\n  ; Copy R5 bytes from R1 + 32 into K_SFP_BUF\n  LI R0, #0\n  LMI R0, #3\n  ADDI R2, R1, #32\n  MOV R3, R5\n  BCOPY R0, R2, R3\n  LI R1, #K_NET_LAST_FILE - 19683\n  LMI R1, #1\n  LI R2, #0\n  LMI R2, #3\n  MOV R3, R5\n  LI R4, #1\n  CALL fs_write\n  LI R1, #K_NET_SFP_RX_COUNT\n  LT R0, R1, #0\n  ADDI R0, R0, #1\n  ST R0, R1, #0\n  JMPX knrd_process\n\nknrd_tritos_file:\n  ; R1 = &block[0], R7 = mode ('B' or 'T'), R5 = data_bytes, R8 = flags\n  ; Extract total_trytes = block[25] + block[26]*256 (R2)\n  LT R2, R1, #25\n  LT R0, R1, #26\n  MULI R0, R0, #256\n  ADD R2, R2, R0 ; R2 = total_trytes\n  ; Extract chunk_idx = block[29] + block[30]*256 (R3)\n  LT R3, R1, #29\n  LT R0, R1, #30\n  MULI R0, R0, #256\n  ADD R3, R3, R0 ; R3 = chunk_idx\n\n  ; Check if SYN chunk (chunk_idx == 0)\n  CMPI R3, #0\n  JNZX knrd_tf_not_syn\n  CALL fs_norm_name\n  LI R0, #K_SFP_RX_NAME - 19683\n  LMI R0, #1\n  LI R4, #FS_NAME_TMP\n  LI R6, #8\n  BCOPY R0, R4, R6\n  LI R4, #0\n  ST R4, R0, #0\n  LI R0, #K_SFP_RX_TOTAL\n  SW R2, R0, #0\n  LI R0, #K_SFP_RX_GOT\n  SW R4, R0, #0\n  LI R0, #K_SFP_RX_FIN\n  ST R4, R0, #0\nknrd_tf_not_syn:\n  ; Check if FIN bit is set in R8 (flags >= 8)\n  CMPI R8, #8\n  JNX knrd_tf_unpack\n  LI R0, #K_SFP_RX_FIN\n  LI R4, #1\n  ST R4, R0, #0\n\nknrd_tf_unpack:\n  CMPI R7, #'B'\n  JZX knrd_tf_byte_mode\n\n  ; Tryte mode ('T'): 2 bytes per tryte (signed 16-bit LE), 220 trytes per chunk\n  LI R0, #2\n  DIV R6, R5, R0 ; R6 = chunk_trytes = data_bytes / 2\n  MULI R3, R3, #220 ; dst offset in trytes\n  LI R7, #0\n  LMI R7, #3\n  ADD R7, R7, R3 ; dst tryte ptr\n  ADDI R8, R1, #32 ; src byte ptr\n  MOV R0, R6\nknrd_tf_tlp:\n  CMPI R0, #0\n  JNPX knrd_tf_acc\n  LT R4, R8, #0\n  LT R5, R8, #1\n  MULI R5, R5, #256\n  ADD R4, R4, R5\n  LI R5, #32768 - 19683\n  LMI R5, #2 ; 32768\n  CMP R4, R5\n  JNX knrd_tf_tst\n  LI R5, #65536 - 19683\n  LMI R5, #3 ; 65536\n  SUB R4, R4, R5\nknrd_tf_tst:\n  ST R4, R7, #0\n  ADDI R7, R7, #1\n  ADDI R8, R8, #2\n  SUBI R0, R0, #1\n  JMPX knrd_tf_tlp\n\nknrd_tf_byte_mode:\n  ; Byte mode ('B'): 1 byte per tryte, 440 trytes per chunk\n  MOV R6, R5 ; R6 = chunk_trytes = data_bytes\n  MULI R3, R3, #440\n  LI R0, #0\n  LMI R0, #3\n  ADD R0, R0, R3 ; dst tryte ptr\n  ADDI R2, R1, #32 ; src byte ptr\n  MOV R3, R6\n  BCOPY R0, R2, R3\n\nknrd_tf_acc:\n  LI R0, #K_SFP_RX_GOT\n  LW R2, R0, #0\n  ADD R2, R2, R6\n  SW R2, R0, #0\n  ; Only commit to FS once FIN seen AND K_SFP_RX_GOT >= K_SFP_RX_TOTAL\n  LI R0, #K_SFP_RX_FIN\n  LT R1, R0, #0\n  CMPI R1, #0\n  JZX knrd_process\n  LI R0, #K_SFP_RX_TOTAL\n  LW R3, R0, #0\n  CMP R2, R3\n  JNX knrd_process\n\n  ; Every chunk is in! Write file to TritOS FS\n  LI R0, #K_SFP_RX_FIN\n  LI R1, #0\n  ST R1, R0, #0\n  LI R0, #K_NET_LAST_FILE - 19683\n  LMI R0, #1\n  LI R1, #K_SFP_RX_NAME - 19683\n  LMI R1, #1\n  LI R2, #8\n  BCOPY R0, R1, R2\n  LI R2, #0\n  ST R2, R0, #0\n\n  LI R1, #K_NET_LAST_FILE - 19683\n  LMI R1, #1\n  LI R2, #0\n  LMI R2, #3\n  ; R3 is total_trytes\n  LI R4, #1\n  CALL fs_write\n  LI R1, #K_NET_SFP_RX_COUNT\n  LT R0, R1, #0\n  ADDI R0, R0, #1\n  ST R0, R1, #0\n  JMPX knrd_process\n\nknrd_chk_timeout:\n  ; Check Ping step budget (250,000 steps) if K_NET_PING_PENDING == 1\n  LI R1, #K_NET_PING_PENDING\n  LT R0, R1, #0\n  CMPI R0, #0\n  JZX knrd_done\n  CALL drv_timer_read\n  LI R2, #K_NET_PING_SENT_TICKS\n  LW R2, R2, #0\n  SUB R0, R0, R2\n  LI R2, #-5879\n  LMI R2, #13 ; -5879 + 13 * 19683 = 250000 steps\n  CMP R0, R2\n  JNX knrd_done\n  LI R0, #0\n  ST R0, R1, #0 ; K_NET_PING_PENDING = 0\n  LI R1, #K_NET_LAST_RTT\n  LI R0, #-1\n  SW R0, R1, #0 ; K_NET_LAST_RTT = -1 (NO REPLY)\n  LI R0, #K_NET_STATUS_MSG - 19683\n  LMI R0, #1\n  LI R1, #str_net_noreply\n  LI R2, #9\n  BCOPY R0, R1, R2\n\nknrd_done:\n  POP R8\n  POP R7\n  POP R6\n  POP R5\n  POP R4\n  POP R3\n  POP R2\n  POP R1\n  POP R0\n  RET\n\n; drv_net_send_file_impl: R0 = dst_node, R1 = filename_ptr -> R0 = 0 (OK), -1 (not found), -2 (too big for SpiralOS)\ndrv_net_send_file_impl:\n  PUSH R1\n  PUSH R2\n  PUSH R3\n  PUSH R4\n  PUSH R5\n  PUSH R6\n  PUSH R7\n  PUSH R8\n  ; Save dst_node in K_NET_DST_TMP\n  LI R6, #K_NET_DST_TMP\n  SW R0, R6, #0\n  ; Reject empty filename immediately\n  LT R0, R1, #0\n  CMPI R0, #0\n  JZX knsff_nf\n  CALL fs_find\n  CMPI R3, #-1\n  JZX knsff_nf\n  LW R8, R3, #12 ; R8 = total_trytes\n  ; Read file into K_SFP_BUF\n  LI R1, #FS_NAME_TMP\n  LI R2, #0\n  LMI R2, #3\n  MOV R4, R8\n  CALL fs_read\n\n  ; Inspect all R8 trytes in K_SFP_BUF: if every tryte is in 0..255 -> mode 'B' (66), else mode 'T' (84)\n  LI R1, #0\n  LMI R1, #3\n  LI R2, #0\n  LI R7, #'B'\nknsff_scan_lp:\n  CMP R2, R8\n  JNNX knsff_scan_done\n  ADD R3, R1, R2\n  LT R0, R3, #0\n  CMPI R0, #0\n  JNX knsff_set_t\n  CMPI R0, #255\n  JPX knsff_set_t\n  ADDI R2, R2, #1\n  JMPX knsff_scan_lp\nknsff_set_t:\n  LI R7, #'T'\nknsff_scan_done:\n  LI R0, #K_NET_MODE_TMP\n  ST R7, R0, #0\n\n  ; Compute encoded_bytes in R5: R8 for 'B', R8 * 2 for 'T'\n  MOV R5, R8\n  CMPI R7, #'B'\n  JZX knsff_enc_ok\n  MULI R5, R8, #2\nknsff_enc_ok:\n  ; Check SpiralOS size limit: if encoded_bytes > 440 and dst_node in {0x0101 (257), 0x0201 (513), 0x00FE (254)} -> refuse!\n  CMPI R5, #440\n  JNPX knsff_size_ok\n  LI R6, #K_NET_DST_TMP\n  LW R0, R6, #0\n  CMPI R0, #257\n  JZX knsff_too_big\n  CMPI R0, #513\n  JZX knsff_too_big\n  CMPI R0, #254\n  JZX knsff_too_big\n  JMPX knsff_size_ok\n\nknsff_too_big:\n  LI R0, #K_NET_STATUS_MSG - 19683\n  LMI R0, #1\n  LI R1, #str_net_toobig\n  LI R2, #20\n  BCOPY R0, R1, R2\n  LI R0, #-2\n  JMPX knsff_ret\n\nknsff_size_ok:\n  ; Record send timestamp for ACK RTT measurement\n  CALL drv_timer_read\n  LI R1, #K_NET_PING_SENT_TICKS\n  SW R0, R1, #0\n  LI R1, #K_NET_PING_PENDING\n  LI R0, #0\n  ST R0, R1, #0\n\n  ; Loop over file trytes: R4 = tryte_offset (0..R8), K_NET_IDX_TMP = chunk_idx (0, 1, ...)\n  LI R0, #K_NET_IDX_TMP\n  LI R1, #0\n  ST R1, R0, #0\n  LI R4, #0\nknsff_chunk_lp:\n  CMP R4, R8\n  JNNX knsff_ok\n  SUB R5, R8, R4 ; remaining trytes\n  LI R0, #K_NET_MODE_TMP\n  LT R7, R0, #0 ; mode ('B' or 'T')\n  CMPI R7, #'B'\n  JZX knsff_lim_b\n  ; Mode 'T': max 220 trytes (440 bytes) per chunk\n  CMPI R5, #220\n  JNPX knsff_c_ok\n  LI R5, #220\n  JMPX knsff_c_ok\nknsff_lim_b:\n  ; Mode 'B': max 440 trytes (440 bytes) per chunk\n  CMPI R5, #440\n  JNPX knsff_c_ok\n  LI R5, #440\nknsff_c_ok:\n  ; Zero 32-byte name block at SCAN_BUF\n  LI R0, #SCAN_BUF\n  LI R1, #0\n  LI R2, #32\n  BFILL R0, R1, R2\n  ; Copy normalized 8-char filename from FS_NAME_TMP into SCAN_BUF[0..7]\n  LI R0, #SCAN_BUF\n  LI R1, #FS_NAME_TMP\n  LI R2, #8\n  BCOPY R0, R1, R2\n  ; Populate TritOS metadata at SCAN_BUF[24..30]\n  LI R0, #SCAN_BUF\n  ST R7, R0, #24 ; block[24] = mode ('B' or 'T')\n  LI R2, #256\n  MOD R1, R8, R2\n  ST R1, R0, #25\n  DIV R1, R8, R2\n  MOD R1, R1, R2\n  ST R1, R0, #26 ; block[25..28] = total_trytes (u32 LE)\n  LI R3, #K_NET_IDX_TMP\n  LT R3, R3, #0 ; chunk_idx\n  MOD R1, R3, R2\n  ST R1, R0, #29\n  DIV R1, R3, R2\n  ST R1, R0, #30 ; block[29..30] = chunk_idx (u16 LE)\n\n  ; Encode R5 trytes from K_SFP_BUF + R4 into SCAN_BUF + 32\n  LI R1, #0\n  LMI R1, #3\n  ADD R1, R1, R4 ; src trytes\n  ADDI R2, R0, #32 ; dst bytes\n  CMPI R7, #'B'\n  JZX knsff_pk_b\n\n  ; Mode 'T': pack R5 signed 16-bit LE trytes into R5 * 2 bytes\n  MOV R3, R5\nknsff_pk_tlp:\n  CMPI R3, #0\n  JNPX knsff_pk_tdone\n  LT R0, R1, #0\n  CMPI R0, #0\n  JNNX knsff_pk_tpos\n  LI R6, #65536 - 19683\n  LMI R6, #3\n  ADD R0, R0, R6\nknsff_pk_tpos:\n  LI R6, #256\n  MOD R6, R0, R6\n  ST R6, R2, #0\n  LI R6, #256\n  DIV R6, R0, R6\n  ST R6, R2, #1\n  ADDI R1, R1, #1\n  ADDI R2, R2, #2\n  SUBI R3, R3, #1\n  JMPX knsff_pk_tlp\nknsff_pk_tdone:\n  MULI R6, R5, #2 ; R6 = chunk_data_bytes\n  JMPX knsff_send_chunk\n\nknsff_pk_b:\n  ; Mode 'B': copy R5 byte trytes (0..255) directly\n  MOV R0, R2\n  MOV R3, R5\n  BCOPY R0, R1, R3\n  MOV R6, R5 ; R6 = chunk_data_bytes\n\nknsff_send_chunk:\n  ; Determine flags (R2) and port (R3/R4):\n  ; Single frame (R4 == 0 and R4 + R5 >= R8): port 4300, flags = SYN|PSH|FIN (13)\n  ; First chunk of multi-frame (R4 == 0 and R4 + R5 < R8): port 4300, flags = SYN|PSH (5)\n  ; Middle chunk (R4 > 0 and R4 + R5 < R8): port 4301, flags = PSH (4)\n  ; Last chunk (R4 > 0 and R4 + R5 >= R8): port 4301, flags = PSH|FIN (12)\n  ADD R0, R4, R5 ; next_offset\n  CMPI R4, #0\n  JNZX knsff_after_first\n  ; First chunk (chunk_idx == 0) -> port 4300\n  LI R3, #4300\n  CMP R0, R8\n  JNNX knsff_single_flags\n  LI R2, #5 ; SYN | PSH\n  JMPX knsff_do_tx\nknsff_single_flags:\n  LI R2, #13 ; SYN | PSH | FIN\n  JMPX knsff_do_tx\n\nknsff_after_first:\n  ; Subsequent chunks (chunk_idx > 0) -> port 4301\n  LI R3, #4301\n  CMP R0, R8\n  JNNX knsff_last_flags\n  LI R2, #4 ; PSH\n  JMPX knsff_do_tx\nknsff_last_flags:\n  LI R2, #12 ; PSH | FIN\n\nknsff_do_tx:\n  PUSH R4\n  PUSH R5\n  PUSH R8\n  LI R0, #K_NET_DST_TMP\n  LW R0, R0, #0 ; dst_node\n  LI R1, #3     ; PROTO_SSP = 3\n  ; R2 is flags, R3 is sport\n  MOV R4, R3    ; dport = sport (4300 or 4301)\n  LI R5, #0     ; ack = 0\n  LI R7, #SCAN_BUF\n  ADDI R8, R6, #32 ; payload_len = 32 + chunk_data_bytes\n  CALLX drv_net_send_impl\n  POP R8\n  POP R5\n  POP R4\n\n  ADD R4, R4, R5\n  LI R0, #K_NET_IDX_TMP\n  LT R1, R0, #0\n  ADDI R1, R1, #1\n  ST R1, R0, #0\n  JMPX knsff_chunk_lp\n\nknsff_ok:\n  LI R0, #0\n  JMPX knsff_ret\nknsff_nf:\n  LI R0, #K_NET_STATUS_MSG - 19683\n  LMI R0, #1\n  LI R1, #str_net_nf\n  LI R2, #15\n  BCOPY R0, R1, R2\n  LI R0, #-1\nknsff_ret:\n  POP R8\n  POP R7\n  POP R6\n  POP R5\n  POP R4\n  POP R3\n  POP R2\n  POP R1\n  RET\n\n; drv_net_status_impl: R0 = user_buf_ptr -> polls NIC & timeouts, writes status block (+0..122), returns R0 = rx_pkts\ndrv_net_status_impl:\n  PUSH R1\n  PUSH R2\n  PUSH R4\n  MOV R4, R0\n  CALLX drv_net_poll_impl\n  IN R0, #P_NID\n  SW R0, R4, #0\n  LI R1, #K_NET_TX_PKTS\n  LW R0, R1, #0\n  SW R0, R4, #3\n  LI R1, #K_NET_RX_PKTS\n  LW R0, R1, #0\n  SW R0, R4, #6\n  LI R1, #K_NET_DROP_PKTS\n  LW R0, R1, #0\n  SW R0, R4, #9\n  LI R1, #K_NET_PING_REPLIES\n  LW R0, R1, #0\n  SW R0, R4, #12\n  LI R1, #K_NET_LAST_RTT\n  LW R0, R1, #0\n  SW R0, R4, #15\n  LI R1, #K_NET_CHAT_COUNT\n  LT R0, R1, #0\n  ST R0, R4, #18\n  LT R0, R1, #1 ; K_NET_SFP_RX_COUNT\n  ST R0, R4, #19\n  ADDI R0, R4, #20\n  LI R1, #K_NET_LAST_CHAT - 19683\n  LMI R1, #1\n  LI R2, #64\n  BCOPY R0, R1, R2\n  ADDI R0, R4, #84\n  LI R1, #K_NET_LAST_FILE - 19683\n  LMI R1, #1\n  LI R2, #16\n  BCOPY R0, R1, R2\n  ADDI R0, R4, #100\n  LI R1, #K_NET_STATUS_MSG - 19683\n  LMI R1, #1\n  LI R2, #20\n  BCOPY R0, R1, R2\n  LI R1, #K_NET_RX_PKTS\n  LW R0, R1, #0\n  POP R4\n  POP R2\n  POP R1\n  RET\n\n; ==== END DRIVER net ====\n\n; ============================================================================\n; USER-MODE APPLICATIONS (Apps 0..10)\n; ============================================================================\n.org 19683\napp3_clock_rom:\n  LI R0, #520\n  LI R1, #12\n  LI R2, #180\n  LI R3, #54\n  LI R4, #str_clk_title - app3_clock_rom\n  ADD R4, R4, R8\n  LI R5, #-320\n  SYSCALL #10\n\n  LI R0, #6\n  LI R1, #8\n  LI R2, #str_clk_dec - app3_clock_rom\n  ADD R2, R2, R8\n  LI R3, #COL_CYAN\n  LI R4, #-320\n  SYSCALL #21\n\n  LI R0, #6\n  LI R1, #26\n  LI R2, #str_clk_trn - app3_clock_rom\n  ADD R2, R2, R8\n  LI R3, #COL_GREEN\n  LI R4, #-320\n  SYSCALL #21\n\n  LI R7, #-1\n\nclk_loop:\n  SYSCALL #25\n  SYSCALL #3\n  ADDI R6, R8, #2000\n  SW R0, R6, #0\n  MOV R6, R0\n  CMPI R7, #-1\n  JZX clk_do_draw\n  SUB R0, R6, R7\n  CMPI R0, #35000\n  JNNX clk_do_draw\n  SYSCALL #2\n  JMPX clk_loop\nclk_do_draw:\n  MOV R7, R6\n  LI R0, #40\n  LI R1, #8\n  LI R2, #112\n  LI R3, #8\n  LI R4, #-320\n  SYSCALL #20\n  LI R0, #40\n  LI R1, #8\n  MOV R2, R6\n  LI R3, #10\n  LI R4, #COL_WHITE\n  LI R5, #-320\n  SYSCALL #26\n  LI R0, #40\n  LI R1, #8\n  LI R2, #112\n  LI R3, #8\n  SYSCALL #24\n\n  LI R0, #40\n  LI R1, #26\n  LI R2, #112\n  LI R3, #8\n  LI R4, #-320\n  SYSCALL #20\n  LI R0, #40\n  LI R1, #26\n  MOV R2, R6\n  LI R3, #3\n  LI R4, #COL_YELLOW\n  LI R5, #-320\n  SYSCALL #26\n  LI R0, #40\n  LI R1, #26\n  LI R2, #112\n  LI R3, #8\n  SYSCALL #24\n\n  SYSCALL #2\n  JMPX clk_loop\n\nstr_clk_title: .stringz \"CLOCK\"\nstr_clk_dec:   .stringz \"DEC:\"\nstr_clk_trn:   .stringz \"TRN:\"\napp3_clock_end:\n\n; ----------------------------------------------------------------------------\n; APP 5: TRIT CALCULATOR\n; ----------------------------------------------------------------------------\napp5_calc_rom:\n  LI R0, #510\n  LI R1, #75\n  LI R2, #190\n  LI R3, #96\n  LI R4, #str_calc_title-app5_calc_rom\n  ADD R4, R4, R8\n  LI R5, #-315\n  SYSCALL #10\n\n  LI R0, #6\n  LI R1, #4\n  LI R2, #str_calc_hdr-app5_calc_rom\n  ADD R2, R2, R8\n  LI R3, #COL_CYAN\n  LI R4, #-315\n  SYSCALL #21\n\n  LI R0, #6\n  LI R1, #56\n  LI R2, #str_calc_btns1-app5_calc_rom\n  ADD R2, R2, R8\n  LI R3, #COL_WHITE\n  LI R4, #-240\n  SYSCALL #21\n\n  LI R0, #6\n  LI R1, #72\n  LI R2, #str_calc_btns2-app5_calc_rom\n  ADD R2, R2, R8\n  LI R3, #COL_WHITE\n  LI R4, #-240\n  SYSCALL #21\n\n  LI R0, #0\n  LI R1, #0\n  LI R2, #0\n  LI R3, #0\n  SYSCALL #24\n\n  LI R7, #0\n  ADDI R6, R8, #1500\n  LI R0, #0\n  ST R0, R6, #0\n\ncalc_ev_lp:\n  SYSCALL #25\n  CMPI R0, #0\n  JZX calc_idle\n  CMPI R0, #1\n  J n  CMPI R0, #'3'\n  JZX fault_div0\n  LI R0, #-500\n  JR R0\nfault_prot:\n  LI R1, #100\n  LI R0, #999\n  ST R0, R1, #0\n  JMPX term_cmd_done\nfault_priv:\n  LI R0, #0\n  MTSPR R0, #5\n  JMPX term_cmd_done\nfault_div0:\n  LI R0, #100\n  LI R1, #0\n  DIV R0, R0, R1\n  JMPX term_cmd_done\n\nterm_cmd_fill:\n  ; FILL: genuinely fill the block disk through the guest by saving 50-sector (36,450-tryte) files\n  ; \"F00\", \"F01\", ... until SYS_FS_WRITE returns -1 (DISK FULL)!\n  LI R4, #0 ; file counter 0..43\nterm_fill_lp:\n  ADDI R5, R8, #2580 ; filename buffer\n  LI R0, #'F'\n  ST R0, R5, #0\n  LI R0, #10\n  DIV R1, R4, R0\n  ADDI R1, R1, #48\n  ST R1, R5, #1\n  MOD R1, R4, R0\n  ADDI R1, R1, #48\n  ST R1, R5, #2\n  LI R0, #0\n  ST R0, R5, #3\n\n  MOV R0, R5\n  MOV R1, R8 ; src_ptr = UBASE\n  LI R2, #36450 - 19683\n  LMI R2, #2 ; 36,450 trytes = 50 sectors!\n  LI R3, #1\n  SYSCALL #32\n  CMPI R0, #-1\n  JZX term_fill_full\n  ADDI R4, R4, #1\n  CMPI R4, #45\n  JNX term_fill_lp\nterm_fill_full:\n  LI R0, #6\n  LI R1, #36\n  LI R2, #str_term_full - app0_term_rom\n  ADD R2, R2, R8\n  LI R3, #COL_YELLOW\n  LI R4, #-340\n  SYSCALL #21\n  JMPX term_cmd_done\n\nterm_cmd_done:\n  LI R7, #0\n  ADDI R6, R8, #2500\n  LI R0, #0\n  ST R0, R6, #0\n  CALLX term_draw_cmdline\n  LI R0, #0\n  LI R1, #0\n  LI R2, #0\n  LI R3, #0\n  SYSCALL #24\n  JMPX term_ev_lp\n\nterm_skip_sp:\n  LT R0, R1, #0\n  CMPI R0, #32\n  JNZX tss_ret\n  ADDI R1, R1, #1\n  JMPX term_skip_sp\ntss_ret:\n  RET\n\nterm_skip_word:\n  LT R0, R1, #0\n  CMPI R0, #0\n  JZX tsw_ret\n  CMPI R0, #32\n  JZX tsw_ret\n  ADDI R1, R1, #1\n  JMPX term_skip_word\ntsw_ret:\n  RET\n\nstr_term_title:    .stringz \"TERMINAL\"\nstr_term_ban:      .stringz \"TRITOS DESKTOP SH\"\nstr_term_pr:       .stringz \"> \"\nstr_term_fn_ps:    .stringz \"PS\"\nstr_term_fn_kstat: .stringz \"KSTAT\"\nstr_term_full:     .stringz \"DISK FULL\"\napp0_term_end:\n\n\n; ----------------------------------------------------------------------------\n; APP 6: KLONDIKE SOLITAIRE (APP_ID = 6)\n; Standard 7 tableau piles, stock, waste, 4 foundations, Draw-1 and Draw-3 modes,\n; 729-color cards, mouse drag-and-drop, illegal move refusal, win detection,\n; documented Fisher-Yates shuffle (S = (S * 127 + 259) % 6561), save state to \"SOL\".\n; Memory layout (relative to R8 = UBASE):\n;   +5000..5205: SOL_STATE (206 trytes, saved to \"SOL\"):\n;     +5000: seed\n;     +5001: draw_mode (1 or 3)\n;     +5002: won (0 or 1)\n;     +5003: move_count\n;     +5004: illegal_count\n;     +5005: stock_len (0..24)\n;     +5006: waste_len (0..24)\n;     +5007..5010: found_len[0..3]\n;     +5011..5017: tab_len[0..6]\n;     +5018..5024: tab_down[0..6]\n;     +5025..5048: stock[0..23]\n;     +5049..5072: waste[0..23]\n;     +5073..5205: tab[0..6][0..18] (7 * 19 = 133 trytes)\n;   +5210: next_seed (-1 or accumulated typed digits)\n;   +5211: drag_src (-1=none, 0..6=tab, 7=waste, 8..11=found)\n;   +5212: drag_idx\n;   +5213: dirty\n;   +5220..5271: deck[0..51]\n;   +5280..5295: card label scratch\n; ----------------------------------------------------------------------------\napp6_sol_rom:\n  LI R0, #18\n  LI R1, #18\n  LI R2, #220\n  LI R3, #148\n  LI R4, #str_sol_title - app6_sol_rom\n  ADD R4, R4, R8\n  LI R5, #-290\n  SYSCALL #10\n\n  ; Initialize seed = 1, draw_mode = 1, next_seed = -1, drag_src = -1\n  ADDI R6, R8, #5000\n  LI R0, #1\n  ST R0, R6, #0 ; seed = 1\n  ST R0, R6, #1 ; draw_mode = 1\n  LI R0, #-1\n  ST R0, R6, #210 ; next_seed = -1\n  ST R0, R6, #211 ; drag_src = -1\n\n  CALLX sol_deal\n  CALLX sol_redraw\n\nsol_ev_lp:\n  SYSCALL #25\n  CMPI R0, #0\n  JZX sol_idle\n  CMPI R0, #1\n  JZX sol_on_key\n  CMPI R0, #2\n  JZX sol_on_mdown\n  CMPI R0, #4\n  JZX sol_on_mup\n  JMPX sol_ev_lp\n\nsol_idle:\n  ADDI R6, R8, #5213\n  LT R0, R6, #0\n  CMPI R0, #0\n  JZX sol_do_yield\n  LI R0, #0\n  ST R0, R6, #0\n  CALLX sol_redraw\nsol_do_yield:\n  SYSCALL #2\n  JMPX sol_ev_lp\n\nsol_on_key:\n  ; Isolation test triggers: 200 = fault, 201 = infinite loop\n  CMPI R1, #200\n  JZX sol_trig_fault\n  CMPI R1, #201\n  JZX sol_trig_loop\n\n  ; Digits '0'..'9' accumulate next_seed\n  CMPI R1, #48\n  JNX sol_key_non_digit\n  CMPI R1, #57\n  JPX sol_key_non_digit\n  SUBI R1, R1, #48\n  ADDI R6, R8, #5210\n  LT R0, R6, #0\n  CMPI R0, #-1\n  JNZX sol_seed_acc\n  MOV R0, R1\n  ST R0, R6, #0\n  JMPX sol_ev_lp\nsol_seed_acc:\n  MULI R0, R0, #10\n  ADD R0, R0, R1\n  ST R0, R6, #0\n  JMPX sol_ev_lp\n\nsol_key_non_digit:\n  CMPI R1, #'N'\n  JZX sol_cmd_new\n  CMPI R1, #'n'\n  JZX sol_cmd_new\n  CMPI R1, #'D'\n  JZX sol_cmd_mode\n  CMPI R1, #'d'\n  JZX sol_cmd_mode\n  CMPI R1, #'S'\n  JZX sol_cmd_save\n  CMPI R1, #'s'\n  JZX sol_cmd_save\n  CMPI R1, #32 ; Space -> draw from stock\n  JZX sol_cmd_draw\n  JMPX sol_ev_lp\n\nsol_trig_fault:\n  LI R1, #100\n  LI R0, #999\n  ST R0, R1, #0\n  JMPX sol_ev_lp\nsol_trig_loop:\n  JMPX sol_trig_loop\n\nsol_cmd_new:\n  ADDI R6, R8, #5210\n  LT R0, R6, #0\n  CMPI R0, #-1\n  JZX sol_new_keep_seed\n  ADDI R5, R8, #5000\n  ST R0, R5, #0\n  LI R0, #-1\n  ST R0, R6, #0\nsol_new_keep_seed:\n  CALLX sol_deal\n  ADDI R6, R8, #5213\n  LI R0, #1\n  ST R0, R6, #0\n  JMPX sol_ev_lp\n\nsol_cmd_mode:\n  ADDI R6, R8, #5001\n  LT R0, R6, #0\n  CMPI R0, #1\n  JZX sol_set_d3\n  LI R0, #1\n  JMPX sol_st_mode\nsol_set_d3:\n  LI R0, #3\nsol_st_mode:\n  ST R0, R6, #0\n  ADDI R6, R8, #5213\n  LI R0, #1\n  ST R0, R6, #0\n  JMPX sol_ev_lp\n\nsol_cmd_save:\n  LI R0, #str_sol_fn - app6_sol_rom\n  ADD R0, R0, R8\n  ADDI R1, R8, #5000\n  LI R2, #206\n  LI R3, #1\n  SYSCALL #32\n  JMPX sol_ev_lp\n\nsol_cmd_draw:\n  CALLX sol_draw_stock\n  ADDI R6, R8, #5213\n  LI R0, #1\n  ST R0, R6, #0\n  JMPX sol_ev_lp\n\nsol_on_mdown:\n  ; R1 = client_x, R2 = client_y\n  ADDI R6, R8, #5211\n  LI R0, #-1\n  ST R0, R6, #0 ; drag_src = -1\n\n  ; 1. Check toolbar (y < 13)\n  CMPI R2, #13\n  JNNX sol_md_top\n  CMPI R1, #44\n  JNX sol_cmd_new\n  CMPI R1, #88\n  JNX sol_cmd_mode\n  CMPI R1, #140\n  JNX sol_cmd_save\n  JMPX sol_ev_lp\n\nsol_md_top:\n  ; 2. Check top row (y in 14..36): Stock (6..32), Waste (34..64), Foundations (90..210)\n  CMPI R2, #37\n  JNNX sol_md_tab\n  CMPI R1, #6\n  JNX sol_md_illegal\n  CMPI R1, #32\n  JNPX sol_cmd_draw\n  CMPI R1, #64\n  JNPX sol_md_waste\n  CMPI R1, #90\n  JNX sol_md_illegal\n  SUBI R0, R1, #90\n  LI R3, #30\n  DIV R0, R0, R3 ; f = 0..3\n  CMPI R0, #4\n  JNNX sol_md_illegal\n  ADDI R5, R8, #5007\n  ADD R5, R5, R0\n  LT R3, R5, #0 ; found_len[f]\n  CMPI R3, #0\n  JNPX sol_md_illegal\n  ADDI R0, R0, #8 ; drag_src = 8 + f\n  ST R0, R6, #0\n  SUBI R3, R3, #1\n  ST R3, R6, #1\n  JMPX sol_ev_lp\n\nsol_md_waste:\n  ADDI R5, R8, #5006\n  LT R3, R5, #0 ; waste_len\n  CMPI R3, #0\n  JNPX sol_md_illegal\n  LI R0, #7\n  ST R0, R6, #0 ; drag_src = 7 (waste)\n  SUBI R3, R3, #1\n  ST R3, R6, #1\n  JMPX sol_ev_lp\n\nsol_md_tab:\n  ; 3. Tableau columns c = 0..6 at x = 6 + c*30, y >= 38\n  CMPI R1, #6\n  JNX sol_md_illegal\n  SUBI R0, R1, #6\n  LI R3, #30\n  DIV R0, R0, R3 ; c = 0..6\n  CMPI R0, #7\n  JNNX sol_md_illegal\n  ADDI R5, R8, #5011\n  ADD R5, R5, R0\n  LT R3, R5, #0 ; tab_len[c]\n  CMPI R3, #0\n  JNPX sol_md_illegal\n  ; Compute card index r = (y - 40) / 5, clamped to [0, tab_len[c] - 1]\n  SUBI R4, R2, #40\n  CMPI R4, #0\n  JNNX sol_md_r0\n  LI R4, #0\n  JMPX sol_md_r1\nsol_md_r0:\n  LI R7, #5\n  DIV R4, R4, R7\nsol_md_r1:\n  SUBI R7, R3, #1\n  CMP R4, R7\n  JNPX sol_md_r2\n  MOV R4, R7\nsol_md_r2:\n  ; Check if r < tab_down[c] (face-down card -> illegal!)\n  ADDI R5, R8, #5018\n  ADD R5, R5, R0\n  LT R7, R5, #0 ; tab_down[c]\n  CMP R4, R7\n  JNX sol_md_illegal\n  ST R0, R6, #0 ; drag_src = c\n  ST R4, R6, #1 ; drag_idx = r\n  JMPX sol_ev_lp\n\nsol_md_illegal:\n  ADDI R5, R8, #5004\n  LT R0, R5, #0\n  ADDI R0, R0, #1\n  ST R0, R5, #0 ; illegal_count++\n  ADDI R6, R8, #5213\n  LI R0, #1\n  ST R0, R6, #0\n  JMPX sol_ev_lp\n\nsol_on_mup:\n  ; R1 = drop_x, R2 = drop_y\n  ADDI R6, R8, #5211\n  LT R4, R6, #0 ; drag_src\n  CMPI R4, #-1\n  JZX sol_ev_lp\n  LT R5, R6, #1 ; drag_idx\n  LI R0, #-1\n  ST R0, R6, #0 ; clear drag_src\n\n  ; Determine drop target:\n  ; If y in 14..36 and x >= 90 -> Foundation f = (x - 90) / 30 (dest = 8 + f)\n  ; If y >= 38 and x >= 6 -> Tableau dst_c = (x - 6) / 30 (dest = dst_c)\n  CMPI R2, #14\n  JNX sol_mup_illegal\n  CMPI R2, #37\n  JNNX sol_mup_tab\n  CMPI R1, #90\n  JNX sol_mup_illegal\n  SUBI R3, R1, #90\n  LI R0, #30\n  DIV R3, R3, R0 ; f = 0..3\n  CMPI R3, #4\n  JNNX sol_mup_illegal\n  ADDI R3, R3, #8 ; dest = 8 + f\n  CALLX sol_try_move\n  JMPX sol_ev_lp\n\nsol_mup_tab:\n  CMPI R1, #6\n  JNX sol_mup_illegal\n  SUBI R3, R1, #6\n  LI R0, #30\n  DIV R3, R3, R0 ; dst_c = 0..6\n  CMPI R3, #7\n  JNNX sol_mup_illegal\n  CALLX sol_try_move\n  JMPX sol_ev_lp\n\nsol_mup_illegal:\n  ADDI R5, R8, #5004\n  LT R0, R5, #0\n  ADDI R0, R0, #1\n  ST R0, R5, #0\n  ADDI R6, R8, #5213\n  LI R0, #1\n  ST R0, R6, #0\n  JMPX sol_ev_lp\n\n; sol_draw_stock: draws 1 or 3 cards from stock to waste, or recycles waste to stock\nsol_draw_stock:\n  PUSH R0\n  PUSH R1\n  PUSH R2\n  PUSH R3\n  PUSH R4\n  PUSH R5\n  ADDI R5, R8, #5000\n  LT R1, R5, #5 ; stock_len\n  CMPI R1, #0\n  JPX sds_draw_cards\n  ; Stock is empty -> check waste_len\n  LT R2, R5, #6 ; waste_len\n  CMPI R2, #0\n  JNPX sds_illegal\n  ; Recycle waste[0..R2-1] in reverse order into stock[0..R2-1]\n  LI R3, #0 ; i = 0\nsds_rec_lp:\n  CMP R3, R2\n  JNNX sds_rec_done\n  SUB R4, R2, R3\n  SUBI R4, R4, #1 ; waste_len - 1 - i\n  ADDI R0, R5, #49\n  ADD R0, R0, R4\n  LT R4, R0, #0 ; card = waste[waste_len - 1 - i]\n  ADDI R0, R5, #25\n  ADD R0, R0, R3\n  ST R4, R0, #0 ; stock[i] = card\n  ADDI R3, R3, #1\n  JMPX sds_rec_lp\nsds_rec_done:\n  ST R2, R5, #5 ; stock_len = old waste_len\n  LI R0, #0\n  ST R0, R5, #6 ; waste_len = 0\n  ; Clear waste slots to -1\n  ADDI R0, R5, #49\n  LI R1, #-1\n  LI R2, #24\n  BFILL R0, R1, R2\n  LT R0, R5, #3\n  ADDI R0, R0, #1\n  ST R0, R5, #3 ; move_count++\n  JMPX sds_done\n\nsds_draw_cards:\n  LT R3, R5, #1 ; draw_mode (1 or 3)\nsds_dc_lp:\n  CMPI R3, #0\n  JNPX sds_dc_ok\n  LT R1, R5, #5 ; stock_len\n  CMPI R1, #0\n  JNPX sds_dc_ok\n  SUBI R1, R1, #1\n  ST R1, R5, #5 ; stock_len--\n  ADDI R0, R5, #25\n  ADD R0, R0, R1\n  LT R4, R0, #0 ; card = stock[stock_len]\n  LI R2, #-1\n  ST R2, R0, #0 ; clear stock slot\n  LT R2, R5, #6 ; waste_len\n  ADDI R0, R5, #49\n  ADD R0, R0, R2\n  ST R4, R0, #0 ; waste[waste_len] = card\n  ADDI R2, R2, #1\n  ST R2, R5, #6 ; waste_len++\n  SUBI R3, R3, #1\n  JMPX sds_dc_lp\nsds_dc_ok:\n  LT R0, R5, #3\n  ADDI R0, R0, #1\n  ST R0, R5, #3 ; move_count++\n  JMPX sds_done\n\nsds_illegal:\n  LT R0, R5, #4\n  ADDI R0, R0, #1\n  ST R0, R5, #4 ; illegal_count++\nsds_done:\n  POP R5\n  POP R4\n  POP R3\n  POP R2\n  POP R1\n  POP R0\n  RET\n\n; sol_try_move: R4 = drag_src (0..6=tab, 7=waste, 8..11=found), R5 = drag_idx, R3 = dest (0..6=tab, 8..11=found)\nsol_try_move:\n  PUSH R0\n  PUSH R1\n  PUSH R2\n  PUSH R3\n  PUSH R4\n  PUSH R5\n  PUSH R6\n  PUSH R7\n\n  ; Reject same-pile drop\n  CMP R4, R3\n  JZX stm_refuse\n\n  ; Get moving card ID into R6 and card count being moved into R7\n  CMPI R4, #7\n  JZX stm_src_waste\n  CMPI R4, #8\n  JNNX stm_src_found\n  ; Source is Tableau R4 at index R5\n  ADDI R0, R8, #5011\n  ADD R0, R0, R4\n  LT R1, R0, #0 ; tab_len[src]\n  SUB R7, R1, R5 ; count = tab_len[src] - drag_idx\n  CMPI R7, #0\n  JNPX stm_refuse\n  MULI R0, R4, #19\n  ADD R0, R0, R5\n  ADDI R0, R0, #5073\n  ADD R0, R0, R8\n  LT R6, R0, #0 ; moving bottom card\n  JMPX stm_have_src\n\nstm_src_waste:\n  ADDI R0, R8, #5006\n  LT R1, R0, #0 ; waste_len\n  CMPI R1, #0\n  JNPX stm_refuse\n  SUBI R1, R1, #1\n  ADDI R0, R8, #5049\n  ADD R0, R0, R1\n  LT R6, R0, #0\n  LI R7, #1\n  JMPX stm_have_src\n\nstm_src_found:\n  SUBI R1, R4, #8 ; f\n  ADDI R0, R8, #5007\n  ADD R0, R0, R1\n  LT R2, R0, #0 ; found_len[f]\n  CMPI R2, #0\n  JNPX stm_refuse\n  SUBI R2, R2, #1\n  MULI R6, R1, #13\n  ADD R6, R6, R2 ; card = f*13 + (found_len[f] - 1)\n  LI R7, #1\n\nstm_have_src:\n  ; Check destination R3:\n  CMPI R3, #8\n  JNNX stm_dst_found\n\n  ; Destination is Tableau R3 (0..6):\n  ; Check dst pile length\n  ADDI R0, R8, #5011\n  ADD R0, R0, R3\n  LT R1, R0, #0 ; dst_len = tab_len[dst]\n  LI R2, #13\n  DIV R0, R6, R2 ; src_suit = card / 13\n  MOD R2, R6, R2 ; src_rank = card % 13\n  CMPI R1, #0\n  JPX stm_dst_tab_nonempty\n  ; Empty tableau pile -> only King (rank == 12) allowed!\n  CMPI R2, #12\n  JNZX stm_refuse\n  JMPX stm_exec_tab\n\nstm_dst_tab_nonempty:\n  ; Non-empty tableau pile -> get top card at tab[dst][dst_len - 1]\n  SUBI R1, R1, #1\n  MULI R0, R3, #19\n  ADD R0, R0, R1\n  ADDI R0, R0, #5073\n  ADD R0, R0, R8\n  LT R1, R0, #0 ; top_card\n  LI R2, #13\n  DIV R0, R6, R2 ; src_suit\n  DIV R1, R1, R2 ; top_suit\n  ADD R0, R0, R1\n  LI R2, #2\n  MOD R0, R0, R2 ; (src_suit + top_suit) % 2 must be 1 (opposite colors!)\n  CMPI R0, #1\n  JNZX stm_refuse\n  ; Check src_rank + 1 == top_rank\n  ADDI R0, R8, #5011\n  ADD R0, R0, R3\n  LT R1, R0, #0\n  SUBI R1, R1, #1\n  MULI R0, R3, #19\n  ADD R0, R0, R1\n  ADDI R0, R0, #5073\n  ADD R0, R0, R8\n  LT R1, R0, #0 ; top_card\n  LI R2, #13\n  MOD R0, R6, R2 ; src_rank\n  MOD R1, R1, R2 ; top_rank\n  ADDI R0, R0, #1\n  CMP R0, R1\n  JNZX stm_refuse\n\nstm_exec_tab:\n  ; Legal move to Tableau R3! Append R7 cards to tab[R3] and remove from source R4\n  ADDI R0, R8, #5011\n  ADD R0, R0, R3\n  LT R1, R0, #0 ; dst_len\n  ADD R2, R1, R7\n  CMPI R2, #19\n  JPX stm_refuse\n  ST R2, R0, #0 ; tab_len[dst] = dst_len + R7\n\n  ; Destination pointer in tab[dst]:\n  MULI R2, R3, #19\n  ADD R2, R2, R1\n  ADDI R2, R2, #5073\n  ADD R2, R2, R8 ; R2 = &tab[dst][dst_len]\n\n  CMPI R4, #7\n  JZX stm_et_from_waste\n  CMPI R4, #8\n  JNNX stm_et_from_found\n\n  ; From Tableau R4 at R5 (count R7):\n  MULI R1, R4, #19\n  ADD R1, R1, R5\n  ADDI R1, R1, #5073\n  ADD R1, R1, R8 ; R1 = &tab[src][drag_idx]\n  MOV R0, R7\nstm_et_cp_lp:\n  CMPI R0, #0\n  JNPX stm_et_cp_done\n  LT R6, R1, #0\n  ST R6, R2, #0\n  LI R6, #-1\n  ST R6, R1, #0\n  ADDI R1, R1, #1\n  ADDI R2, R2, #1\n  SUBI R0, R0, #1\n  JMPX stm_et_cp_lp\nstm_et_cp_done:\n  ADDI R0, R8, #5011\n  ADD R0, R0, R4\n  ST R5, R0, #0 ; tab_len[src] = drag_idx\n  ; Flip new top card if tab_down[src] == drag_idx and drag_idx > 0\n  CMPI R5, #0\n  JNPX stm_move_ok\n  ADDI R0, R8, #5018\n  ADD R0, R0, R4\n  LT R1, R0, #0 ; tab_down[src]\n  CMP R1, R5\n  JNX stm_move_ok\n  SUBI R1, R5, #1\n  ST R1, R0, #0\n  JMPX stm_move_ok\n\nstm_et_from_waste:\n  ST R6, R2, #0\n  ADDI R0, R8, #5006\n  LT R1, R0, #0\n  SUBI R1, R1, #1\n  ST R1, R0, #0\n  ADDI R0, R8, #5049\n  ADD R0, R0, R1\n  LI R2, #-1\n  ST R2, R0, #0\n  JMPX stm_move_ok\n\nstm_et_from_found:\n  ST R6, R2, #0\n  SUBI R1, R4, #8\n  ADDI R0, R8, #5007\n  ADD R0, R0, R1\n  LT R2, R0, #0\n  SUBI R2, R2, #1\n  ST R2, R0, #0\n  JMPX stm_move_ok\n\nstm_dst_found:\n  ; Destination is Foundation f = R3 - 8 (0..3)\n  ; Only single card (R7 == 1) can move to Foundation!\n  CMPI R7, #1\n  JNZX stm_refuse\n  SUBI R1, R3, #8 ; f\n  LI R2, #13\n  DIV R0, R6, R2 ; card_suit\n  CMP R0, R1\n  JNZX stm_refuse\n  MOD R0, R6, R2 ; card_rank\n  ADDI R2, R8, #5007\n  ADD R2, R2, R1\n  LT R3, R2, #0 ; found_len[f]\n  CMP R0, R3\n  JNZX stm_refuse\n\n  ; Legal move to Foundation f!\n  ADDI R3, R3, #1\n  ST R3, R2, #0 ; found_len[f]++\n\n  ; Remove card from source R4\n  CMPI R4, #7\n  JZX stm_ef_from_waste\n  CMPI R4, #8\n  JNNX stm_ef_from_found\n  ; From Tableau R4 at R5\n  MULI R0, R4, #19\n  ADD R0, R0, R5\n  ADDI R0, R0, #5073\n  ADD R0, R0, R8\n  LI R1, #-1\n  ST R1, R0, #0\n  ADDI R0, R8, #5011\n  ADD R0, R0, R4\n  ST R5, R0, #0 ; tab_len[src] = drag_idx\n  CMPI R5, #0\n  JNPX stm_move_ok\n  ADDI R0, R8, #5018\n  ADD R0, R0, R4\n  LT R1, R0, #0\n  CMP R1, R5\n  JNX stm_move_ok\n  SUBI R1, R5, #1\n  ST R1, R0, #0\n  JMPX stm_move_ok\n\nstm_ef_from_waste:\n  ADDI R0, R8, #5006\n  LT R1, R0, #0\n  SUBI R1, R1, #1\n  ST R1, R0, #0\n  ADDI R0, R8, #5049\n  ADD R0, R0, R1\n  LI R2, #-1\n  ST R2, R0, #0\n  JMPX stm_move_ok\n\nstm_ef_from_found:\n  SUBI R1, R4, #8\n  ADDI R0, R8, #5007\n  ADD R0, R0, R1\n  LT R2, R0, #0\n  SUBI R2, R2, #1\n  ST R2, R0, #0\n\nstm_move_ok:\n  ; Increment move_count (+5003) and check win condition (sum of found_len[0..3] == 52)\n  ADDI R0, R8, #5000\n  LT R1, R0, #3\n  ADDI R1, R1, #1\n  ST R1, R0, #3\n  LT R1, R0, #7\n  LT R2, R0, #8\n  ADD R1, R1, R2\n  LT R2, R0, #9\n  ADD R1, R1, R2\n  LT R2, R0, #10\n  ADD R1, R1, R2\n  CMPI R1, #52\n  JNZX stm_mark_dirty\n  LI R1, #1\n  ST R1, R0, #2 ; won = 1\n  JMPX stm_mark_dirty\n\nstm_refuse:\n  ADDI R0, R8, #5004\n  LT R1, R0, #0\n  ADDI R1, R1, #1\n  ST R1, R0, #0 ; illegal_count++\n\nstm_mark_dirty:\n  ADDI R0, R8, #5213\n  LI R1, #1\n  ST R1, R0, #0\n  POP R7\n  POP R6\n  POP R5\n  POP R4\n  POP R3\n  POP R2\n  POP R1\n  POP R0\n  RET\n\n; sol_deal: initializes deck[0..51], shuffles with LCG S = (S * 127 + 259) % 6561, and populates SOL_STATE\nsol_deal:\n  PUSH R0\n  PUSH R1\n  PUSH R2\n  PUSH R3\n  PUSH R4\n  PUSH R5\n  PUSH R6\n  PUSH R7\n\n  ; 1. Initialize deck[0..51] at UBASE + 5220\n  ADDI R1, R8, #5220\n  LI R0, #0\nsd_init_lp:\n  CMPI R0, #52\n  JNNX sd_shuf_init\n  ADD R2, R1, R0\n  ST R0, R2, #0\n  ADDI R0, R0, #1\n  JMPX sd_init_lp\n\nsd_shuf_init:\n  ADDI R0, R8, #5000\n  LT R2, R0, #0 ; s = seed\n  LI R3, #51    ; i = 51\n  LI R4, #6561  ; modulus = 6561\nsd_shuf_lp:\n  CMPI R3, #1\n  JNX sd_clear_state\n  MULI R2, R2, #127\n  ADDI R2, R2, #259\n  MOD R2, R2, R4 ; s = (s * 127 + 259) % 6561\n  CMPI R2, #0\n  JNNX sd_s_pos\n  ADD R2, R2, R4\nsd_s_pos:\n  ADDI R5, R3, #1 ; i + 1\n  MOD R6, R2, R5  ; j = s % (i + 1)\n  ; __PERTURB_SOLITAIRE_SHUFFLE__\n  ; Swap deck[i] and deck[j]\n  ADD R5, R1, R3 ; &deck[i]\n  ADD R6, R1, R6 ; &deck[j]\n  LT R0, R5, #0\n  LT R7, R6, #0\n  ST R7, R5, #0\n  ST R0, R6, #0\n  SUBI R3, R3, #1\n  JMPX sd_shuf_lp\n\nsd_clear_state:\n  ; Zero counters +5002..+5024\n  ADDI R0, R8, #5002\n  LI R2, #0\n  LI R3, #23\n  BFILL R0, R2, R3\n  ; Fill card arrays +5025..+5205 (181 trytes) with -1\n  ADDI R0, R8, #5025\n  LI R2, #-1\n  LI R3, #181\n  BFILL R0, R2, R3\n\n  ; Deal 28 cards into tableau piles c = 0..6\n  LI R2, #0 ; deck idx = 0\n  LI R3, #0 ; c = 0\nsd_tab_c_lp:\n  CMPI R3, #7\n  JNNX sd_stock_deal\n  ADDI R0, R8, #5011\n  ADD R0, R0, R3\n  ADDI R4, R3, #1\n  ST R4, R0, #0 ; tab_len[c] = c + 1\n  ADDI R0, R8, #5018\n  ADD R0, R0, R3\n  ST R3, R0, #0 ; tab_down[c] = c\n  LI R4, #0 ; r = 0\nsd_tab_r_lp:\n  CMP R4, R3\n  JPX sd_tab_nx_c\n  ADD R0, R1, R2\n  LT R5, R0, #0 ; card = deck[idx]\n  ADDI R2, R2, #1\n  MULI R6, R3, #19\n  ADD R6, R6, R4\n  ADDI R6, R6, #5073\n  ADD R6, R6, R8\n  ST R5, R6, #0 ; tab[c][r] = card\n  ADDI R4, R4, #1\n  JMPX sd_tab_r_lp\nsd_tab_nx_c:\n  ADDI R3, R3, #1\n  JMPX sd_tab_c_lp\n\nsd_stock_deal:\n  ; Remaining 24 cards deck[28..51] go into stock[0..23]\n  ADDI R0, R8, #5005\n  LI R3, #24\n  ST R3, R0, #0 ; stock_len = 24\n  LI R3, #0 ; i = 0\nsd_stk_lp:\n  CMPI R3, #24\n  JNNX sd_done\n  ADD R0, R1, R2\n  LT R5, R0, #0\n  ADDI R2, R2, #1\n  ADDI R6, R8, #5025\n  ADD R6, R6, R3\n  ST R5, R6, #0\n  ADDI R3, R3, #1\n  JMPX sd_stk_lp\n\nsd_done:\n  POP R7\n  POP R6\n  POP R5\n  POP R4\n  POP R3\n  POP R2\n  POP R1\n  POP R0\n  RET\n\n; sol_redraw: renders toolbar, stock, waste, 4 foundations, 7 tableau piles, and win banner in 729-color palette\nsol_redraw:\n  PUSH R0\n  PUSH R1\n  PUSH R2\n  PUSH R3\n  PUSH R4\n  PUSH R5\n  PUSH R6\n  PUSH R7\n\n  ; Clear playfield\n  LI R0, #0\n  LI R1, #0\n  LI R2, #218\n  LI R3, #135\n  LI R4, #-290\n  SYSCALL #20\n\n  ; Draw toolbar at (4, 2)\n  LI R0, #4\n  LI R1, #2\n  LI R2, #str_sol_bar - app6_sol_rom\n  ADD R2, R2, R8\n  LI R3, #COL_WHITE\n  LI R4, #-230\n  SYSCALL #21\n\n  ; Draw Stock pile at (6, 15, 22, 18)\n  ADDI R5, R8, #5000\n  LT R0, R5, #5 ; stock_len\n  LI R4, #-200\n  CMPI R0, #0\n  JNPX sr_stk_col\n  LI R4, #-120 ; blue card back when non-empty\nsr_stk_col:\n  LI R0, #6\n  LI R1, #15\n  LI R2, #22\n  LI R3, #18\n  SYSCALL #20\n  ADDI R5, R8, #5000\n  LT
